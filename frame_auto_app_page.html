<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 오토 프레임 (앱)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #f5f6f8;
            color: #202124;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif
        }

        .wrap {
            margin: auto;
            padding: 28px 32px
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-bottom: 22px;
            gap: 12px
        }

        .head h1 {
            margin: 0;
            font-size: 27px
        }

        .date {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            padding: 10px 14px;
            font-size: 13px
        }

        .card {
            background: #fff;
            border: 1px solid #e6e8ec;
            border-radius: 12px;
            padding: 26px 24px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .07);
            min-width: 0
        }

        section {
            margin-bottom: 48px
        }

        section:last-of-type {
            margin-bottom: 24px
        }

        .title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px
        }

        .title h2 {
            font-size: 17px;
            font-weight: 800;
            color: #1a1d23;
            letter-spacing: -.01em;
            margin: 0
        }

        .title span {
            font-size: 12px;
            color: #858a92
        }

        .note {
            font-size: 11px;
            color: #858a92;
            margin-top: 10px
        }

        .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: 0;
            flex: none
        }

        .num {
            font-variant-numeric: tabular-nums
        }

        /* ① 테마별 성과 박스 */
        .themes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px
        }

        .theme {
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        .theme-art {
            background: #f8f9fb;
            padding: 16px;
            border-bottom: 1px solid #eceef1
        }

        .theme-art .ad {
            max-width: 280px;
            margin: auto
        }

        .theme-body {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .theme-name {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center
        }

        /* 프레임 이름 호버 툴팁 */
        .fname { cursor: default; border-bottom: 1px dotted transparent }
        .fname:hover { border-bottom-color: currentColor }
        #frameTip { position: fixed; left: -9999px; top: -9999px; z-index: 2000; width: 216px; padding: 8px; background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .16); pointer-events: none; visibility: hidden }
        #frameTip.show { visibility: visible }
        #frameTip .ft-item { display: none }
        #frameTip .ft-item.on { display: block }
        #frameTip .ad.ad-slot { width: 200px; margin: 0 auto }
        #frameTip .ft-name { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; font-size: 12px; font-weight: 700; color: #20242a }

        /* ① 프레임 미리보기 링크 (뷰어 페이지 새 탭) */
        a.theme-art { display: block; text-decoration: none; color: inherit }
        .theme-view { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: #3446b8; text-decoration: none; white-space: nowrap; padding: 2px 7px; border-radius: 999px; background: #eef0f9 }
        .theme-view:hover { background: #3446b8; color: #fff }

        .theme-period {
            font-size: 12px;
            color: #6b7078
        }

        .theme-period b {
            color: #3446b8
        }

        .theme-stats {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 7px 10px;
            font-size: 13px;
            border-top: 1px dashed #e1e4e9;
            padding-top: 10px;
            margin: 0
        }

        .theme-stats dt {
            color: #7b8088
        }

        .theme-stats dd {
            margin: 0;
            text-align: right;
            font-weight: 700;
            font-variant-numeric: tabular-nums
        }

        /* ② 타임라인 */
        .tl {
            list-style: none;
            margin: 0;
            padding: 0;
            position: relative
        }

        .tl::before {
            content: "";
            position: absolute;
            left: 82px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: #e6e8ec
        }

        .tl li {
            display: grid;
            grid-template-columns: 70px 26px 1fr 150px;
            gap: 0 12px;
            align-items: start;
            padding: 10px 0
        }

        .tl li+li {
            border-top: 1px solid #f1f2f4
        }

        .tl-date {
            font-size: 13px;
            font-weight: 700;
            text-align: right;
            padding-top: 2px;
            font-variant-numeric: tabular-nums
        }

        .tl-date small {
            display: block;
            font-size: 11px;
            color: #9aa0a8;
            font-weight: 400
        }

        .tl-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 0 2px var(--c);
            background: var(--c);
            margin: 3px auto 0;
            position: relative;
            z-index: 1
        }

        .tl-body {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0
        }

        .tl-top {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .tl-top b {
            font-size: 14px
        }

        .tl-body p {
            margin: 0;
            font-size: 12.5px;
            color: #6b7078;
            line-height: 1.5
        }

        .chip {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap
        }

        .chip.deploy {
            background: #e8ecff;
            color: #3446b8
        }

        .chip.copy {
            background: #fff3dc;
            color: #a86b00
        }

        .chip.ratio {
            background: #fbe9ea;
            color: #c9444d
        }

        .chip.ch.google {
            background: #eef0f3;
            color: #4b5260
        }

        .chip.ch.kakao {
            background: #fff4c2;
            color: #6b5300
        }

        .tl-target {
            font-size: 12px;
            font-weight: 700;
            color: #444;
            display: flex;
            align-items: center
        }

        .chip.live {
            background: #e6f4ec;
            color: #198754
        }

        .tl-art .ad {
            width: 150px
        }

        /* ② 어제 vs 그제 */
        .yd-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px
        }

        .yd-card {
            background: #f8f9fb;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0
        }

        .yd-card h3 {
            margin: 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .yd-m {
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .yd-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px
        }

        .yd-label {
            font-size: 12px;
            color: #6b7078;
            font-weight: 600
        }

        .yd-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px
        }

        .yd-day {
            font-size: 11px;
            color: #858a92
        }

        .yd-num {
            font-size: 12.5px;
            color: #858a92;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap
        }

        .yd-row.now .yd-day {
            color: #3446b8;
            font-weight: 700
        }

        .yd-row.now .yd-num {
            font-size: 17px;
            color: #202124;
            font-weight: 750
        }

        .yd-track {
            display: block;
            height: 6px;
            background: #e6e8ec;
            border-radius: 3px;
            overflow: hidden
        }

        .yd-track span {
            display: block;
            height: 100%;
            border-radius: 3px
        }

        .yd-chg {
            font-size: 11.5px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap
        }

        .yd-chg.rise {
            background: #e6f4ec;
            color: #198754
        }

        .yd-chg.fall {
            background: #fbe9ea;
            color: #c9444d
        }

        .yd-chg.flat {
            background: #eceef1;
            color: #666
        }

        .yd-head {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #666;
            margin-bottom: 12px
        }

        .yd-head i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: -1px
        }

        /* ③ 최근 7일 */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            font-size: 12px;
            color: #555;
            margin-bottom: 8px
        }

        .legend i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: -1px
        }

        .w7 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px
        }

        .w7-box h3 {
            margin: 0 0 6px;
            font-size: 13px;
            color: #444
        }

        .w7-chart {
            height: 230px;
            position: relative
        }

        .w7-chart svg {
            display: block;
            overflow: visible
        }

        .tip {
            position: absolute;
            pointer-events: none;
            background: #20242a;
            color: #fff;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.6;
            white-space: nowrap;
            z-index: 3;
            box-shadow: 0 4px 14px #0003
        }

        .tip b {
            display: block
        }

        .tip i {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px
        }

        .tip span {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            font-variant-numeric: tabular-nums
        }

        /* 표 */
        .scroll {
            overflow: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px
        }

        th,
        td {
            padding: 10px 10px;
            border-bottom: 1px solid #e9ebef;
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums
        }

        th:first-child,
        td:first-child {
            text-align: left
        }

        th {
            color: #777;
            background: #fafbfc;
            font-size: 11px;
            font-weight: 700
        }

        th.grp {
            text-align: center;
            color: #202124;
            font-size: 12px;
            border-bottom: 2px solid var(--c)
        }

        th.sep,
        td.sep {
            border-left: 1px solid #e6e8ec
        }

        td.best {
            color: #3446b8;
            font-weight: 700
        }

        .crown-wrap {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
            cursor: default
        }

        .crown-wrap::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 8px);
            right: -6px;
            background: #20242a;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.5;
            text-align: left;
            white-space: pre;
            padding: 7px 10px;
            border-radius: 7px;
            box-shadow: 0 4px 14px #0003;
            opacity: 0;
            pointer-events: none;
            transition: opacity .12s;
            z-index: 5
        }

        .crown-wrap::before {
            content: "";
            position: absolute;
            bottom: calc(100% + 2px);
            right: 10px;
            border: 6px solid transparent;
            border-top-color: #20242a;
            border-bottom: 0;
            opacity: 0;
            transition: opacity .12s;
            z-index: 5
        }

        td.top:hover .crown-wrap::after,
        td.top:hover .crown-wrap::before {
            opacity: 1
        }

        .crown {
            width: 17px;
            height: 20px;
            flex: none;
            margin: -3px 0
        }

        td.top {
            background: color-mix(in srgb, var(--c) 16%, #fff);
            font-weight: 700;
            box-shadow: inset 3px 0 0 var(--c)
        }

        td.size-cell {
            padding-left: 22px
        }

        .win {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 12px
        }

        .win::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--c)
        }

        .ss {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 14px
        }

        .ss-item {
            background: #f8f9fb;
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            min-width: 0
        }

        .ss-top {
            display: flex;
            align-items: center;
            font-size: 13px;
            font-weight: 700
        }

        .ss-top b {
            margin-left: auto;
            font-size: 13px
        }

        .ss-bar {
            height: 6px;
            background: #e6e8ec;
            border-radius: 3px;
            overflow: hidden
        }

        .ss-bar span {
            display: block;
            height: 100%;
            background: var(--c);
            border-radius: 3px
        }

        .ss-list {
            font-size: 11.5px;
            color: #6b7078;
            line-height: 1.5
        }

        @media(max-width:700px) {
            .ss {
                grid-template-columns: 1fr
            }
        }

        td.left {
            text-align: left
        }

        .cell-name {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .cell-name .ad {
            width: 56px;
            flex: none;
            box-shadow: none
        }

        .total-row td {
            background: #f3f5ff;
            font-weight: 700;
            color: #202124;
            border-bottom: 2px solid #d9ddf5;
            font-size: 12.5px
        }

        .total-row td:first-child {
            color: #3446b8
        }

        .sort-btn {
            all: unset;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 6px;
            margin: -3px -6px;
            border-radius: 6px;
            font: inherit;
            color: inherit
        }

        .sort-btn:hover {
            background: #eef0f3
        }

        .sort-btn:focus-visible {
            outline: 2px solid #3446b8
        }

        .sort-btn .arw {
            display: inline-flex;
            flex-direction: column;
            font-size: 7px;
            line-height: 7px;
            color: #d3d7dd
        }

        .sort-btn .arw span {
            padding: 1px 4px;
            margin: 0 -4px;
            cursor: pointer
        }

        .sort-btn .arw span:hover {
            color: #6b7078
        }

        .sort-btn[data-dir="desc"] .arw .arw-up,
        .sort-btn[data-dir="asc"] .arw .arw-dn {
            color: #3446b8
        }

        .sort-btn[data-dir] {
            color: #3446b8;
            font-weight: 700
        }

        /* ---------- 프레임 예시 이미지 (HTML 목업 · 실제 소재 이미지로 교체 가능) ---------- */
        .ad {
            container-type: inline-size;
            aspect-ratio: 6/5;
            width: 100%;
            max-width: 100%;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            line-height: 1.25;
            letter-spacing: -.01em;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .12)
        }

        .ad svg {
            display: block;
            width: 100%;
            height: 100%
        }

        .ad-btn {
            display: inline-block;
            border-radius: 1.4cqw;
            padding: 2.2cqw 4cqw;
            font-size: 4.2cqw;
            font-weight: 700
        }

        .ad-hide {
            display: inline-block;
            padding: 1.6cqw 3cqw;
            border-radius: 1.4cqw;
            font-size: 4cqw;
            font-weight: 700;
            background: repeating-linear-gradient(135deg, rgba(0, 0, 0, .08) 0 2cqw, rgba(0, 0, 0, .02) 2cqw 4cqw)
        }

        .ad-tag {
            position: absolute;
            right: 1.6cqw;
            bottom: 1.4cqw;
            font-size: 2.4cqw;
            color: rgba(128, 128, 128, .9)
        }

        .ad-blackgold {
            background: radial-gradient(120% 90% at 50% 0%, #232018 0%, #0b0b0a 60%);
            color: #f4ecd8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.8cqw;
            text-align: center;
            padding: 6cqw
        }

        .ad-blackgold::before {
            content: "";
            position: absolute;
            inset: 3cqw;
            border: 1px solid #c9a54a;
            pointer-events: none
        }

        .ad-blackgold .eyebrow {
            font-size: 3.2cqw;
            letter-spacing: .35em;
            color: #d8b65c;
            font-weight: 700
        }

        .ad-blackgold .img {
            width: 36cqw;
            height: 32cqw
        }

        .ad-blackgold .ttl {
            font-size: 5.4cqw;
            font-weight: 700
        }

        .ad-blackgold .price {
            font-size: 6.4cqw;
            font-weight: 700;
            color: #e2c270
        }

        .ad-blackgold .ad-btn {
            border: 1px solid #d8b65c;
            color: #e2c270;
            padding: 1.6cqw 5cqw;
            font-size: 3.8cqw
        }

        .ad-blackgold .ad-hide {
            background: repeating-linear-gradient(135deg, rgba(226, 194, 112, .22) 0 2cqw, rgba(226, 194, 112, .06) 2cqw 4cqw);
            color: #e2c270
        }

        .ad-whitered {
            background: #fff;
            color: #1c1c1c;
            display: grid;
            grid-template-rows: auto 1fr;
            border: 1px solid #eee
        }

        .ad-whitered .band {
            background: #d7262f;
            color: #fff;
            font-weight: 800;
            font-size: 4.6cqw;
            padding: 2.6cqw 5cqw;
            display: flex;
            justify-content: space-between
        }

        .ad-whitered .band em {
            font-style: normal;
            background: #fff;
            color: #d7262f;
            border-radius: 1cqw;
            padding: 0 2cqw
        }

        .ad-whitered .row {
            display: grid;
            grid-template-columns: 46% 1fr;
            align-items: center
        }

        .ad-whitered .img {
            padding: 5cqw 4cqw
        }

        .ad-whitered .body {
            padding: 3cqw 5cqw 3cqw 1cqw;
            display: flex;
            flex-direction: column;
            gap: 2cqw
        }

        .ad-whitered .ttl {
            font-size: 5.4cqw;
            font-weight: 700
        }

        .ad-whitered .price {
            font-size: 8cqw;
            font-weight: 800;
            color: #d7262f
        }

        .ad-whitered .price s {
            display: block;
            font-size: 3.8cqw;
            color: #999;
            font-weight: 400
        }

        .ad-whitered .ad-btn {
            background: #d7262f;
            color: #fff;
            align-self: flex-start
        }

        .ad-redauto {
            background: linear-gradient(160deg, #e3182f 0%, #a80e22 100%);
            color: #fff;
            padding: 5cqw;
            display: flex;
            flex-direction: column;
            gap: 3cqw
        }

        .ad-redauto .head2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 4.6cqw;
            font-weight: 800
        }

        .ad-redauto .auto {
            font-size: 3cqw;
            background: rgba(255, 255, 255, .18);
            border-radius: 10cqw;
            padding: .8cqw 2.4cqw;
            font-weight: 700
        }

        .ad-redauto .tiles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.4cqw;
            flex: 1
        }

        .ad-redauto .tile {
            background: #fff;
            color: #222;
            border-radius: 2cqw;
            padding: 2cqw;
            display: flex;
            flex-direction: column;
            gap: 1cqw;
            justify-content: space-between
        }

        .ad-redauto .tile .img {
            height: 17cqw
        }

        .ad-redauto .tile b {
            font-size: 3.6cqw;
            color: #d0142b
        }

        .ad-redauto .tile span {
            font-size: 2.9cqw;
            color: #666
        }

        .ad-redauto .foot {
            display: flex;
            justify-content: space-between;
            align-items: center;

        const ROWS = ADATA.map(([d, t, imp, clk]) => ({ d, t, imp, clk }));
        const DATES = [...new Set(ROWS.map(r => r.d))].sort();
        const TODAY = DATES[DATES.length - 1] || ymd(new Date());
        const PERIOD_FROM = TODAY.slice(0, 8) + '01';
        THEMES.forEach(T => { const ds = ROWS.filter(r => r.t === T.id).map(r => r.d).sort(); T.from = ds[0]; T.to = ds[ds.length - 1]; });

        /* ---------- 공통 ---------- */
        const sum = rows => { const o = { imp: 0, clk: 0 }; for (const r of rows) { o.imp += r.imp; o.clk += r.clk; } o.ctr = o.imp >= MIN_IMP ? o.clk / o.imp * 100 : 0; return o; };
        const pick = (fn) => ROWS.filter(fn);
        const f = n => Math.round(n).toLocaleString('ko-KR');
        const pct = v => v.toFixed(3) + '%';
        const M3 = [
            { k: 'imp', label: '노출수', fmt: f },
            { k: 'clk', label: '클릭수', fmt: f },
            { k: 'ctr', label: '클릭률 (CTR)', fmt: pct },
        ];
        const theme = id => THEMES.find(t => t.id === id);
        // 프레임 이름 — 마우스를 올리면 배너 툴팁 (frameTip · 배너가 있는 프레임만)
        const nm = (T, short = false) => `<span class="fname" data-frame-tip="${T.id}">${short ? T.name.replace(' 프레임', '') : T.name}</span>`;
        function frameArt(id, o = {}) {
            const T = theme(id), src = o.src || T.src || '';
            const attr = T.tpl ? `data-tpl="${src}"` : `src="${src}"`;
            return `<div class="ad ad-slot" data-frame="${id}">${src ? `<iframe ${attr} title="${T.name}" loading="lazy" scrolling="no"></iframe>` : `<div class="ad-empty">${T.desc}</div>`}</div>`;
        }

        // 배너 iframe(250px)을 칸 폭에 맞게 축소 — 표가 다시 그려지거나 창 크기가 바뀌면 다시 계산
        const BANNER_PX = 250;
        const fitBannerSlots = () => document.querySelectorAll('.ad.ad-slot iframe').forEach(f => {
            const w = f.parentElement.clientWidth;
            if (w) f.style.transform = `scale(${w / BANNER_PX})`;
        });
        // 레드오토(오토 프레임) 템플릿: 뷰어 페이지(dev_openRtbAuto_view.html)와 같은 목 상품 데이터로 채워서 표시
        const TPL_MOCK = {
            '{{w}}': BANNER_PX, '{{h}}': BANNER_PX,
            '{{productList}}': `{ pcode: "test-pcode1", pnm: "오토프레임 카라넥 원피스", price: "49,900", prdt_prmct: "39,900", dc_rate: "32",

            '{{wp_imgtag}}': '', '{{UUID}}': 'test-uuid', '{{USER}}': 'test-user', '{{ITL_TP_CODE}}': 'test-code',
        };
        const tplCache = {};
        const fillTemplateBanners = () => document.querySelectorAll('.ad.ad-slot iframe[data-tpl]:not([data-filled])').forEach(f => {
            f.dataset.filled = '1';
            const url = f.dataset.tpl;
            tplCache[url] ??= fetch(url).then(r => r.text()).then(t => Object.entries(TPL_MOCK).reduce((c, [k, v]) => c.split(k).join(v), t));
            tplCache[url].then(html => { f.srcdoc = html; }).catch(err => console.warn('오토 배너 템플릿을 불러오지 못했습니다', err));
        });
        (function () {
            let queued = false;
            const schedule = () => { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; fitBannerSlots(); fillTemplateBanners(); }); };
            new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
            window.addEventListener('resize', schedule);
            document.getElementById('tlModal')?.addEventListener('toggle', schedule);   // 모달이 열릴 때 (닫혀 있으면 폭이 0)

        /* 프레임 이름 호버 → 배너 툴팁 (테마별 배너를 미리 한 번만 만들어 두고 보여줌) */
        (function () {
            const tip = document.createElement('div');
            tip.id = 'frameTip';
            tip.setAttribute('aria-hidden', 'true');
            tip.innerHTML = THEMES.filter(T => T.src).map(T => `<div class="ft-item" data-frame-tip-for="${T.id}">${frameArt(T.id)}<div class="ft-name"><span class="dot" style="${sw(T)}"></span>${T.name}</div></div>`).join('');
            document.body.appendChild(tip);
            const W = 216, GAP = 14;
            let cur = null;
            const place = (x, y) => {
                const h = tip.offsetHeight || 260;
                let left = x + GAP, top = y + GAP;
                if (left + W > innerWidth - 8) left = x - W - GAP;          // 오른쪽 공간이 없으면 왼쪽에
                if (top + h > innerHeight - 8) top = Math.max(8, y - h - GAP); // 아래 공간이 없으면 위에
                tip.style.left = left + 'px'; tip.style.top = top + 'px';
            };
            const show = (el, e) => {
                const id = el.dataset.frameTip;
                if (!theme(id)?.src) return;
                cur = el;
                // 모달(dialog) 안에서는 모달 위에 떠야 하므로 모달 안으로 옮김
                const host = el.closest('dialog') || document.body;
                if (tip.parentElement !== host) host.appendChild(tip);
                tip.querySelectorAll('.ft-item').forEach(it => it.classList.toggle('on', it.dataset.frameTipFor === id));
                tip.classList.add('show');
                fitBannerSlots();
                place(e.clientX, e.clientY);
            };
            const hide = () => { cur = null; tip.classList.remove('show'); };
            document.addEventListener('mouseover', e => { const el = e.target.closest('[data-frame-tip]'); if (el && el !== cur) show(el, e); });
            document.addEventListener('mouseout', e => { const el = e.target.closest('[data-frame-tip]'); if (el && el === cur && !el.contains(e.relatedTarget)) hide(); });
            document.addEventListener('mousemove', e => { if (cur) place(e.clientX, e.clientY); });
            document.addEventListener('scroll', hide, true);
        })();

        initTimeline();   // 프레임 변경 Timeline (frame_timeline.js 공용)

        /* ① 프레임 테마별 성과 */
        function renderThemes(from, to) {
            const inR = r => r.d >= from && r.d <= to;
            const TS = Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => inR(r) && r.t === T.id))]));
            // 프레임 중 순위 (② 와 같은 표시)
            const themeRank = (id, k) => { const n = TS[id][k] > 0 ? 1 + THEMES.filter(T => TS[T.id][k] > TS[id][k]).length : 0; return n ? `<em class="rk-badge rk${Math.min(n, 3)}">${n}위</em>` : ''; };
            document.getElementById('themes').innerHTML = THEMES.map(T => {
                const s = TS[T.id], ds = [...new Set(pick(r => inR(r) && r.t === T.id).map(r => r.d))].sort();
                const period = !ds.length ? '데이터 없음' : from === to ? `데이터: <b>${md(from)}</b>` : `데이터: <b>${md(ds[0])} ~ ${md(ds[ds.length - 1])}</b>`;
                const view = T.view ? `<a class="theme-view" href="${T.view}" target="_blank" rel="noopener" title="${T.name} 전체 사이즈 미리보기 (새 탭)">프레임 미리보기<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>` : '';
                return `<article class="card theme">
                    ${T.view ? `<a class="theme-art" href="${T.view}" target="_blank" rel="noopener" aria-label="${T.name} 미리보기 (새 탭)">${frameArt(T.id)}</a>` : `<div class="theme-art">${frameArt(T.id)}</div>`}
                    <div class="theme-body">
                        <div class="theme-name"><span class="dot" style="${sw(T)}"></span>${T.ab ? `<span class="ab-chip ${T.ab}">${AB_LABEL[T.ab]}</span>` : ''}${T.kind ? `<span class="kind-chip">${T.kind}</span>` : ''}${T.name}${view}</div>
                        <div class="theme-period">${period}</div>
                        <dl class="theme-stats">
                            <dt>노출수 ${themeRank(T.id, 'imp')}</dt><dd>${s.imp ? f(s.imp) : '−'}</dd>
                            <dt>클릭수 ${themeRank(T.id, 'clk')}</dt><dd>${s.imp ? f(s.clk) : '−'}</dd>
                            <dt>클릭률 (CTR) ${themeRank(T.id, 'ctr')}</dt><dd>${s.imp ? pct(s.ctr) : '−'}</dd>
                        </dl>
                    </div>
                </article>`;
            }).join('');
        }
        (function () {
            const ctrl = document.getElementById('themePeriod'), dateEl = document.getElementById('themeDate');
            dateEl.min = PERIOD_FROM; dateEl.max = TODAY; dateEl.value = TODAY;
            ctrl.querySelector('[data-mode="month"]').textContent = `${+TODAY.slice(5, 7)}월 전체`;
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || TODAY;
                if (mode === 'day') renderThemes(d, d); else renderThemes(PERIOD_FROM, TODAY);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();

        const CROWN = `<svg class="crown" viewBox="0 0 24 28" aria-hidden="true"><path d="M6 1h5l3 8H9z" fill="#3f7ee8"/><path d="M18 1h-5l-3 8h5z" fill="#d7262f"/><circle cx="12" cy="17.5" r="9" fill="#f2b705" stroke="#c98f00" stroke-width="1.5"/><circle cx="12" cy="17.5" r="6.3" fill="none" stroke="#fff3c4" stroke-width="1"/><text x="12" y="21.6" text-anchor="middle" font-size="11" font-weight="800" font-family="Arial, sans-serif" fill="#7a5200">1</text></svg>`;
        /* ② 어제 vs 그제 */
        (function () {
            const Y = DATES[DATES.length - 1], B = DATES[DATES.length - 2], YC = '#3446b8', BC = '#b9bfca';
            document.getElementById('ydHead').innerHTML = `<span><i style="background:${YC}"></i>어제 ${md(Y)}</span><span><i style="background:${BC}"></i>그제 ${md(B)}</span>`;
            const Ys = Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => r.t === T.id && r.d === Y))]));
            const best = Object.fromEntries(M3.map(m => [m.k, Math.max(...THEMES.map(T => Ys[T.id][m.k]))]));
            const Bs = Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => r.t === T.id && r.d === B))]));
            // 프레임 중 순위 (데이터 없는 프레임은 제외)
            const rank = (S, k, id) => S[id][k] > 0 ? 1 + THEMES.filter(T => S[T.id][k] > S[id][k]).length : null;
            const rankChip = n => n ? `<em class="rk-badge rk${Math.min(n, 3)}">${n}위</em>` : '';
            document.getElementById('yd').innerHTML = THEMES.map(T => {
                const y = Ys[T.id], b = Bs[T.id];
                const metrics = M3.map(m => {
                    const yv = y[m.k], bv = b[m.k];
                    if (!y.imp && !b.imp) return `<div class="yd-m"><div class="yd-top"><span class="yd-label">${m.label}</span><span class="yd-chg flat">데이터 없음</span></div><div class="yd-row now"><span class="yd-day">어제</span><span class="yd-num">−</span></div></div>`;
                    if (!bv) return `<div class="yd-m"><div class="yd-top"><span class="yd-label">${m.label}</span><span class="yd-chg flat">그제 데이터 없음</span></div><div class="yd-row now"><span class="yd-day">어제</span><span class="yd-num">${m.fmt(yv)}</span></div></div>`;
                    const diff = m.k === 'ctr' ? yv - bv : (yv / bv - 1) * 100;
                    const cls = Math.abs(diff) < 0.0005 ? 'flat' : diff > 0 ? 'rise' : 'fall';
                    const txt = `${cls === 'flat' ? '−' : diff > 0 ? '▲' : '▼'} ${Math.abs(diff).toFixed(m.k === 'ctr' ? 3 : 1)}${m.k === 'ctr' ? '%p' : '%'}`;
                    const mx = Math.max(yv, bv) || 1;
                    const top = yv > 0 && yv === best[m.k];
                    const val = top ? `<span class="crown-wrap" data-tip="어제 ${m.label} 1위\n${THEMES.length}개 프레임 중 가장 높음">${CROWN}${m.fmt(yv)}</span>` : m.fmt(yv);
                    return `<div class="yd-m${top ? ' best' : ''}">
                        <div class="yd-top"><span class="yd-label">${m.label}</span><span class="yd-chg ${cls}">${txt}</span></div>
                        <div class="yd-row now"><span class="yd-day">어제 ${rankChip(rank(Ys, m.k, T.id))}</span><span class="yd-num">${val}</span></div>
                        <span class="yd-track"><span style="width:${yv / mx * 100}%;background:${YC}"></span></span>
                        <div class="yd-row"><span class="yd-day">그제 ${rankChip(rank(Bs, m.k, T.id))}</span><span class="yd-num">${m.fmt(bv)}</span></div>
                        <span class="yd-track"><span style="width:${bv / mx * 100}%;background:${BC}"></span></span>
                    </div>`;
                }).join('');
                return `<div class="yd-card"><h3><span><span class="dot" style="${sw(T)}"></span>${nm(T)}</span></h3>${metrics}</div>`;
            }).join('');
        })();

        /* ③ 최근 7일 — 지표별 차트, 날짜마다 프레임별 막대 */
        (function () {
            const D7 = DATES.slice(-7);   // 데이터가 있는 최근 7일
            const data = D7.map(d => Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => r.t === T.id && r.d === d))])));
            document.getElementById('w7Legend').innerHTML = THEMES.map(T => `<span><i style="${sw(T)}"></i>${nm(T)}${T.ch === '카카오' ? ' (카카오)' : ''}</span>`).join('');
            const wrap = document.getElementById('w7');
            wrap.innerHTML = M3.map(m => `<div class="w7-box"><h3>${m.label}</h3><div class="w7-chart" data-k="${m.k}"><svg></svg><div class="tip" hidden></div></div></div>`).join('');
            const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= v) return k * p; return v; };
            const short = (k, v) => k === 'ctr' ? v.toFixed(3) + '%' : v >= 1e4 ? f(v / 1e4) + '만' : f(v);

            function draw() {
                wrap.querySelectorAll('.w7-chart').forEach(box => {
                    const k = box.dataset.k, m = M3.find(x => x.k === k), svg = box.querySelector('svg'), tip = box.querySelector('.tip');
                    const W = box.clientWidth, H = box.clientHeight, L = 46, R = 6, T = 8, B = 26, iw = W - L - R, ih = H - T - B;
                    const max = nice(Math.max(...data.flatMap(o => THEMES.map(t => o[t.id][k]))) || 1);
                    svg.setAttribute('width', W); svg.setAttribute('height', H);
                    let out = '';
                    for (let g = 0; g <= 4; g++) {
                        const y = T + ih - ih * g / 4;
                        out += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${g ? '#f2f3f5' : '#e6e8ec'}"/><text x="${L - 6}" y="${y + 4}" font-size="10" fill="#b3b8bf" text-anchor="end">${short(k, max * g / 4)}</text>`;
                    }
                    const gw = iw / D7.length, bw = Math.min(12, (gw - 10) / THEMES.length - 2);
                    const tops = THEMES.map(() => []);   // 테마별 막대 꼭대기 좌표 (호버 선그래프용)
                    D7.forEach((d, i) => {
                        const gx = L + gw * i, x0 = gx + (gw - (bw + 2) * THEMES.length + 2) / 2;
                        THEMES.forEach((t, j) => {
                            const v = data[i][t.id][k], h = v / max * ih;
                            if (h > 0) tops[j].push([x0 + j * (bw + 2) + bw / 2, T + ih - h]);
                            if (h > 0) out += `<rect class="bar" data-t="${j}" x="${x0 + j * (bw + 2)}" y="${T + ih - h}" width="${bw}" height="${h}" rx="2" fill="${t.color}"${t.ring ? ` stroke="${t.ring}" stroke-width="1.5"` : ''}/>`;
                        });
                        out += `<rect class="hit" data-i="${i}" x="${gx}" y="${T}" width="${gw}" height="${ih}" fill="transparent"/>`;
                        out += `<text x="${gx + gw / 2}" y="${H - 8}" font-size="10.5" fill="#888" text-anchor="middle">${md(d)}</text>`;
                    });
                    out += `<g class="hl-line" pointer-events="none"></g>`;
                    svg.innerHTML = out;
                    svg.querySelectorAll('.hit').forEach(h => {
                        h.addEventListener('mouseenter', () => {
                            const i = +h.dataset.i;
                            tip.innerHTML = `<b>${md(D7[i])} · ${m.label}</b>` + THEMES.map(t => `<span><em style="font-style:normal"><i style="${sw(t)}"></i>${t.name}</em>${data[i][t.id][k] ? m.fmt(data[i][t.id][k]) : '−'}</span>`).join('');
                            tip.hidden = false;
                            const gx = L + gw * i, tw = tip.offsetWidth;
                            tip.style.left = (gx + gw + tw > W ? gx - tw - 4 : gx + gw + 4) + 'px'; tip.style.top = '0px';
                            h.setAttribute('fill', 'rgba(52,70,184,.06)');
                        });
                        h.addEventListener('mouseleave', () => { tip.hidden = true; h.setAttribute('fill', 'transparent'); });
                    });
                    // 막대에 마우스를 올리면 같은 테마의 7일 추이를 선으로 연결
                    const hl = svg.querySelector('.hl-line');
                    let cur = -1;
                    svg.onmousemove = e => {
                        const x = e.clientX - svg.getBoundingClientRect().left, i = Math.floor((x - L) / gw);
                        if (i < 0 || i >= D7.length) return;
                        const x0 = L + gw * i + (gw - (bw + 2) * THEMES.length + 2) / 2;
                        const j = Math.max(0, Math.min(THEMES.length - 1, Math.floor((x - x0 + 1) / (bw + 2))));
                        if (j === cur) return;
                        cur = j;
                        const c = THEMES[j].color, p = tops[j];
                        hl.innerHTML = `<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${p.map(q => q.join(',')).join(' ')}"/>` + p.map(([cx, cy]) => `<circle cx="${cx}" cy="${cy}" r="3.5" fill="#fff" stroke="${c}" stroke-width="2"/>`).join('');
                        box.classList.add('hl');
                        svg.querySelectorAll('.bar').forEach(b => b.classList.toggle('on', +b.dataset.t === j));
                    };
                    svg.onmouseleave = () => { cur = -1; hl.innerHTML = ''; box.classList.remove('hl'); };
                });
            }
            window.addEventListener('resize', draw);
            draw();
        })();

        /* ---------- 표 정렬 + 합계 행 ---------- */
        function makeSortable(table) {
            const ths = [...table.querySelectorAll('th[data-col]')];
            ths.forEach(th => {
                th.innerHTML = `<button type="button" class="sort-btn" title="▲ 큰 순 · ▼ 작은 순 (이름을 누르면 번갈아 정렬)">${th.innerHTML}<span class="arw" aria-hidden="true"><span class="arw-up">▲</span><span class="arw-dn">▼</span></span></button>`;
                th.querySelector('button').addEventListener('click', e => {
                    const b = e.currentTarget, hit = e.target.closest('.arw-up, .arw-dn'), dir = hit ? (hit.classList.contains('arw-up') ? 'desc' : 'asc') : (b.dataset.dir === 'desc' ? 'asc' : 'desc'), col = +th.dataset.col;
                    ths.forEach(t => { delete t.querySelector('button').dataset.dir; t.removeAttribute('aria-sort'); });
                    b.dataset.dir = dir; th.setAttribute('aria-sort', dir === 'desc' ? 'descending' : 'ascending');
                    const key = r => { const c = r.cells[col]; return c.dataset.v !== undefined ? +c.dataset.v : c.textContent.trim(); };
                    [...table.tBodies].forEach(tb => [...tb.rows].filter(r => !r.classList.contains('type-row')).sort((a, c) => { const x = key(a), y = key(c); return (x > y ? 1 : x < y ? -1 : 0) * (dir === 'desc' ? -1 : 1); }).forEach(r => tb.appendChild(r)));
                });
            });
        }
        const numTd = (v, fmt, cls = '', c = '', tip = '') => `<td class="${cls}" data-v="${v}"${c ? ` style="${cv(c)}"` : ''}>${cls.includes('top') ? `<span class="crown-wrap" data-tip="${tip}">${CROWN}${fmt(v)}</span>` : fmt(v)}</td>`;


        /* ④ 레드오토 · coupangETC 일별 추이 */
        (function () {
            const R = theme('redauto'), A = theme('coupangetc');
            const day = (t, d) => sum(pick(r => r.t === t && r.d === d));
            const seg = (r, a) => {
                const rr = r.imp >= MIN_IMP, aa = a.imp >= MIN_IMP;
                return rr && aa ? ['both', '병행'] : rr ? ['red', '레드오토 단독'] : aa ? ['auto', 'coupangETC 단독'] : ['none', '−'];
            };
            const cell = (o, k, m) => `<td class="sep" data-v="${o.imp ? o[k] : -1}">${o.imp ? m.fmt(o[k]) : '−'}</td>`;
            const group = (o) => M3.map(m => cell(o, m.k, m)).join('');
            const rows = [...DATES].reverse().map(d => {
                const r = day(R.id, d), a = day(A.id, d), both = sum(pick(x => (x.t === R.id || x.t === A.id) && x.d === d));
                const [cls, label] = seg(r, a);
                return `<tr class="${cls === 'both' ? 'pivot' : ''}"><td><b>${md(d)}</b></td><td class="left"><span class="seg-chip ${cls}">${label}</span></td>${group(r)}${group(a)}${group(both)}</tr>`;
            }).join('');
            const tot = t => sum(pick(r => t.includes(r.t)));
            const TR = tot([R.id]), TA = tot([A.id]), TB = tot([R.id, A.id]);
            document.getElementById('transTable').innerHTML = `<thead>
                <tr><th rowspan="2">일자</th><th rowspan="2" style="text-align:left">구간</th>
                    <th colspan="3" class="grp sep" style="${cv(R)}"><span class="dot" style="${sw(R)}"></span>${nm(R)}</th>
                    <th colspan="3" class="grp sep" style="${cv(A)}"><span class="dot" style="${sw(A)}"></span>${nm(A)}</th>
                    <th colspan="3" class="grp sep">합산</th></tr>
                <tr>${[R, A, { name: '합산' }].map(() => M3.map(m => `<th class="sep">${m.label.replace(' (CTR)', '')}</th>`).join('')).join('')}</tr>
                <tr class="total-row"><td>합계</td><td class="left">${DATES.length}일</td>${group(TR)}${group(TA)}${group(TB)}</tr>
            </thead><tbody>${rows}</tbody>`;
        })();

        /* ⑤ 지면별 — 기간 누적, 노출 상위 12개 지면 × 오토 프레임 (지표 탭) */
        const PROWS = APDATA.map(([t, p, imp, clk]) => ({ t, p, imp, clk }));
        const PLACE_N = 12;
        // 지면 표시: 요청 사이즈 970_280 → 970×280
        const placeLabel = p => {
            const m = p.match(/^(\d+)_(\d+)$/);
            if (m) return `<b>${m[1]}×${m[2]}</b><small>요청 사이즈</small>`;
            return `<b>${p}</b>`;
        };
        function renderPlace(mk) {
            const m = M3.find(x => x.k === mk);
            const FR = THEMES;
            const psum = fn => sum(PROWS.filter(fn));
            const argmax = list => { let w = -1; list.forEach((o, i) => { if (o.imp && (w < 0 || o[mk] > list[w][mk])) w = i; }); return w; };
            const places = [...new Set(PROWS.map(r => r.p))]
                .map(p => ({ p, all: psum(r => r.p === p) }))
                .sort((a, b) => b.all.imp - a.all.imp).slice(0, PLACE_N);
            const rows = places.map(({ p }) => ({ p, v: FR.map(T => psum(r => r.t === T.id && r.p === p)) }));
            rows.forEach(r => r.win = argmax(r.v));
            const shown = new Set(rows.map(r => r.p));
            const tot = FR.map(T => psum(r => r.t === T.id && shown.has(r.p)));   // 합계는 표에 있는 지면 기준
            const winCell = i => i < 0 ? '−' : `<span class="win" style="${cv(FR[i])}">${nm(FR[i], true)}${FR[i].ch === '카카오' ? ' (카카오)' : ''}</span>`;
            const plain = o => o.imp ? m.fmt(o[mk]) : '−';
            const head = `<thead>
                <tr><th>지면 (요청 사이즈)</th><th class="sep" style="text-align:left">${m.label} 1위</th>${FR.map((T, i) => `<th data-col="${i + 2}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}${T.ch === '카카오' ? '<br><small>(카카오)</small>' : ''}</th>`).join('')}</tr>
                <tr class="total-row"><td>합계</td><td class="sep left">${winCell(argmax(tot))}</td>${tot.map(o => `<td class="sep">${plain(o)}</td>`).join('')}</tr>
            </thead>`;
            const placeRow = ({ p, v, win }) => `<tr><td class="place-cell">${placeLabel(p)}</td><td class="sep left">${winCell(win)}</td>${v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === win ? ' top' : ''), i === win ? FR[i] : '', `${p} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>`;
            const t = document.getElementById('placeTable');
            t.innerHTML = head + `<tbody>${rows.map(placeRow).join('')}</tbody>`;
            makeSortable(t);
            document.getElementById('placeSummary').innerHTML = FR.map((T, i) => {
                const list = rows.filter(r => r.win === i).map(r => r.p.replace(/^(\d+)_(\d+)$/, '$1×$2'));
                return `<div class="ss-item" style="${cv(T)}">
                    <div class="ss-top"><span class="dot" style="${sw(T)}"></span>${nm(T)}${T.ch === '카카오' ? ' (카카오)' : ''}<b>${m.label} 1위 · ${list.length}개 지면</b></div>
                    <div class="ss-bar"><span style="width:${rows.length ? list.length / rows.length * 100 : 0}%"></span></div>
                    <div class="ss-list">${list.join(' · ') || '−'}</div>
                </div>`;
            }).join('');
        }
        (function () {
            const tabs = document.getElementById('placeMetric');
            const run = () => renderPlace(tabs.querySelector('[aria-selected="true"]').dataset.metric);
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            run();
        })();

        // 날짜 칸 어디를 눌러도 달력이 뜨게
        // 날짜 칸(①④⑤⑥)은 눌러도 칸 안의 글자가 선택(파랗게)·복사되지 않게 — 포커스 없이 달력만 띄움
        document.querySelectorAll('.date-in').forEach(el => {
            el.addEventListener('mousedown', e => { e.preventDefault(); try { el.showPicker(); } catch (err) { } });
            el.addEventListener('keydown', e => { if (e.key !== 'Tab') e.preventDefault(); });   // 키보드 복사·선택 막기 (Tab 이동은 허용)
        });
    </script>
    <script>
        /* 맨 위로 버튼 — 300px 이상 내려가면 표시 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
</body>

</html>
