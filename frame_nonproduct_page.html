<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비상품 프레임</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #f5f6f8;
            color: #202124;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif
        }

        .wrap {
            margin: auto;
            padding: 28px 32px
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-bottom: 22px;
            gap: 12px
        }

        .head h1 {
            margin: 0;
            font-size: 27px
        }

        .date {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            padding: 10px 14px;
            font-size: 13px
        }

        .card {
            background: #fff;
            border: 1px solid #e6e8ec;
            border-radius: 12px;
            padding: 26px 24px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .07);
            min-width: 0
        }

        section {
            margin-bottom: 64px
        }

        section:last-of-type {
            margin-bottom: 24px
        }

        .title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px
        }

        .title h2 {
            font-size: 17px;
            font-weight: 800;
            color: #1a1d23;
            letter-spacing: -.01em;
            margin: 0
        }

        .title span {
            font-size: 12px;
            color: #858a92
        }

        .note {
            font-size: 11px;
            color: #858a92;
            margin-top: 10px
        }

        .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: 0;
            flex: none
        }

        .num {
            font-variant-numeric: tabular-nums
        }

        /* ① 테마별 성과 박스 */
        .themes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px
        }

        .theme {
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        .theme-art {
            background: #f8f9fb;
            padding: 16px;
            border-bottom: 1px solid #eceef1
        }

        .theme-art .ad {
            max-width: 280px;
            margin: auto
        }

        .theme-body {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .theme-name {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center
        }

        /* 프레임 이름 호버 툴팁 */
        .fname { cursor: default; border-bottom: 1px dotted transparent }
        .fname:hover { border-bottom-color: currentColor }
        #frameTip { position: fixed; left: -9999px; top: -9999px; z-index: 2000; width: 216px; padding: 8px; background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .16); pointer-events: none; visibility: hidden }
        #frameTip.show { visibility: visible }
        #frameTip .ft-item { display: none }
        #frameTip .ft-item.on { display: block }
        #frameTip .ad.ad-slot { width: 200px; margin: 0 auto }
        #frameTip .ft-name { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; font-size: 12px; font-weight: 700; color: #20242a }

        /* ① 신규 표시 */
        .tag-chip { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 999px; background: #3446b8; color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: .2px; line-height: 1.5 }
        /* ① 프레임 미리보기 링크 (뷰어 페이지 새 탭) */
        a.theme-art { display: block; text-decoration: none; color: inherit }
        .theme-view { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: #3446b8; text-decoration: none; white-space: nowrap; padding: 2px 7px; border-radius: 999px; background: #eef0f9 }
        .theme-view:hover { background: #3446b8; color: #fff }

        .theme-period {
            font-size: 12px;
            color: #6b7078
        }

        .theme-period b {
            color: #3446b8
        }

        .theme-stats {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 7px 10px;
            font-size: 13px;
            border-top: 1px dashed #e1e4e9;
            padding-top: 10px;
            margin: 0
        }

        .theme-stats dt {
            color: #7b8088
        }

        .theme-stats dd {
            margin: 0;
            text-align: right;
            font-weight: 700;
            font-variant-numeric: tabular-nums
        }

        /* ② 타임라인 */
        .tl {
            list-style: none;
            margin: 0;
            padding: 0;
            position: relative
        }

        .tl::before {
            content: "";
            position: absolute;
            left: 82px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: #e6e8ec
        }

        .tl li {
            display: grid;
            grid-template-columns: 70px 26px 1fr 150px;
            gap: 0 12px;
            align-items: start;
            padding: 10px 0
        }

        .tl li+li {
            border-top: 1px solid #f1f2f4
        }

        .tl-date {
            font-size: 13px;
            font-weight: 700;
            text-align: right;
            padding-top: 2px;
            font-variant-numeric: tabular-nums
        }

        .tl-date small {
            display: block;
            font-size: 11px;
            color: #9aa0a8;
            font-weight: 400
        }

        .tl-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 0 2px var(--c);
            background: var(--c);
            margin: 3px auto 0;
            position: relative;
            z-index: 1
        }

        .tl-body {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0
        }

        .tl-top {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .tl-top b {
            font-size: 14px
        }

        .tl-body p {
            margin: 0;
            font-size: 12.5px;
            color: #6b7078;
            line-height: 1.5
        }

        .chip {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap
        }

        .chip.deploy {
            background: #e8ecff;
            color: #3446b8
        }

        .chip.copy {
            background: #fff3dc;
            color: #a86b00
        }

        .chip.ratio {
            background: #fbe9ea;
            color: #c9444d
        }

        .chip.ch.google {
            background: #eef0f3;
            color: #4b5260
        }

        .chip.ch.kakao {
            background: #fff4c2;
            color: #6b5300
        }

        .tl-target {
            font-size: 12px;
            font-weight: 700;
            color: #444;
            display: flex;
            align-items: center
        }

        .chip.live {
            background: #e6f4ec;
            color: #198754
        }

        .tl-art .ad {
            width: 150px
        }

        /* ② 어제 vs 그제 */
        .yd-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px
        }

        .yd-card {
            background: #f8f9fb;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0
        }

        .yd-card h3 {
            margin: 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .yd-m {
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .yd-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px
        }

        .yd-label {
            font-size: 12px;
            color: #6b7078;
            font-weight: 600
        }

        .yd-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px
        }

        .yd-day {
            font-size: 11px;
            color: #858a92
        }

        .yd-num {
            font-size: 12.5px;
            color: #858a92;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap
        }

        .yd-row.now .yd-day {
            color: #3446b8;
            font-weight: 700
        }

        .yd-row.now .yd-num {
            font-size: 17px;
            color: #202124;
            font-weight: 750
        }

        .yd-track {
            display: block;
            height: 6px;
            background: #e6e8ec;
            border-radius: 3px;
            overflow: hidden
        }

        .yd-track span {
            display: block;
            height: 100%;
            border-radius: 3px
        }

        .yd-chg {
            font-size: 11.5px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap
        }

        .yd-chg.rise {
            background: #e6f4ec;
            color: #198754
        }

        .yd-chg.fall {
            background: #fbe9ea;
            color: #c9444d
        }

        .yd-chg.flat {
            background: #eceef1;
            color: #666
        }

        .yd-head {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #666;
            margin-bottom: 12px
        }

        .yd-head i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: -1px
        }

        /* ③ 최근 7일 */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            font-size: 12px;
            color: #555;
            margin-bottom: 8px
        }

        .legend i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: -1px
        }

        .w7 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px
        }

        .w7-box h3 {
            margin: 0 0 6px;
            font-size: 13px;
            color: #444
        }

        .w7-chart {
            height: 230px;
            position: relative
        }

        .w7-chart svg {
            display: block;
            overflow: visible
        }

        .tip {
            position: absolute;
            pointer-events: none;
            background: #20242a;
            color: #fff;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.6;
            white-space: nowrap;
            z-index: 3;
            box-shadow: 0 4px 14px #0003
        }

        .tip b {
            display: block
        }

        .tip i {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px
        }

        .tip span {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            font-variant-numeric: tabular-nums
        }

        /* 표 */
        .scroll {
            overflow: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px
        }

        th,
        td {
            padding: 10px 10px;
            border-bottom: 1px solid #e9ebef;
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums
        }

        th:first-child,
        td:first-child {
            text-align: left
        }

        th {
            color: #777;
            background: #fafbfc;
            font-size: 11px;
            font-weight: 700
        }

        th.grp {
            text-align: center;
            color: #202124;
            font-size: 12px;
            border-bottom: 2px solid var(--c)
        }

        th.sep,
        td.sep {
            border-left: 1px solid #e6e8ec
        }

        td.best {
            color: #3446b8;
            font-weight: 700
        }

        .crown-wrap {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
            cursor: default
        }

        .crown-wrap::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 8px);
            right: -6px;
            background: #20242a;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.5;
            text-align: left;
            white-space: pre;
            padding: 7px 10px;
            border-radius: 7px;
            box-shadow: 0 4px 14px #0003;
            opacity: 0;
            pointer-events: none;
            transition: opacity .12s;
            z-index: 5
        }

        .crown-wrap::before {
            content: "";
            position: absolute;
            bottom: calc(100% + 2px);
            right: 10px;
            border: 6px solid transparent;
            border-top-color: #20242a;
            border-bottom: 0;
            opacity: 0;
            transition: opacity .12s;
            z-index: 5
        }

        td.top:hover .crown-wrap::after,
        td.top:hover .crown-wrap::before {
            opacity: 1
        }

        .crown {
            width: 17px;
            height: 20px;
            flex: none;
            margin: -3px 0
        }

        td.top {
            background: color-mix(in srgb, var(--c) 16%, #fff);
            font-weight: 700;
            box-shadow: inset 3px 0 0 var(--c)
        }

        td.size-cell {
            padding-left: 22px
        }

        .win {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 12px
        }

        .win::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--c)
        }

        .ss {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 14px
        }

        .ss-item {
            background: #f8f9fb;
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            min-width: 0
        }

        .ss-top {
            display: flex;
            align-items: center;
            font-size: 13px;
            font-weight: 700
        }

        .ss-top b {
            margin-left: auto;
            font-size: 13px
        }

        .ss-bar {
            height: 6px;
            background: #e6e8ec;
            border-radius: 3px;
            overflow: hidden
        }

        .ss-bar span {
            display: block;
            height: 100%;
            background: var(--c);
            border-radius: 3px
        }

        .ss-list {
            font-size: 11.5px;
            color: #6b7078;
            line-height: 1.5
        }

        @media(max-width:700px) {
            .ss {
                grid-template-columns: 1fr
            }
        }

        td.left {
            text-align: left
        }

        .cell-name {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .cell-name .ad {
            width: 56px;
            flex: none;
            box-shadow: none
        }

        .total-row td {
            background: #f3f5ff;
            font-weight: 700;
            color: #202124;
            border-bottom: 2px solid #d9ddf5;
            font-size: 12.5px
        }

        .total-row td:first-child {
            color: #3446b8
        }

        .sort-btn {
            all: unset;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 6px;
            margin: -3px -6px;
            border-radius: 6px;
            font: inherit;
            color: inherit
        }

        .sort-btn:hover {
            background: #eef0f3
        }

        .sort-btn:focus-visible {
            outline: 2px solid #3446b8
        }

        .sort-btn .arw {
            display: inline-flex;
            flex-direction: column;
            font-size: 7px;
            line-height: 7px;
            color: #d3d7dd
        }

        .sort-btn .arw span {
            padding: 1px 4px;
            margin: 0 -4px;
            cursor: pointer
        }

        .sort-btn .arw span:hover {
            color: #6b7078
        }

        .sort-btn[data-dir="desc"] .arw .arw-up,
        .sort-btn[data-dir="asc"] .arw .arw-dn {
            color: #3446b8
        }

        .sort-btn[data-dir] {
            color: #3446b8;
            font-weight: 700
        }

        /* ---------- 프레임 예시 이미지 (HTML 목업 · 실제 소재 이미지로 교체 가능) ---------- */
        .ad {
            container-type: inline-size;
            aspect-ratio: 6/5;
            width: 100%;
            max-width: 100%;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            line-height: 1.25;
            letter-spacing: -.01em;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .12)
        }

        .ad svg {
            display: block;
            width: 100%;
            height: 100%
        }

        .ad-btn {
            display: inline-block;
            border-radius: 1.4cqw;
            padding: 2.2cqw 4cqw;
            font-size: 4.2cqw;
            font-weight: 700
        }

        .ad-hide {
            display: inline-block;
            padding: 1.6cqw 3cqw;
            border-radius: 1.4cqw;
            font-size: 4cqw;
            font-weight: 700;
            background: repeating-linear-gradient(135deg, rgba(0, 0, 0, .08) 0 2cqw, rgba(0, 0, 0, .02) 2cqw 4cqw)
        }

        .ad-tag {
            position: absolute;
            right: 1.6cqw;
            bottom: 1.4cqw;
            font-size: 2.4cqw;
            color: rgba(128, 128, 128, .9)
        }

        .ad-blackgold {
            background: radial-gradient(120% 90% at 50% 0%, #232018 0%, #0b0b0a 60%);
            color: #f4ecd8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.8cqw;
            text-align: center;
            padding: 6cqw
        }

        .ad-blackgold::before {
            content: "";
            position: absolute;
            inset: 3cqw;
            border: 1px solid #c9a54a;
            pointer-events: none
        }

        .ad-blackgold .eyebrow {
            font-size: 3.2cqw;
            letter-spacing: .35em;
            color: #d8b65c;
            font-weight: 700
        }

        .ad-blackgold .img {
            width: 36cqw;
            height: 32cqw
        }

        .ad-blackgold .ttl {
            font-size: 5.4cqw;
            font-weight: 700
        }

        .ad-blackgold .price {
            font-size: 6.4cqw;
            font-weight: 700;
            color: #e2c270
        }

        .ad-blackgold .ad-btn {
            border: 1px solid #d8b65c;
            color: #e2c270;
            padding: 1.6cqw 5cqw;
            font-size: 3.8cqw
        }

        .ad-blackgold .ad-hide {
            background: repeating-linear-gradient(135deg, rgba(226, 194, 112, .22) 0 2cqw, rgba(226, 194, 112, .06) 2cqw 4cqw);
            color: #e2c270
        }

        .ad-whitered {
            background: #fff;
            color: #1c1c1c;
            display: grid;
            grid-template-rows: auto 1fr;
            border: 1px solid #eee
        }

        .ad-whitered .band {
            background: #d7262f;
            color: #fff;
            font-weight: 800;
            font-size: 4.6cqw;
            padding: 2.6cqw 5cqw;
            display: flex;
            justify-content: space-between
        }

        .ad-whitered .band em {
            font-style: normal;
            background: #fff;
            color: #d7262f;
            border-radius: 1cqw;
            padding: 0 2cqw
        }

        .ad-whitered .row {
            display: grid;
            grid-template-columns: 46% 1fr;
            align-items: center
        }

        .ad-whitered .img {
            padding: 5cqw 4cqw
        }

        .ad-whitered .body {
            padding: 3cqw 5cqw 3cqw 1cqw;
            display: flex;
            flex-direction: column;
            gap: 2cqw
        }

        .ad-whitered .ttl {
            font-size: 5.4cqw;
            font-weight: 700
        }

        .ad-whitered .price {
            font-size: 8cqw;
            font-weight: 800;
            color: #d7262f
        }

        .ad-whitered .price s {
            display: block;
            font-size: 3.8cqw;
            color: #999;
            font-weight: 400
        }

        .ad-whitered .ad-btn {
            background: #d7262f;
            color: #fff;
            align-self: flex-start
        }

        .ad-redauto {
            background: linear-gradient(160deg, #e3182f 0%, #a80e22 100%);
            color: #fff;
            padding: 5cqw;
            display: flex;
            flex-direction: column;
            gap: 3cqw
        }

        .ad-redauto .head2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 4.6cqw;
            font-weight: 800
        }

        .ad-redauto .auto {
            font-size: 3cqw;
            background: rgba(255, 255, 255, .18);
            border-radius: 10cqw;
            padding: .8cqw 2.4cqw;
            font-weight: 700
        }

        .ad-redauto .tiles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.4cqw;
            flex: 1
        }

        .ad-redauto .tile {
            background: #fff;
            color: #222;
            border-radius: 2cqw;
            padding: 2cqw;
            display: flex;
            flex-direction: column;
            gap: 1cqw;
            justify-content: space-between
        }

        .ad-redauto .tile .img {
            height: 17cqw
        }

        .ad-redauto .tile b {
            font-size: 3.6cqw;

        const sw = T => `background:${T.color}${T.ring ? `;box-shadow:inset 0 0 0 2px ${T.ring}` : ''}`;
        const cv = T => `--c:${T.color}${T.ring ? `;--r:${T.ring}` : ''}`;
        const md = s => s.slice(5).replace('-', '/');
        const THEMES = [];
        const theme = id => THEMES.find(t => t.id === id);
        const nm = T => `<span class="fname">${T.name}</span>`;
        initTimeline();
    </script>
    <script>
        /* 맨 위로 버튼 — 300px 이상 내려가면 표시 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
