<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비상품 프레임</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="frame_common.css">
    <style>
        /* ===== 상품 오토 · 비상품 페이지 전용: 프레임 2개라 카드·요약 박스 2열 ===== */
        .themes { grid-template-columns: repeat(2, 1fr) }
        #placeSummary { grid-template-columns: repeat(2, 1fr) }
        @media(max-width:800px) { .themes, #placeSummary { grid-template-columns: 1fr } }
        /* 이미지 배너 (iauto 336x280) — 칸 폭에 맞춰 축소 */
        .ad.ad-slot:has(img), .ad.ad-slot:has(.ad-empty) { aspect-ratio: 336 / 280 }
        /* 비상품 배너는 336x280 — 빈 칸도 같은 비율로 높이 맞춤 */
        .ad.ad-slot:has(img) { border-color: #e3e6ea; overflow: hidden }
        .ad.ad-slot img { display: block; width: 100%; height: 100%; object-fit: contain }
    </style>
</head>
<body>
    <div class="wrap">

        <section>
            <div class="title">
                <h2>1. 비상품 프레임별 성과</h2>
                <div class="period-ctrl" id="themePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="themeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="themes" id="themes"></div>
        </section>

        <section>
            <div class="title">
                <h2>2. 어제 vs 그제 비상품 프레임별 비교</h2>
            </div>
            <div class="card">
                <div class="scroll yd-scroll" id="yd"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>3. 최근 7일 비상품 프레임별 비교</h2>
            </div>
            <div class="card">
                <div class="legend" id="w7Legend"></div>
                <div class="w7" id="w7"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>4. iauto · i사이즈 일별 추이</h2>
            </div>
            <div class="card">
                <div class="scroll">
                    <table id="transTable"></table>
                </div>
            </div>
        </section>

        <section id="placeSection">
            <div class="title">
                <h2>5. 프레임 지면별 비교 (12개 지면) <small class="h2-note">매체 지면 기준 · 기간 누적 · 노출 상위 12개</small></h2>
            </div>
            <div class="card">
                <div class="m-tabs" id="placeMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="ss" id="placeSummary"></div>
                <div class="scroll">
                    <table id="placeTable"></table>
                </div>
            </div>
        </section>
    </div>

    <button type="button" class="tl-open" id="tlOpen" aria-haspopup="dialog" aria-label="프레임 변경 Timeline 보기">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
        </svg>
        <span class="tl-open-label">프레임 변경 Timeline</span>
    </button>

    <dialog class="tl-modal" id="tlModal" aria-labelledby="tlModalTitle">
        <div class="tl-modal-head">
            <div>
                <h2 id="tlModalTitle">프레임 변경 Timeline</h2>
            </div>
            <button type="button" class="tl-close" id="tlClose" aria-label="닫기">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>
            </button>
        </div>
        <div class="tl-modal-body">
            <ol class="tl" id="timeline"></ol>
        </div>
    </dialog>

    <button type="button" class="to-top" id="toTop" aria-label="맨 위로">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <script src="frame_timeline.js"></script>
    <script src="frame_common.js"></script>
    <script>
        /* =====================================================================
           설정 — 숫자는 rtb_frame_analysis xlsx(04 시트)에서 update_data.bat이 채웁니다
           ===================================================================== */
        // 비상품 프레임 2개: iauto (비상품 auto, 신규) · i사이즈 (이전 방식 — 사이즈별로 따로 만든 프레임 12개, 오토 아님). 배너 미리보기는 아직 없습니다.
        const THEMES = [
            { id: 'iauto', name: 'iauto 프레임', ab: 'after', ch: '구글', code: 'iauto', desc: '비상품 auto · 09-02 투입', color: '#3446b8', src: '',
              img: 'https://manage.mobon.net/ad/imgfile//20240617185940-tJb4iOIAxf-336x280.jpg', view: 'https://kyungahkims.github.io/openRtb_banners.github.io/total_banners_view.html' },   // img: 배너 이미지(336x280) · view: 전체 배너 뷰어 (블랙골드·화이트레드와 같은 페이지)
            { id: 'isize', name: 'i사이즈 프레임 (12개)', ab: 'before', ch: '구글', code: 'i{가로}_{세로}', desc: '사이즈별 개별 프레임 12개 (오토 아님) · 09-02까지', color: '#22c55e', src: '' },   // 데이터: update_data.py (rtb_frame_analysis xlsx 04 시트)
        ];
        const MIN_IMP = 1000;   // 이보다 노출이 적으면 CTR을 0(집계 제외)으로 — 노출 수십에 클릭만 잡힌 값 방지
        const PERIOD = {"시작": "2026-09-01", "끝": "2026-09-22", "집행일수": 18};

        /* 데이터 [날짜, 프레임 id, 노출수, 클릭수] — update_data.bat이 자동으로 바꿉니다 */
        /* ADATA:START */
        const ADATA = [
            ["2026-09-01", "iauto", 10583, 0],
            ["2026-09-01", "isize", 1070427, 367],
            ["2026-09-02", "iauto", 368170, 90],
            ["2026-09-02", "isize", 782536, 155],
            ["2026-09-03", "iauto", 1240167, 366],
            ["2026-09-04", "iauto", 1240441, 397],
            ["2026-09-05", "iauto", 826627, 269],
            ["2026-09-06", "iauto", 869050, 285],
            ["2026-09-07", "iauto", 1100801, 325],
            ["2026-09-08", "iauto", 1001443, 352],
            ["2026-09-09", "iauto", 922560, 349],
            ["2026-09-09", "isize", 854, 0],
            ["2026-09-10", "iauto", 964237, 366],
            ["2026-09-11", "iauto", 1119181, 296],
            ["2026-09-14", "iauto", 820051, 263],
            ["2026-09-15", "iauto", 827718, 266],
            ["2026-09-16", "iauto", 1136420, 450],
            ["2026-09-17", "iauto", 1396951, 428],
            ["2026-09-18", "iauto", 1673756, 416],
            ["2026-09-21", "iauto", 1296964, 290],
            ["2026-09-22", "iauto", 1015446, 205],
        ];
        /* ADATA:END */
        /* 지면별 누적 [프레임 id, 요청 사이즈, 노출수, 클릭수] — 지면별.csv에서 update_data.bat이 자동으로 바꿉니다 */
        /* APDATA:START */
        const APDATA = [
            ["iauto", "web_daum.net_banner_3_N_v2", 3504807, 87],
            ["iauto", "web_theqoo.net_banner_1_N_v2", 830638, 181],
            ["iauto", "app_com.read.goodnovel_banner_1_N_v2", 811489, 541],
            ["iauto", "web_inven.co.kr_banner_0_N_v2", 564111, 21],
            ["iauto", "web_v.daum.net_banner_1_N_v2", 559979, 155],
            ["iauto", "web_maplescouter.com_banner_1_N_v2", 539045, 108],
            ["iauto", "web_daum.net_banner_1_N_v2", 489029, 596],
            ["iauto", "mob_imbc.com_banner_5_N_v2", 426468, 26],
            ["isize", "web_daum.net_banner_3_N_v2", 420477, 9],
            ["iauto", "web_v.daum.net_banner_3_N_v2", 315352, 124],
            ["iauto", "web_quasarzone.com_banner_3_N_v2", 308768, 7],
            ["iauto", "web_ppomppu.co.kr_banner_1_N_v2", 275309, 98],
            ["iauto", "mob_jeomsinpf1.co.kr_banner_1_N_v2", 224780, 114],
            ["isize", "app_com.read.goodnovel_banner_1_N_v2", 140090, 89],
            ["isize", "web_theqoo.net_banner_1_N_v2", 102490, 16],
            ["isize", "web_v.daum.net_banner_1_N_v2", 96800, 33],
            ["isize", "web_daum.net_banner_1_N_v2", 92163, 97],
            ["isize", "web_ppomppu.co.kr_banner_1_N_v2", 40022, 10],
            ["isize", "mob_imbc.com_banner_5_N_v2", 39065, 4],
            ["isize", "mob_jeomsinpf1.co.kr_banner_1_N_v2", 28298, 12],
            ["isize", "web_v.daum.net_banner_3_N_v2", 26060, 5],
            ["isize", "web_quasarzone.com_banner_3_N_v2", 20338, 1],
            ["isize", "web_inven.co.kr_banner_0_N_v2", 18719, 1],
            ["isize", "web_maplescouter.com_banner_1_N_v2", 12391, 2],
        ];
        /* APDATA:END */

        const ROWS = ADATA.map(([d, t, imp, clk]) => ({ d, t, imp, clk }));
        const DATES = [...new Set(ROWS.map(r => r.d))].sort();
        const TODAY = DATES[DATES.length - 1] || ymd(new Date());
        const PERIOD_FROM = TODAY.slice(0, 8) + '01';
        THEMES.forEach(T => { const ds = ROWS.filter(r => r.t === T.id).map(r => r.d).sort(); T.from = ds[0]; T.to = ds[ds.length - 1]; });

        initFramePage();   // ① 테마별 성과 · ② 어제 vs 그제 · ③ 최근 7일 · 배너 툴팁 · Timeline (frame_common.js)

        /* ④ iauto · i사이즈 일별 추이 */
        (function () {
            const R = theme('iauto'), A = theme('isize');
            const day = (t, d) => sum(pick(r => r.t === t && r.d === d));
            const seg = (r, a) => {
                const rr = r.imp >= MIN_IMP, aa = a.imp >= MIN_IMP;
                return rr && aa ? ['both', '병행'] : rr ? ['red', 'iauto 단독'] : aa ? ['auto', 'i사이즈 단독'] : ['none', '−'];
            };
            const cell = (o, k, m) => `<td class="sep" data-v="${o.imp ? o[k] : -1}">${o.imp ? m.fmt(o[k]) : '−'}</td>`;
            const group = (o) => M3.map(m => cell(o, m.k, m)).join('');
            const rows = [...DATES].reverse().map(d => {
                const r = day(R.id, d), a = day(A.id, d), both = sum(pick(x => (x.t === R.id || x.t === A.id) && x.d === d));
                const [cls, label] = seg(r, a);
                return `<tr class="${cls === 'both' ? 'pivot' : ''}"><td><b>${md(d)}</b></td><td class="left"><span class="seg-chip ${cls}" style="${cls === 'red' ? cv(R) : cls === 'auto' ? cv(A) : cls === 'both' ? `--c:${R.color};--c2:${A.color}` : ''}">${label}</span></td>${group(r)}${group(a)}${group(both)}</tr>`;
            }).join('');
            const tot = t => sum(pick(r => t.includes(r.t)));
            const TR = tot([R.id]), TA = tot([A.id]), TB = tot([R.id, A.id]);
            document.getElementById('transTable').innerHTML = `<thead>
                <tr><th rowspan="2">일자</th><th rowspan="2" style="text-align:left">구간</th>
                    <th colspan="3" class="grp sep" style="${cv(R)}"><span class="dot" style="${sw(R)}"></span>${nm(R)}</th>
                    <th colspan="3" class="grp sep" style="${cv(A)}"><span class="dot" style="${sw(A)}"></span>${nm(A)}</th>
                    <th colspan="3" class="grp sep">합산</th></tr>
                <tr>${[R, A, { name: '합산' }].map(() => M3.map(m => `<th class="sep">${m.label.replace(' (CTR)', '')}</th>`).join('')).join('')}</tr>
                <tr class="total-row"><td>합계</td><td class="left">${DATES.length}일</td>${group(TR)}${group(TA)}${group(TB)}</tr>
            </thead><tbody>${rows}</tbody>`;
        })();

        /* ⑤ 지면별 — 기간 누적, 노출 상위 12개 지면 × 오토 프레임 (지표 탭) */
        const PROWS = APDATA.map(([t, p, imp, clk]) => ({ t, p, imp, clk }));
        if (!PROWS.length) document.getElementById('placeSection').hidden = true;   // 지면 데이터(지면별(비상품).csv)가 없으면 숨김
        const PLACE_N = 12;
        // 지면 표시: 매체 지면 web_daum.net_banner_3_N_v2 → daum.net / banner 3 · web (요청 사이즈 970_280 → 970×280 도 지원)
        const placeLabel = p => {
            const m = p.match(/^(\d+)_(\d+)$/);
            if (m) return `<b>${m[1]}×${m[2]}</b><small>요청 사이즈</small>`;
            const t = p.replace(/_N_v2$/, '').match(/^(web|app|mob)_(.+?)_([a-z]+)_(\d+)$/);
            if (t) return `<b>${t[2]}</b><small>${t[3]} ${t[4]} · ${t[1]}</small>`;
            return `<b>${p}</b>`;
        };
        const placeShort = p => { const t = p.replace(/_N_v2$/, '').match(/^(web|app|mob)_(.+?)_([a-z]+)_(\d+)$/); return t ? `${t[2]} ${t[3]} ${t[4]}` : p.replace(/^(\d+)_(\d+)$/, '$1×$2'); };   // 요약 목록용 짧은 이름 (daum.net banner 3)
        function renderPlace(mk) {
            const m = M3.find(x => x.k === mk);
            const FR = THEMES;
            const psum = fn => sum(PROWS.filter(fn));
            const argmax = list => { let w = -1; list.forEach((o, i) => { if (o.imp && (w < 0 || o[mk] > list[w][mk])) w = i; }); return w; };
            const places = [...new Set(PROWS.map(r => r.p))]
                .map(p => ({ p, all: psum(r => r.p === p) }))
                .sort((a, b) => b.all.imp - a.all.imp).slice(0, PLACE_N);
            const rows = places.map(({ p }) => ({ p, v: FR.map(T => psum(r => r.t === T.id && r.p === p)) }));
            rows.forEach(r => r.win = argmax(r.v));
            const shown = new Set(rows.map(r => r.p));
            const tot = FR.map(T => psum(r => r.t === T.id && shown.has(r.p)));   // 합계는 표에 있는 지면 기준
            const winCell = i => i < 0 ? '−' : `<span class="win" style="${cv(FR[i])}">${nm(FR[i], true)}${FR[i].ch === '카카오' ? ' (카카오)' : ''}</span>`;
            const plain = o => o.imp ? m.fmt(o[mk]) : '−';
            const head = `<thead>
                <tr><th>지면</th><th class="sep" style="text-align:left">${m.label} 1위</th>${FR.map((T, i) => `<th data-col="${i + 2}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}${T.ch === '카카오' ? '<br><small>(카카오)</small>' : ''}</th>`).join('')}</tr>
                <tr class="total-row"><td>합계</td><td class="sep left">${winCell(argmax(tot))}</td>${tot.map(o => `<td class="sep">${plain(o)}</td>`).join('')}</tr>
            </thead>`;
            const placeRow = ({ p, v, win }) => `<tr><td class="place-cell">${placeLabel(p)}</td><td class="sep left">${winCell(win)}</td>${v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === win ? ' top' : ''), i === win ? FR[i] : '', `${p} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>`;
            const t = document.getElementById('placeTable');
            t.innerHTML = head + `<tbody>${rows.map(placeRow).join('')}</tbody>`;
            makeSortable(t);
            document.getElementById('placeSummary').innerHTML = FR.map((T, i) => {
                const list = rows.filter(r => r.win === i).map(r => placeShort(r.p));
                return `<div class="ss-item" style="${cv(T)}">
                    <div class="ss-top"><span class="dot" style="${sw(T)}"></span>${nm(T)}${T.ch === '카카오' ? ' (카카오)' : ''}<b>${m.label} 1위 · ${list.length}개 지면</b></div>
                    <div class="ss-bar"><span style="width:${rows.length ? list.length / rows.length * 100 : 0}%"></span></div>
                    <div class="ss-list">${list.join(' · ') || '−'}</div>
                </div>`;
            }).join('');
        }
        (function () {
            const tabs = document.getElementById('placeMetric');
            const run = () => renderPlace(tabs.querySelector('[aria-selected="true"]').dataset.metric);
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            run();
        })();
    </script>
</body>

</html>
