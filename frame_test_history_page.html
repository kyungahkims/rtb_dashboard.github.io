<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>상품 고정 프레임</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="frame_common.css">
    <style>
        /* ===== 상품 고정 프레임 페이지 전용 ===== */
        :root { --theme-cols: 3; --summary-cols: 3 }   /* ① 카드 3개 · 사이즈별/지면별 요약 박스 3개 */
    </style>
</head>

<body>
    <div class="wrap">

        <section>
            <div class="title">
                <h2>1. 프레임 테마별 성과</h2>
                <div class="period-ctrl" id="themePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="themeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="themes" id="themes"></div>
        </section>

        <section>
            <div class="title">
                <h2>2. 어제 vs 그제 프레임 테마별 비교</h2>
            </div>
            <div class="card">
                <div class="scroll yd-scroll" id="yd"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>3. 최근 7일 프레임 테마별 비교</h2>
            </div>
            <div class="card">
                <div class="legend" id="w7Legend"></div>
                <div class="w7" id="w7"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>4. 블랙골드 · 화이트레드 · 매거진 일별 추이 <small class="h2-note">구간 = 그날 노출된 테마 · 구간이 바뀐 날은 강조</small></h2>
            </div>
            <div class="card">
                <div class="scroll">
                    <table id="transTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>5. 사이즈별 프레임 비교 (14개 사이즈)</h2>
                <div class="period-ctrl" id="sizePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="sizeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="sizeMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="ss" id="sizeSummary"></div>
                <div class="scroll">
                    <table id="sizeTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>6. 프레임 이름별 비교</h2>
                <div class="period-ctrl" id="namePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="nameDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="scroll name-scroll">
                    <table id="nameTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>7. 프레임 지면별 비교 (12개 지면) <small class="h2-note">구글 대시보드 상위 지면 12개 · 소량 지면(기타)은 제외</small></h2>
                <div class="period-ctrl" id="placePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="placeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="placeMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="ss" id="placeSummary"></div>
                <div class="scroll">
                    <table id="placeTable"></table>
                </div>
            </div>
        </section>

    </div>


    <button type="button" class="tl-open" id="tlOpen" aria-haspopup="dialog" aria-label="프레임 변경 Timeline 보기">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
        </svg>
        <span class="tl-open-label">프레임 변경 Timeline</span>
    </button>

        <div class="tl-modal-head">
            <div>

                    stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>
            </button>
        </div>
        <div class="tl-modal-body">
            <ol class="tl" id="timeline"></ol>
        </div>
    </dialog>

            ["2026-09-22", "whitered", "320_50_whiteRed_ETC", "320x50", 37469, 11],
            ["2026-09-22", "whitered", "160_600_whiteRed_ETC", "160x600", 53741, 23],
            ["2026-09-22", "whitered", "300_250_whiteRed_ETC", "300x250", 51682, 23],
            ["2026-09-22", "whitered", "120_600_whiteRed_ETC", "120x600", 42558, 9],
            ["2026-09-22", "whitered", "250_250_whiteRed_ETC", "250x250", 17297, 12],
            ["2026-09-22", "whitered", "200_200_whiteRed_ETC", "200x200", 16104, 5],
            ["2026-09-22", "whitered", "336_280_whiteRed_ETC", "336x280", 12402, 5],
            ["2026-09-22", "whitered", "320_100_whiteRed_ETC", "320x100", 13779, 8],
            ["2026-09-22", "whitered", "300_50_whiteRed_ETC", "300x50", 15227, 1],
            ["2026-09-22", "whitered", "728_90_whiteRedNo", "728x90", 85578, 14],
            ["2026-09-22", "whitered", "234_60_whiteRed_ETC", "234x60", 13543, 3],
            ["2026-09-22", "whitered", "300_100_whiteRed_ETC", "300x100", 14496, 3],
            ["2026-09-22", "whitered", "300_250_whiteRedNo", "300x250", 66972, 17],
            ["2026-09-22", "whitered", "300_600_whiteRed_ETC", "300x600", 6701, 4],
            ["2026-09-22", "whitered", "970_250_whiteRed_ETC", "970x250", 6693, 4],
            ["2026-09-22", "whitered", "160_600_whiteRedNo", "160x600", 22979, 11],
            ["2026-09-22", "whitered", "320_50_whiteRedNo", "320x50", 22216, 0],
            ["2026-09-22", "whitered", "120_600_whiteRedNo", "120x600", 15354, 3],
            ["2026-09-22", "whitered", "200_200_whiteRedNo", "200x200", 12120, 2],
            ["2026-09-22", "whitered", "336_280_whiteRedNo", "336x280", 11715, 7],
            ["2026-09-22", "whitered", "300_600_whiteRedNo", "300x600", 7309, 5],
            ["2026-09-22", "whitered", "320_100_whiteRedNo", "320x100", 6552, 4],
            ["2026-09-22", "whitered", "250_250_whiteRedNo", "250x250", 4518, 1],
            ["2026-09-22", "whitered", "970_250_whiteRedNo", "970x250", 2115, 1],
            ["2026-09-22", "whitered", "300_50_whiteRedNo", "300x50", 1529, 0],
            ["2026-09-22", "whitered", "234_60_whiteRedNo", "234x60", 1376, 0],
            ["2026-09-22", "whitered", "300_100_whiteRedNo", "300x100", 1034, 1],
        ];
        /* DDATA:END */

        const ROWS = DATA.map(([d, t, n, s, imp, clk]) => ({ d, t, n, s, imp, clk }));
        const DATES = [...new Set(ROWS.map(r => r.d))].sort();       // 데이터가 있는 날짜
        const TODAY = DATES[DATES.length - 1] || ymd(new Date());     // 마지막 데이터 날짜
        const PERIOD_FROM = TODAY.slice(0, 8) + '01';                 // 당월 1일 (④⑤ 조회기간 시작)
        THEMES.forEach(T => { const ds = ROWS.filter(r => r.t === T.id).map(r => r.d).sort(); T.from = ds[0]; T.to = ds[ds.length - 1]; });

        /* ---------- 상품 고정 전용: 기간 판정 · 사이즈/이름 누적(SDATA·NDATA) · 일별 사이즈(DDATA) ---------- */
        const inPeriod = r => r.d >= PERIOD_FROM && r.d <= TODAY;
        const SROWS = SDATA.map(([t, s, imp, clk]) => ({ t, s, imp, clk }));
        const NROWS = NDATA.map(([t, n, s, imp, clk]) => ({ t, n, s, imp, clk }));
        // 일별 사이즈·이름: DATA 에 사이즈가 있으면 그것, 없으면 DDATA(원본 일별) — ⑤⑥ '일별' 선택에 씀
        const DROWS = ROWS.some(r => r.s) ? ROWS.filter(r => r.s) : DDATA.map(([d, t, n, s, imp, clk]) => ({ d, t, n, s, imp, clk }));
        const DAILY_DETAIL = DROWS.length > 0;
        const DDATES = [...new Set(DROWS.map(r => r.d))].sort(), DTODAY = DDATES[DDATES.length - 1] || TODAY;   // 일별 사이즈 데이터의 마지막 날
        const dpick = fn => DROWS.filter(fn);

        initFramePage();   // ① 테마별 성과 · ② 어제 vs 그제 · ③ 최근 7일 · 배너 툴팁 · Timeline (frame_common.js)

        /* ④ 일별 추이 — 날짜마다 테마별 노출·클릭·CTR + 합산. 구간 = 그날 노출된 테마(단독 / 병행), 구간이 바뀐 날은 강조 */
        (function () {
            const day = (t, d) => sum(pick(r => r.t === t && r.d === d));
            const active = vals => THEMES.filter((T, i) => vals[i].imp > 0);
            const seg = on => {
                if (!on.length) return `<span class="seg-chip none">−</span>`;
                if (on.length === 1) return `<span class="seg-chip one" style="${cv(on[0])}">${on[0].name.replace(' 프레임', '')} 단독</span>`;
                // 병행 — 노출된 테마 색을 칸으로 나눠 표시
                const n = on.length, bg = on.map((T, i) => `color-mix(in srgb, ${T.color} 22%, #fff) ${i / n * 100}% ${(i + 1) / n * 100}%`).join(', ');
                return `<span class="seg-chip" style="background:linear-gradient(90deg, ${bg})">${on.map(T => T.name.replace(' 프레임', '')).join(' · ')} 병행</span>`;
            };
            const cell = (o, k, m) => `<td class="sep" data-v="${o.imp ? o[k] : -1}">${o.imp ? m.fmt(o[k]) : '−'}</td>`;
            const group = o => M3.map(m => cell(o, m.k, m)).join('');
            const days = [...DATES].reverse();
            let prevKey = null;
            const rows = [...DATES].map(d => {   // 과거 → 최신 순으로 구간 변화를 판단한 뒤 최신순으로 표시
                const v = THEMES.map(T => day(T.id, d)), on = active(v), key = on.map(T => T.id).join('+');
                const pivot = prevKey !== null && key !== prevKey;
                prevKey = key;
                return { d, v, on, pivot, all: sum(pick(r => r.d === d)) };
            }).reverse().map(({ d, v, on, pivot, all }) =>
                `<tr class="${pivot ? 'pivot' : ''}"><td><b>${md(d)}</b></td><td class="left">${seg(on)}</td>${v.map(group).join('')}${group(all)}</tr>`).join('');
            const tot = THEMES.map(T => sum(pick(r => r.t === T.id))), totAll = sum(ROWS);
            document.getElementById('transTable').innerHTML = `<thead>
                <tr><th rowspan="2">일자</th><th rowspan="2" style="text-align:left">구간</th>
                    ${THEMES.map(T => `<th colspan="3" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}</th>`).join('')}
                    <th colspan="3" class="grp sep">합산</th></tr>
                <tr>${[...THEMES, { name: '합산' }].map(() => M3.map(m => `<th class="sep">${m.label.replace(' (CTR)', '')}</th>`).join('')).join('')}</tr>
                <tr class="total-row"><td>합계</td><td class="left">${DATES.length}일</td>${tot.map(group).join('')}${group(totAll)}</tr>
            </thead><tbody>${rows}</tbody>`;
        })();

        /* ⑤ 사이즈별 — 블랙골드 · 화이트레드 · 매거진 (지표 탭 · 9월 전체 / 일별 선택) */
        function renderSize(from, to, mk) {
            const inR = r => r.d >= from && r.d <= to;
            const m = M3.find(x => x.k === mk);
            const FR = ['blackgold', 'whitered', 'magazine'].map(theme);
            const argmax = list => { let w = -1; list.forEach((o, i) => { if (o.imp && (w < 0 || o[mk] > list[w][mk])) w = i; }); return w; };
            const whole = from === PERIOD_FROM && to === TODAY && SROWS.length;   // 월 전체는 기간 누적(SDATA · xlsx) · 일별은 원본 일별(DROWS)
            const src = whole ? (fn => SROWS.filter(fn)) : (fn => dpick(r => inR(r) && fn(r)));
            const rows = SIZES.map(S => ({ S, v: FR.map(T => sum(src(r => r.t === T.id && r.s === S.name))) }));
            rows.forEach(r => r.win = argmax(r.v));
            const tot = FR.map(T => sum(src(r => r.t === T.id)));
            const winCell = i => i < 0 ? '−' : `<span class="win" style="${cv(FR[i])}">${nm(FR[i], true)}</span>`;
            const plain = o => o.imp ? m.fmt(o[mk]) : '−';
            const head = `<thead>
                <tr><th>사이즈</th><th class="sep" style="text-align:left">${m.label} 1위</th>${FR.map((T, i) => `<th data-col="${i + 2}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}</th>`).join('')}</tr>
                <tr class="total-row"><td>합계</td><td class="sep left">${winCell(argmax(tot))}</td>${tot.map(o => `<td class="sep">${plain(o)}</td>`).join('')}</tr>
            </thead>`;
            const sizeRow = ({ S, v, win }) => `<tr><td class="size-cell"><b>${S.name}</b></td><td class="sep left">${winCell(win)}</td>${v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === win ? ' top' : ''), i === win ? FR[i] : '', `${S.name} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>`;
            const body = `<tbody>${rows.map(sizeRow).join('')}</tbody>`;
            const t = document.getElementById('sizeTable');
            t.innerHTML = head + body;
            makeSortable(t);
            // 요약: 테마별 1위 사이즈 수
            document.getElementById('sizeSummary').innerHTML = FR.map((T, i) => {
                const list = rows.filter(r => r.win === i).map(r => r.S.name);
                return `<div class="ss-item" style="${cv(T)}">
                    <div class="ss-top"><span class="dot" style="${sw(T)}"></span>${nm(T)}<b>${m.label} 1위 · ${list.length}개 사이즈</b></div>
                    <div class="ss-bar"><span style="width:${list.length / SIZES.length * 100}%"></span></div>
                    <div class="ss-list">${list.join(' · ') || '−'}</div>
                </div>`;
            }).join('');
        }
        (function () {
            const ctrl = document.getElementById('sizePeriod'), dateEl = document.getElementById('sizeDate'), tabs = document.getElementById('sizeMetric');
            if (!DAILY_DETAIL) ctrl.querySelector('[data-mode="day"]').hidden = true;
            dateEl.min = PERIOD_FROM; dateEl.max = DTODAY; dateEl.value = DTODAY;
            ctrl.querySelector('[data-mode="month"]').textContent = `${+TODAY.slice(5, 7)}월 전체`;
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                const mk = tabs.querySelector('[aria-selected="true"]').dataset.metric;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || DTODAY;
                if (mode === 'day') renderSize(d, d, mk); else renderSize(PERIOD_FROM, TODAY, mk);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();

        /* ⑤ 프레임 이름별 — 실제 프레임 이름 전부 (9월 전체 / 일별 선택) */
        function renderNames(from, to) {
            const inR = r => r.d >= from && r.d <= to;
            const whole = from === PERIOD_FROM && to === TODAY && NROWS.length;   // 월 전체는 기간 누적(NDATA · xlsx) · 일별은 원본 일별(DROWS)
            const src = whole ? NROWS : dpick(inR);
            const names = [...new Set(src.map(r => r.n))];
            const rows = names.map(n => { const rs = src.filter(r => r.n === n); return { n, T: theme(rs[0].t), size: rs[0].s, s: sum(rs) }; });
            const t = document.getElementById('nameTable');
            t.innerHTML = `<thead>
                <tr><th>프레임 이름</th><th style="text-align:left">테마</th><th data-col="2" style="text-align:left">사이즈</th>${M3.map((m, i) => `<th data-col="${i + 3}">${m.label}</th>`).join('')}</tr>
            </thead><tbody>${rows.length ? rows.map(({ n, T, size, s }) => `<tr>
                <td><span class="rk-slot"></span><b>${n}</b></td>
                <td class="left"><span class="dot" style="${sw(T)}"></span>${nm(T)}</td>
                <td class="left">${size === '비규격' ? '비규격 (오토)' : size}</td>
                ${M3.map(m => numTd(s[m.k], m.fmt)).join('')}</tr>`).join('') : '<tr><td colspan="6" class="na" style="text-align:center">이 날짜에는 데이터가 없습니다</td></tr>'}</tbody>`;
            makeSortable(t);
            // 프레임 이름 앞 1·2·3위 — 정렬한 지표(노출수·클릭수·CTR) 기준, 이름·사이즈로 정렬하면 CTR 기준
            const rank = () => {
                const th = t.querySelector('th[aria-sort]'), col = th && +th.dataset.col >= 3 ? +th.dataset.col : 5;
                const trs = [...t.tBodies[0].rows].filter(r => r.cells.length > 1);
                const order = [...trs].sort((x, y) => +y.cells[col].dataset.v - +x.cells[col].dataset.v);
                trs.forEach(r => r.querySelector('.rk-slot').innerHTML = '');
                order.slice(0, 3).forEach((r, i) => r.querySelector('.rk-slot').innerHTML = `<span class="rk-badge rk${i + 1}">${i + 1}위</span>`);
            };
            t.tHead.addEventListener('click', () => setTimeout(rank));
            t.querySelector('th[data-col="5"] .arw-up').click();   // 처음에는 클릭률 (CTR) 높은 순
        }
        (function () {
            const ctrl = document.getElementById('namePeriod'), dateEl = document.getElementById('nameDate');
            if (!DAILY_DETAIL) ctrl.querySelector('[data-mode="day"]').hidden = true;
            dateEl.min = PERIOD_FROM; dateEl.max = DTODAY; dateEl.value = DTODAY;
            ctrl.querySelector('[data-mode="month"]').textContent = `${+TODAY.slice(5, 7)}월 전체`;
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || DTODAY;
                if (mode === 'day') renderNames(d, d); else renderNames(PERIOD_FROM, TODAY);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();
        /* ⑥ 지면별 — 테마 × 지면 (지표 탭 · 9월 전체 / 일별 선택) · 지면 데이터가 들어오면 표시 */
        const PROWS = PDATA.map(([d, t, p, imp, clk]) => ({ d, t, p, imp, clk }));
        const ETC_PLACE = '기타 지면';
        // 지면 이름 표시: web_daum.net_banner_3_N_v2 → daum.net / banner 3 · web
        const placeLabel = p => {
            const m = p.replace(/_N_v2$/, '').match(/^(web|app|mob)_(.+?)_([a-z]+)_(\d+)$/);
            return m ? `<b>${m[2]}</b><small>${m[3]} ${m[4]} · ${m[1]}</small>` : `<b>${p}</b>`;
        };
        function renderPlace(from, to, mk) {
            const inR = r => r.d >= from && r.d <= to;
            const m = M3.find(x => x.k === mk);
            const FR = THEMES;
            const psum = fn => sum(PROWS.filter(fn));
            const argmax = list => { let w = -1; list.forEach((o, i) => { if (o.imp && (w < 0 || o[mk] > list[w][mk])) w = i; }); return w; };
            // 지면 목록: 기간 내 노출 많은 순 — 12개 실제 지면만 ('기타 지면' 묶음은 제외)
            const places = [...new Set(PROWS.filter(r => inR(r) && r.p !== ETC_PLACE).map(r => r.p))]
                .map(p => ({ p, all: psum(r => inR(r) && r.p === p) }))
                .sort((a, b) => b.all.imp - a.all.imp);
            const rows = places.map(({ p }) => ({ p, v: FR.map(T => psum(r => inR(r) && r.t === T.id && r.p === p)) }));
            rows.forEach(r => r.win = argmax(r.v));
            const tot = FR.map(T => psum(r => inR(r) && r.t === T.id && r.p !== ETC_PLACE));   // 합계도 표에 있는 12개 지면 기준
            const winCell = i => i < 0 ? '−' : `<span class="win" style="${cv(FR[i])}">${nm(FR[i], true)}</span>`;
            const plain = o => o.imp ? m.fmt(o[mk]) : '−';
            const head = `<thead>
                <tr><th>지면</th><th class="sep" style="text-align:left">${m.label} 1위</th>${FR.map((T, i) => `<th data-col="${i + 2}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}</th>`).join('')}</tr>
                <tr class="total-row"><td>합계</td><td class="sep left">${winCell(argmax(tot))}</td>${tot.map(o => `<td class="sep">${plain(o)}</td>`).join('')}</tr>
            </thead>`;
            const placeRow = ({ p, v, win }) => `<tr><td class="place-cell">${placeLabel(p)}</td><td class="sep left">${winCell(win)}</td>${v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === win ? ' top' : ''), i === win ? FR[i] : '', `${p} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>`;
            const t = document.getElementById('placeTable');
            t.innerHTML = head + `<tbody>${rows.length ? rows.map(placeRow).join('') : `<tr><td colspan="${FR.length + 2}" class="na" style="text-align:center">이 날짜에는 데이터가 없습니다</td></tr>`}</tbody>`;
            makeSortable(t);
            // 요약: 테마별 1위 지면 수
            const real = rows;
            document.getElementById('placeSummary').innerHTML = FR.map((T, i) => {
                const list = real.filter(r => r.win === i).map(r => r.p.replace(/_N_v2$/, ''));
                return `<div class="ss-item" style="${cv(T)}">
                    <div class="ss-top"><span class="dot" style="${sw(T)}"></span>${nm(T)}<b>${m.label} 1위 · ${list.length}개 지면</b></div>
                    <div class="ss-bar"><span style="width:${real.length ? list.length / real.length * 100 : 0}%"></span></div>
                    <div class="ss-list">${list.join(' · ') || '−'}</div>
                </div>`;
            }).join('');
        }
        (function () {
            const ctrl = document.getElementById('placePeriod'), dateEl = document.getElementById('placeDate'), tabs = document.getElementById('placeMetric');
            const PD = [...new Set(PROWS.map(r => r.d))].sort(), PTODAY = PD[PD.length - 1] || TODAY;
            dateEl.min = PERIOD_FROM; dateEl.max = PTODAY; dateEl.value = PTODAY;
            ctrl.querySelector('[data-mode="month"]').textContent = `${+PTODAY.slice(5, 7)}월 전체`;
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                const mk = tabs.querySelector('[aria-selected="true"]').dataset.metric;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || PTODAY;
                if (mode === 'day') renderPlace(d, d, mk); else renderPlace(PERIOD_FROM, PTODAY, mk);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();
        // 날짜 칸 어디를 눌러도 달력이 뜨게
        // 날짜 칸(①④⑤⑥)은 눌러도 칸 안의 글자가 선택(파랗게)·복사되지 않게 — 포커스 없이 달력만 띄움
        document.querySelectorAll('.date-in').forEach(el => {
            el.addEventListener('mousedown', e => { e.preventDefault(); try { el.showPicker(); } catch (err) { } });
            el.addEventListener('keydown', e => { if (e.key !== 'Tab') e.preventDefault(); });   // 키보드 복사·선택 막기 (Tab 이동은 허용)
        });
    
    </script>
