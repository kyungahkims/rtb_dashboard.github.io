<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>상품 고정 프레임</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #f5f6f8;
            color: #202124;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif
        }

        .wrap {
            margin: auto;
            padding: 28px 32px
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-bottom: 22px;
            gap: 12px
        }

        .head h1 {
            margin: 0;
            font-size: 27px
        }

        .date {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            padding: 10px 14px;
            font-size: 13px
        }

        .card {
            background: #fff;
            border: 1px solid #e6e8ec;
            border-radius: 12px;
            padding: 26px 24px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .07);
            min-width: 0
        }

        section {
            margin-bottom: 48px
        }

        section:last-of-type {
            margin-bottom: 24px
        }

        .title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px
        }

        .title h2 {
            font-size: 17px;
            font-weight: 800;
            color: #1a1d23;
            letter-spacing: -.01em;
            margin: 0
        }

        .title span {
            font-size: 12px;
            color: #858a92
        }

        .note {
            font-size: 11px;
            color: #858a92;
            margin-top: 10px
        }

        .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: 0;
            flex: none
        }

        /* ① 테마별 성과 박스 */
        .themes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px
        }

        .theme {
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        .theme-art {
            background: #f8f9fb;
            padding: 16px;
            border-bottom: 1px solid #eceef1
        }

        .theme-art .ad {
            max-width: 280px;
            margin: auto
        }

        .theme-body {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .theme-name {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center
        }

        /* 프레임 이름 호버 툴팁 */
        .fname { cursor: default; border-bottom: 1px dotted transparent }
        .fname:hover { border-bottom-color: currentColor }
        #frameTip { position: fixed; left: -9999px; top: -9999px; z-index: 2000; width: 216px; padding: 8px; background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .16); pointer-events: none; visibility: hidden }
        #frameTip.show { visibility: visible }
        #frameTip .ft-item { display: none }
        #frameTip .ft-item.on { display: block }
        #frameTip .ad.ad-slot { width: 200px; margin: 0 auto }
        #frameTip .ft-name { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; font-size: 12px; font-weight: 700; color: #20242a }

        /* ① 신규 표시 */
        .tag-chip { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 999px; background: #3446b8; color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: .2px; line-height: 1.5 }
        /* ① 프레임 미리보기 링크 (뷰어 페이지 새 탭) */
        a.theme-art { display: block; text-decoration: none; color: inherit }
        .theme-view { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: #3446b8; text-decoration: none; white-space: nowrap; padding: 2px 7px; border-radius: 999px; background: #eef0f9 }
        .theme-view:hover { background: #3446b8; color: #fff }

        .theme-period {
            font-size: 12px;
            color: #6b7078
        }

        .theme-period b {
            color: #3446b8
        }

        .theme-stats {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 7px 10px;
            font-size: 13px;
            border-top: 1px dashed #e1e4e9;
            padding-top: 10px;
            margin: 0
        }

        .theme-stats dt {
            color: #7b8088
        }

        .theme-stats dd {
            margin: 0;
            text-align: right;
            font-weight: 700;
            font-variant-numeric: tabular-nums
        }

        /* ② 타임라인 */
        .tl {
            list-style: none;
            margin: 0;
            padding: 0;
            position: relative
        }

        .tl::before {
            content: "";
            position: absolute;
            left: 82px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: #e6e8ec
        }

        .tl li {
            display: grid;
            grid-template-columns: 70px 26px 1fr 150px;
            gap: 0 12px;
            align-items: start;
            padding: 10px 0
        }

        .tl li+li {
            border-top: 1px solid #f1f2f4
        }

        .tl-date {
            font-size: 13px;
            font-weight: 700;
            text-align: right;
            padding-top: 2px;
            font-variant-numeric: tabular-nums
        }

        .tl-date small {
            display: block;
            font-size: 11px;
            color: #9aa0a8;
            font-weight: 400
        }

        .tl-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 0 2px var(--c);
            background: var(--c);
            margin: 3px auto 0;
            position: relative;
            z-index: 1
        }

        .tl-body {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0
        }

        .tl-top {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .tl-top b {
            font-size: 14px
        }

        .tl-body p {
            margin: 0;
            font-size: 12.5px;
            color: #6b7078;
            line-height: 1.5
        }

        .chip {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap
        }

        .chip.deploy {
            background: #e8ecff;
            color: #3446b8
        }

        .chip.copy {
            background: #fff3dc;
            color: #a86b00
        }

        .chip.ratio {
            background: #fbe9ea;
            color: #c9444d
        }

        .chip.fix {
            background: #eceef1;
            color: #4b5260
        }

        .chip.ch.google {
            background: #eef0f3;
            color: #4b5260
        }

        .chip.ch.kakao {
            background: #fff4c2;
            color: #6b5300
        }

        .tl-target {
            font-size: 12px;
            font-weight: 700;
            color: #444;
            display: flex;
            align-items: center
        }

        .chip.live {
            background: #e6f4ec;
            color: #198754
        }

        .tl-art .ad {
            width: 150px
        }
        /* ② 전전일 vs 전일 — 지표별 카드 (제목 + 한 줄 요약 · 막대 · 이름/1위 배지 · 증감 칩) */
        .yd-legend { margin-bottom: 14px }
        .yd-legend-note { color: #858a92 }
        .yd-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px }
        .yd-card { background: #fff; border: 1px solid #e6e8ec; border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .06); padding: 16px 18px 14px; min-width: 0 }
        .yd-card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px }
        .yd-card-head h3 { margin: 0; font-size: 14px; font-weight: 800; color: #202124; white-space: nowrap }
        .yd-note { font-size: 11.5px; font-weight: 600; color: #858a92; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
        .yd-chart { position: relative; height: 170px }
        .yd-chart svg { display: block; overflow: visible }
        .yd-chart .yd-bar { cursor: default }
        .yd-labels { display: grid; margin-top: 8px; text-align: center }
        .yd-labels > div { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0 }
        .yd-name { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #202124; white-space: nowrap }
        .yd-chg { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap }
        .yd-chg.rise { background: #e6f4ec; color: #198754 }
        .yd-chg.fall { background: #fbe9ea; color: #c9444d }
        .yd-chg.flat { background: #eceef1; color: #666 }
        .yd-chg.none { background: #eceef1; color: #858a92 }
        @media(max-width:1100px) { .yd-cards { grid-template-columns: 1fr } }

        /* ③ 최근 7일 */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            font-size: 12px;
            color: #555;
            margin-bottom: 8px
        }

        .legend i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: -1px
        }

        .w7 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px
        }

        .w7-box h3 {
            margin: 0 0 6px;
            font-size: 13px;
            color: #444
        }

        .w7-chart {
            height: 230px;
            position: relative
        }

        .w7-chart svg {
            display: block;
            overflow: visible
        }

        .tip {
            position: absolute;
            pointer-events: none;
            background: #20242a;
            color: #fff;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.6;
            white-space: nowrap;
            z-index: 3;
            box-shadow: 0 4px 14px #0003
        }

        .tip b {
            display: block
        }

        .tip i {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px
        }

        .tip span {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            font-variant-numeric: tabular-nums
        }

        /* 표 */
        .scroll {
            overflow: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px
        }

        th,
        td {
            padding: 10px 10px;
            border-bottom: 1px solid #e9ebef;
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums
        }

        th:first-child,
        td:first-child {
            text-align: left
        }

        th {
            color: #777;
            background: #fafbfc;
            font-size: 11px;
            font-weight: 700
        }

        th.grp {
            text-align: center;
            color: #202124;
            font-size: 12px;
            border-bottom: 2px solid var(--c)
        }

        th.sep,
        td.sep {
            border-left: 1px solid #e6e8ec
        }

        td.best {
            color: #3446b8;
            font-weight: 700
        }

        .crown-wrap {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
            cursor: default
        }

        .crown-wrap::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 8px);
            right: -6px;
            background: #20242a;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.5;
            text-align: left;
            white-space: pre;
            padding: 7px 10px;
            border-radius: 7px;
            box-shadow: 0 4px 14px #0003;
            opacity: 0;
            pointer-events: none;
            transition: opacity .12s;
            z-index: 5
        }

        .crown-wrap::before {
            content: "";
            position: absolute;
            bottom: calc(100% + 2px);
            right: 10px;
            border: 6px solid transparent;
            border-top-color: #20242a;
            border-bottom: 0;
            opacity: 0;
            transition: opacity .12s;
            z-index: 5
        }

        td.top:hover .crown-wrap::after,
        td.top:hover .crown-wrap::before {
            opacity: 1
        }

        .crown {
            width: 17px;
            height: 20px;
            flex: none;
            margin: -3px 0
        }

        td.top {
            background: color-mix(in srgb, var(--c) 16%, #fff);
            font-weight: 700;
            box-shadow: inset 3px 0 0 var(--c)
        }

        td.size-cell {
            padding-left: 22px
        }

        .win {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 12px
        }

        .win::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--c)
        }

        .ss {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 14px
        }

        .ss-item {
            background: #f8f9fb;
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            min-width: 0
        }

        .ss-top {
            display: flex;
            align-items: center;
            font-size: 13px;
            font-weight: 700
        }

        .ss-top b {
            margin-left: auto;
            font-size: 13px
        }

        .ss-bar {
            height: 6px;
            background: #e6e8ec;
            border-radius: 3px;
            overflow: hidden
        }

        .ss-bar span {
            display: block;
            height: 100%;
            background: var(--c);
            border-radius: 3px
        }

        .ss-list {
            font-size: 11.5px;
            color: #6b7078;
            line-height: 1.5
        }

        @media(max-width:700px) {
            .ss {
                grid-template-columns: 1fr
            }
        }

        td.left {
            text-align: left
        }

        .cell-name .ad {
            width: 56px;
            flex: none;
            box-shadow: none
        }

        .total-row td {
            background: #f3f5ff;
            font-weight: 700;
            color: #202124;
            border-bottom: 2px solid #d9ddf5;
            font-size: 12.5px
        }

        /* 표 날짜 칸: 토요일 파랑 · 일요일/공휴일 빨강 (holidays.js) */
        td.day-sat { color: #2a6fdb }
        td.day-sun { color: #d7262f }

        .total-row td:first-child {
            color: #3446b8
        }

        .sort-btn {
            all: unset;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 6px;
            margin: -3px -6px;
            border-radius: 6px;
            font: inherit;
            color: inherit
        }

        .sort-btn:hover {
            background: #eef0f3
        }

        .sort-btn:focus-visible {
            outline: 2px solid #3446b8
        }

        .sort-btn .arw {
            display: inline-flex;
            flex-direction: column;
            font-size: 7px;
            line-height: 7px;
            color: #d3d7dd
        }

        .sort-btn .arw span {
            padding: 1px 4px;
            margin: 0 -4px;
            cursor: pointer
        }

        .sort-btn .arw span:hover {
            color: #6b7078
        }

        .sort-btn[data-dir="desc"] .arw .arw-up,
        .sort-btn[data-dir="asc"] .arw .arw-dn {
            color: #3446b8
        }

        .sort-btn[data-dir] {
            color: #3446b8;
            font-weight: 700
        }

        /* ---------- 프레임 예시 이미지 (HTML 목업 · 실제 소재 이미지로 교체 가능) ---------- */
        .ad {
            container-type: inline-size;
            aspect-ratio: 6/5;
            width: 100%;
            max-width: 100%;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            line-height: 1.25;
            letter-spacing: -.01em;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .12)
        }

        .ad svg {
            display: block;
            width: 100%;
            height: 100%
        }

        .ad-blackgold .img {
            width: 36cqw;
            height: 32cqw
        }

        .ad-blackgold .price {
            font-size: 6.4cqw;
            font-weight: 700;
            color: #e2c270
        }

        .ad-whitered .img {
            padding: 5cqw 4cqw
        }

        .ad-whitered .body {
            padding: 3cqw 5cqw 3cqw 1cqw;
            display: flex;
            flex-direction: column;
            gap: 2cqw
        }

        .ad-whitered .price {
            font-size: 8cqw;
            font-weight: 800;
            color: #d7262f
        }

        .ad-whitered .price s {
            display: block;
            font-size: 3.8cqw;
            color: #999;
            font-weight: 400
        }

        .ad-redauto .auto {
            font-size: 3cqw;
            background: rgba(255, 255, 255, .18);
            border-radius: 10cqw;
            padding: .8cqw 2.4cqw;
            font-weight: 700
        }

        .ad-redauto .tile .img {
            height: 17cqw
        }

        .ad-magazine .col {
            display: flex;
            flex-direction: column;
            gap: 2cqw;
            min-width: 0
        }

        .ad-magazine .hl {
            font-family: Georgia, "Noto Serif KR", serif;
            font-size: 7.2cqw;
            line-height: 1.18;
            font-weight: 700;
            letter-spacing: -.03em
        }

        .ad-magazine .price {
            font-size: 4.6cqw;
            font-weight: 700;
            margin-top: auto
        }

        .ad-magazine .link {
            font-size: 3.6cqw;
            font-weight: 700;
            border-bottom: 1px solid;
            align-self: flex-start
        }

        .ad-magazine .img {
            background: #e2d9c8;
            display: flex;
            align-items: center;
            padding: 4cqw
        }

        @media(max-width:1100px) {

            .themes {
                grid-template-columns: repeat(2, 1fr)
            }

            .w7 {
                grid-template-columns: 1fr
            }
        }

        @media(max-width:700px) {
            .wrap {
                padding: 18px
            }

            .head {
                display: block
            }

            .date {
                display: inline-block;
                margin-top: 12px
            }

            .themes {
                grid-template-columns: 1fr
            }

            .tl::before {
                left: 64px
            }

            .tl li {
                grid-template-columns: 52px 26px 1fr
            }

            .tl-art {
                grid-column: 3;
                margin-top: 8px
            }
        }

        .ad.ad-slot {
            background: #fff;
            border: 1px solid #d6d9de;
            box-shadow: none;
            border-radius: 6px
        }

        .ad.ad-slot:has(iframe) {
            aspect-ratio: 1;            /* 250x250 배너 */
            border-color: #e3e6ea
        }

        .ad.ad-slot iframe {
            display: block;
            width: 250px;               /* 배너 원본 크기로 그린 뒤 */
            height: 250px;
            border: 0;
            transform-origin: 0 0;      /* 칸 폭에 맞게 축소 (fitBannerSlots) */
            pointer-events: none;       /* 대시보드에서 실수로 광고 클릭 방지 */
        }

        .tl-open {
            position: fixed;
            right: 24px;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            z-index: 20;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 0;
            background: #3446b8;
            color: #fff;
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(52, 70, 184, .38);
            transition: transform .15s, background .15s
        }

        .tl-open:hover {
            background: #28389a;
            transform: translateY(-2px)
        }

        .tl-open-label {
            position: absolute;
            right: calc(100% + 10px);
            top: 50%;
            transform: translateY(-50%);
            background: #20242a;
            color: #fff;
            font-size: 12.5px;
            font-weight: 700;
            white-space: nowrap;
            padding: 7px 11px;
            border-radius: 7px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s
        }

        .tl-open:hover .tl-open-label,
        .tl-open:focus-visible .tl-open-label {
            opacity: 1
        }

        .tl-open:focus-visible,
        .tl-close:focus-visible {
            outline: 2px solid #3446b8;
            outline-offset: 2px
        }

        .tl-modal {
            width: min(920px, calc(100vw - 32px));
            max-height: calc(100vh - 48px);
            padding: 0;
            border: 0;
            border-radius: 14px;
            box-shadow: 0 20px 60px #0004;
            color: #202124
        }

        .tl-modal::backdrop {
            background: rgba(20, 24, 30, .45)
        }

        .tl-modal[open] {
            display: flex;
            flex-direction: column;
            animation: tlIn .16s ease-out
        }

        @keyframes tlIn {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .tl-modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px 22px;

        .legend i {

            border-radius: 50%;

        }
        /* ④ 사이즈별 — 요약 박스 여백 */
        .ss { gap: 16px; margin: 6px 0 24px }
        .ss-item { padding: 28px 22px 26px; gap: 16px; min-height: 160px; justify-content: center }
        .ss-top { font-size: 14px }
        .ss-list { line-height: 1.7 }
        /* ④ 기간 선택 */
        .period-ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
        .seg { display: inline-flex; background: #f1f2f4; border-radius: 9px; padding: 3px }
        .seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; font: inherit; font-size: 12.5px; font-weight: 600; color: #6b7078; cursor: pointer }
        .seg button[aria-pressed="true"] { background: #fff; color: #3446b8; font-weight: 800; box-shadow: 0 1px 3px #0002 }
        .seg button:focus-visible, .date-in:focus-visible { outline: 2px solid #3446b8; outline-offset: 1px }
        .date-in { border: 1px solid #d6d9de; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12.5px; color: #202124; background: #fff }
        td.na { color: #c3c7ce }
        /* ④ 사이즈별 표 — 촘촘하게 */
        #sizeTable th, #sizeTable td { padding: 6px 8px }
        #sizeTable td.size-cell { padding-left: 18px }
        #sizeTable th.all, #sizeTable td.all { background: #f7f8fa; font-weight: 700; color: #1a1d23 }   /* 3종 합계 · 평균 열 */
        /* ⑧ 추가 사이즈 배너 영향 */
        .ns-kpi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 14px }
        .ns-kpi .ss-item { gap: 4px; padding: 14px 16px }
        .ns-kpi .k-label { font-size: 12px; color: #6b7078; font-weight: 700 }
        .ns-kpi .k-val { font-size: 22px; font-weight: 800; color: #1a1d23; letter-spacing: -.01em; font-variant-numeric: tabular-nums }
        .ns-kpi .k-val.up { color: #1a7f4b }
        .ns-kpi .k-val.down { color: #d7262f }
        .ns-kpi .k-sub { font-size: 11.5px; color: #858a92 }
        .ns-verdict { margin: 0 0 16px; padding: 12px 16px; border-radius: 10px; background: #eef0fb; color: #1a1d23; font-size: 13px; line-height: 1.65 }
        .ns-verdict b { color: #3446b8 }
        #newSizeTable th, #newSizeTable td { padding: 6px 8px; white-space: nowrap }
        #newSizeTable tbody.grp td { background: #f7f8fa; font-weight: 700 }
        #newSizeTable td.pp-up { color: #1a7f4b; font-weight: 700 }
        #newSizeTable td.pp-down { color: #d7262f; font-weight: 700 }
        .ns-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: #6b7078; margin: 20px 0 6px }
        .ns-legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px }
        .ns-legend i.bar { width: 10px; height: 10px; border-radius: 2px; background: #dfe3ea }
        .ns-chart { position: relative; height: 240px }
        .ns-chart svg { display: block; overflow: visible }
        @media(max-width:700px) { .ns-kpi { grid-template-columns: 1fr } }
        /* ④ 일별 추이 표 */
        #transTable th, #transTable td { padding: 6px 8px; white-space: nowrap }
        #transTable th.grp { text-align: center }
        #transTable tr.pivot td { background: #fff7e0 }
        #transTable tr.pivot td.top { background: color-mix(in srgb, var(--r, var(--c)) 16%, #fff) }   /* 강조 행에서도 1위 칸은 프레임 색 */
        .seg-chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 1.5; color: #202124 }
        .seg-chip.one { background: color-mix(in srgb, var(--c) 14%, #fff); color: color-mix(in srgb, var(--c) 78%, #000) }   /* 테마 하나 — 그 테마 색 */
        .seg-chip.none { background: #eceef1; color: #6b7078 }
        /* ⑤ 지표 탭 */
        .m-tabs { display: flex; gap: 4px; border-bottom: 1px solid #e6e8ec; margin: 2px 0 18px }
        .m-tabs button { border: 0; background: none; font: inherit; font-size: 13.5px; font-weight: 700; color: #858a92; padding: 10px 16px 11px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px }
        .m-tabs button:hover { color: #202124 }
        .m-tabs button[aria-selected="true"] { color: #3446b8; border-bottom-color: #3446b8 }
        .m-tabs button:focus-visible { outline: 2px solid #3446b8; outline-offset: -2px; border-radius: 6px }
        #sizeTable th.grp { text-align: right }
        /* ⑥ 지면별 — 요약 박스 한 줄 */
        #placeSummary { grid-template-columns: repeat(3, 1fr) }
        /* 박스 안 제목·막대·목록 줄을 4개 박스가 공유 (서브그리드) → 라인 높이 일치 */
        #placeSummary .ss-item { padding: 22px 18px 20px; display: grid; grid-template-rows: subgrid; grid-row: span 3; align-content: start; justify-content: normal }
        #placeSummary .ss-list { align-self: start }
        /* 제목 줄: 테마 이름 / 1위 · n개 지면 을 두 줄로 (좁은 칸에서 단어가 끊기지 않게) */
        #placeSummary .ss-top { flex-wrap: wrap; row-gap: 4px; white-space: nowrap }
        #placeSummary .ss-top b { flex-basis: 100%; margin-left: 0; font-weight: 600; color: #6b7078 }
        #placeSummary .ss-list { overflow-wrap: anywhere }
        @media(max-width:1100px) { #placeSummary { grid-template-columns: repeat(2, 1fr) } }
        @media(max-width:700px) { #placeSummary { grid-template-columns: 1fr } }
        #placeTable th, #placeTable td { padding: 6px 8px }
        #placeTable th.grp { text-align: right }
        #placeTable td.place-cell { padding-left: 18px; white-space: nowrap }
        #placeTable td.place-cell small { display: block; font-weight: 400; color: #858a92; font-size: 11px; margin-top: 1px }
        /* 카드 안쪽 여백 — 표 카드는 기존대로 */
        .card:has(> .scroll) { padding: 18px }

        /* 블랙골드처럼 테두리색(--r)이 있는 프레임 */
        .tl-dot { box-shadow: 0 0 0 2px var(--r, var(--c)) }
        .win::before, .ss-bar span { box-shadow: inset 0 0 0 2px var(--r, transparent) }
        td.top { background: color-mix(in srgb, var(--r, var(--c)) 16%, #fff); box-shadow: inset 3px 0 0 var(--r, var(--c)) }
        /* ③ 최근 7일 — 막대 호버 시 선그래프 */
        .w7-chart .bar { transition: opacity .15s }
        .w7-chart.hl .bar:not(.on) { opacity: .2 }
        /* ⑤ 프레임 이름별 — 높이 고정 + 스크롤 (헤더는 위에 고정) */
        .name-scroll { max-height: 520px; overflow-y: auto }
        .name-scroll thead th { position: sticky; top: 0; z-index: 1 }
        .date-in { cursor: pointer }
        /* 날짜 칸 — 눌러도 파랗게 선택·복사되지 않게 */
        .date-in { -webkit-user-select: none; user-select: none; caret-color: transparent }
        .date-in:focus, .date-in:focus-visible { outline: none }
        .date-in::-webkit-datetime-edit-year-field:focus,
        .date-in::-webkit-datetime-edit-month-field:focus,
        .date-in::-webkit-datetime-edit-day-field:focus { background: transparent; color: inherit }
        .h2-note { margin-left: 8px; font-size: 12px; font-weight: 400; color: #858a92 }
        /* 요약 막대 하나 — 프레임별 1위 비중 */
        .ss-stack { grid-column: 1 / -1; background: #f8f9fb; border-radius: 10px; padding: 16px 18px 14px; position: relative }
        .ss-stack-title { font-size: 13px; font-weight: 800; color: #202124; margin-bottom: 10px }
        .ss-stack-title small { margin-left: 6px; font-size: 12px; font-weight: 600; color: #858a92 }
        .ss-stack-bar { display: flex; height: 26px; border-radius: 7px; overflow: hidden; background: #e6e8ec }
        .ss-stack-bar span { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; box-shadow: inset 0 0 0 2px var(--r, transparent) }
        /* 제목 옆 ? 아이콘 — 마우스를 올리면 설명 툴팁 */
        .h2-help { display: inline-grid; place-items: center; width: 17px; height: 17px; margin-left: 8px; border-radius: 50%; background: #eceef1; color: #6b7078; font-size: 11px; font-weight: 800; vertical-align: 2px; position: relative; cursor: help }
        .h2-help:hover, .h2-help:focus-visible { background: #3446b8; color: #fff }
        .h2-help::after { content: attr(data-tip); position: absolute; left: 0; top: calc(100% + 10px); width: max-content; max-width: 460px; padding: 14px 16px; border-radius: 10px; background: #fff; color: #3b4048; border: 1px solid #e6e8ec; font-size: 12.5px; font-weight: 500; line-height: 1.75; white-space: pre-line; word-break: keep-all; text-align: left; box-shadow: 0 6px 20px rgba(0, 0, 0, .10); opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 6 }
        .h2-help:hover::after, .h2-help:focus-visible::after { opacity: 1 }
        /* ⑤ 1·2·3위 표시 */
        .rk-slot .rk-badge { margin-right: 8px }
        .rk-badge { display: inline-block; min-width: 34px; text-align: center; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 800; line-height: 1.4 }
        .rk-badge.rk1 { background: #ffe9a8; color: #9a6a00 }
        .rk-badge.rk2 { background: #e9ecf1; color: #5b6270 }
        .rk-badge.rk3 { background: #f6e0cf; color: #9a5a2a }
        .theme-stats .rk-badge, .yd-name .rk-badge { font-style: normal; min-width: 30px; padding: 1px 6px; font-size: 10.5px; margin-left: 2px; vertical-align: 1px }   /* ①② 1·2·3위 */
        /* 맨 위로 버튼 */
        .to-top { position: fixed; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #e6e8ec; background: #fff; color: #3446b8; display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, .14); opacity: 0; visibility: hidden; transform: translateY(8px); transition: opacity .18s, transform .18s, visibility .18s }
        .to-top.show { opacity: 1; visibility: visible; transform: none }
        .to-top:hover { background: #3446b8; color: #fff; border-color: #3446b8 }
        .to-top:focus-visible { outline: 2px solid #3446b8; outline-offset: 2px }
        body:has(.tl-open) .to-top { bottom: calc(24px + 58px + 12px + env(safe-area-inset-bottom, 0px)); right: 31px }   /* Timeline 버튼 위 */
        /* 표 행 호버 — 배경 연하게 */
        tbody tr:hover td { background: #f3f5fa }
        tbody tr:hover td.top { background: color-mix(in srgb, var(--r, var(--c)) 24%, #fff) }
        tbody td { transition: background .12s }
    </style>
</head>

<body>
    <div class="wrap">

        <section>
            <div class="title">
                <h2>1. 프레임 테마별 성과</h2>
                <div class="period-ctrl" id="themePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="themeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="themes" id="themes"></div>
        </section>

        <section>
            <div class="title">
                <h2>2. 전전일 vs 전일 프레임 테마별 비교</h2>
            </div>
            <div class="card">
                <div class="scroll yd-scroll" id="yd"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>3. 최근 7일 프레임 테마별 비교</h2>
            </div>
            <div class="card">
                <div class="legend" id="w7Legend"></div>
                <div class="w7" id="w7"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>4. 프레임 테마별 일별 추이 <span class="h2-help" data-tip="구간: 그날 어떤 배너가 나갔는지 보여 줍니다.&#10;&#160;&#160;• 단독 = 배너 하나만 나간 날&#10;&#160;&#160;• 병행 = 여러 배너가 같이 나간 날&#10;&#10;노란색 줄: 나가는 배너 조합이 전날과 달라진 날&#10;1위 메달: 여러 배너가 같이 나간 날 중 클릭률이 가장 높았던 배너" aria-label="구간 설명" tabindex="0">?</span></h2>
            </div>
            <div class="card">
                <div class="scroll">
                    <table id="transTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>5. 사이즈별 프레임 비교 (14개 사이즈)</h2>
                <div class="period-ctrl" id="sizePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="sizeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="sizeMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="ss" id="sizeSummary"></div>
                <div class="scroll">
                    <table id="sizeTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>6. 프레임 테마 · 사이즈별 성과 순위 <span class="h2-help" data-tip="어떤 테마의 어떤 사이즈 배너가 가장 잘 나왔는지 순위로 보여 줍니다.&#10;예: 1위 블랙골드 336×280 = 블랙골드 테마의 336×280 배너가 클릭률이 가장 높음&#10;&#10;표 읽는 법&#10;&#160;&#160;• 한 줄 = 테마 하나 × 사이즈 하나&#10;&#160;&#160;• 1 · 2 · 3위는 지금 정렬된 기준(처음엔 클릭률)으로 매깁니다&#10;&#160;&#160;• 열 제목을 누르면 노출수 · 클릭수 기준으로 바꿀 수 있습니다" aria-label="표 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="namePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="nameDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="scroll name-scroll">
                    <table id="nameTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>7. 프레임 지면별 비교 (상위 10개 지면) <span class="h2-help" data-tip="배너가 실제로 걸린 지면별로&#10;디자인 3종의 성과를 비교합니다.&#10;&#10;9월 전체: 9월 누적 기준&#10;&#160;&#160;• 노출이 많은 지면 10곳&#10;일별: 하루 단위 기준&#10;&#160;&#160;• 그날 노출이 많은 지면 10곳&#10;&#10;지면은 사이트 이름 기준이며, 같은 사이트의 여러 광고 자리는 합산합니다." aria-label="지면별 표 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="placePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="placeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="placeMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="ss" id="placeSummary"></div>
                <div class="scroll">
                    <table id="placeTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>8. 추가 사이즈 배너 영향 (5개 사이즈) <span class="h2-help" data-tip="이전 배너에 없던 사이즈 5개(234×60 · 300×50 · 300×100 · 336×280 · 468×60)가&#10;전체 평균 클릭률을 끌어내렸는지 확인합니다.&#10;&#10;보는 법&#10;&#160;&#160;• 추가 5종 CTR vs 기존 9종 CTR — 추가 사이즈가 기존보다 낮으면 평균을 끌어내림&#10;&#160;&#160;• 결론 — 추가 사이즈를 뺀 CTR과 전체 CTR의 차이 (%p)가 곧 영향&#10;&#160;&#160;• 일별 그래프 — 두 CTR 선이 같이 움직이면 사이즈가 아닌 다른 원인&#10;&#10;블랙골드 · 화이트레드 · 매거진 3종을 합산한 값입니다" aria-label="표 설명" tabindex="0">?</span></h2>
                <span id="newSizeRange"></span>
            </div>
            <div class="card">
                <div class="ns-kpi" id="newSizeKpi"></div>
                <p class="ns-verdict" id="newSizeVerdict"></p>
                <div class="scroll">
                    <table id="newSizeTable"></table>
                </div>
                <div class="ns-legend" id="newSizeLegend"></div>
                <div class="ns-chart" id="newSizeChart"><svg></svg><div class="tip" hidden></div></div>
            </div>
        </section>

    </div>


    <button type="button" class="tl-open" id="tlOpen" aria-haspopup="dialog" aria-label="프레임 변경 Timeline 보기">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"

            ["2026-09-29", "whitered", "336_280_whiteRedNo", "336x280", 22444, 9],
            ["2026-09-29", "whitered", "728_90_whiteRedNo", "728x90", 166682, 32],
            ["2026-09-29", "whitered", "970_250_whiteRedNo", "970x250", 4360, 1],
        ];
        /* DDATA:END */

        const pad = n => String(n).padStart(2, '0');
        const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const md = s => s.slice(5).replace('-', '/');

        const ROWS = DATA.map(([d, t, n, s, imp, clk]) => ({ d, t, n, s, imp, clk }));
        const DATES = [...new Set(ROWS.map(r => r.d))].sort();       // 데이터가 있는 날짜
        const TODAY = DATES[DATES.length - 1] || ymd(new Date());     // 마지막 데이터 날짜
        const PERIOD_FROM = TODAY.slice(0, 8) + '01';                 // 당월 1일 (④⑤ 조회기간 시작)
        THEMES.forEach(T => { const ds = ROWS.filter(r => r.t === T.id).map(r => r.d).sort(); T.from = ds[0]; T.to = ds[ds.length - 1]; });

        /* ---------- 공통 ---------- */
        const sum = rows => { const o = { imp: 0, clk: 0 }; for (const r of rows) { o.imp += r.imp; o.clk += r.clk; } o.ctr = o.imp ? o.clk / o.imp * 100 : 0; return o; };
        const pick = (fn) => ROWS.filter(fn);
        const SROWS = SDATA.map(([t, s, imp, clk]) => ({ t, s, imp, clk }));
        const NROWS = NDATA.map(([t, n, s, imp, clk]) => ({ t, n, s, imp, clk }));
        // 일별 사이즈·이름: DATA 에 사이즈가 있으면 그것, 없으면 DDATA(원본 일별) — ⑤⑥ '일별' 선택에 씀
        const DROWS = ROWS.some(r => r.s) ? ROWS.filter(r => r.s) : DDATA.map(([d, t, n, s, imp, clk]) => ({ d, t, n, s, imp, clk }));
        const DAILY_DETAIL = DROWS.length > 0;
        const DDATES = [...new Set(DROWS.map(r => r.d))].sort(), DTODAY = DDATES[DDATES.length - 1] || TODAY;   // 일별 사이즈 데이터의 마지막 날
        const dpick = fn => DROWS.filter(fn);
        const f = n => Math.round(n).toLocaleString('ko-KR');
        const pct = v => v.toFixed(3) + '%';
        const M3 = [
            { k: 'imp', label: '노출수', fmt: f },
            { k: 'clk', label: '클릭수', fmt: f },
            { k: 'ctr', label: '클릭률 (CTR)', fmt: pct },
        ];
        const theme = id => THEMES.find(t => t.id === id);
        // 프레임 이름 — 마우스를 올리면 배너 툴팁 (frameTip)
        const nm = (T, short = false) => `<span class="fname" data-frame-tip="${T.id}">${short ? T.name.replace(' 프레임', '') : T.name}</span>`;
        function frameArt(id, o = {}) {
            // 배너 이미지 자리: 테두리 박스만. THEMES의 src(또는 o.src)에 주소를 넣으면 iframe으로 표시됩니다.
            const T = theme(id), src = o.src || T.src || '';
            // tpl 테마(레드오토)는 src 대신 data-tpl → fillTemplateBanners()가 목 데이터를 채워 srcdoc으로 넣습니다
            const attr = T.tpl ? `data-tpl="${src}"` : `src="${src}"`;
            return `<div class="ad ad-slot" data-frame="${id}">${src ? `<iframe ${attr} title="${T.name}" loading="lazy" scrolling="no"></iframe>` : ''}</div>`;
        }

        // 배너 iframe(250px)을 칸 폭에 맞게 축소 — 표가 다시 그려지거나 창 크기가 바뀌면 다시 계산
        const BANNER_PX = 250;
        const fitBannerSlots = () => document.querySelectorAll('.ad.ad-slot iframe').forEach(f => {
            const w = f.parentElement.clientWidth;
            if (w) f.style.transform = `scale(${w / BANNER_PX})`;
        });
        // 레드오토(오토 프레임) 템플릿: 뷰어 페이지(dev_openRtbAuto_view.html)와 같은 목 상품 데이터로 채워서 표시
        const TPL_MOCK = {
            '{{w}}': BANNER_PX, '{{h}}': BANNER_PX,
            '{{productList}}': `{ pcode: "test-pcode1", pnm: "오토프레임 카라넥 원피스", price: "49,900", prdt_prmct: "39,900", dc_rate: "32",
                img: "https://www.dabagirl.co.kr/web/product/big/202105/04ff60dbb9fa51e3c47fc8e4bdc27c08.jpg", purl: "javascript:void(0)", advrtsReplcCode: "01", advrtsReplcNm: "" }`,
            '{{HTTP}}': 'https://img.mobon.net', '{{HTTP_DR}}': 'https://img.mobon.net',
            '{{wp_imgtag}}': '', '{{UUID}}': 'test-uuid', '{{USER}}': 'test-user', '{{ITL_TP_CODE}}': 'test-code',
        };
        const tplCache = {};
        const fillTemplateBanners = () => document.querySelectorAll('.ad.ad-slot iframe[data-tpl]:not([data-filled])').forEach(f => {
            f.dataset.filled = '1';
            const url = f.dataset.tpl;
            tplCache[url] ??= fetch(url).then(r => r.text()).then(t => Object.entries(TPL_MOCK).reduce((c, [k, v]) => c.split(k).join(v), t));
            tplCache[url].then(html => { f.srcdoc = html; }).catch(err => console.warn('오토 배너 템플릿을 불러오지 못했습니다', err));
        });
        (function () {
            let queued = false;
            const schedule = () => { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; fitBannerSlots(); fillTemplateBanners(); }); };
            new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
            window.addEventListener('resize', schedule);
            document.getElementById('tlModal').addEventListener('toggle', schedule);   // 모달이 열릴 때 (닫혀 있으면 폭이 0)
            schedule();
        })();

        /* 프레임 이름 호버 → 배너 툴팁 (테마별 배너를 미리 한 번만 만들어 두고 보여줌) */
        (function () {
            const tip = document.createElement('div');
            tip.id = 'frameTip';
            tip.setAttribute('aria-hidden', 'true');
            tip.innerHTML = THEMES.filter(T => T.src).map(T => `<div class="ft-item" data-frame-tip-for="${T.id}">${frameArt(T.id)}<div class="ft-name"><span class="dot" style="${sw(T)}"></span>${T.name}</div></div>`).join('');
            document.body.appendChild(tip);
            const W = 216, GAP = 14;
            let cur = null;
            const place = (x, y) => {
                const h = tip.offsetHeight || 260;
                let left = x + GAP, top = y + GAP;
                if (left + W > innerWidth - 8) left = x - W - GAP;          // 오른쪽 공간이 없으면 왼쪽에
                if (top + h > innerHeight - 8) top = Math.max(8, y - h - GAP); // 아래 공간이 없으면 위에
                tip.style.left = left + 'px'; tip.style.top = top + 'px';
            };
            const show = (el, e) => {
                const id = el.dataset.frameTip;
                if (!theme(id)?.src) return;
                cur = el;
                // 모달(dialog) 안에서는 모달 위에 떠야 하므로 모달 안으로 옮김
                const host = el.closest('dialog') || document.body;
                if (tip.parentElement !== host) host.appendChild(tip);
                tip.querySelectorAll('.ft-item').forEach(it => it.classList.toggle('on', it.dataset.frameTipFor === id));
                tip.classList.add('show');
                fitBannerSlots();
                place(e.clientX, e.clientY);
            };
            const hide = () => { cur = null; tip.classList.remove('show'); };
            document.addEventListener('mouseover', e => { const el = e.target.closest('[data-frame-tip]'); if (el && el !== cur) show(el, e); });
            document.addEventListener('mouseout', e => { const el = e.target.closest('[data-frame-tip]'); if (el && el === cur && !el.contains(e.relatedTarget)) hide(); });
            document.addEventListener('mousemove', e => { if (cur) place(e.clientX, e.clientY); });
            document.addEventListener('scroll', hide, true);
        })();

        initTimeline();   // 프레임 변경 Timeline (frame_timeline.js 공용)

        /* ① 프레임 테마별 성과 */
        function renderThemes(from, to) {
            const inR = r => r.d >= from && r.d <= to;
            const TS = Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => inR(r) && r.t === T.id))]));
            // 4개 프레임 중 순위 (② 와 같은 표시)
            const themeRank = (id, k) => { const n = TS[id][k] > 0 ? 1 + THEMES.filter(T => TS[T.id][k] > TS[id][k]).length : 0; return n ? `<em class="rk-badge rk${Math.min(n, 3)}">${n}위</em>` : ''; };
            document.getElementById('themes').innerHTML = THEMES.map(T => {
                const s = TS[T.id], ds = [...new Set(pick(r => inR(r) && r.t === T.id).map(r => r.d))].sort();
                const period = !ds.length ? '데이터 없음' : from === to ? `데이터: <b>${md(from)}</b>` : `데이터: <b>${md(ds[0])} ~ ${md(ds[ds.length - 1])}</b>`;
                const view = T.view ? `<a class="theme-view" href="${T.view}" target="_blank" rel="noopener" title="${T.name} 전체 사이즈 미리보기 (새 탭)">프레임 미리보기<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>` : '';
                return `<article class="card theme">
                    ${T.view ? `<a class="theme-art" href="${T.view}" target="_blank" rel="noopener" aria-label="${T.name} 미리보기 (새 탭)">${frameArt(T.id)}</a>` : `<div class="theme-art">${frameArt(T.id)}</div>`}
                    <div class="theme-body">
                        <div class="theme-name"><span class="dot" style="${sw(T)}"></span>${T.tag ? `<span class="tag-chip">${T.tag}</span>` : ''}${T.name}${view}</div>
                        <div class="theme-period">${period}</div>
                        <dl class="theme-stats">
                            <dt>노출수 ${themeRank(T.id, 'imp')}</dt><dd>${s.imp ? f(s.imp) : '−'}</dd>
                            <dt>클릭수 ${themeRank(T.id, 'clk')}</dt><dd>${s.imp ? f(s.clk) : '−'}</dd>
                            <dt>클릭률 (CTR) ${themeRank(T.id, 'ctr')}</dt><dd>${s.imp ? pct(s.ctr) : '−'}</dd>
                        </dl>
                    </div>
                </article>`;
            }).join('');
        }
        (function () {
            const ctrl = document.getElementById('themePeriod'), dateEl = document.getElementById('themeDate');
            dateEl.min = PERIOD_FROM; dateEl.max = TODAY; dateEl.value = TODAY;
            ctrl.querySelector('[data-mode="month"]').textContent = `${+TODAY.slice(5, 7)}월 전체`;
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || TODAY;
                if (mode === 'day') renderThemes(d, d); else renderThemes(PERIOD_FROM, TODAY);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();

        const CROWN = `<svg class="crown" viewBox="0 0 24 28" aria-hidden="true"><path d="M6 1h5l3 8H9z" fill="#3f7ee8"/><path d="M18 1h-5l-3 8h5z" fill="#d7262f"/><circle cx="12" cy="17.5" r="9" fill="#f2b705" stroke="#c98f00" stroke-width="1.5"/><circle cx="12" cy="17.5" r="6.3" fill="none" stroke="#fff3c4" stroke-width="1"/><text x="12" y="21.6" text-anchor="middle" font-size="11" font-weight="800" font-family="Arial, sans-serif" fill="#7a5200">1</text></svg>`;

        /* ② 전전일 vs 전일 — 지표별 카드: 제목 + 한 줄 요약, 프레임마다 전전일(연한 색)·전일(진한 색) 막대와 숫자, 이름 옆 1위 배지, 아래 증감 칩 */
        (function () {
            const Y = DATES[DATES.length - 1], B = DATES[DATES.length - 2];
            const Ys = Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => r.t === T.id && r.d === Y))]));
            const Bs = Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => r.t === T.id && r.d === B))]));
            const best = Object.fromEntries(M3.map(m => [m.k, Math.max(...THEMES.map(T => Ys[T.id][m.k]))]));
            const short = (k, v) => k === 'ctr' ? v.toFixed(3) + '%' : v >= 1e4 ? f(v / 1e4) + '만' : f(v);
            const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
            const nameOf = T => T.name.replace(' 프레임', '');
            // 프레임별 증감: { cls: rise·fall·flat·none, txt, diff, flat(요약용 '유지') }
            const change = (T, k) => {
                const y = Ys[T.id], b = Bs[T.id], yv = y[k], bv = b[k];
                if (!y.imp && !b.imp) return { cls: 'none', txt: '데이터 없음' };
                if (!y.imp) return { cls: 'none', txt: '전일 데이터 없음' };
                if (!b.imp || !bv) return { cls: 'none', txt: '전전일 데이터 없음' };
                const diff = k === 'ctr' ? yv - bv : (yv / bv - 1) * 100;
                const flat = k === 'ctr' ? Math.abs(diff) <= 0.001 : Math.abs(diff) <= 1;   // 요약용 '유지' 기준: CTR ±0.001%p · 노출/클릭 ±1%
                const cls = Math.abs(diff) < 0.0005 ? 'flat' : diff > 0 ? 'rise' : 'fall';
                return { cls, flat, diff, txt: `${cls === 'flat' ? '−' : diff > 0 ? '▲' : '▼'} ${Math.abs(diff).toFixed(k === 'ctr' ? 3 : 1)}%` };
            };
            // 카드 오른쪽 한 줄 요약 (예: 세 테마 모두 약 +21% · 화이트레드만 증가 · 화이트레드만 유지)
            const note = (k) => {
                const cs = THEMES.map(T => ({ T, c: change(T, k) })).filter(x => x.c.cls !== 'none');
                if (!cs.length) return '';
                const dir = x => x.c.flat ? '유지' : x.c.diff > 0 ? '증가' : '감소';
                const fmtAvg = () => { const avg = cs.reduce((a, x) => a + x.c.diff, 0) / cs.length; return k === 'ctr' ? `${avg > 0 ? '+' : '−'}${Math.abs(avg).toFixed(3)}%p` : `${avg > 0 ? '+' : '−'}${Math.abs(avg).toFixed(0)}%`; };
                if (cs.length === 1) return `${nameOf(cs[0].T)}만 데이터 있음`;
                const groups = {}; cs.forEach(x => (groups[dir(x)] = groups[dir(x)] || []).push(x));
                const kinds = Object.keys(groups);
                const all = cs.length === THEMES.length ? (THEMES.length === 2 ? '두 프레임 모두' : `${['', '', '두', '세', '네', '다섯'][THEMES.length] || THEMES.length + '개'} 테마 모두`) : '모두';
                if (kinds.length === 1) {
                    const d = kinds[0];
                    if (d === '유지') return `${all} 유지`;
                    const spread = Math.max(...cs.map(x => x.c.diff)) - Math.min(...cs.map(x => x.c.diff));
                    return (k === 'ctr' ? spread <= 0.005 : spread <= 5) ? `${all} 약 ${fmtAvg()}` : `${all} ${d}`;
                }
                const solo = kinds.find(d => groups[d].length === 1);
                if (solo && kinds.length === 2) return `${nameOf(groups[solo][0].T)}만 ${solo}`;
                return cs.map(x => `${nameOf(x.T)} ${dir(x)}`).join(' · ');
            };
            const wrap = document.getElementById('yd');
            // 범례: 막대 색은 프레임 색이고, 진한 색이 전일 · 연한 색이 전전일라는 것만 표시
            wrap.innerHTML = `<div class="legend yd-legend"><span class="yd-legend-note">연한 색 = 전전일 ${md(B)} · 진한 색 = 전일 ${md(Y)}</span></div>`
                + `<div class="yd-cards">${M3.map(m => `<div class="yd-card">
                    <div class="yd-card-head"><h3>${m.label}</h3><span class="yd-note">${esc(note(m.k))}</span></div>
                    <div class="yd-chart" data-k="${m.k}"><svg></svg><div class="tip" hidden></div></div>
                    <div class="yd-labels" style="grid-template-columns:repeat(${THEMES.length},1fr)">${THEMES.map(T => {
                        const c = change(T, m.k), win = Ys[T.id][m.k] > 0 && Ys[T.id][m.k] === best[m.k];
                        return `<div><div class="yd-name">${nm(T, true)}${win ? '<em class="rk-badge rk1">1위</em>' : ''}</div><span class="yd-chg ${c.cls}">${c.txt}</span></div>`;
                    }).join('')}</div>
                </div>`).join('')}</div>`;
            function draw() {
                wrap.querySelectorAll('.yd-chart').forEach(box => {
                    const k = box.dataset.k, m = M3.find(x => x.k === k), svg = box.querySelector('svg'), tip = box.querySelector('.tip');
                    svg.setAttribute('width', 0);   // 먼저 0으로 줄여야 칸이 좁아졌을 때(메뉴 펼침 등) 새 폭을 제대로 읽음 — 안 그러면 이전 폭의 SVG가 칸을 붙들어 가로 스크롤이 생김
                    const W = box.clientWidth, H = box.clientHeight, T = 20, ih = H - T - 2;
                    const max = Math.max(...THEMES.flatMap(t => [Ys[t.id][k], Bs[t.id][k]])) || 1;
                    svg.setAttribute('width', W); svg.setAttribute('height', H);
                    let out = `<line x1="0" x2="${W}" y1="${H - 1}" y2="${H - 1}" stroke="#e6e8ec"/>`;
                    const gw = W / THEMES.length, bw = Math.max(10, Math.min(30, (gw - 28) / 2 - 3)), gap = 6;
                    THEMES.forEach((t, i) => {
                        const cx = gw * i + gw / 2, y = Ys[t.id], b = Bs[t.id];
                        [[b[k], b.imp, cx - gap / 2 - bw, .3], [y[k], y.imp, cx + gap / 2, 1]].forEach(([v, has, x, op]) => {
                            const h = v / max * ih;
                            if (h > 0) out += `<rect class="yd-bar" data-day="${op === 1 ? `전일 ${md(Y)}` : `전전일 ${md(B)}`}" data-t="${i}" data-v="${v}" x="${x}" y="${T + ih - h}" width="${bw}" height="${h}" rx="3" fill="${t.color}" opacity="${op}"/>`;
                            // 숫자 라벨: 막대보다 글자가 길면(CTR 등) 전전일는 왼쪽 막대 오른끝에 맞춰 오른정렬, 전일는 오른쪽 막대 왼끝에 맞춰 왼정렬해서 겹치지 않게
                            const label = has ? short(k, v) : '−', wide = label.length * 6.4 > bw + gap - 2;
                            const [lx, anchor] = !wide ? [x + bw / 2, 'middle'] : op === 1 ? [x, 'start'] : [x + bw, 'end'];
                            out += `<text x="${lx}" y="${T + ih - h - 5}" font-size="${op === 1 ? 11.5 : 10.5}" font-weight="${op === 1 ? 700 : 400}" fill="${op === 1 ? '#202124' : '#858a92'}" text-anchor="${anchor}">${label}</text>`;
                        });
                    });
                    svg.innerHTML = out;
                    // 막대에 마우스를 올리면 전일/전전일 · 프레임 · 값 툴팁
                    svg.querySelectorAll('.yd-bar').forEach(r => {
                        r.addEventListener('mouseenter', () => {
                            const t = THEMES[+r.dataset.t];
                            tip.innerHTML = `<b>${r.dataset.day}</b><span><em style="font-style:normal"><i style="${sw(t)}"></i>${t.name}</em>${m.fmt(+r.dataset.v)}</span>`;
                            tip.hidden = false;
                            const x = +r.getAttribute('x'), y = +r.getAttribute('y'), tw = tip.offsetWidth, th = tip.offsetHeight;
                            tip.style.left = Math.max(0, Math.min(W - tw, x + bw / 2 - tw / 2)) + 'px';
                            tip.style.top = Math.max(0, y - th - 26) + 'px';
                        });
                        r.addEventListener('mouseleave', () => { tip.hidden = true; });
                    });
                });
            }
            window.addEventListener('resize', draw);
            draw();
        })();

        /* ③ 최근 7일 — 지표별 차트, 날짜마다 테마 4개 막대 */
        (function () {
            const D7 = DATES.slice(-7);   // 데이터가 있는 최근 7일
            const data = D7.map(d => Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => r.t === T.id && r.d === d))])));
            document.getElementById('w7Legend').innerHTML = THEMES.map(T => `<span><i style="${sw(T)}"></i>${nm(T)}</span>`).join('');
            const wrap = document.getElementById('w7');
            wrap.innerHTML = M3.map(m => `<div class="w7-box"><h3>${m.label}</h3><div class="w7-chart" data-k="${m.k}"><svg></svg><div class="tip" hidden></div></div></div>`).join('');
            const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= v) return k * p; return v; };
            const short = (k, v) => k === 'ctr' ? v.toFixed(3) + '%' : v >= 1e4 ? f(v / 1e4) + '만' : f(v);

            function draw() {
                wrap.querySelectorAll('.w7-chart').forEach(box => {
                    const k = box.dataset.k, m = M3.find(x => x.k === k), svg = box.querySelector('svg'), tip = box.querySelector('.tip');
                    svg.setAttribute('width', 0);   // 먼저 0으로 줄여야 칸이 좁아졌을 때(메뉴 펼침 등) 새 폭을 제대로 읽음 — 안 그러면 이전 폭의 SVG가 칸을 붙들어 가로 스크롤이 생김
                    const W = box.clientWidth, H = box.clientHeight, L = 46, R = 6, T = 8, B = 26, iw = W - L - R, ih = H - T - B;
                    const max = nice(Math.max(...data.flatMap(o => THEMES.map(t => o[t.id][k]))) || 1);
                    svg.setAttribute('width', W); svg.setAttribute('height', H);
                    let out = '';
                    for (let g = 0; g <= 4; g++) {
                        const y = T + ih - ih * g / 4;
                        out += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${g ? '#f2f3f5' : '#e6e8ec'}"/><text x="${L - 6}" y="${y + 4}" font-size="10" fill="#b3b8bf" text-anchor="end">${short(k, max * g / 4)}</text>`;
                    }
                    const gw = iw / D7.length, bw = Math.min(12, (gw - 10) / THEMES.length - 2);
                    const tops = THEMES.map(() => []);   // 테마별 막대 꼭대기 좌표 (호버 선그래프용)
                    D7.forEach((d, i) => {
                        const gx = L + gw * i, x0 = gx + (gw - (bw + 2) * THEMES.length + 2) / 2;
                        THEMES.forEach((t, j) => {
                            const v = data[i][t.id][k], h = v / max * ih;
                            if (h > 0) tops[j].push([x0 + j * (bw + 2) + bw / 2, T + ih - h]);
                            if (h > 0) out += `<rect class="bar" data-t="${j}" x="${x0 + j * (bw + 2)}" y="${T + ih - h}" width="${bw}" height="${h}" rx="2" fill="${t.color}"${t.ring ? ` stroke="${t.ring}" stroke-width="1.5"` : ''}/>`;
                        });
                        out += `<rect class="hit" data-i="${i}" x="${gx}" y="${T}" width="${gw}" height="${ih}" fill="transparent"/>`;
                        out += `<text x="${gx + gw / 2}" y="${H - 8}" font-size="10.5" fill="#888" text-anchor="middle">${md(d)}</text>`;
                    });
                    out += `<g class="hl-line" pointer-events="none"></g>`;
                    svg.innerHTML = out;
                    svg.querySelectorAll('.hit').forEach(h => {
                        h.addEventListener('mouseenter', () => {
                            const i = +h.dataset.i;
                            tip.innerHTML = `<b>${md(D7[i])} · ${m.label}</b>` + THEMES.map(t => `<span><em style="font-style:normal"><i style="${sw(t)}"></i>${t.name}</em>${data[i][t.id][k] ? m.fmt(data[i][t.id][k]) : '−'}</span>`).join('');
                            tip.hidden = false;
                            const gx = L + gw * i, tw = tip.offsetWidth;
                            tip.style.left = (gx + gw + tw > W ? gx - tw - 4 : gx + gw + 4) + 'px'; tip.style.top = '0px';
                            h.setAttribute('fill', 'rgba(52,70,184,.06)');
                        });
                        h.addEventListener('mouseleave', () => { tip.hidden = true; h.setAttribute('fill', 'transparent'); });
                    });
                    // 막대에 마우스를 올리면 같은 테마의 7일 추이를 선으로 연결
                    const hl = svg.querySelector('.hl-line');
                    let cur = -1;
                    svg.onmousemove = e => {
                        const x = e.clientX - svg.getBoundingClientRect().left, i = Math.floor((x - L) / gw);
                        if (i < 0 || i >= D7.length) return;
                        const x0 = L + gw * i + (gw - (bw + 2) * THEMES.length + 2) / 2;
                        const j = Math.max(0, Math.min(THEMES.length - 1, Math.floor((x - x0 + 1) / (bw + 2))));
                        if (j === cur) return;
                        cur = j;
                        const c = THEMES[j].color, p = tops[j];
                        hl.innerHTML = `<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${p.map(q => q.join(',')).join(' ')}"/>` + p.map(([cx, cy]) => `<circle cx="${cx}" cy="${cy}" r="3.5" fill="#fff" stroke="${c}" stroke-width="2"/>`).join('');
                        box.classList.add('hl');
                        svg.querySelectorAll('.bar').forEach(b => b.classList.toggle('on', +b.dataset.t === j));
                    };
                    svg.onmouseleave = () => { cur = -1; hl.innerHTML = ''; box.classList.remove('hl'); };
                });
            }
            window.addEventListener('resize', draw);
            draw();
        })();

        /* ---------- 표 정렬 + 합계 행 ---------- */
        function makeSortable(table) {
            const ths = [...table.querySelectorAll('th[data-col]')];
            ths.forEach(th => {
                th.innerHTML = `<button type="button" class="sort-btn" title="▲ 큰 순 · ▼ 작은 순 (이름을 누르면 번갈아 정렬)">${th.innerHTML}<span class="arw" aria-hidden="true"><span class="arw-up">▲</span><span class="arw-dn">▼</span></span></button>`;
                th.querySelector('button').addEventListener('click', e => {
                    const b = e.currentTarget, hit = e.target.closest('.arw-up, .arw-dn'), dir = hit ? (hit.classList.contains('arw-up') ? 'desc' : 'asc') : (b.dataset.dir === 'desc' ? 'asc' : 'desc'), col = +th.dataset.col;
                    ths.forEach(t => { delete t.querySelector('button').dataset.dir; t.removeAttribute('aria-sort'); });
                    b.dataset.dir = dir; th.setAttribute('aria-sort', dir === 'desc' ? 'descending' : 'ascending');
                    const key = r => { const c = r.cells[col]; return c.dataset.v !== undefined ? +c.dataset.v : c.textContent.trim(); };
                    [...table.tBodies].forEach(tb => [...tb.rows].filter(r => !r.classList.contains('type-row')).sort((a, c) => { const x = key(a), y = key(c); return (x > y ? 1 : x < y ? -1 : 0) * (dir === 'desc' ? -1 : 1); }).forEach(r => tb.appendChild(r)));
                });
            });
        }
        // 요약: 지표 1위를 차지한 항목 수를 프레임별 비중으로 막대 하나에 (사이즈별 · 지면별 표 위)
        function stackSummary(FR, items, label, unit) {
            const total = items.filter(r => r.win >= 0).length;
            const cnt = FR.map((T, i) => items.filter(r => r.win === i));
            const seg = FR.map((T, i) => {
                const n = cnt[i].length, pct = total ? n / total * 100 : 0;
                return n ? `<span style="width:${pct}%;${sw(T)}" data-tip="${T.name}|${label} 1위 ${n}개 (${Math.round(pct)}%)">${pct >= 12 ? `${T.name.replace(' 프레임', '')} ${Math.round(pct)}%` : ''}</span>` : '';
            }).join('');
            return `<div class="ss-stack"><div class="ss-stack-title">${label} 1위 비중</div><div class="ss-stack-bar">${seg}</div></div>`;
        }
        // 비중 막대 구간에 마우스를 올리면 검은 툴팁 (프레임 · 1위 개수)
        document.addEventListener('mouseover', e => {
            const seg = e.target.closest('.ss-stack-bar span[data-tip]'); if (!seg) return;
            const box = seg.closest('.ss-stack'); let tip = box.querySelector('.tip');
            if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip); }
            const [name, txt] = seg.dataset.tip.split('|');
            tip.innerHTML = `<b>${name}</b><span>${txt}</span>`; tip.hidden = false;
            const b = box.getBoundingClientRect(), r = seg.getBoundingClientRect();
            tip.style.left = Math.max(0, Math.min(b.width - tip.offsetWidth, r.left - b.left + r.width / 2 - tip.offsetWidth / 2)) + 'px';
            tip.style.top = (r.top - b.top - tip.offsetHeight - 8) + 'px';
            seg.addEventListener('mouseleave', () => { tip.hidden = true; }, { once: true });
        });
        const numTd = (v, fmt, cls = '', c = '', tip = '') => `<td class="${cls}" data-v="${v}"${c ? ` style="${cv(c)}"` : ''}>${cls.includes('top') ? `<span class="crown-wrap" data-tip="${tip}">${CROWN}${fmt(v)}</span>` : fmt(v)}</td>`;

        /* ④ 일별 추이 — 날짜마다 테마별 노출·클릭·CTR + 합산. 구간 = 그날 노출된 테마(단독 / 병행), 구간이 바뀐 날은 강조 */
        (function () {
            const day = (t, d) => sum(pick(r => r.t === t && r.d === d));
            const active = vals => THEMES.filter((T, i) => vals[i].imp > 0);
            const seg = on => {
                if (!on.length) return `<span class="seg-chip none">−</span>`;
                if (on.length === 1) return `<span class="seg-chip one" style="${cv(on[0])}">${on[0].name.replace(' 프레임', '')} 단독</span>`;
                // 병행 — 노출된 테마 색을 칸으로 나눠 표시
                const n = on.length, bg = on.map((T, i) => `color-mix(in srgb, ${T.color} 22%, #fff) ${i / n * 100}% ${(i + 1) / n * 100}%`).join(', ');
                return `<span class="seg-chip" style="background:linear-gradient(90deg, ${bg})">${on.map(T => T.name.replace(' 프레임', '')).join(' · ')} 병행</span>`;
            };
            const cell = (o, k, m) => `<td class="sep" data-v="${o.imp ? o[k] : -1}">${o.imp ? m.fmt(o[k]) : '−'}</td>`;
            const group = o => M3.map(m => cell(o, m.k, m)).join('');
            const MINV = 1;
            // 병행(2개 이상 노출)인 날은 클릭률 1위 프레임 칸에만 1위 메달 + 색 강조
            const winGroup = (o, T, list, d) => M3.map(m => {
                const on = list.filter(x => x.imp >= MINV);
                const win = m.k === 'ctr' && on.length >= 2 && o.imp >= MINV && o[m.k] > 0 && o[m.k] === Math.max(...on.map(x => x[m.k]));
                return win ? numTd(o[m.k], m.fmt, 'sep top', T, `${md(d)} · ${m.label} 1위
${T.name} ${m.fmt(o[m.k])}`) : cell(o, m.k, m);
            }).join('');
            let prevKey = null;
            const rows = [...DATES].map(d => {   // 과거 → 최신 순으로 구간 변화를 판단한 뒤 최신순으로 표시
                const v = THEMES.map(T => day(T.id, d)), on = active(v), key = on.map(T => T.id).join('+');
                const pivot = prevKey !== null && key !== prevKey;
                prevKey = key;
                return { d, v, on, pivot, all: sum(pick(r => r.d === d)) };
            }).reverse().map(({ d, v, on, pivot, all }) =>
                `<tr class="${pivot ? 'pivot' : ''}"><td class="${dayCls(d)}"><b>${md(d)}</b></td><td class="left">${seg(on)}</td>${v.map((o, i) => winGroup(o, THEMES[i], v, d)).join('')}${group(all)}</tr>`).join('');
            const tot = THEMES.map(T => sum(pick(r => r.t === T.id))), totAll = sum(ROWS);
            document.getElementById('transTable').innerHTML = `<thead>
                <tr><th rowspan="2">일자</th><th rowspan="2" style="text-align:left">구간</th>
                    ${THEMES.map(T => `<th colspan="3" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}</th>`).join('')}
                    <th colspan="3" class="grp sep">합산</th></tr>
                <tr>${[...THEMES, { name: '합산' }].map(() => M3.map(m => `<th class="sep">${m.label.replace(' (CTR)', '')}</th>`).join('')).join('')}</tr>
                <tr class="total-row"><td>합계</td><td class="left">${DATES.length}일</td>${tot.map(group).join('')}${group(totAll)}</tr>
            </thead><tbody>${rows}</tbody>`;
        })();

        /* ⑤ 사이즈별 — 블랙골드 · 화이트레드 · 매거진 (지표 탭 · 9월 전체 / 일별 선택) */
        function renderSize(from, to, mk) {
            const inR = r => r.d >= from && r.d <= to;
            const m = M3.find(x => x.k === mk);
            const FR = ['blackgold', 'whitered', 'magazine'].map(theme);
            const argmax = list => { let w = -1; list.forEach((o, i) => { if (o.imp && (w < 0 || o[mk] > list[w][mk])) w = i; }); return w; };
            const whole = from === PERIOD_FROM && to === TODAY && SROWS.length;   // 월 전체는 기간 누적(SDATA · xlsx) · 일별은 원본 일별(DROWS)
            const src = whole ? (fn => SROWS.filter(fn)) : (fn => dpick(r => inR(r) && fn(r)));
            const rows = SIZES.map(S => ({ S, v: FR.map(T => sum(src(r => r.t === T.id && r.s === S.name))) }));
            rows.forEach(r => r.win = argmax(r.v));
            const tot = FR.map(T => sum(src(r => r.t === T.id)));
            // 3종 합계 열 — 노출·클릭은 세 테마 합계, 클릭률은 합산 클릭 ÷ 합산 노출 (노출 가중 평균)
            const allOf = list => { const o = { imp: 0, clk: 0 }; list.forEach(v => { o.imp += v.imp; o.clk += v.clk; }); o.ctr = o.imp ? o.clk / o.imp * 100 : 0; return o; };
            const allLabel = mk === 'ctr' ? '3종 평균' : '3종 합계';
            const allTip = mk === 'ctr' ? '세 테마의 클릭 합계 ÷ 노출 합계' : '세 테마의 ' + m.label + ' 합계';
            const allTd = o => !o.imp ? `<td class="sep all na" data-v="-1">−</td>` : numTd(o[mk], m.fmt, 'sep all');
            const totAll = allOf(tot);
            const head = `<thead>
                <tr><th>사이즈</th>${FR.map((T, i) => `<th data-col="${i + 1}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}</th>`).join('')}<th data-col="${FR.length + 1}" class="grp sep all" title="${allTip}">${allLabel}</th></tr>
                <tr class="total-row"><td>합계</td>${tot.map((o, i) => !o.imp ? `<td class="sep na" data-v="-1">−</td>` : numTd(o[mk], m.fmt, 'sep' + (i === argmax(tot) ? ' top' : ''), i === argmax(tot) ? FR[i] : '', `합계 · ${m.label} 1위
${FR[i].name} ${m.fmt(o[mk])}`)).join('')}${allTd(totAll)}</tr>
            </thead>`;
            const sizeRow = ({ S, v, win }) => `<tr><td class="size-cell"><b>${S.name}</b></td>${v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === win ? ' top' : ''), i === win ? FR[i] : '', `${S.name} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}${allTd(allOf(v))}</tr>`;
            const body = `<tbody>${rows.map(sizeRow).join('')}</tbody>`;
            const t = document.getElementById('sizeTable');
            t.innerHTML = head + body;
            makeSortable(t);
            // 요약: 테마별 1위 사이즈 수
            document.getElementById('sizeSummary').innerHTML = stackSummary(FR, rows.map(r => ({ win: r.win, name: r.S.name })), m.label, '사이즈');
        }
        (function () {
            const ctrl = document.getElementById('sizePeriod'), dateEl = document.getElementById('sizeDate'), tabs = document.getElementById('sizeMetric');
            if (!DAILY_DETAIL) ctrl.querySelector('[data-mode="day"]').hidden = true;
            dateEl.min = PERIOD_FROM; dateEl.max = DTODAY; dateEl.value = DTODAY;
            ctrl.querySelector('[data-mode="month"]').textContent = `${+TODAY.slice(5, 7)}월 전체`;
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                const mk = tabs.querySelector('[aria-selected="true"]').dataset.metric;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || DTODAY;
                if (mode === 'day') renderSize(d, d, mk); else renderSize(PERIOD_FROM, TODAY, mk);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
