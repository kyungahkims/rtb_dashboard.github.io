                run();
            });
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();

        /* ⑧ 추가 사이즈 배너 영향 — 이전 배너에 없던 5개 사이즈가 평균 CTR을 끌어내렸는지 (3종 합산 · 일별 원본 DROWS) */
        (function () {
            const NEW_SIZES = ['234x60', '300x50', '300x100', '336x280', '468x60'];
            const isNew = sz => NEW_SIZES.includes(sz);
            const sec = document.getElementById('newSizeKpi').closest('section');
            const rows = DROWS.filter(r => r.s && r.s !== '비규격');
            if (!rows.length) { sec.hidden = true; return; }
            const FR = ['blackgold', 'whitered', 'magazine'].map(theme);
            const all = sum(rows), nw = sum(rows.filter(r => isNew(r.s))), old = sum(rows.filter(r => !isNew(r.s)));
            const oldCnt = new Set(rows.filter(r => !isNew(r.s)).map(r => r.s)).size;
            const share = all.imp ? nw.imp / all.imp * 100 : 0;
            const diff = all.ctr - old.ctr;   // 추가 사이즈가 전체 CTR에 미친 영향 (%p) — 음수면 끌어내림
            const pp = v => Math.abs(v) < 0.0005 ? '0.000%p' : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(3) + '%p';   // ±0.0005 미만은 0으로
            const sizeNm = sz => sz.replace('x', '×');
            document.getElementById('newSizeRange').textContent = `${md(DDATES[0])} ~ ${md(DTODAY)} · 3종 합산`;

            // 요약 4칸
            const kpi = (label, val, sub, cls = '') => `<div class="ss-item"><span class="k-label">${label}</span><span class="k-val ${cls}">${val}</span><span class="k-sub">${sub}</span></div>`;
            document.getElementById('newSizeKpi').innerHTML =
                kpi('추가 5종 CTR', pct(nw.ctr), `노출 ${f(nw.imp)} · 클릭 ${f(nw.clk)}`) +
                kpi(`기존 ${oldCnt}종 CTR`, pct(old.ctr), `노출 ${f(old.imp)} · 클릭 ${f(old.clk)}`);

            // 사이즈별 표 — 추가 5종 + 합계 행
            const bySize = NEW_SIZES.map(sz => ({ sz, o: sum(rows.filter(r => r.s === sz)), t: FR.map(T => sum(rows.filter(r => r.s === sz && r.t === T.id))) }))
                .filter(x => x.o.imp).sort((a, b) => b.o.imp - a.o.imp);
            const ppTd = v => `<td class="${Math.abs(v) < 0.0005 ? '' : v < 0 ? 'pp-down' : 'pp-up'}" data-v="${v}">${pp(v)}</td>`;
            const line = (name, o, t, cls = '') => `<tr class="${cls}"><td class="left"><b>${name}</b></td>${numTd(o.imp, f)}<td data-v="${all.imp ? o.imp / all.imp * 100 : 0}">${(all.imp ? o.imp / all.imp * 100 : 0).toFixed(1)}%</td>${numTd(o.clk, f)}${numTd(o.ctr, pct)}${ppTd(o.ctr - old.ctr)}${t.map(v => v.imp ? numTd(v.ctr, pct) : `<td class="na" data-v="-1">−</td>`).join('')}</tr>`;
            const tbl = document.getElementById('newSizeTable');
            tbl.innerHTML = `<thead><tr>
                <th data-col="0" style="text-align:left">사이즈</th><th data-col="1">노출수</th><th data-col="2">노출 비중</th><th data-col="3">클릭수</th><th data-col="4">클릭률 (CTR)</th><th data-col="5" title="기존 ${oldCnt}종 평균 CTR과의 차이">기존 대비</th>
                ${FR.map((T, i) => `<th data-col="${i + 6}" class="grp" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T, true)} CTR</th>`).join('')}
            </tr></thead>
            <tbody>${bySize.map(x => line(sizeNm(x.sz) + ' (추가)', x.o, x.t)).join('')}</tbody>
            <tbody class="grp">
                ${line('추가 5종 합계', nw, FR.map(T => sum(rows.filter(r => isNew(r.s) && r.t === T.id))), 'type-row')}
                ${line(`기존 ${oldCnt}종 합계`, old, FR.map(T => sum(rows.filter(r => !isNew(r.s) && r.t === T.id))), 'type-row')}
                ${line(`전체 (${oldCnt + bySize.length}종)`, all, FR.map(T => sum(rows.filter(r => r.t === T.id))), 'type-row')}
            </tbody>`;
            makeSortable(tbl);

            // 일별: 추가 5종 CTR · 기존 CTR · 추가 사이즈 노출 비중
            const days = DDATES;
            const daily = days.map(d => {
                const dr = rows.filter(r => r.d === d), a = sum(dr), n = sum(dr.filter(r => isNew(r.s))), o = sum(dr.filter(r => !isNew(r.s)));
                return { d, a, n, o, share: a.imp ? n.imp / a.imp * 100 : 0 };
            }).filter(x => x.a.imp);
            const avg = (list, k) => { const o = sum(list.map(x => x[k])); return o.ctr; };
            const k = Math.min(3, Math.floor(daily.length / 2)) || 1;
            const head3 = daily.slice(0, k), tail3 = daily.slice(-k);
            const oldFrom = avg(head3, 'o'), oldTo = avg(tail3, 'o'), newFrom = avg(head3, 'n'), newTo = avg(tail3, 'n');
            const shFrom = head3.reduce((t, x) => t + x.share, 0) / head3.length, shTo = tail3.reduce((t, x) => t + x.share, 0) / tail3.length;
            const best = [...bySize].sort((a, b) => b.o.ctr - a.o.ctr)[0], worst = [...bySize].sort((a, b) => a.o.ctr - b.o.ctr)[0];

            // 결론 문장
            let v;
            if (Math.abs(diff) < 0.001) v = `추가 사이즈 5종을 빼고 계산해도 전체 CTR은 <b>${pct(all.ctr)} → ${pct(old.ctr)}</b>로 차이가 ${pp(diff)}입니다. 추가 5종 CTR(${pct(nw.ctr)})이 기존 ${oldCnt}종(${pct(old.ctr)})과 거의 같고 노출 비중도 ${share.toFixed(1)}%라 <b>평균 CTR을 끌어내리지 않았습니다.</b>`;
            else if (diff < 0) v = `추가 사이즈 5종이 전체 CTR을 <b>${pp(diff)}</b> 끌어내렸습니다 (추가 제외 시 ${pct(old.ctr)} → 포함 ${pct(all.ctr)}). 추가 5종 CTR ${pct(nw.ctr)} · 기존 ${oldCnt}종 ${pct(old.ctr)} · 노출 비중 ${share.toFixed(1)}%입니다.`;
            else v = `추가 사이즈 5종이 전체 CTR을 오히려 <b>${pp(diff)}</b> 끌어올렸습니다 (추가 제외 시 ${pct(old.ctr)} → 포함 ${pct(all.ctr)}). 추가 5종 CTR ${pct(nw.ctr)} · 기존 ${oldCnt}종 ${pct(old.ctr)} · 노출 비중 ${share.toFixed(1)}%입니다.`;
            if (best && worst && best !== worst) v += ` 사이즈별로는 ${sizeNm(best.sz)}(${pct(best.o.ctr)})이 기존 평균보다 높고 ${sizeNm(worst.sz)}(${pct(worst.o.ctr)})은 낮아 서로 상쇄됩니다.`;
            if (daily.length >= 4) v += `<br>일별로 보면 기존 ${oldCnt}종 CTR이 ${md(head3[0].d)}~${md(head3[k - 1].d)} ${pct(oldFrom)}에서 ${md(tail3[0].d)}~${md(tail3[k - 1].d)} ${pct(oldTo)}로 ${oldTo < oldFrom ? '내려갔고' : '올라갔고'}, 추가 5종도 ${pct(newFrom)} → ${pct(newTo)}로 같은 방향입니다. 추가 사이즈 노출 비중은 ${shFrom.toFixed(1)}% → ${shTo.toFixed(1)}%로 ${shTo < shFrom ? '오히려 줄었습니다' : '늘었습니다'}. ${oldTo < oldFrom && shTo <= shFrom ? '<b>9월 중 CTR 하락은 추가 사이즈가 아니라 사이즈와 무관한 원인(지면 구성 변화)입니다.</b>' : ''}`;
            document.getElementById('newSizeVerdict').innerHTML = v;

            // 일별 그래프
            const C_NEW = '#3446b8', C_OLD = '#9aa0a8';
            document.getElementById('newSizeLegend').innerHTML = `<span><i style="background:${C_NEW}"></i>추가 5종 CTR</span><span><i style="background:${C_OLD}"></i>기존 ${oldCnt}종 CTR</span><span><i class="bar"></i>추가 사이즈 노출 비중 (오른쪽 축)</span>`;
            const nice = v => { if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const q of [1, 2, 2.5, 5, 10]) if (q * p >= v) return q * p; return v; };
            const box = document.getElementById('newSizeChart'), svg = box.querySelector('svg'), tip = box.querySelector('.tip');
            function draw() {
                svg.setAttribute('width', 0);
                const W = box.clientWidth, H = box.clientHeight, L = 50, R = 44, T = 10, B = 26, iw = W - L - R, ih = H - T - B;
                const maxC = nice(Math.max(...daily.flatMap(x => [x.n.ctr, x.o.ctr]))), maxS = nice(Math.max(...daily.map(x => x.share)));
                const gw = iw / daily.length, X = i => L + gw * i + gw / 2, Y = val => T + ih - val / maxC * ih, YS = val => T + ih - val / maxS * ih;
                svg.setAttribute('width', W); svg.setAttribute('height', H);
                let out = '';
                for (let g = 0; g <= 4; g++) {
                    const y = T + ih - ih * g / 4;
                    out += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${g ? '#f2f3f5' : '#e6e8ec'}"/>`;
                    out += `<text x="${L - 6}" y="${y + 4}" font-size="10" fill="#b3b8bf" text-anchor="end">${(maxC * g / 4).toFixed(3)}%</text>`;
                    out += `<text x="${W - R + 6}" y="${y + 4}" font-size="10" fill="#b3b8bf" text-anchor="start">${Math.round(maxS * g / 4)}%</text>`;
                }
                const bw = Math.max(3, Math.min(14, gw * 0.5));
                daily.forEach((x, i) => { const h = x.share / maxS * ih; if (h > 0) out += `<rect x="${X(i) - bw / 2}" y="${T + ih - h}" width="${bw}" height="${h}" rx="2" fill="#dfe3ea"/>`; });
                const poly = (key, color, dash) => {
                    const pts = daily.map((x, i) => x[key].imp ? `${X(i)},${Y(x[key].ctr)}` : null).filter(Boolean);
                    return `<polyline fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"${dash ? ' stroke-dasharray="5 4"' : ''} points="${pts.join(' ')}"/>` +
                        daily.map((x, i) => x[key].imp ? `<circle cx="${X(i)}" cy="${Y(x[key].ctr)}" r="3" fill="#fff" stroke="${color}" stroke-width="2"/>` : '').join('');
                };
                out += poly('o', C_OLD, true) + poly('n', C_NEW, false);
                const step = Math.max(1, Math.ceil(daily.length / 14));
                daily.forEach((x, i) => {
                    out += `<rect class="hit" data-i="${i}" x="${L + gw * i}" y="${T}" width="${gw}" height="${ih}" fill="transparent"/>`;
                    if (i % step === 0 || i === daily.length - 1) out += `<text x="${X(i)}" y="${H - 8}" font-size="10.5" fill="#888" text-anchor="middle">${md(x.d)}</text>`;
                });
                svg.innerHTML = out;
                svg.querySelectorAll('.hit').forEach(h => {
                    h.addEventListener('mouseenter', () => {
                        const x = daily[+h.dataset.i];
                        tip.innerHTML = `<b>${md(x.d)}</b><span><em style="font-style:normal"><i style="background:${C_NEW}"></i>추가 5종</em>${x.n.imp ? pct(x.n.ctr) + ' (' + f(x.n.imp) + ')' : '−'}</span><span><em style="font-style:normal"><i style="background:${C_OLD}"></i>기존 ${oldCnt}종</em>${x.o.imp ? pct(x.o.ctr) + ' (' + f(x.o.imp) + ')' : '−'}</span><span><em style="font-style:normal"><i style="background:#dfe3ea"></i>추가 비중</em>${x.share.toFixed(1)}%</span>`;
                        tip.hidden = false;
                        const gx = L + gw * (+h.dataset.i), tw = tip.offsetWidth;
                        tip.style.left = (gx + gw + tw > W ? gx - tw - 4 : gx + gw + 4) + 'px'; tip.style.top = '0px';
                        h.setAttribute('fill', 'rgba(52,70,184,.06)');
                    });
                    h.addEventListener('mouseleave', () => { tip.hidden = true; h.setAttribute('fill', 'transparent'); });
                });
            }
            window.addEventListener('resize', draw);
            draw();
        })();

        /* ⑤ 프레임 이름별 — 실제 프레임 이름 전부 (9월 전체 / 일별 선택) */
        function renderNames(from, to) {
            const inR = r => r.d >= from && r.d <= to;
            const whole = from === PERIOD_FROM && to === TODAY && NROWS.length;   // 월 전체는 기간 누적(NDATA · xlsx) · 일별은 원본 일별(DROWS)
            const src = whole ? NROWS : dpick(inR);
            // 크기 × 디자인 조합으로 합산 (같은 조합의 변형 배너 _ETC · No 등은 하나로)
            const keys = [...new Set(src.map(r => `${r.t}|${r.s}`))];
            const rows = keys.map(k => { const [tid, size] = k.split('|'); return { T: theme(tid), size, s: sum(src.filter(r => r.t === tid && r.s === size)) }; });
            const t = document.getElementById('nameTable');
            t.innerHTML = `<thead>
                <tr><th data-col="0" style="text-align:left">프레임 테마</th><th data-col="1" style="text-align:left">사이즈</th>${M3.map((m, i) => `<th data-col="${i + 2}">${m.label}</th>`).join('')}</tr>
            </thead><tbody>${rows.length ? rows.map(({ T, size, s }) => `<tr>
                <td class="left"><span class="rk-slot"></span><span class="dot" style="${sw(T)}"></span>${nm(T)}</td>
                <td class="left"><b>${size === '비규격' ? '비규격 (오토)' : size}</b></td>
                ${M3.map(m => numTd(s[m.k], m.fmt)).join('')}</tr>`).join('') : '<tr><td colspan="5" class="na" style="text-align:center">이 날짜에는 데이터가 없습니다</td></tr>'}</tbody>`;
            makeSortable(t);
            // 디자인 앞 1·2·3위 — 정렬한 지표(노출수·클릭수·CTR) 기준, 디자인·사이즈로 정렬하면 CTR 기준
            const rank = () => {
                const th = t.querySelector('th[aria-sort]'), col = th && +th.dataset.col >= 2 ? +th.dataset.col : 4;
                const trs = [...t.tBodies[0].rows].filter(r => r.cells.length > 1);
                const order = [...trs].sort((x, y) => +y.cells[col].dataset.v - +x.cells[col].dataset.v);
                trs.forEach(r => r.querySelector('.rk-slot').innerHTML = '');
                order.slice(0, 3).forEach((r, i) => r.querySelector('.rk-slot').innerHTML = `<span class="rk-badge rk${i + 1}">${i + 1}위</span>`);
            };
            t.tHead.addEventListener('click', () => setTimeout(rank));
            t.querySelector('th[data-col="4"] .arw-up').click();   // 처음에는 클릭률 (CTR) 높은 순
        }
        (function () {
            const ctrl = document.getElementById('namePeriod'), dateEl = document.getElementById('nameDate');
            if (!DAILY_DETAIL) ctrl.querySelector('[data-mode="day"]').hidden = true;
            dateEl.min = PERIOD_FROM; dateEl.max = DTODAY; dateEl.value = DTODAY;
            ctrl.querySelector('[data-mode="month"]').textContent = `${+TODAY.slice(5, 7)}월 전체`;
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || DTODAY;
                if (mode === 'day') renderNames(d, d); else renderNames(PERIOD_FROM, TODAY);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();
        /* ⑥ 지면별 — 테마 × 지면 (지표 탭 · 9월 전체 / 일별 선택) · 지면 데이터가 들어오면 표시 */
        // 지면은 사이트 이름만 표시 (매체 · 광고 자리 번호는 표시하지 않고, 같은 사이트의 여러 자리는 합산)
        const siteOf = p => { const m = p.replace(/_N_v2$/, '').match(/^(web|app|mob)_(.+?)_([a-z]+)_(\d+)$/); return m ? m[2] : p; };
        const PROWS = PDATA.map(([d, t, p, imp, clk]) => ({ d, t, p: siteOf(p), imp, clk }));
        const XPROWS = XPDATA.map(([t, p, imp, clk]) => ({ t, p: siteOf(p), imp, clk }));   // 기간 누적 (xlsx)
        const ETC_PLACE = '기타 지면';
        const PLACE_N = 10;   // 표에 보여 줄 지면 수 (노출 상위 · 사이트 기준)
        const placeLabel = p => `<b>${p}</b>`;
        function renderPlace(from, to, mk) {
            const whole = from === PERIOD_FROM && to !== from && XPROWS.length > 0;   // 월 전체: xlsx 기간 누적 · 일별: 원본 일별
            const src = whole ? XPROWS : PROWS;
            const inR = r => whole || (r.d >= from && r.d <= to);
            const m = M3.find(x => x.k === mk);
            const FR = THEMES;
            const psum = fn => sum(src.filter(fn));
            const argmax = list => { let w = -1; list.forEach((o, i) => { if (o.imp && (w < 0 || o[mk] > list[w][mk])) w = i; }); return w; };
            // 지면 목록: 기간 내 노출 많은 순 — 상위 PLACE_N개 실제 지면만 ('기타 지면' 묶음은 제외)
            const places = [...new Set(src.filter(r => inR(r) && r.p !== ETC_PLACE).map(r => r.p))]
                .map(p => ({ p, all: psum(r => inR(r) && r.p === p) }))
                .sort((a, b) => b.all.imp - a.all.imp).slice(0, PLACE_N);
            const rows = places.map(({ p }) => ({ p, v: FR.map(T => psum(r => inR(r) && r.t === T.id && r.p === p)) }));
            rows.forEach(r => r.win = argmax(r.v));
            const shown = new Set(rows.map(r => r.p));
            const tot = FR.map(T => psum(r => inR(r) && r.t === T.id && shown.has(r.p)));   // 합계도 표에 있는 지면 기준
            const head = `<thead>
                <tr><th>지면</th>${FR.map((T, i) => `<th data-col="${i + 1}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}</th>`).join('')}</tr>
                <tr class="total-row"><td>합계</td>${tot.map((o, i) => !o.imp ? `<td class="sep na" data-v="-1">−</td>` : numTd(o[mk], m.fmt, 'sep' + (i === argmax(tot) ? ' top' : ''), i === argmax(tot) ? FR[i] : '', `합계 · ${m.label} 1위
${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>
            </thead>`;
            const placeRow = ({ p, v, win }) => `<tr><td class="place-cell">${placeLabel(p)}</td>${v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === win ? ' top' : ''), i === win ? FR[i] : '', `${p} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>`;
            const t = document.getElementById('placeTable');
            t.innerHTML = head + `<tbody>${rows.length ? rows.map(placeRow).join('') : `<tr><td colspan="${FR.length + 1}" class="na" style="text-align:center">이 날짜에는 데이터가 없습니다</td></tr>`}</tbody>`;
            makeSortable(t);
            document.getElementById('placeSummary').innerHTML = stackSummary(FR, rows.map(r => ({ win: r.win, name: r.p })), m.label, '지면');
        }
        (function () {
            const ctrl = document.getElementById('placePeriod'), dateEl = document.getElementById('placeDate'), tabs = document.getElementById('placeMetric');
            const PD = [...new Set(PROWS.map(r => r.d))].sort(), PTODAY = PD[PD.length - 1] || TODAY;
            dateEl.min = PERIOD_FROM; dateEl.max = PTODAY; dateEl.value = PTODAY;
            ctrl.querySelector('[data-mode="month"]').textContent = `${+PTODAY.slice(5, 7)}월 전체`;
            if (!PROWS.length) ctrl.querySelector('[data-mode="day"]').hidden = true;   // 일별 지면 데이터가 없으면 월 전체만
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                const mk = tabs.querySelector('[aria-selected="true"]').dataset.metric;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || PTODAY;
                if (mode === 'day') renderPlace(d, d, mk); else renderPlace(PERIOD_FROM, PTODAY, mk);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();
        // 날짜 칸 어디를 눌러도 달력이 뜨게
        // 날짜 칸(①④⑤⑥)은 눌러도 칸 안의 글자가 선택(파랗게)·복사되지 않게 — 포커스 없이 달력만 띄움
        document.querySelectorAll('.date-in').forEach(el => {
            el.addEventListener('mousedown', e => { e.preventDefault(); try { el.showPicker(); } catch (err) { } });
            el.addEventListener('keydown', e => { if (e.key !== 'Tab') e.preventDefault(); });   // 키보드 복사·선택 막기 (Tab 이동은 허용)
        });
    </script>
    <script>
        /* 맨 위로 버튼 — 300px 이상 내려가면 표시 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
</body>

</html>
