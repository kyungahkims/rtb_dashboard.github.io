<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>상품 고정 프레임</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #f5f6f8;
            color: #202124;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif
        }

        .wrap {
            margin: auto;
            padding: 28px 32px
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-bottom: 22px;
            gap: 12px
        }

        .head h1 {
            margin: 0;
            font-size: 27px
        }

        .date {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            padding: 10px 14px;
            font-size: 13px
        }

        .card {
            background: #fff;
            border: 1px solid #e6e8ec;
            border-radius: 12px;
            padding: 26px 24px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .07);
            min-width: 0
        }

        section {
            margin-bottom: 48px
        }

        section:last-of-type {
            margin-bottom: 24px
        }

        .title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px
        }

        .title h2 {
            font-size: 17px;
            font-weight: 800;
            color: #1a1d23;
            letter-spacing: -.01em;
            margin: 0
        }

        .title span {
            font-size: 12px;
            color: #858a92
        }

        .note {
            font-size: 11px;
            color: #858a92;
            margin-top: 10px
        }

        .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: 0;
            flex: none
        }

        /* ① 테마별 성과 박스 */
        .themes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px
        }

        .theme {
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        .theme-art {
            background: #f8f9fb;
            padding: 16px;
            border-bottom: 1px solid #eceef1
        }

        .theme-art .ad {
            max-width: 280px;
            margin: auto
        }

        .theme-body {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .theme-name {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center
        }

        /* 프레임 이름 호버 툴팁 */
        .fname { cursor: default; border-bottom: 1px dotted transparent }
        .fname:hover { border-bottom-color: currentColor }
        #frameTip { position: fixed; left: -9999px; top: -9999px; z-index: 2000; width: 216px; padding: 8px; background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .16); pointer-events: none; visibility: hidden }
        #frameTip.show { visibility: visible }
        #frameTip .ft-item { display: none }
        #frameTip .ft-item.on { display: block }
        #frameTip .ad.ad-slot { width: 200px; margin: 0 auto }
        #frameTip .ft-name { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; font-size: 12px; font-weight: 700; color: #20242a }

        /* ① 신규 표시 */
        .tag-chip { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 999px; background: #3446b8; color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: .2px; line-height: 1.5 }
        /* ① 프레임 미리보기 링크 (뷰어 페이지 새 탭) */
        a.theme-art { display: block; text-decoration: none; color: inherit }
        .theme-view { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: #3446b8; text-decoration: none; white-space: nowrap; padding: 2px 7px; border-radius: 999px; background: #eef0f9 }
        .theme-view:hover { background: #3446b8; color: #fff }

        .theme-period {
            font-size: 12px;
            color: #6b7078
        }

        .theme-period b {
            color: #3446b8
        }

        .theme-stats {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 7px 10px;
            font-size: 13px;
            border-top: 1px dashed #e1e4e9;
            padding-top: 10px;
            margin: 0
        }

        .theme-stats dt {
            color: #7b8088
        }

        .theme-stats dd {
            margin: 0;
            text-align: right;
            font-weight: 700;
            font-variant-numeric: tabular-nums
        }

        /* ② 타임라인 */
        .tl {
            list-style: none;
            margin: 0;
            padding: 0;
            position: relative
        }

        .tl::before {
            content: "";
            position: absolute;
            left: 82px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: #e6e8ec
        }

        .tl li {
            display: grid;
            grid-template-columns: 70px 26px 1fr 150px;
            gap: 0 12px;
            align-items: start;
            padding: 10px 0
        }

        .tl li+li {
            border-top: 1px solid #f1f2f4
        }

        .tl-date {
            font-size: 13px;
            font-weight: 700;
            text-align: right;
            padding-top: 2px;
            font-variant-numeric: tabular-nums
        }

        .tl-date small {
            display: block;
            font-size: 11px;
            color: #9aa0a8;
            font-weight: 400
        }

        .tl-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 0 2px var(--c);
            background: var(--c);
            margin: 3px auto 0;
            position: relative;
            z-index: 1
        }

        .tl-body {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0
        }

        .tl-top {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .tl-top b {
            font-size: 14px
        }

        .tl-body p {
            margin: 0;
            font-size: 12.5px;
            color: #6b7078;
            line-height: 1.5
        }

        .chip {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap
        }

        .chip.deploy {
            background: #e8ecff;
            color: #3446b8
        }

        .chip.copy {
            background: #fff3dc;
            color: #a86b00
        }

        .chip.ratio {
            background: #fbe9ea;
            color: #c9444d
        }

        .chip.fix {
            background: #eceef1;
            color: #4b5260
        }

        .chip.ch.google {
            background: #eef0f3;
            color: #4b5260
        }

        .chip.ch.kakao {
            background: #fff4c2;
            color: #6b5300
        }

        .tl-target {
            font-size: 12px;
            font-weight: 700;
            color: #444;
            display: flex;
            align-items: center
        }

        .chip.live {
            background: #e6f4ec;
            color: #198754
        }

        .tl-art .ad {
            width: 150px
        }
        /* ② 전전일 vs 전일 — 지표별 카드 (제목 + 한 줄 요약 · 막대 · 이름/1위 배지 · 증감 칩) */
        .yd-legend { margin-bottom: 14px }
        .yd-legend-note { color: #858a92 }
        .yd-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px }
        .yd-card { background: #fff; border: 1px solid #e6e8ec; border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .06); padding: 16px 18px 14px; min-width: 0 }
        .yd-card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px }
        .yd-card-head h3 { margin: 0; font-size: 14px; font-weight: 800; color: #202124; white-space: nowrap }
        .yd-note { font-size: 11.5px; font-weight: 600; color: #858a92; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
        .yd-chart { position: relative; height: 170px }
        .yd-chart svg { display: block; overflow: visible }
        .yd-chart .yd-bar { cursor: default }
        .yd-labels { display: grid; margin-top: 8px; text-align: center }
        .yd-labels > div { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0 }
        .yd-name { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #202124; white-space: nowrap }
        .yd-chg { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap }
        .yd-chg.rise { background: #e6f4ec; color: #198754 }
        .yd-chg.fall { background: #fbe9ea; color: #c9444d }
        .yd-chg.flat { background: #eceef1; color: #666 }
        .yd-chg.none { background: #eceef1; color: #858a92 }
        @media(max-width:1100px) { .yd-cards { grid-template-columns: 1fr } }

        /* ③ 최근 7일 */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            font-size: 12px;
            color: #555;
            margin-bottom: 8px
        }

        .legend i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: -1px
        }

        .w7 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px
        }

        .w7-box h3 {
            margin: 0 0 6px;
            font-size: 13px;
            color: #444
        }

        .w7-chart {
            height: 230px;
            position: relative
        }

        .w7-chart svg {
            display: block;
            overflow: visible
        }

        .tip {
            position: absolute;
            pointer-events: none;
            background: #20242a;
            color: #fff;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.6;
            white-space: nowrap;
            z-index: 3;
            box-shadow: 0 4px 14px #0003
        }

        .tip b {
            display: block
        }

        .tip i {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px
        }

        .tip span {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            font-variant-numeric: tabular-nums
        }

        /* 표 */
        .scroll {
            overflow: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px
        }

        th,
        td {
            padding: 10px 10px;
            border-bottom: 1px solid #e9ebef;
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums
        }

        th:first-child,
        td:first-child {
            text-align: left
        }

        th {
            color: #777;
            background: #fafbfc;
            font-size: 11px;
            font-weight: 700
        }

        th.grp {
            text-align: center;
            color: #202124;
            font-size: 12px;
            border-bottom: 2px solid var(--c)
        }

        th.sep,
        td.sep {
            border-left: 1px solid #e6e8ec
        }

        td.best {
            color: #3446b8;
            font-weight: 700
        }

        .crown-wrap {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
            cursor: default
        }

        .crown-wrap::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 8px);
            right: -6px;
            background: #20242a;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.5;
            text-align: left;
            white-space: pre;
            padding: 7px 10px;
            border-radius: 7px;
            box-shadow: 0 4px 14px #0003;
            opacity: 0;
            pointer-events: none;
            transition: opacity .12s;
            z-index: 5
        }

        .crown-wrap::before {
            content: "";
            position: absolute;
            bottom: calc(100% + 2px);
            right: 10px;
            border: 6px solid transparent;
            border-top-color: #20242a;
            border-bottom: 0;
            opacity: 0;
            transition: opacity .12s;
            z-index: 5
        }

        td.top:hover .crown-wrap::after,
        td.top:hover .crown-wrap::before {
            opacity: 1
        }

        .crown {
            width: 17px;
            height: 20px;
            flex: none;
            margin: -3px 0
        }

        td.top {
            background: color-mix(in srgb, var(--c) 16%, #fff);
            font-weight: 700;
            box-shadow: inset 3px 0 0 var(--c)
        }

        td.size-cell {
            padding-left: 22px
        }

        .win {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 12px
        }

        .win::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--c)
        }

        .ss {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 14px
        }

        .ss-item {
            background: #f8f9fb;
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            min-width: 0
        }

        .ss-top {
            display: flex;
            align-items: center;
            font-size: 13px;
            font-weight: 700
        }

        .ss-top b {
            margin-left: auto;
            font-size: 13px
        }

        .ss-bar {
            height: 6px;
            background: #e6e8ec;
            border-radius: 3px;
            overflow: hidden
        }

        .ss-bar span {
            display: block;
            height: 100%;
            background: var(--c);
            border-radius: 3px
        }

        .ss-list {
            font-size: 11.5px;
            color: #6b7078;
            line-height: 1.5
        }

        @media(max-width:700px) {
            .ss {
                grid-template-columns: 1fr
            }
        }

        td.left {
            text-align: left
        }

        .cell-name .ad {
            width: 56px;
            flex: none;
            box-shadow: none
        }

        .total-row td {
            background: #f3f5ff;
            font-weight: 700;
            color: #202124;
            border-bottom: 2px solid #d9ddf5;
            font-size: 12.5px
        }

        /* 표 날짜 칸: 토요일 파랑 · 일요일/공휴일 빨강 (holidays.js) */
        td.day-sat { color: #2a6fdb }
        td.day-sun { color: #d7262f }

        .total-row td:first-child {
            color: #3446b8
        }

        .sort-btn {
            all: unset;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 6px;
            margin: -3px -6px;
            border-radius: 6px;
            font: inherit;
            color: inherit
        }

        .sort-btn:hover {
            background: #eef0f3
        }

        .sort-btn:focus-visible {
            outline: 2px solid #3446b8
        }

        .sort-btn .arw {
            display: inline-flex;
            flex-direction: column;
            font-size: 7px;
            line-height: 7px;
            color: #d3d7dd
        }

        .sort-btn .arw span {
            padding: 1px 4px;
            margin: 0 -4px;
            cursor: pointer
        }

        .sort-btn .arw span:hover {
            color: #6b7078
        }

        .sort-btn[data-dir="desc"] .arw .arw-up,
        .sort-btn[data-dir="asc"] .arw .arw-dn {
            color: #3446b8
        }

        .sort-btn[data-dir] {
            color: #3446b8;
            font-weight: 700
        }

        /* ---------- 프레임 예시 이미지 (HTML 목업 · 실제 소재 이미지로 교체 가능) ---------- */
        .ad {
            container-type: inline-size;
            aspect-ratio: 6/5;
            width: 100%;
            max-width: 100%;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            line-height: 1.25;
            letter-spacing: -.01em;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .12)
        }

        .ad svg {
            display: block;
            width: 100%;
            height: 100%
        }

        .ad-blackgold .img {
            width: 36cqw;
            height: 32cqw
        }

        .ad-blackgold .price {
            font-size: 6.4cqw;
            font-weight: 700;
            color: #e2c270
        }

        .ad-whitered .img {
            padding: 5cqw 4cqw
        }

        .ad-whitered .body {
            padding: 3cqw 5cqw 3cqw 1cqw;
            display: flex;
            flex-direction: column;
            gap: 2cqw
        }

        .ad-whitered .price {
            font-size: 8cqw;
            font-weight: 800;
            color: #d7262f
        }

        .ad-whitered .price s {
            display: block;
            font-size: 3.8cqw;
            color: #999;
            font-weight: 400
        }

        .ad-redauto .auto {
            font-size: 3cqw;
            background: rgba(255, 255, 255, .18);
            border-radius: 10cqw;
            padding: .8cqw 2.4cqw;
            font-weight: 700
        }

        .ad-redauto .tile .img {
            height: 17cqw
        }

        .ad-magazine .col {
            display: flex;
            flex-direction: column;
            gap: 2cqw;
            min-width: 0
        }

        .ad-magazine .hl {
            font-family: Georgia, "Noto Serif KR", serif;
            font-size: 7.2cqw;
            line-height: 1.18;
            font-weight: 700;
            letter-spacing: -.03em
        }

        .ad-magazine .price {
            font-size: 4.6cqw;
            font-weight: 700;
            margin-top: auto
        }

        .ad-magazine .link {
            font-size: 3.6cqw;
            font-weight: 700;
            border-bottom: 1px solid;
            align-self: flex-start
        }

        .ad-magazine .img {
            background: #e2d9c8;
            display: flex;
            align-items: center;
            padding: 4cqw
        }

        @media(max-width:1100px) {

            .themes {
                grid-template-columns: repeat(2, 1fr)
            }

            .w7 {
                grid-template-columns: 1fr
            }
        }

        @media(max-width:700px) {
            .wrap {
                padding: 18px
            }

            .head {
                display: block
            }

            .date {
                display: inline-block;
                margin-top: 12px
            }

            .themes {
                grid-template-columns: 1fr
            }

            .tl::before {
                left: 64px
            }

            .tl li {
                grid-template-columns: 52px 26px 1fr
            }

            .tl-art {
                grid-column: 3;
                margin-top: 8px
            }
        }

        .ad.ad-slot {
            background: #fff;
            border: 1px solid #d6d9de;
            box-shadow: none;
            border-radius: 6px
        }

        .ad.ad-slot:has(iframe) {
            aspect-ratio: 1;            /* 250x250 배너 */
            border-color: #e3e6ea
        }

        .ad.ad-slot iframe {
            display: block;
            width: 250px;               /* 배너 원본 크기로 그린 뒤 */
            height: 250px;
            border: 0;
            transform-origin: 0 0;      /* 칸 폭에 맞게 축소 (fitBannerSlots) */
            pointer-events: none;       /* 대시보드에서 실수로 광고 클릭 방지 */
        }

        .tl-open {
            position: fixed;
            right: 24px;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            z-index: 20;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 0;
            background: #3446b8;
            color: #fff;
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(52, 70, 184, .38);
            transition: transform .15s, background .15s
        }

        .tl-open:hover {
            background: #28389a;
            transform: translateY(-2px)
        }

        .tl-open-label {
            position: absolute;
            right: calc(100% + 10px);
            top: 50%;
            transform: translateY(-50%);
            background: #20242a;
            color: #fff;
            font-size: 12.5px;
            font-weight: 700;
            white-space: nowrap;
            padding: 7px 11px;
            border-radius: 7px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s
        }

        .tl-open:hover .tl-open-label,
        .tl-open:focus-visible .tl-open-label {
            opacity: 1
        }

        .tl-open:focus-visible,
        .tl-close:focus-visible {
            outline: 2px solid #3446b8;
            outline-offset: 2px
        }

        .tl-modal {
            width: min(920px, calc(100vw - 32px));
            max-height: calc(100vh - 48px);
            padding: 0;
            border: 0;
            border-radius: 14px;
            box-shadow: 0 20px 60px #0004;
            color: #202124
        }

        .tl-modal::backdrop {
            background: rgba(20, 24, 30, .45)
        }

        .tl-modal[open] {
            display: flex;
            flex-direction: column;
            animation: tlIn .16s ease-out
        }

        @keyframes tlIn {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .tl-modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px 22px;

        }

        .seg { display: inline-flex; background: #f1f2f4; border-radius: 9px; padding: 3px }
        .seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; font: inherit; font-size: 12.5px; font-weight: 600; color: #6b7078; cursor: pointer }
        .seg button[aria-pressed="true"] { background: #fff; color: #3446b8; font-weight: 800; box-shadow: 0 1px 3px #0002 }
        .seg button:focus-visible, .date-in:focus-visible { outline: 2px solid #3446b8; outline-offset: 1px }
        .date-in { border: 1px solid #d6d9de; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12.5px; color: #202124; background: #fff }
        td.na { color: #c3c7ce }
        /* ④ 사이즈별 표 — 촘촘하게 */

        #transTable tr.pivot td.top { background: color-mix(in srgb, var(--r, var(--c)) 16%, #fff) }   /* 강조 행에서도 1위 칸은 프레임 색 */
        .seg-chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 1.5; color: #202124 }
        .seg-chip.one { background: color-mix(in srgb, var(--c) 14%, #fff); color: color-mix(in srgb, var(--c) 78%, #000) }   /* 테마 하나 — 그 테마 색 */
        .seg-chip.none { background: #eceef1; color: #6b7078 }
        /* ⑤ 지표 탭 */
        .m-tabs { display: flex; gap: 4px; border-bottom: 1px solid #e6e8ec; margin: 2px 0 18px }
        .m-tabs button { border: 0; background: none; font: inherit; font-size: 13.5px; font-weight: 700; color: #858a92; padding: 10px 16px 11px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px }
        .m-tabs button:hover { color: #202124 }
        .m-tabs button[aria-selected="true"] { color: #3446b8; border-bottom-color: #3446b8 }
        .m-tabs button:focus-visible { outline: 2px solid #3446b8; outline-offset: -2px; border-radius: 6px }
        #sizeTable th.grp { text-align: right }
        /* ⑥ 지면별 — 요약 박스 한 줄 */
        #placeSummary { grid-template-columns: repeat(3, 1fr) }
        /* 박스 안 제목·막대·목록 줄을 4개 박스가 공유 (서브그리드) → 라인 높이 일치 */
        #placeSummary .ss-item { padding: 22px 18px 20px; display: grid; grid-template-rows: subgrid; grid-row: span 3; align-content: start; justify-content: normal }
        #placeSummary .ss-list { align-self: start }
        /* 제목 줄: 테마 이름 / 1위 · n개 지면 을 두 줄로 (좁은 칸에서 단어가 끊기지 않게) */
        #placeSummary .ss-top { flex-wrap: wrap; row-gap: 4px; white-space: nowrap }

        #placeSummary .ss-list { overflow-wrap: anywhere }
        @media(max-width:1100px) { #placeSummary { grid-template-columns: repeat(2, 1fr) } }
        @media(max-width:700px) { #placeSummary { grid-template-columns: 1fr } }
        #placeTable th, #placeTable td { padding: 6px 8px }
        #placeTable th.grp { text-align: right }
        #placeTable td.place-cell { padding-left: 18px; white-space: nowrap }
        #placeTable td.place-cell small { display: block; font-weight: 400; color: #858a92; font-size: 11px; margin-top: 1px }
        /* 카드 안쪽 여백 — 표 카드는 기존대로 */
        .card:has(> .scroll) { padding: 18px }

        /* 블랙골드처럼 테두리색(--r)이 있는 프레임 */

        /* ③ 최근 7일 — 막대 호버 시 선그래프 */
        .w7-chart .bar { transition: opacity .15s }

        .date-in { cursor: pointer }
        /* 날짜 칸 — 눌러도 파랗게 선택·복사되지 않게 */
        .date-in { -webkit-user-select: none; user-select: none; caret-color: transparent }

        .date-in::-webkit-datetime-edit-month-field:focus,

        .h2-note { margin-left: 8px; font-size: 12px; font-weight: 400; color: #858a92 }
        /* 요약 막대 하나 — 프레임별 1위 비중 */
        .ss-stack { grid-column: 1 / -1; background: #f8f9fb; border-radius: 10px; padding: 16px 18px 14px; position: relative }
        .ss-stack-title { font-size: 13px; font-weight: 800; color: #202124; margin-bottom: 10px }
        .ss-stack-title small { margin-left: 6px; font-size: 12px; font-weight: 600; color: #858a92 }
        .ss-stack-bar { display: flex; height: 26px; border-radius: 7px; overflow: hidden; background: #e6e8ec }
        .ss-stack-bar span { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; box-shadow: inset 0 0 0 2px var(--r, transparent) }
        /* 제목 옆 ? 아이콘 — 마우스를 올리면 설명 툴팁 */
        .h2-help { display: inline-grid; place-items: center; width: 17px; height: 17px; margin-left: 8px; border-radius: 50%; background: #eceef1; color: #6b7078; font-size: 11px; font-weight: 800; vertical-align: 2px; position: relative; cursor: help }
        .h2-help:hover, .h2-help:focus-visible { background: #3446b8; color: #fff }
        .h2-help::after { content: attr(data-tip); position: absolute; left: 0; top: calc(100% + 10px); width: max-content; max-width: 460px; padding: 14px 16px; border-radius: 10px; background: #fff; color: #3b4048; border: 1px solid #e6e8ec; font-size: 12.5px; font-weight: 500; line-height: 1.75; white-space: pre-line; word-break: keep-all; text-align: left; box-shadow: 0 6px 20px rgba(0, 0, 0, .10); opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 6 }
        .h2-help:hover::after, .h2-help:focus-visible::after { opacity: 1 }
        /* ⑤ 1·2·3위 표시 */
        .rk-slot .rk-badge { margin-right: 8px }
        .rk-badge { display: inline-block; min-width: 34px; text-align: center; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 800; line-height: 1.4 }
        .rk-badge.rk1 { background: #ffe9a8; color: #9a6a00 }
        .rk-badge.rk2 { background: #e9ecf1; color: #5b6270 }
        .rk-badge.rk3 { background: #f6e0cf; color: #9a5a2a }
        .theme-stats .rk-badge, .yd-name .rk-badge { font-style: normal; min-width: 30px; padding: 1px 6px; font-size: 10.5px; margin-left: 2px; vertical-align: 1px }   /* ①② 1·2·3위 */
        /* 맨 위로 버튼 */
        .to-top { position: fixed; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #e6e8ec; background: #fff; color: #3446b8; display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, .14); opacity: 0; visibility: hidden; transform: translateY(8px); transition: opacity .18s, transform .18s, visibility .18s }
        .to-top.show { opacity: 1; visibility: visible; transform: none }
        .to-top:hover { background: #3446b8; color: #fff; border-color: #3446b8 }
        .to-top:focus-visible { outline: 2px solid #3446b8; outline-offset: 2px }
        body:has(.tl-open) .to-top { bottom: calc(24px + 58px + 12px + env(safe-area-inset-bottom, 0px)); right: 31px }   /* Timeline 버튼 위 */
        /* 표 행 호버 — 배경 연하게 */
        tbody tr:hover td { background: #f3f5fa }
        tbody tr:hover td.top { background: color-mix(in srgb, var(--r, var(--c)) 24%, #fff) }
        tbody td { transition: background .12s }
    </style>
</head>

        function renderThemes(from, to) {

            const TS = Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => inR(r) && r.t === T.id))]));
            // 4개 프레임 중 순위 (② 와 같은 표시)
            const themeRank = (id, k) => { const n = TS[id][k] > 0 ? 1 + THEMES.filter(T => TS[T.id][k] > TS[id][k]).length : 0; return n ? `<em class="rk-badge rk${Math.min(n, 3)}">${n}위</em>` : ''; };
            document.getElementById('themes').innerHTML = THEMES.map(T => {

        (function () {

        const CROWN = `<svg class="crown" viewBox="0 0 24 28" aria-hidden="true"><path d="M6 1h5l3 8H9z" fill="#3f7ee8"/><path d="M18 1h-5l-3 8h5z" fill="#d7262f"/><circle cx="12" cy="17.5" r="9" fill="#f2b705" stroke="#c98f00" stroke-width="1.5"/><circle cx="12" cy="17.5" r="6.3" fill="none" stroke="#fff3c4" stroke-width="1"/><text x="12" y="21.6" text-anchor="middle" font-size="11" font-weight="800" font-family="Arial, sans-serif" fill="#7a5200">1</text></svg>`;

        /* ② 전전일 vs 전일 — 지표별 카드: 제목 + 한 줄 요약, 프레임마다 전전일(연한 색)·전일(진한 색) 막대와 숫자, 이름 옆 1위 배지, 아래 증감 칩 */
        (function () {
            const Y = DATES[DATES.length - 1], B = DATES[DATES.length - 2];
            const Ys = Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => r.t === T.id && r.d === Y))]));
            const Bs = Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => r.t === T.id && r.d === B))]));
            const best = Object.fromEntries(M3.map(m => [m.k, Math.max(...THEMES.map(T => Ys[T.id][m.k]))]));
            const short = (k, v) => k === 'ctr' ? v.toFixed(3) + '%' : v >= 1e4 ? f(v / 1e4) + '만' : f(v);
            const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
            const nameOf = T => T.name.replace(' 프레임', '');
            // 프레임별 증감: { cls: rise·fall·flat·none, txt, diff, flat(요약용 '유지') }
            const change = (T, k) => {
                const y = Ys[T.id], b = Bs[T.id], yv = y[k], bv = b[k];
                if (!y.imp && !b.imp) return { cls: 'none', txt: '데이터 없음' };
                if (!y.imp) return { cls: 'none', txt: '전일 데이터 없음' };
                if (!b.imp || !bv) return { cls: 'none', txt: '전전일 데이터 없음' };
                const diff = k === 'ctr' ? yv - bv : (yv / bv - 1) * 100;
                const flat = k === 'ctr' ? Math.abs(diff) <= 0.001 : Math.abs(diff) <= 1;   // 요약용 '유지' 기준: CTR ±0.001%p · 노출/클릭 ±1%
                const cls = Math.abs(diff) < 0.0005 ? 'flat' : diff > 0 ? 'rise' : 'fall';
                return { cls, flat, diff, txt: `${cls === 'flat' ? '−' : diff > 0 ? '▲' : '▼'} ${Math.abs(diff).toFixed(k === 'ctr' ? 3 : 1)}%` };
            };
            // 카드 오른쪽 한 줄 요약 (예: 세 테마 모두 약 +21% · 화이트레드만 증가 · 화이트레드만 유지)
            const note = (k) => {
                const cs = THEMES.map(T => ({ T, c: change(T, k) })).filter(x => x.c.cls !== 'none');
                if (!cs.length) return '';
                const dir = x => x.c.flat ? '유지' : x.c.diff > 0 ? '증가' : '감소';
                const fmtAvg = () => { const avg = cs.reduce((a, x) => a + x.c.diff, 0) / cs.length; return k === 'ctr' ? `${avg > 0 ? '+' : '−'}${Math.abs(avg).toFixed(3)}%p` : `${avg > 0 ? '+' : '−'}${Math.abs(avg).toFixed(0)}%`; };
                if (cs.length === 1) return `${nameOf(cs[0].T)}만 데이터 있음`;
                const groups = {}; cs.forEach(x => (groups[dir(x)] = groups[dir(x)] || []).push(x));
                const kinds = Object.keys(groups);
                const all = cs.length === THEMES.length ? (THEMES.length === 2 ? '두 프레임 모두' : `${['', '', '두', '세', '네', '다섯'][THEMES.length] || THEMES.length + '개'} 테마 모두`) : '모두';
                if (kinds.length === 1) {
                    const d = kinds[0];
                    if (d === '유지') return `${all} 유지`;
                    const spread = Math.max(...cs.map(x => x.c.diff)) - Math.min(...cs.map(x => x.c.diff));
                    return (k === 'ctr' ? spread <= 0.005 : spread <= 5) ? `${all} 약 ${fmtAvg()}` : `${all} ${d}`;
                }
                const solo = kinds.find(d => groups[d].length === 1);
                if (solo && kinds.length === 2) return `${nameOf(groups[solo][0].T)}만 ${solo}`;

            };
            const wrap = document.getElementById('yd');
            // 범례: 막대 색은 프레임 색이고, 진한 색이 전일 · 연한 색이 전전일라는 것만 표시

                + `<div class="yd-cards">${M3.map(m => `<div class="yd-card">
                    <div class="yd-card-head"><h3>${m.label}</h3><span class="yd-note">${esc(note(m.k))}</span></div>
                    <div class="yd-chart" data-k="${m.k}"><svg></svg><div class="tip" hidden></div></div>
                    <div class="yd-labels" style="grid-template-columns:repeat(${THEMES.length},1fr)">${THEMES.map(T => {
                        const c = change(T, m.k), win = Ys[T.id][m.k] > 0 && Ys[T.id][m.k] === best[m.k];

                    }).join('')}</div>

            function draw() {
                wrap.querySelectorAll('.yd-chart').forEach(box => {
                    const k = box.dataset.k, m = M3.find(x => x.k === k), svg = box.querySelector('svg'), tip = box.querySelector('.tip');
                    svg.setAttribute('width', 0);   // 먼저 0으로 줄여야 칸이 좁아졌을 때(메뉴 펼침 등) 새 폭을 제대로 읽음 — 안 그러면 이전 폭의 SVG가 칸을 붙들어 가로 스크롤이 생김
                    const W = box.clientWidth, H = box.clientHeight, T = 20, ih = H - T - 2;
                    const max = Math.max(...THEMES.flatMap(t => [Ys[t.id][k], Bs[t.id][k]])) || 1;
                    svg.setAttribute('width', W); svg.setAttribute('height', H);
                    let out = `<line x1="0" x2="${W}" y1="${H - 1}" y2="${H - 1}" stroke="#e6e8ec"/>`;
                    const gw = W / THEMES.length, bw = Math.max(10, Math.min(30, (gw - 28) / 2 - 3)), gap = 6;
                    THEMES.forEach((t, i) => {
                        const cx = gw * i + gw / 2, y = Ys[t.id], b = Bs[t.id];
                        [[b[k], b.imp, cx - gap / 2 - bw, .3], [y[k], y.imp, cx + gap / 2, 1]].forEach(([v, has, x, op]) => {
                            const h = v / max * ih;
                            if (h > 0) out += `<rect class="yd-bar" data-day="${op === 1 ? `전일 ${md(Y)}` : `전전일 ${md(B)}`}" data-t="${i}" data-v="${v}" x="${x}" y="${T + ih - h}" width="${bw}" height="${h}" rx="3" fill="${t.color}" opacity="${op}"/>`;
                            // 숫자 라벨: 막대보다 글자가 길면(CTR 등) 전전일는 왼쪽 막대 오른끝에 맞춰 오른정렬, 전일는 오른쪽 막대 왼끝에 맞춰 왼정렬해서 겹치지 않게
                            const label = has ? short(k, v) : '−', wide = label.length * 6.4 > bw + gap - 2;
                            const [lx, anchor] = !wide ? [x + bw / 2, 'middle'] : op === 1 ? [x, 'start'] : [x + bw, 'end'];
                            out += `<text x="${lx}" y="${T + ih - h - 5}" font-size="${op === 1 ? 11.5 : 10.5}" font-weight="${op === 1 ? 700 : 400}" fill="${op === 1 ? '#202124' : '#858a92'}" text-anchor="${anchor}">${label}</text>`;
                        });

        /* ③ 최근 7일 — 지표별 차트, 날짜마다 테마 4개 막대 */
        (function () {
            const D7 = DATES.slice(-7);   // 데이터가 있는 최근 7일
            const data = D7.map(d => Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => r.t === T.id && r.d === d))])));

            const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= v) return k * p; return v; };
            const short = (k, v) => k === 'ctr' ? v.toFixed(3) + '%' : v >= 1e4 ? f(v / 1e4) + '만' : f(v);

                        });

                        out += `<text x="${gx + gw / 2}" y="${H - 8}" font-size="10.5" fill="#888" text-anchor="middle">${md(d)}</text>`;
                    });

        /* ---------- 표 정렬 + 합계 행 ---------- */
        function makeSortable(table) {

        // 요약: 지표 1위를 차지한 항목 수를 프레임별 비중으로 막대 하나에 (사이즈별 · 지면별 표 위)
        function stackSummary(FR, items, label, unit) {
            const total = items.filter(r => r.win >= 0).length;
            const cnt = FR.map((T, i) => items.filter(r => r.win === i));

        const numTd = (v, fmt, cls = '', c = '', tip = '') => `<td class="${cls}" data-v="${v}"${c ? ` style="${cv(c)}"` : ''}>${cls.includes('top') ? `<span class="crown-wrap" data-tip="${tip}">${CROWN}${fmt(v)}</span>` : fmt(v)}</td>`;

        /* ④ 일별 추이 — 날짜마다 테마별 노출·클릭·CTR + 합산. 구간 = 그날 노출된 테마(단독 / 병행), 구간이 바뀐 날은 강조 */
        (function () {

                // 병행 — 노출된 테마 색을 칸으로 나눠 표시
                const n = on.length, bg = on.map((T, i) => `color-mix(in srgb, ${T.color} 22%, #fff) ${i / n * 100}% ${(i + 1) / n * 100}%`).join(', ');

        /* ⑤ 사이즈별 — 블랙골드 · 화이트레드 · 매거진 (지표 탭 · 9월 전체 / 일별 선택) */

        // 지면은 사이트 이름만 표시 (매체 · 광고 자리 번호는 표시하지 않고, 같은 사이트의 여러 자리는 합산)
        const siteOf = p => { const m = p.replace(/_N_v2$/, '').match(/^(web|app|mob)_(.+?)_([a-z]+)_(\d+)$/); return m ? m[2] : p; };
        const PROWS = PDATA.map(([d, t, p, imp, clk]) => ({ d, t, p: siteOf(p), imp, clk }));
        const XPROWS = XPDATA.map(([t, p, imp, clk]) => ({ t, p: siteOf(p), imp, clk }));   // 기간 누적 (xlsx)
        const ETC_PLACE = '기타 지면';
        const PLACE_N = 10;   // 표에 보여 줄 지면 수 (노출 상위 · 사이트 기준)
        const placeLabel = p => `<b>${p}</b>`;
        function renderPlace(from, to, mk) {
            const whole = from === PERIOD_FROM && to !== from && XPROWS.length > 0;   // 월 전체: xlsx 기간 누적 · 일별: 원본 일별
            const src = whole ? XPROWS : PROWS;
            const inR = r => whole || (r.d >= from && r.d <= to);
            const m = M3.find(x => x.k === mk);
            const FR = THEMES;
            const psum = fn => sum(src.filter(fn));
            const argmax = list => { let w = -1; list.forEach((o, i) => { if (o.imp && (w < 0 || o[mk] > list[w][mk])) w = i; }); return w; };
            // 지면 목록: 기간 내 노출 많은 순 — 상위 PLACE_N개 실제 지면만 ('기타 지면' 묶음은 제외)
            const places = [...new Set(src.filter(r => inR(r) && r.p !== ETC_PLACE).map(r => r.p))]
                .map(p => ({ p, all: psum(r => inR(r) && r.p === p) }))
                .sort((a, b) => b.all.imp - a.all.imp).slice(0, PLACE_N);
            const rows = places.map(({ p }) => ({ p, v: FR.map(T => psum(r => inR(r) && r.t === T.id && r.p === p)) }));
            rows.forEach(r => r.win = argmax(r.v));
            const shown = new Set(rows.map(r => r.p));
            const tot = FR.map(T => psum(r => inR(r) && r.t === T.id && shown.has(r.p)));   // 합계도 표에 있는 지면 기준
            const head = `<thead>
                <tr><th>지면</th>${FR.map((T, i) => `<th data-col="${i + 1}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}</th>`).join('')}</tr>
                <tr class="total-row"><td>합계</td>${tot.map((o, i) => !o.imp ? `<td class="sep na" data-v="-1">−</td>` : numTd(o[mk], m.fmt, 'sep' + (i === argmax(tot) ? ' top' : ''), i === argmax(tot) ? FR[i] : '', `합계 · ${m.label} 1위
${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>
            </thead>`;
            const placeRow = ({ p, v, win }) => `<tr><td class="place-cell">${placeLabel(p)}</td>${v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === win ? ' top' : ''), i === win ? FR[i] : '', `${p} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>`;
            const t = document.getElementById('placeTable');
            t.innerHTML = head + `<tbody>${rows.length ? rows.map(placeRow).join('') : `<tr><td colspan="${FR.length + 1}" class="na" style="text-align:center">이 날짜에는 데이터가 없습니다</td></tr>`}</tbody>`;
            makeSortable(t);
            document.getElementById('placeSummary').innerHTML = stackSummary(FR, rows.map(r => ({ win: r.win, name: r.p })), m.label, '지면');
        }
        (function () {
            const ctrl = document.getElementById('placePeriod'), dateEl = document.getElementById('placeDate'), tabs = document.getElementById('placeMetric');
            const PD = [...new Set(PROWS.map(r => r.d))].sort(), PTODAY = PD[PD.length - 1] || TODAY;
            dateEl.min = PERIOD_FROM; dateEl.max = PTODAY; dateEl.value = PTODAY;
            ctrl.querySelector('[data-mode="month"]').textContent = `${+PTODAY.slice(5, 7)}월 전체`;
            if (!PROWS.length) ctrl.querySelector('[data-mode="day"]').hidden = true;   // 일별 지면 데이터가 없으면 월 전체만
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                const mk = tabs.querySelector('[aria-selected="true"]').dataset.metric;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || PTODAY;
                if (mode === 'day') renderPlace(d, d, mk); else renderPlace(PERIOD_FROM, PTODAY, mk);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();
        // 날짜 칸 어디를 눌러도 달력이 뜨게
        // 날짜 칸(①④⑤⑥)은 눌러도 칸 안의 글자가 선택(파랗게)·복사되지 않게 — 포커스 없이 달력만 띄움
        document.querySelectorAll('.date-in').forEach(el => {
            el.addEventListener('mousedown', e => { e.preventDefault(); try { el.showPicker(); } catch (err) { } });
            el.addEventListener('keydown', e => { if (e.key !== 'Tab') e.preventDefault(); });   // 키보드 복사·선택 막기 (Tab 이동은 허용)
        });
    </script>
    <script>
        /* 맨 위로 버튼 — 300px 이상 내려가면 표시 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
</body>

</html>
