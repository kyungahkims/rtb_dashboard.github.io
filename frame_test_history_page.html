<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>상품 고정 프레임</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/frame_test_history_page.css">
</head>

<body>
    <div class="wrap">

        <section>
            <div class="title">
                <h2>1. 프레임 테마별 성과</h2>
                <div class="period-ctrl" id="themePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="themeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="themes" id="themes"></div>
        </section>

        <section>
            <div class="title">
                <h2>2. 전전일 vs 전일 프레임 테마별 비교</h2>
            </div>
            <div class="card">
                <div class="scroll yd-scroll" id="yd"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>3. 최근 7일 프레임 테마별 비교</h2>
            </div>
            <div class="card">
                <div class="legend" id="w7Legend"></div>
                <div class="w7" id="w7"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>4. 프레임 테마별 일별 추이 <span class="h2-help" data-tip="구간: 그날 어떤 배너가 나갔는지 보여 줍니다.&#10;&#160;&#160;• 단독 = 배너 하나만 나간 날&#10;&#160;&#160;• 병행 = 여러 배너가 같이 나간 날&#10;&#10;노란색 줄: 나가는 배너 조합이 전날과 달라진 날&#10;1위 메달: 여러 배너가 같이 나간 날 중 클릭률이 가장 높았던 배너" aria-label="구간 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="transPeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="scroll">
                    <table id="transTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>5. 사이즈별 프레임 비교 (14개 사이즈)</h2>
                <div class="period-ctrl" id="sizePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="sizeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="sizeMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="ss" id="sizeSummary"></div>
                <div class="scroll">
                    <table id="sizeTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>6. 프레임 테마 · 사이즈별 성과 순위 <span class="h2-help" data-tip="어떤 테마의 어떤 사이즈 배너가 가장 잘 나왔는지 순위로 보여 줍니다.&#10;예: 1위 블랙골드 336×280 = 블랙골드 테마의 336×280 배너가 클릭률이 가장 높음&#10;&#10;표 읽는 법&#10;&#160;&#160;• 한 줄 = 테마 하나 × 사이즈 하나&#10;&#160;&#160;• 1 · 2 · 3위는 지금 정렬된 기준(처음엔 클릭률)으로 매깁니다&#10;&#160;&#160;• 열 제목을 누르면 노출수 · 클릭수 기준으로 바꿀 수 있습니다" aria-label="표 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="namePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="nameDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="scroll name-scroll">
                    <table id="nameTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>7. 프레임 지면별 비교 (상위 10개 지면) <span class="h2-help" data-tip="배너가 실제로 걸린 지면별로&#10;디자인 3종의 성과를 비교합니다.&#10;&#10;9월 전체: 9월 누적 기준&#10;&#160;&#160;• 노출이 많은 지면 10곳&#10;일별: 하루 단위 기준&#10;&#160;&#160;• 그날 노출이 많은 지면 10곳&#10;&#10;지면은 사이트 이름 기준이며, 같은 사이트의 여러 광고 자리는 합산합니다." aria-label="지면별 표 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="placePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="placeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="placeMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="ss" id="placeSummary"></div>
                <div class="scroll">
                    <table id="placeTable"></table>
                </div>
            </div>
        </section>

    </div>

    <button type="button" class="tl-open" id="tlOpen" aria-haspopup="dialog" aria-label="프레임 변경 Timeline 보기">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
        </svg>
        <span class="tl-open-label">프레임 변경 Timeline</span>
    </button>

    <dialog class="tl-modal" id="tlModal" aria-labelledby="tlModalTitle">
        <div class="tl-modal-head">
            <div>
                <h2 id="tlModalTitle">프레임 변경 Timeline</h2>
            </div>
            <button type="button" class="tl-close" id="tlClose" aria-label="닫기">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>
            </button>
        </div>
        <div class="tl-modal-body">
            <ol class="tl" id="timeline"></ol>
        </div>
    </dialog>

            const seg = e.target.closest('.ss-stack-bar span[data-tip]'); if (!seg) return;
            const box = seg.closest('.ss-stack'); let tip = box.querySelector('.tip');
            if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip); }
            const [name, txt] = seg.dataset.tip.split('|');
            tip.innerHTML = `<b>${name}</b><span>${txt}</span>`; tip.hidden = false;
            const b = box.getBoundingClientRect(), r = seg.getBoundingClientRect();
            tip.style.left = Math.max(0, Math.min(b.width - tip.offsetWidth, r.left - b.left + r.width / 2 - tip.offsetWidth / 2)) + 'px';
            tip.style.top = (r.top - b.top - tip.offsetHeight - 8) + 'px';
            seg.addEventListener('mouseleave', () => { tip.hidden = true; }, { once: true });
        });
        const numTd = (v, fmt, cls = '', c = '', tip = '') => `<td class="${cls}" data-v="${v}"${c ? ` style="${cv(c)}"` : ''}>${cls.includes('top') ? `<span class="crown-wrap" data-tip="${tip}">${CROWN}${fmt(v)}</span>` : fmt(v)}</td>`;

        /* 일별 추이 표, 선택한 월 */
        function renderTrans(from, to) {
            const inR = r => r.d >= from && r.d <= to;
            const day = (t, d) => sum(pick(r => r.t === t && r.d === d));
            const active = vals => THEMES.filter((T, i) => vals[i].imp > 0);
            const seg = on => {
                if (!on.length) return `<span class="seg-chip none">−</span>`;
                if (on.length === 1) return `<span class="seg-chip one" style="${cv(on[0])}">${on[0].name.replace(' 프레임', '')} 단독</span>`;
                // 병행 칩
                const n = on.length, bg = on.map((T, i) => `color-mix(in srgb, ${T.color} 22%, #fff) ${i / n * 100}% ${(i + 1) / n * 100}%`).join(', ');
                return `<span class="seg-chip" style="background:linear-gradient(90deg, ${bg})">${on.map(T => T.name.replace(' 프레임', '')).join(' · ')} 병행</span>`;
            };
            const cell = (o, k, m) => `<td class="sep" data-v="${o.imp ? o[k] : -1}">${o.imp ? m.fmt(o[k]) : '−'}</td>`;
            const group = o => M3.map(m => cell(o, m.k, m)).join('');
            const MINV = 1;
            // 병행인 날 클릭률 1위 칸 강조
            const winGroup = (o, T, list, d) => M3.map(m => {
                const on = list.filter(x => x.imp >= MINV);
                const win = m.k === 'ctr' && on.length >= 2 && o.imp >= MINV && o[m.k] > 0 && o[m.k] === Math.max(...on.map(x => x[m.k]));
                return win ? numTd(o[m.k], m.fmt, 'sep top', T, `${md(d)} · ${m.label} 1위
${T.name} ${m.fmt(o[m.k])}`) : cell(o, m.k, m);
            }).join('');
            let prevKey = null;
            const rows = [...DATES].map(d => {   // 구간 변화는 과거순으로 판단
                const v = THEMES.map(T => day(T.id, d)), on = active(v), key = on.map(T => T.id).join('+');
                const pivot = prevKey !== null && key !== prevKey;
                prevKey = key;
                return { d, v, on, pivot, all: sum(pick(r => r.d === d)) };
            }).filter(inR).reverse().map(({ d, v, on, pivot, all }) =>
                `<tr class="${pivot ? 'pivot' : ''}"><td class="${dayCls(d)}"><b>${md(d)}</b></td><td class="left">${seg(on)}</td>${v.map((o, i) => winGroup(o, THEMES[i], v, d)).join('')}${group(all)}</tr>`).join('');
            const tot = THEMES.map(T => sum(pick(r => r.t === T.id && inR(r)))), totAll = sum(pick(inR)), nDays = DATES.filter(d => d >= from && d <= to).length;
            document.getElementById('transTable').innerHTML = `<thead>
                <tr><th rowspan="2">일자</th><th rowspan="2" style="text-align:left">구간</th>
                    ${THEMES.map(T => `<th colspan="3" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}</th>`).join('')}
                    <th colspan="3" class="grp sep">합산</th></tr>
                <tr>${[...THEMES, { name: '합산' }].map(() => M3.map(m => `<th class="sep">${m.label.replace(' (CTR)', '')}</th>`).join('')).join('')}</tr>
                <tr class="total-row"><td>합계</td><td class="left">${nDays}일</td>${tot.map(group).join('')}${group(totAll)}</tr>
            </thead><tbody>${rows}</tbody>`;
        }
        (function () {
            const ctrl = document.getElementById('transPeriod');
            monthButtons(ctrl, DATES);
            const run = () => renderTrans(...monthRange(ctrl, DATES));
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            run();
        })();

        /* 사이즈별 표 */
        function renderSize(from, to, mk) {
            const inR = r => r.d >= from && r.d <= to;
            const m = M3.find(x => x.k === mk);
            const FR = ['blackgold', 'whitered', 'magazine'].map(theme);
            const argmax = list => { let w = -1; list.forEach((o, i) => { if (o.imp && o[mk] > 0 && (w < 0 || o[mk] > list[w][mk])) w = i; }); return w; };   // 값이 0이면 1위 없음
            const whole = wholeRange(from, to, DATES) && SROWS.length;   // 월 전체는 SDATA, 일별은 DROWS
            const src = whole ? (fn => SROWS.filter(fn)) : (fn => dpick(r => inR(r) && fn(r)));
            const rows = SIZES.map(S => ({ S, v: FR.map(T => sum(src(r => r.t === T.id && r.s === S.name))) }));
            rows.forEach(r => r.win = argmax(r.v));
            const tot = FR.map(T => sum(src(r => r.t === T.id)));
            // 3종 합계 열
            const allOf = list => { const o = { imp: 0, clk: 0 }; list.forEach(v => { o.imp += v.imp; o.clk += v.clk; }); o.ctr = o.imp ? o.clk / o.imp * 100 : 0; return o; };
            const allLabel = mk === 'ctr' ? '3종 평균' : '3종 합계';
            const allTip = mk === 'ctr' ? '세 테마의 클릭 합계 ÷ 노출 합계' : '세 테마의 ' + m.label + ' 합계';
            const allTd = o => !o.imp ? `<td class="sep all na" data-v="-1">−</td>` : numTd(o[mk], m.fmt, 'sep all');
            const totAll = allOf(tot);
            const head = `<thead>
                <tr><th>사이즈</th>${FR.map((T, i) => `<th data-col="${i + 1}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}</th>`).join('')}<th data-col="${FR.length + 1}" class="grp sep all" title="${allTip}">${allLabel}</th></tr>
                <tr class="total-row"><td>합계</td>${tot.map((o, i) => !o.imp ? `<td class="sep na" data-v="-1">−</td>` : numTd(o[mk], m.fmt, 'sep' + (i === argmax(tot) ? ' top' : ''), i === argmax(tot) ? FR[i] : '', `합계 · ${m.label} 1위
${FR[i].name} ${m.fmt(o[mk])}`)).join('')}${allTd(totAll)}</tr>
            </thead>`;
            const sizeRow = ({ S, v, win }) => `<tr><td class="size-cell"><b>${S.name}</b></td>${v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === win ? ' top' : ''), i === win ? FR[i] : '', `${S.name} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}${allTd(allOf(v))}</tr>`;
            const body = `<tbody>${rows.map(sizeRow).join('')}</tbody>`;
            const t = document.getElementById('sizeTable');
            t.innerHTML = head + body;
            makeSortable(t);
            document.getElementById('sizeSummary').innerHTML = stackSummary(FR, rows.map(r => ({ win: r.win, name: r.S.name })), m.label, '사이즈');
        }
        (function () {
            const ctrl = document.getElementById('sizePeriod'), dateEl = document.getElementById('sizeDate'), tabs = document.getElementById('sizeMetric');
            if (!DAILY_DETAIL) ctrl.querySelector('[data-mode="day"]').hidden = true;
            dateEl.min = DATES[0]; dateEl.max = DTODAY; dateEl.value = DTODAY;
            monthButtons(ctrl, DATES);
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                const mk = tabs.querySelector('[aria-selected="true"]').dataset.metric;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || DTODAY;
                if (mode === 'day') renderSize(d, d, mk); else renderSize(...monthRange(ctrl, DATES), mk);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();

        /* 프레임 이름별 표 */
        function renderNames(from, to) {
            const inR = r => r.d >= from && r.d <= to;
            const whole = wholeRange(from, to, DATES) && NROWS.length;   // 월 전체는 NDATA, 일별은 DROWS
            const src = whole ? NROWS : dpick(inR);
            // 테마 x 사이즈로 합산, 변형 배너는 하나로
            const keys = [...new Set(src.map(r => `${r.t}|${r.s}`))];
            const rows = keys.map(k => { const [tid, size] = k.split('|'); return { T: theme(tid), size, s: sum(src.filter(r => r.t === tid && r.s === size)) }; });
            const t = document.getElementById('nameTable');
            t.innerHTML = `<thead>
                <tr><th data-col="0" style="text-align:left">프레임 테마</th><th data-col="1" style="text-align:left">사이즈</th>${M3.map((m, i) => `<th data-col="${i + 2}">${m.label}</th>`).join('')}</tr>
            </thead><tbody>${rows.length ? rows.map(({ T, size, s }) => `<tr>
                <td class="left"><span class="rk-slot"></span><span class="dot" style="${sw(T)}"></span>${nm(T)}</td>
                <td class="left"><b>${size === '비규격' ? '비규격 (오토)' : size}</b></td>
                ${M3.map(m => numTd(s[m.k], m.fmt)).join('')}</tr>`).join('') : '<tr><td colspan="5" class="na" style="text-align:center">이 날짜에는 데이터가 없습니다</td></tr>'}</tbody>`;
            makeSortable(t);
            // 순위 배지는 정렬한 지표 기준, 이름 정렬이면 CTR
            const rank = () => {
                const th = t.querySelector('th[aria-sort]'), col = th && +th.dataset.col >= 2 ? +th.dataset.col : 4;
                const trs = [...t.tBodies[0].rows].filter(r => r.cells.length > 1);
                const order = trs.filter(r => +r.cells[col].dataset.v > 0).sort((x, y) => +y.cells[col].dataset.v - +x.cells[col].dataset.v);   // 0이면 순위 없음
                trs.forEach(r => r.querySelector('.rk-slot').innerHTML = '');
                order.slice(0, 3).forEach((r, i) => r.querySelector('.rk-slot').innerHTML = `<span class="rk-badge rk${i + 1}">${i + 1}위</span>`);
            };
            t.tHead.addEventListener('click', () => setTimeout(rank));
            t.querySelector('th[data-col="4"] .arw-up').click();   // 처음엔 CTR 높은 순
        }
        (function () {
            const ctrl = document.getElementById('namePeriod'), dateEl = document.getElementById('nameDate');
            if (!DAILY_DETAIL) ctrl.querySelector('[data-mode="day"]').hidden = true;
            dateEl.min = DATES[0]; dateEl.max = DTODAY; dateEl.value = DTODAY;
            monthButtons(ctrl, DATES);
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || DTODAY;
                if (mode === 'day') renderNames(d, d); else renderNames(...monthRange(ctrl, DATES));
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();
        /* 지면별 표 */
        // 지면은 사이트 이름 기준으로 합산
        const siteOf = p => { const m = p.replace(/_N_v2$/, '').match(/^(web|app|mob)_(.+?)_([a-z]+)_(\d+)$/); return m ? m[2] : p; };
        const PROWS = PDATA.map(([d, t, p, imp, clk]) => ({ d, t, p: siteOf(p), imp, clk }));
        const XPROWS = XPDATA.map(([t, p, imp, clk]) => ({ t, p: siteOf(p), imp, clk }));
        const ETC_PLACE = '기타 지면';
        const PLACE_N = 10;   // 표에 보여 줄 지면 수
        const placeLabel = p => `<b>${p}</b>`;
        function renderPlace(from, to, mk) {
            const whole = wholeRange(from, to, DATES) && to !== from && XPROWS.length > 0;   // 월 전체는 XPROWS, 일별은 PROWS
            const src = whole ? XPROWS : PROWS;
            const inR = r => whole || (r.d >= from && r.d <= to);
            const m = M3.find(x => x.k === mk);
            const FR = THEMES;
            const psum = fn => sum(src.filter(fn));
            const argmax = list => { let w = -1; list.forEach((o, i) => { if (o.imp && o[mk] > 0 && (w < 0 || o[mk] > list[w][mk])) w = i; }); return w; };   // 값이 0이면 1위 없음
            // 노출 상위 PLACE_N개 지면
            const places = [...new Set(src.filter(r => inR(r) && r.p !== ETC_PLACE).map(r => r.p))]
                .map(p => ({ p, all: psum(r => inR(r) && r.p === p) }))
                .sort((a, b) => b.all.imp - a.all.imp).slice(0, PLACE_N);
            const rows = places.map(({ p }) => ({ p, v: FR.map(T => psum(r => inR(r) && r.t === T.id && r.p === p)) }));
            rows.forEach(r => r.win = argmax(r.v));
            const shown = new Set(rows.map(r => r.p));
            const tot = FR.map(T => psum(r => inR(r) && r.t === T.id && shown.has(r.p)));   // 합계도 표에 있는 지면 기준
            const head = `<thead>
                <tr><th>지면</th>${FR.map((T, i) => `<th data-col="${i + 1}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}</th>`).join('')}</tr>
                <tr class="total-row"><td>합계</td>${tot.map((o, i) => !o.imp ? `<td class="sep na" data-v="-1">−</td>` : numTd(o[mk], m.fmt, 'sep' + (i === argmax(tot) ? ' top' : ''), i === argmax(tot) ? FR[i] : '', `합계 · ${m.label} 1위
${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>
            </thead>`;
            const placeRow = ({ p, v, win }) => `<tr><td class="place-cell">${placeLabel(p)}</td>${v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === win ? ' top' : ''), i === win ? FR[i] : '', `${p} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>`;
            const t = document.getElementById('placeTable');
            t.innerHTML = head + `<tbody>${rows.length ? rows.map(placeRow).join('') : `<tr><td colspan="${FR.length + 1}" class="na" style="text-align:center">이 날짜에는 데이터가 없습니다</td></tr>`}</tbody>`;
            makeSortable(t);
            document.getElementById('placeSummary').innerHTML = stackSummary(FR, rows.map(r => ({ win: r.win, name: r.p })), m.label, '지면');
        }
        (function () {
            const ctrl = document.getElementById('placePeriod'), dateEl = document.getElementById('placeDate'), tabs = document.getElementById('placeMetric');
            const PD = [...new Set(PROWS.map(r => r.d))].sort(), PTODAY = PD[PD.length - 1] || TODAY;
            dateEl.min = DATES[0]; dateEl.max = PTODAY; dateEl.value = PTODAY;
            monthButtons(ctrl, PD);
            if (!PROWS.length) ctrl.querySelector('[data-mode="day"]').hidden = true;
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                const mk = tabs.querySelector('[aria-selected="true"]').dataset.metric;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || PTODAY;
                if (mode === 'day') renderPlace(d, d, mk); else renderPlace(...monthRange(ctrl, PD), mk);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();
        // 날짜 칸은 포커스 없이 달력만 띄움
        document.querySelectorAll('.date-in').forEach(el => {
            el.addEventListener('mousedown', e => { e.preventDefault(); try { el.showPicker(); } catch (err) { } });
            el.addEventListener('keydown', e => { if (e.key !== 'Tab') e.preventDefault(); });   // Tab 이동만 허용
        });
    </script>
    <script>
        /* 맨 위로 버튼 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
</body>

</html>
