<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>상품 고정 프레임</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/frame_test_history_page.css">
</head>

<body>
    <div class="wrap">

        <section>
            <div class="title">
                <h2>1. 프레임 테마별 성과</h2>
                <div class="period-ctrl" id="themePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="themeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="themes" id="themes"></div>
        </section>

        <section>
            <div class="title">
                <h2>2. 전전일 vs 전일 프레임 테마별 비교</h2>
            </div>
            <div class="card">
                <div class="scroll yd-scroll" id="yd"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>3. 최근 7일 프레임 테마별 비교</h2>
            </div>
            <div class="card">
                <div class="legend" id="w7Legend"></div>
                <div class="w7" id="w7"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>4. 프레임 테마별 일별 추이 <span class="h2-help" data-tip="구간: 그날 어떤 배너가 나갔는지 보여 줍니다.&#10;&#160;&#160;• 단독 = 배너 하나만 나간 날&#10;&#160;&#160;• 병행 = 여러 배너가 같이 나간 날&#10;&#10;노란색 줄: 나가는 배너 조합이 전날과 달라진 날&#10;1위 메달: 여러 배너가 같이 나간 날 중 클릭률이 가장 높았던 배너" aria-label="구간 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="transPeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="scroll">
                    <table id="transTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>5. 사이즈별 프레임 비교 (14개 사이즈)</h2>
                <div class="period-ctrl" id="sizePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="sizeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="sizeMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="ss" id="sizeSummary"></div>
                <div class="scroll">
                    <table id="sizeTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>6. 프레임 테마 · 사이즈별 성과 순위 <span class="h2-help" data-tip="어떤 테마의 어떤 사이즈 배너가 가장 잘 나왔는지 순위로 보여 줍니다.&#10;예: 1위 블랙골드 336×280 = 블랙골드 테마의 336×280 배너가 클릭률이 가장 높음&#10;&#10;표 읽는 법&#10;&#160;&#160;• 한 줄 = 테마 하나 × 사이즈 하나&#10;&#160;&#160;• 1 · 2 · 3위는 지금 정렬된 기준(처음엔 클릭률)으로 매깁니다&#10;&#160;&#160;• 열 제목을 누르면 노출수 · 클릭수 기준으로 바꿀 수 있습니다" aria-label="표 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="namePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="nameDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="scroll name-scroll">
                    <table id="nameTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>7. 프레임 지면별 비교 (상위 10개 지면) <span class="h2-help" data-tip="배너가 실제로 걸린 지면별로&#10;디자인별 성과를 비교합니다.&#10;&#10;9월 전체: 9월 누적 기준&#10;&#160;&#160;• 노출이 많은 지면 10곳&#10;일별: 하루 단위 기준&#10;&#160;&#160;• 그날 노출이 많은 지면 10곳&#10;&#10;지면은 사이트 이름 기준이며, 같은 사이트의 여러 광고 자리는 합산합니다." aria-label="지면별 표 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="placePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="placeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="placeMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="ss" id="placeSummary"></div>
                <div class="scroll">
                    <table id="placeTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>8. 태그 · 사이즈별 테마 비교 <span class="h2-help" data-tip="광고 자리(TAG ID) 하나와 사이즈 하나를 한 줄로 묶고,&#10;그 자리에 나간 테마별 노출 · 클릭 · 클릭률을 옆으로 펼칩니다.&#10;&#10;같은 자리, 같은 사이즈에서 비교하므로 지면 차이가 빠집니다.&#10;가격 숨김 변형(블랙골드 · 화이트레드)과 새 테마도 따로 보입니다.&#10;&#10;월 전체: 누적 노출 상위 100개 자리&#10;일별: 그날 노출 상위 40개 자리&#10;&#10;노출이 적은 자리는 클릭 1건에 클릭률이 크게 흔들리니&#10;'모든 테마가 나간 자리만' 을 켜고 비교하는 게 안전합니다." aria-label="태그 사이즈별 표 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="tagPeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="tagDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="tagMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="tag-opts">
                    <label class="tag-chk"><input type="checkbox" id="tagOnlyAll"> 모든 테마가 나간 자리만</label>
                    <input type="search" id="tagSearch" class="tag-search" placeholder="TAG ID · 사이트 · 사이즈 검색" aria-label="검색">
                    <span class="tag-count" id="tagCount"></span>
                </div>
                <div class="ss" id="tagSummary"></div>
                <div class="scroll">
                    <table id="tagTable"></table>
                </div>
            </div>
        </section>

    </div>

    <button type="button" class="tl-open" id="tlOpen" aria-haspopup="dialog" aria-label="프레임 변경 Timeline 보기">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
        </svg>
        <span class="tl-open-label">프레임 변경 Timeline</span>
    </button>

    <dialog class="tl-modal" id="tlModal" aria-labelledby="tlModalTitle">
        <div class="tl-modal-head">
            <div>
                <h2 id="tlModalTitle">프레임 변경 Timeline</h2>
            </div>
            <button type="button" class="tl-close" id="tlClose" aria-label="닫기">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>
            </button>
        </div>
        <div class="tl-modal-body">
            <ol class="tl" id="timeline"></ol>
        </div>
    </dialog>

        const CROWN = `<svg class="crown" viewBox="0 0 24 28" aria-hidden="true"><path d="M6 1h5l3 8H9z" fill="#3f7ee8"/><path d="M18 1h-5l-3 8h5z" fill="#d7262f"/><circle cx="12" cy="17.5" r="9" fill="#f2b705" stroke="#c98f00" stroke-width="1.5"/><circle cx="12" cy="17.5" r="6.3" fill="none" stroke="#fff3c4" stroke-width="1"/><text x="12" y="21.6" text-anchor="middle" font-size="11" font-weight="800" font-family="Arial, sans-serif" fill="#7a5200">1</text></svg>`;

        /* 전전일 vs 전일 */
        (function () {
            const Y = DATES[DATES.length - 1], B = DATES[DATES.length - 2];

            const short = (k, v) => k === 'ctr' ? v.toFixed(3) + '%' : v >= 1e4 ? f(v / 1e4) + '만' : f(v);

                if (!y.imp && !b.imp) return { cls: 'none', txt: '데이터 없음' };

                const diff = k === 'ctr' ? yv - bv : (yv / bv - 1) * 100;
                const flat = k === 'ctr' ? Math.abs(diff) <= 0.001 : Math.abs(diff) <= 1;   // 유지 기준: CTR ±0.001%p, 노출과 클릭 ±1%
                const cls = Math.abs(diff) < 0.0005 ? 'flat' : diff > 0 ? 'rise' : 'fall';

            // 카드 한 줄 요약

                if (!cs.length) return '';
                const dir = x => x.c.flat ? '유지' : x.c.diff > 0 ? '증가' : '감소';
                const fmtAvg = () => { const avg = cs.reduce((a, x) => a + x.c.diff, 0) / cs.length; return k === 'ctr' ? `${avg > 0 ? '+' : '−'}${Math.abs(avg).toFixed(3)}%p` : `${avg > 0 ? '+' : '−'}${Math.abs(avg).toFixed(0)}%`; };
                if (cs.length === 1) return `${nameOf(cs[0].T)}만 데이터 있음`;
                const groups = {}; cs.forEach(x => (groups[dir(x)] = groups[dir(x)] || []).push(x));

                if (kinds.length === 1) {

                    if (d === '유지') return `${all} 유지`;
                    const spread = Math.max(...cs.map(x => x.c.diff)) - Math.min(...cs.map(x => x.c.diff));
                    return (k === 'ctr' ? spread <= 0.005 : spread <= 5) ? `${all} 약 ${fmtAvg()}` : `${all} ${d}`;
                }
                const solo = kinds.find(d => groups[d].length === 1);
                if (solo && kinds.length === 2) return `${nameOf(groups[solo][0].T)}만 ${solo}`;

            function draw() {

            const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= v) return k * p; return v; };
            const short = (k, v) => k === 'ctr' ? v.toFixed(3) + '%' : v >= 1e4 ? f(v / 1e4) + '만' : f(v);

        /* 표 정렬 */

        // 프레임별 1위 비중 막대

        /* 일별 추이 표, 선택한 월 */

            };
            const cell = (o, k, m) => `<td class="sep" data-v="${o.imp ? o[k] : -1}">${o.imp ? m.fmt(o[k]) : '−'}</td>`;
            const group = o => M3.map(m => cell(o, m.k, m)).join('');

                const win = m.k === 'ctr' && on.length >= 2 && o.imp >= MINV && o[m.k] > 0 && o[m.k] === Math.max(...on.map(x => x[m.k]));

${T.name} ${m.fmt(o[m.k])}`) : cell(o, m.k, m);
            }).join('');

            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
</body>

</html>
