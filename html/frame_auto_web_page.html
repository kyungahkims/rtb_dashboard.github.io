<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 오토 프레임 (웹, 모바일)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap">

<body>
    <div class="wrap">

        <section>
            <div class="title">
                <h2>1. 프레임별 성과</h2>
                <div class="period-ctrl" id="themePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="themeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="themes" id="themes"></div>
        </section>

        <section>
            <div class="title">
                <h2>2. 전전일 vs 전일 프레임별 비교</h2>
            </div>
            <div class="card">
                <div class="scroll yd-scroll" id="yd"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>3. 최근 7일 프레임별 비교</h2>
            </div>
            <div class="card">
                <div class="legend" id="w7Legend"></div>
                <div class="w7" id="w7"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>4. 프레임별 일별 추이 <span class="h2-help" data-tip="구간: 그날 어떤 배너가 나갔는지 보여 줍니다.&#10;&#160;&#160;• 단독 = 배너 하나만 나간 날&#10;&#160;&#160;• 병행 = 여러 배너가 같이 나간 날&#10;&#10;노란색 줄: 나가는 배너 조합이 전날과 달라진 날&#10;1위 메달: 여러 배너가 같이 나간 날 중 클릭률이 가장 높았던 배너" aria-label="구간 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="transPeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="scroll">
                    <table id="transTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>5. 사이즈별 프레임 비교 (12개 사이즈) <span class="h2-help" data-tip="광고 자리 크기(요청 사이즈)별로&#10;두 배너의 성과를 비교합니다.&#10;오토 프레임은 자리 크기에 맞춰 나가므로&#10;요청 사이즈가 곧 실제로 나간 배너 크기입니다.&#10;&#10;9월 전체: 9월 누적 기준&#10;&#160;&#160;• 노출이 많은 크기 12개&#10;일별: 하루 단위 기준&#10;&#160;&#160;• 그날 노출이 많은 크기 12개" aria-label="사이즈별 표 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="placePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="placeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="placeMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="ss" id="placeSummary"></div>
                <div class="scroll">
                    <table id="placeTable"></table>
                </div>
            </div>
        </section>
    </div>

    <button type="button" class="tl-open" id="tlOpen" aria-haspopup="dialog" aria-label="프레임 변경 Timeline 보기">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
        </svg>
        <span class="tl-open-label">프레임 변경 Timeline</span>
    </button>

        <div class="tl-modal-head">
            <div>

                    stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>
            </button>
        </div>
        <div class="tl-modal-body">
            <ol class="tl" id="timeline"></ol>
        </div>
    </dialog>

    </button>

        /* APDDATA:END */

        const pad = n => String(n).padStart(2, '0');
        const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const md = s => s.slice(5).replace('-', '/');

        const ROWS = ADATA.map(([d, t, imp, clk]) => ({ d, t, imp, clk }));

        THEMES.forEach(T => { const ds = ROWS.filter(r => r.t === T.id && r.imp >= MIN_IMP).map(r => r.d).sort(); T.from = ds[0]; T.to = ds[ds.length - 1]; });

        const sum = rows => { const o = { imp: 0, clk: 0 }; for (const r of rows) { o.imp += r.imp; o.clk += r.clk; } o.ctr = o.imp >= MIN_IMP ? o.clk / o.imp * 100 : 0; return o; };
        const pick = (fn) => ROWS.filter(fn);
        const f = n => Math.round(n).toLocaleString('ko-KR');
        const pct = v => v.toFixed(3) + '%';
        const M3 = [
            { k: 'imp', label: '노출수', fmt: f },

        const theme = id => THEMES.find(t => t.id === id);
        // 프레임 이름, 호버 시 배너 툴팁
        const nm = (T, short = false) => `<span class="fname" data-frame-tip="${T.id}">${short ? T.name.replace(' 프레임', '') : T.name}</span>`;
        function frameArt(id, o = {}) {

        // 템플릿 배너용 목 상품 데이터
        const TPL_MOCK = {
            '{{w}}': BANNER_PX, '{{h}}': BANNER_PX,

        /* 프레임 테마별 성과 */

        const josa = w => { const h = [...w].reverse().find(ch => ch >= '가' && ch <= '힣'); return w + (h && (h.charCodeAt(0) - 0xAC00) % 28 ? '이' : '가'); };
        /* 종료된 프레임(T.retired)은 배너 대신 묘비 + 유령 (상품 고정 페이지와 같은 장치, css/tomb.css · js/ghost_outfits.js 공유). 비문: 데이터 기간 · 최종 클릭률 · 순위 · T.epitaph */
        function tombArt(T, s, ds, rank) {

            return `<div class="tomb" role="button" tabindex="0" title="비석을 누르면 유언장" aria-label="${T.name} 유언장 펼치기/접기"><svg class="tomb-svg" viewBox="0 0 190 218" aria-hidden="true"><path d="M30 200V70a65 65 0 0 1 130 0v130z" fill="#9aa3b2" stroke="#6b7482" stroke-width="3"/><path d="M40 196V72a55 55 0 0 1 110 0v124z" fill="#b4bcc8"/><rect x="16" y="196" width="158" height="16" rx="3" fill="#7d8694"/><path d="M8 212h174" stroke="#7a7f38" stroke-width="6" stroke-linecap="round"/><path d="M20 212q4-10 8 0M150 212q4-12 8 0M60 214q3-8 6 0" fill="#9a9c44"/><g transform="translate(6 209) rotate(-12) scale(1)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#d9622a"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(24 214) rotate(10) scale(0.85)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#e9a53b"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(52 211) rotate(-28) scale(0.9)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#b9452b"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(120 213) rotate(18) scale(0.8)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#e9a53b"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(140 208) rotate(-8) scale(1)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#d9622a"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(166 213) rotate(24) scale(0.9)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#c9752e"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(176 207) rotate(-20) scale(0.8)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#b9452b"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(84 4) rotate(-14) scale(0.95)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#d9622a"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(142 36) rotate(38) scale(0.8)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#e9a53b"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g></svg><div class="ep"><small>HERE LIES</small><b>${T.name.replace(' 프레임', '').replace(' (', '<br>(')}</b><i>${period}</i><i>${s.imp ? `CTR ${pct(s.ctr)}${rank ? ` · ${rank}위` : ''}` : '데이터 없음'}</i>${T.epitaph ? `<q>${T.epitaph}</q>` : ''}</div><div class="ghost" aria-hidden="true"><svg viewBox="0 0 64 76" overflow="visible"><path d="M32 2C17 2 6 14 6 29v40c0 3 3 4 5 2l5-5 5 5c2 2 4 2 6 0l5-5 5 5c2 2 4 2 6 0l5-5 5 5c2 2 5 1 5-2V29C58 14 47 2 32 2z" fill="#fff" stroke="#9aa0a8" stroke-width="2"/><circle cx="23" cy="30" r="4" fill="#2b2d31"/><circle cx="41" cy="30" r="4" fill="#2b2d31"/><path d="M26 44q6 5 12 0" stroke="#2b2d31" stroke-width="2.5" fill="none" stroke-linecap="round"/>${ghostOutfit(T.id)}</svg></div><span class="leaves" aria-hidden="true"><i></i><i></i><i></i></span><span class="tomb-say">마지막 인사 보기</span></div>`;
        }
        // 종료된 카드의 비석을 누르면 유언장 펼침/접기 (열린 카드끼리 높이 맞춤)
        (function () {
            const host = document.getElementById('themes');
            const level = () => {
                const boxes = [...host.querySelectorAll('.theme.will-open .theme-will > div')];

            window.addEventListener('resize', level);
            host.addEventListener('click', e => { const t = e.target.closest('.theme.retired .tomb'); if (t) toggle(t); });
            host.addEventListener('keydown', e => { const t = e.target.closest('.theme.retired .tomb'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(t); } });
        })();

        function renderThemes(from, to) {
            const inR = r => r.d >= from && r.d <= to;
            const TS = Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => inR(r) && r.t === T.id))]));
            const themeRank = (id, k) => { const n = TS[id][k] > 0 ? 1 + THEMES.filter(T => TS[T.id][k] > TS[id][k]).length : 0; return n ? `<em class="rk-badge rk${Math.min(n, 3)}">${n}위</em>` : ''; };
            // 카드 순서: 살아 있는 프레임을 앞에, 종료(묘비) 프레임은 뒤에 (각 묶음 안에서는 THEMES 순서 유지)
            const CARD_ORDER = [...THEMES].sort((a, b) => (a.retired ? 1 : 0) - (b.retired ? 1 : 0));
            document.getElementById('themes').innerHTML = CARD_ORDER.map(T => {
                const s = TS[T.id], ds = [...new Set(pick(r => inR(r) && r.t === T.id && r.imp >= MIN_IMP).map(r => r.d))].sort();
                const period = !ds.length ? '데이터 없음' : from === to ? `데이터: <b>${md(from)}</b>` : `데이터: <b>${md(ds[0])} ~ ${md(ds[ds.length - 1])}</b>`;
                const view = T.view ? `<a class="theme-view" href="${T.view}" target="_blank" rel="noopener" title="${T.name} 전체 사이즈 미리보기 (새 탭)">프레임 미리보기<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>` : '';
                const ctrRank = s.ctr > 0 ? 1 + THEMES.filter(X => TS[X.id].ctr > s.ctr).length : 0;
                return `<article class="card theme${T.retired ? ' retired' : ''}">
                    ${T.retired ? `<div class="theme-art tomb-art">${tombArt(T, s, ds, ctrRank)}</div>` : T.view ? `<a class="theme-art" href="${T.view}" target="_blank" rel="noopener" aria-label="${T.name} 미리보기 (새 탭)">${frameArt(T.id)}</a>` : `<div class="theme-art">${frameArt(T.id)}</div>`}
                    <div class="theme-body">
                        <div class="theme-name"><span class="dot" style="${sw(T)}"></span>${T.retired ? `<span class="tag-chip rip">테스트 종료 · ${md(T.retired)}</span>` : T.ab ? `<span class="ab-chip ${T.ab}">${AB_LABEL[T.ab]}</span>` : ''}${T.kind ? `<span class="kind-chip">${T.kind}</span>` : ''}${T.name}${view}</div>
                        <div class="theme-period">${period}</div>
                        ${T.retired && T.will ? `<div class="theme-will"><div><div class="postit"><small>${josa(T.name.replace(' 프레임', ''))} 남김 · ${md(T.retired)}</small>${T.will}</div></div></div>` : ''}
                        <dl class="theme-stats">
                            <dt>노출수 ${themeRank(T.id, 'imp')}</dt><dd>${s.imp ? f(s.imp) : '−'}</dd>
                            <dt>클릭수 ${themeRank(T.id, 'clk')}</dt><dd>${s.imp ? f(s.clk) : '−'}</dd>
                            <dt>클릭률 (CTR) ${themeRank(T.id, 'ctr')}</dt><dd>${s.imp ? pct(s.ctr) : '−'}</dd>
                        </dl>
                    </div>
                </article>`;
            }).join('');
        }
        (function () {
            const ctrl = document.getElementById('themePeriod'), dateEl = document.getElementById('themeDate');
            dateEl.min = DATES[0]; dateEl.max = TODAY; dateEl.value = TODAY;
            monthButtons(ctrl, DATES);
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || TODAY;
                if (mode === 'day') renderThemes(d, d); else renderThemes(...monthRange(ctrl, DATES));
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();

        const CROWN = `<svg class="crown" viewBox="0 0 24 28" aria-hidden="true"><path d="M6 1h5l3 8H9z" fill="#3f7ee8"/><path d="M18 1h-5l-3 8h5z" fill="#d7262f"/><circle cx="12" cy="17.5" r="9" fill="#f2b705" stroke="#c98f00" stroke-width="1.5"/><circle cx="12" cy="17.5" r="6.3" fill="none" stroke="#fff3c4" stroke-width="1"/><text x="12" y="21.6" text-anchor="middle" font-size="11" font-weight="800" font-family="Arial, sans-serif" fill="#7a5200">1</text></svg>`;
        /* 전전일 vs 전일 카드 */
        (function () {
            const Y = DATES[DATES.length - 1], B = DATES[DATES.length - 2];
            const Ys = Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => r.t === T.id && r.d === Y))]));
            const Bs = Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => r.t === T.id && r.d === B))]));
            const best = Object.fromEntries(M3.map(m => [m.k, Math.max(...THEMES.map(T => Ys[T.id][m.k]))]));
            const short = (k, v) => k === 'ctr' ? v.toFixed(3) + '%' : v >= 1e4 ? f(v / 1e4) + '만' : f(v);
            const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
            const nameOf = T => T.name.replace(' 프레임', '');
            // 프레임별 증감
            const change = (T, k) => {
                const y = Ys[T.id], b = Bs[T.id], yv = y[k], bv = b[k];
                if (!y.imp && !b.imp) return { cls: 'none', txt: '데이터 없음' };
                if (!y.imp) return { cls: 'none', txt: '전일 데이터 없음' };
                if (!b.imp || !bv) return { cls: 'none', txt: '전전일 데이터 없음' };
                const diff = k === 'ctr' ? yv - bv : (yv / bv - 1) * 100;
                const flat = k === 'ctr' ? Math.abs(diff) <= 0.001 : Math.abs(diff) <= 1;   // 요약용 유지 판정
                const cls = Math.abs(diff) < 0.0005 ? 'flat' : diff > 0 ? 'rise' : 'fall';
                return { cls, flat, diff, txt: `${cls === 'flat' ? '−' : diff > 0 ? '▲' : '▼'} ${Math.abs(diff).toFixed(k === 'ctr' ? 3 : 1)}%` };
            };
            // 카드 오른쪽 한 줄 요약
            const note = (k) => {
                const cs = THEMES.map(T => ({ T, c: change(T, k) })).filter(x => x.c.cls !== 'none');
                if (!cs.length) return '';
                const dir = x => x.c.flat ? '유지' : x.c.diff > 0 ? '증가' : '감소';
                const fmtAvg = () => { const avg = cs.reduce((a, x) => a + x.c.diff, 0) / cs.length; return k === 'ctr' ? `${avg > 0 ? '+' : '−'}${Math.abs(avg).toFixed(3)}%p` : `${avg > 0 ? '+' : '−'}${Math.abs(avg).toFixed(0)}%`; };
                if (cs.length === 1) return `${nameOf(cs[0].T)}만 데이터 있음`;
                const groups = {}; cs.forEach(x => (groups[dir(x)] = groups[dir(x)] || []).push(x));
                const kinds = Object.keys(groups);
                const all = cs.length === THEMES.length ? (THEMES.length === 2 ? '두 프레임 모두' : `${['', '', '두', '세', '네', '다섯'][THEMES.length] || THEMES.length + '개'} 테마 모두`) : '모두';
                if (kinds.length === 1) {
                    const d = kinds[0];
                    if (d === '유지') return `${all} 유지`;
                    const spread = Math.max(...cs.map(x => x.c.diff)) - Math.min(...cs.map(x => x.c.diff));
                    return (k === 'ctr' ? spread <= 0.005 : spread <= 5) ? `${all} 약 ${fmtAvg()}` : `${all} ${d}`;
                }
                const solo = kinds.find(d => groups[d].length === 1);
                if (solo && kinds.length === 2) return `${nameOf(groups[solo][0].T)}만 ${solo}`;
                return cs.map(x => `${nameOf(x.T)} ${dir(x)}`).join(' · ');
            };
            const wrap = document.getElementById('yd');
            wrap.innerHTML = `<div class="legend yd-legend"><span class="yd-legend-note">연한 색 = 전전일 ${md(B)} · 진한 색 = 전일 ${md(Y)}</span></div>`
                + `<div class="yd-cards">${M3.map(m => `<div class="yd-card">
                    <div class="yd-card-head"><h3>${m.label}</h3><span class="yd-note">${esc(note(m.k))}</span></div>
                    <div class="yd-chart" data-k="${m.k}"><svg></svg><div class="tip" hidden></div></div>
                    <div class="yd-labels" style="grid-template-columns:repeat(${THEMES.length},1fr)">${THEMES.map(T => {
                        const c = change(T, m.k), win = Ys[T.id][m.k] > 0 && Ys[T.id][m.k] === best[m.k];
                        return `<div><div class="yd-name">${nm(T, true)}${win ? '<em class="rk-badge rk1">1위</em>' : ''}</div><span class="yd-chg ${c.cls}">${c.txt}</span></div>`;
                    }).join('')}</div>
                </div>`).join('')}</div>`;
            function draw() {
                wrap.querySelectorAll('.yd-chart').forEach(box => {
                    const k = box.dataset.k, m = M3.find(x => x.k === k), svg = box.querySelector('svg'), tip = box.querySelector('.tip');
                    svg.setAttribute('width', 0);   // 먼저 0으로 줄여야 칸이 좁아졌을 때(메뉴 펼침 등) 새 폭을 제대로 읽음 — 안 그러면 이전 폭의 SVG가 칸을 붙들어 가로 스크롤이 생김
                    const W = box.clientWidth, H = box.clientHeight, T = 20, ih = H - T - 2;
                    const max = Math.max(...THEMES.flatMap(t => [Ys[t.id][k], Bs[t.id][k]])) || 1;
                    svg.setAttribute('width', W); svg.setAttribute('height', H);
                    let out = `<line x1="0" x2="${W}" y1="${H - 1}" y2="${H - 1}" stroke="#e6e8ec"/>`;
                    const gw = W / THEMES.length, bw = Math.max(10, Math.min(30, (gw - 28) / 2 - 3)), gap = 6;
                    THEMES.forEach((t, i) => {
                        const cx = gw * i + gw / 2, y = Ys[t.id], b = Bs[t.id];
                        [[b[k], b.imp, cx - gap / 2 - bw, .3], [y[k], y.imp, cx + gap / 2, 1]].forEach(([v, has, x, op]) => {
                            const h = v / max * ih;
                            if (h > 0) out += `<rect class="yd-bar" data-day="${op === 1 ? `전일 ${md(Y)}` : `전전일 ${md(B)}`}" data-t="${i}" data-v="${v}" x="${x}" y="${T + ih - h}" width="${bw}" height="${h}" rx="3" fill="${t.color}" opacity="${op}"/>`;
                            // 숫자 라벨 겹침 방지
                            const label = has ? short(k, v) : '−', wide = label.length * 6.4 > bw + gap - 2;
                            const [lx, anchor] = !wide ? [x + bw / 2, 'middle'] : op === 1 ? [x, 'start'] : [x + bw, 'end'];
                            out += `<text x="${lx}" y="${T + ih - h - 5}" font-size="${op === 1 ? 11.5 : 10.5}" font-weight="${op === 1 ? 700 : 400}" fill="${op === 1 ? '#202124' : '#858a92'}" text-anchor="${anchor}">${label}</text>`;
                        });
                    });
                    svg.innerHTML = out;
                    // 막대 호버 툴팁
                    svg.querySelectorAll('.yd-bar').forEach(r => {
                        r.addEventListener('mouseenter', () => {
                            const t = THEMES[+r.dataset.t];
                            tip.innerHTML = `<b>${r.dataset.day}</b><span><em style="font-style:normal"><i style="${sw(t)}"></i>${t.name}</em>${m.fmt(+r.dataset.v)}</span>`;
                            tip.hidden = false;
                            const x = +r.getAttribute('x'), y = +r.getAttribute('y'), tw = tip.offsetWidth, th = tip.offsetHeight;
                            tip.style.left = Math.max(0, Math.min(W - tw, x + bw / 2 - tw / 2)) + 'px';
                            tip.style.top = Math.max(0, y - th - 26) + 'px';
                        });
                        r.addEventListener('mouseleave', () => { tip.hidden = true; });
                    });
                });
            }
            window.addEventListener('resize', draw);
            draw();
        })();

        /* 최근 7일 차트 */
        (function () {
            const D7 = DATES.slice(-7);
            const data = D7.map(d => Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => r.t === T.id && r.d === d))])));
            document.getElementById('w7Legend').innerHTML = THEMES.map(T => `<span><i style="${sw(T)}"></i>${nm(T)}${T.ch === '카카오' ? ' (카카오)' : ''}</span>`).join('');
            const wrap = document.getElementById('w7');
            wrap.innerHTML = M3.map(m => `<div class="w7-box"><h3>${m.label}</h3><div class="w7-chart" data-k="${m.k}"><svg></svg><div class="tip" hidden></div></div></div>`).join('');
            const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= v) return k * p; return v; };
            const short = (k, v) => k === 'ctr' ? v.toFixed(3) + '%' : v >= 1e4 ? f(v / 1e4) + '만' : f(v);

            function draw() {
                wrap.querySelectorAll('.w7-chart').forEach(box => {
                    const k = box.dataset.k, m = M3.find(x => x.k === k), svg = box.querySelector('svg'), tip = box.querySelector('.tip');
                    svg.setAttribute('width', 0);   // 먼저 0으로 줄여야 칸이 좁아졌을 때(메뉴 펼침 등) 새 폭을 제대로 읽음 — 안 그러면 이전 폭의 SVG가 칸을 붙들어 가로 스크롤이 생김
                    const W = box.clientWidth, H = box.clientHeight, L = 46, R = 6, T = 8, B = 26, iw = W - L - R, ih = H - T - B;
                    const max = nice(Math.max(...data.flatMap(o => THEMES.map(t => o[t.id][k]))) || 1);
                    svg.setAttribute('width', W); svg.setAttribute('height', H);
                    let out = '';
                    for (let g = 0; g <= 4; g++) {
                        const y = T + ih - ih * g / 4;
                        out += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${g ? '#f2f3f5' : '#e6e8ec'}"/><text x="${L - 6}" y="${y + 4}" font-size="10" fill="#b3b8bf" text-anchor="end">${short(k, max * g / 4)}</text>`;
                    }
                    const gw = iw / D7.length, bw = Math.min(12, (gw - 10) / THEMES.length - 2);
                    const tops = THEMES.map(() => []);   // 호버 선그래프용 꼭대기 좌표
                    D7.forEach((d, i) => {
                        const gx = L + gw * i, x0 = gx + (gw - (bw + 2) * THEMES.length + 2) / 2;
                        THEMES.forEach((t, j) => {
                            const v = data[i][t.id][k], h = v / max * ih;
                            if (h > 0) tops[j].push([x0 + j * (bw + 2) + bw / 2, T + ih - h]);
                            if (h > 0) out += `<rect class="bar" data-t="${j}" x="${x0 + j * (bw + 2)}" y="${T + ih - h}" width="${bw}" height="${h}" rx="2" fill="${t.color}"${t.ring ? ` stroke="${t.ring}" stroke-width="1.5"` : ''}/>`;
                        });
                        out += `<rect class="hit" data-i="${i}" x="${gx}" y="${T}" width="${gw}" height="${ih}" fill="transparent"/>`;
                        out += `<text x="${gx + gw / 2}" y="${H - 8}" font-size="10.5" fill="#888" text-anchor="middle">${md(d)}</text>`;
                    });
                    out += `<g class="hl-line" pointer-events="none"></g>`;
                    svg.innerHTML = out;
                    svg.querySelectorAll('.hit').forEach(h => {
                        h.addEventListener('mouseenter', () => {
                            const i = +h.dataset.i;
                            tip.innerHTML = `<b>${md(D7[i])} · ${m.label}</b>` + THEMES.map(t => `<span><em style="font-style:normal"><i style="${sw(t)}"></i>${t.name}</em>${data[i][t.id][k] ? m.fmt(data[i][t.id][k]) : '−'}</span>`).join('');
                            tip.hidden = false;
                            const gx = L + gw * i, tw = tip.offsetWidth;
                            tip.style.left = (gx + gw + tw > W ? gx - tw - 4 : gx + gw + 4) + 'px'; tip.style.top = '0px';
                            h.setAttribute('fill', 'rgba(52,70,184,.06)');
                        });
                        h.addEventListener('mouseleave', () => { tip.hidden = true; h.setAttribute('fill', 'transparent'); });
                    });
                    // 막대 호버 시 테마 추이 선
                    const hl = svg.querySelector('.hl-line');
                    let cur = -1;
                    svg.onmousemove = e => {
                        const x = e.clientX - svg.getBoundingClientRect().left, i = Math.floor((x - L) / gw);
                        if (i < 0 || i >= D7.length) return;
                        const x0 = L + gw * i + (gw - (bw + 2) * THEMES.length + 2) / 2;
                        const j = Math.max(0, Math.min(THEMES.length - 1, Math.floor((x - x0 + 1) / (bw + 2))));
                        if (j === cur) return;
                        cur = j;
                        const c = THEMES[j].color, p = tops[j];
                        hl.innerHTML = `<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${p.map(q => q.join(',')).join(' ')}"/>` + p.map(([cx, cy]) => `<circle cx="${cx}" cy="${cy}" r="3.5" fill="#fff" stroke="${c}" stroke-width="2"/>`).join('');
                        box.classList.add('hl');
                        svg.querySelectorAll('.bar').forEach(b => b.classList.toggle('on', +b.dataset.t === j));
                    };
                    svg.onmouseleave = () => { cur = -1; hl.innerHTML = ''; box.classList.remove('hl'); };
                });
            }
            window.addEventListener('resize', draw);
            draw();
        })();

        /* 표 정렬 */
        function makeSortable(table) {
            const ths = [...table.querySelectorAll('th[data-col]')];
            ths.forEach(th => {
                th.innerHTML = `<button type="button" class="sort-btn" title="▲ 큰 순 · ▼ 작은 순 (이름을 누르면 번갈아 정렬)">${th.innerHTML}<span class="arw" aria-hidden="true"><span class="arw-up">▲</span><span class="arw-dn">▼</span></span></button>`;
                th.querySelector('button').addEventListener('click', e => {
                    const b = e.currentTarget, hit = e.target.closest('.arw-up, .arw-dn'), dir = hit ? (hit.classList.contains('arw-up') ? 'desc' : 'asc') : (b.dataset.dir === 'desc' ? 'asc' : 'desc'), col = +th.dataset.col;
                    ths.forEach(t => { delete t.querySelector('button').dataset.dir; t.removeAttribute('aria-sort'); });
                    b.dataset.dir = dir; th.setAttribute('aria-sort', dir === 'desc' ? 'descending' : 'ascending');
                    const key = r => { const c = r.cells[col]; return c.dataset.v !== undefined ? +c.dataset.v : c.textContent.trim(); };
                    [...table.tBodies].forEach(tb => [...tb.rows].filter(r => !r.classList.contains('type-row')).sort((a, c) => { const x = key(a), y = key(c); return (x > y ? 1 : x < y ? -1 : 0) * (dir === 'desc' ? -1 : 1); }).forEach(r => tb.appendChild(r)));
                });
            });
        }
        // 1위 비중 막대
        function stackSummary(FR, items, label, unit) {
            const total = items.filter(r => r.win >= 0).length;
            const cnt = FR.map((T, i) => items.filter(r => r.win === i));
            const seg = FR.map((T, i) => {
                const n = cnt[i].length, pct = total ? n / total * 100 : 0;
                return n ? `<span style="width:${pct}%;${sw(T)}" data-tip="${T.name}|${label} 1위 ${n}개 (${Math.round(pct)}%)">${pct >= 12 ? `${T.name.replace(' 프레임', '')} ${Math.round(pct)}%` : ''}</span>` : '';
            }).join('');
            return `<div class="ss-stack"><div class="ss-stack-title">${label} 1위 비중</div><div class="ss-stack-bar">${seg}</div></div>`;
        }
        // 비중 막대 호버 툴팁
        document.addEventListener('mouseover', e => {
            const seg = e.target.closest('.ss-stack-bar span[data-tip]'); if (!seg) return;
            const box = seg.closest('.ss-stack'); let tip = box.querySelector('.tip');
            if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip); }
            const [name, txt] = seg.dataset.tip.split('|');
            tip.innerHTML = `<b>${name}</b><span>${txt}</span>`; tip.hidden = false;
            const b = box.getBoundingClientRect(), r = seg.getBoundingClientRect();
            tip.style.left = Math.max(0, Math.min(b.width - tip.offsetWidth, r.left - b.left + r.width / 2 - tip.offsetWidth / 2)) + 'px';
            tip.style.top = (r.top - b.top - tip.offsetHeight - 8) + 'px';
            seg.addEventListener('mouseleave', () => { tip.hidden = true; }, { once: true });
        });
        const numTd = (v, fmt, cls = '', c = '', tip = '') => `<td class="${cls}" data-v="${v}"${c ? ` style="${cv(c)}"` : ''}>${cls.includes('top') ? `<span class="crown-wrap" data-tip="${tip}">${CROWN}${fmt(v)}</span>` : fmt(v)}</td>`;


        /* 일별 추이 표, 선택한 월 */
        function renderTrans(from, to) {
            const inR = r => r.d >= from && r.d <= to;
            const day = (t, d) => sum(pick(r => r.t === t && r.d === d));
            const active = vals => THEMES.filter((T, i) => vals[i].imp >= MINV);
            const seg = on => {
                if (!on.length) return `<span class="seg-chip none">−</span>`;
                if (on.length === 1) return `<span class="seg-chip one" style="${cv(on[0])}">${on[0].name.replace(' 프레임', '')} 단독</span>`;
                // 병행 칩
                const n = on.length, bg = on.map((T, i) => `color-mix(in srgb, ${T.color} 22%, #fff) ${i / n * 100}% ${(i + 1) / n * 100}%`).join(', ');
                return `<span class="seg-chip" style="background:linear-gradient(90deg, ${bg})">${on.map(T => T.name.replace(' 프레임', '')).join(' · ')} 병행</span>`;
            };
            const cell = (o, k, m) => `<td class="sep" data-v="${o.imp ? o[k] : -1}">${o.imp ? m.fmt(o[k]) : '−'}</td>`;
            const group = o => M3.map(m => cell(o, m.k, m)).join('');
            const MINV = typeof MIN_IMP === 'number' ? MIN_IMP : 1;
            // 병행인 날만 CTR 1위 강조
            const winGroup = (o, T, list, d) => M3.map(m => {
                const on = list.filter(x => x.imp >= MINV);
                const win = m.k === 'ctr' && on.length >= 2 && o.imp >= MINV && o[m.k] > 0 && o[m.k] === Math.max(...on.map(x => x[m.k]));
                return win ? numTd(o[m.k], m.fmt, 'sep top', T, `${md(d)} · ${m.label} 1위
${T.name} ${m.fmt(o[m.k])}`) : cell(o, m.k, m);
            }).join('');
            let prevKey = null;
            const rows = [...DATES].map(d => {   // 구간 변화는 과거순으로 판단
                const v = THEMES.map(T => day(T.id, d)), on = active(v), key = on.map(T => T.id).join('+');
                const pivot = prevKey !== null && key !== prevKey;
                prevKey = key;
                return { d, v, on, pivot, all: sum(pick(r => r.d === d)) };
            }).filter(inR).reverse().map(({ d, v, on, pivot, all }) =>
                `<tr class="${pivot ? 'pivot' : ''}"><td class="${dayCls(d)}"><b>${md(d)}</b></td><td class="left">${seg(on)}</td>${v.map((o, i) => winGroup(o, THEMES[i], v, d)).join('')}${group(all)}</tr>`).join('');
            const tot = THEMES.map(T => sum(pick(r => r.t === T.id && inR(r)))), totAll = sum(pick(inR)), nDays = DATES.filter(d => d >= from && d <= to).length;
            document.getElementById('transTable').innerHTML = `<thead>
                <tr><th rowspan="2">일자</th><th rowspan="2" style="text-align:left">구간</th>
                    ${THEMES.map(T => `<th colspan="3" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}</th>`).join('')}
                    <th colspan="3" class="grp sep">합산</th></tr>
                <tr>${[...THEMES, { name: '합산' }].map(() => M3.map(m => `<th class="sep">${m.label.replace(' (CTR)', '')}</th>`).join('')).join('')}</tr>
                <tr class="total-row"><td>합계</td><td class="left">${nDays}일</td>${tot.map(group).join('')}${group(totAll)}</tr>
            </thead><tbody>${rows}</tbody>`;
        }
        (function () {
            const ctrl = document.getElementById('transPeriod');
            monthButtons(ctrl, DATES);
            const run = () => renderTrans(...monthRange(ctrl, DATES));
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            run();
        })();

        /* 사이즈별 표 */
        const PROWS = APDATA.map(([t, p, imp, clk]) => ({ t, p, imp, clk }));   // 월 누적
        const PDROWS = APDDATA.map(([d, t, p, imp, clk]) => ({ d, t, p, imp, clk }));   // 일별
        const PLACE_N = 12;
        // 970_280은 970×280로 표시
        const placeLabel = p => {
            const m = p.match(/^(\d+)_(\d+)$/);
            if (m) return `<b>${m[1]}×${m[2]}</b><small>요청 사이즈</small>`;
            return `<b>${p}</b>`;
        };
        function renderPlace(from, to, mk) {
            const whole = wholeRange(from, to, DATES) && to !== from;   // 월 전체면 누적 데이터
            const src = whole ? PROWS : PDROWS.filter(r => r.d >= from && r.d <= to);
            const m = M3.find(x => x.k === mk);
            const FR = THEMES;
            const psum = fn => sum(src.filter(fn));
            const argmax = list => { let w = -1; list.forEach((o, i) => { if (o.imp && o[mk] > 0 && (w < 0 || o[mk] > list[w][mk])) w = i; }); return w; };   // 값이 0이면 1위 없음
            const places = [...new Set(src.map(r => r.p))]
                .map(p => ({ p, all: psum(r => r.p === p) }))
                .sort((a, b) => b.all.imp - a.all.imp).slice(0, PLACE_N);
            const rows = places.map(({ p }) => ({ p, v: FR.map(T => psum(r => r.t === T.id && r.p === p)) }));
            rows.forEach(r => r.win = argmax(r.v));
            const shown = new Set(rows.map(r => r.p));
            const tot = FR.map(T => psum(r => r.t === T.id && shown.has(r.p)));   // 합계는 표에 있는 지면 기준
            const head = `<thead>
                <tr><th>사이즈</th>${FR.map((T, i) => `<th data-col="${i + 1}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}${T.ch === '카카오' ? '<br><small>(카카오)</small>' : ''}</th>`).join('')}</tr>
                <tr class="total-row"><td>합계</td>${tot.map((o, i) => !o.imp ? `<td class="sep na" data-v="-1">−</td>` : numTd(o[mk], m.fmt, 'sep' + (i === argmax(tot) ? ' top' : ''), i === argmax(tot) ? FR[i] : '', `합계 · ${m.label} 1위
${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>
            </thead>`;
            const placeRow = ({ p, v, win }) => `<tr><td class="place-cell">${placeLabel(p)}</td>${v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === win ? ' top' : ''), i === win ? FR[i] : '', `${p} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>`;
            const t = document.getElementById('placeTable');
            t.innerHTML = head + `<tbody>${rows.length ? rows.map(placeRow).join('') : `<tr><td colspan="${FR.length + 1}" class="na" style="text-align:center">이 날짜에는 데이터가 없습니다</td></tr>`}</tbody>`;
            makeSortable(t);
            document.getElementById('placeSummary').innerHTML = stackSummary(FR, rows.map(r => ({ win: r.win, name: r.p.replace(/^(\d+)_(\d+)$/, '$1×$2') })), m.label, '사이즈');
        }
        (function () {
            const ctrl = document.getElementById('placePeriod'), dateEl = document.getElementById('placeDate'), tabs = document.getElementById('placeMetric');
            const PD = [...new Set(PDROWS.map(r => r.d))].sort(), PTODAY = PD[PD.length - 1] || TODAY;
            dateEl.min = DATES[0]; dateEl.max = PTODAY; dateEl.value = PTODAY;
            monthButtons(ctrl, PD);
            if (!PDROWS.length) ctrl.querySelector('[data-mode="day"]').hidden = true;
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                const mk = tabs.querySelector('[aria-selected="true"]').dataset.metric;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || PTODAY;
                if (mode === 'day') renderPlace(d, d, mk); else renderPlace(...monthRange(ctrl, PD), mk);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();

        // 날짜 칸 클릭 시 달력만 띄움
        document.querySelectorAll('.date-in').forEach(el => {
            el.addEventListener('mousedown', e => { e.preventDefault(); try { el.showPicker(); } catch (err) { } });
            el.addEventListener('keydown', e => { if (e.key !== 'Tab') e.preventDefault(); });
        });
    </script>
    <script>
        /* 맨 위로 버튼 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
</body>
