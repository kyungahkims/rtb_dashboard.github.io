<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 오토 프레임 (앱)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/frame_auto_app_page.css">
</head>
<body>
    <div class="wrap">

        <section>
            <div class="title">
                <h2>1. 프레임별 성과</h2>
                <div class="period-ctrl" id="themePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="themeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="themes" id="themes"></div>
        </section>

        <section>
            <div class="title">
                <h2>2. 전전일 vs 전일 프레임별 비교</h2>
            </div>
            <div class="card">
                <div class="scroll yd-scroll" id="yd"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>3. 최근 7일 프레임별 비교</h2>
            </div>
            <div class="card">
                <div class="legend" id="w7Legend"></div>
                <div class="w7" id="w7"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>4. 프레임별 일별 추이 <span class="h2-help" data-tip="구간: 그날 어떤 배너가 나갔는지 보여 줍니다.&#10;&#160;&#160;• 단독 = 배너 하나만 나간 날&#10;&#160;&#160;• 병행 = 여러 배너가 같이 나간 날&#10;&#10;노란색 줄: 나가는 배너 조합이 전날과 달라진 날&#10;1위 메달: 여러 배너가 같이 나간 날 중 클릭률이 가장 높았던 배너" aria-label="구간 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="transPeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="scroll">
                    <table id="transTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>5. 사이즈별 프레임 비교 (12개 사이즈) <span class="h2-help" data-tip="광고 자리 크기(요청 사이즈)별로&#10;두 배너의 성과를 비교합니다.&#10;오토 프레임은 자리 크기에 맞춰 나가므로&#10;요청 사이즈가 곧 실제로 나간 배너 크기입니다.&#10;&#10;9월 전체: 9월 누적 기준&#10;&#160;&#160;• 노출이 많은 크기 12개&#10;일별: 하루 단위 기준&#10;&#160;&#160;• 그날 노출이 많은 크기 12개" aria-label="사이즈별 표 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="placePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="placeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="placeMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="ss" id="placeSummary"></div>
                <div class="scroll">
                    <table id="placeTable"></table>
                </div>
            </div>
        </section>
    </div>

    <button type="button" class="tl-open" id="tlOpen" aria-haspopup="dialog" aria-label="프레임 변경 Timeline 보기">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
        </svg>
        <span class="tl-open-label">프레임 변경 Timeline</span>
    </button>

        <div class="tl-modal-head">
            <div>

                    stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>
            </button>
        </div>
        <div class="tl-modal-body">
            <ol class="tl" id="timeline"></ol>
        </div>
    </dialog>

            const places = [...new Set(src.map(r => r.p))]
                .map(p => ({ p, all: psum(r => r.p === p) }))
                .sort((a, b) => b.all.imp - a.all.imp).slice(0, PLACE_N);
            const rows = places.map(({ p }) => ({ p, v: FR.map(T => psum(r => r.t === T.id && r.p === p)) }));
            rows.forEach(r => r.win = argmax(r.v));
            const shown = new Set(rows.map(r => r.p));
            const tot = FR.map(T => psum(r => r.t === T.id && shown.has(r.p)));   // 합계는 표에 있는 지면 기준
            const head = `<thead>
                <tr><th>사이즈</th>${FR.map((T, i) => `<th data-col="${i + 1}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}${T.ch === '카카오' ? '<br><small>(카카오)</small>' : ''}</th>`).join('')}</tr>
                <tr class="total-row"><td>합계</td>${tot.map((o, i) => !o.imp ? `<td class="sep na" data-v="-1">−</td>` : numTd(o[mk], m.fmt, 'sep' + (i === argmax(tot) ? ' top' : ''), i === argmax(tot) ? FR[i] : '', `합계 · ${m.label} 1위
${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>
            </thead>`;
            const placeRow = ({ p, v, win }) => `<tr><td class="place-cell">${placeLabel(p)}</td>${v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === win ? ' top' : ''), i === win ? FR[i] : '', `${p} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>`;
            const t = document.getElementById('placeTable');
            t.innerHTML = head + `<tbody>${rows.length ? rows.map(placeRow).join('') : `<tr><td colspan="${FR.length + 1}" class="na" style="text-align:center">이 날짜에는 데이터가 없습니다</td></tr>`}</tbody>`;
            makeSortable(t);
            document.getElementById('placeSummary').innerHTML = stackSummary(FR, rows.map(r => ({ win: r.win, name: r.p.replace(/^(\d+)_(\d+)$/, '$1×$2') })), m.label, '사이즈');
        }
        (function () {
            const ctrl = document.getElementById('placePeriod'), dateEl = document.getElementById('placeDate'), tabs = document.getElementById('placeMetric');
            const PD = [...new Set(PDROWS.map(r => r.d))].sort(), PTODAY = PD[PD.length - 1] || TODAY;
            dateEl.min = DATES[0]; dateEl.max = PTODAY; dateEl.value = PTODAY;
            monthButtons(ctrl, PD);
            if (!PDROWS.length) ctrl.querySelector('[data-mode="day"]').hidden = true;
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                const mk = tabs.querySelector('[aria-selected="true"]').dataset.metric;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || PTODAY;
                if (mode === 'day') renderPlace(d, d, mk); else renderPlace(...monthRange(ctrl, PD), mk);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();

        // 날짜 칸 클릭 시 달력만 띄움
        document.querySelectorAll('.date-in').forEach(el => {
            el.addEventListener('mousedown', e => { e.preventDefault(); try { el.showPicker(); } catch (err) { } });
            el.addEventListener('keydown', e => { if (e.key !== 'Tab') e.preventDefault(); });
        });
    </script>
    <script>
        /* 맨 위로 버튼 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
</body>

</html>
