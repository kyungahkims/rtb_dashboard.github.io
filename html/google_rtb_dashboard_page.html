<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Google RTB Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/google_rtb_dashboard_page.css">
</head>

<body>
    <div class="wrap">
        <section>
            <div class="title">
                <h2>1. 월별 핵심 성과</h2>
                <div class="title-r">
                    <span id="kpiPeriod"></span>
                    <div class="seg month-seg" role="group" aria-label="월 선택"></div>
                </div>
            </div>
            <div class="kpis">
                <div class="card kpi" style="--c:#3446b8">
                    <div class="kpi-top"><span class="kpi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><div class="label">노출수</div></div>
                    <div class="value" data-v="imp">−</div>
                    <div class="kpi-sub" data-kpi="imp"></div>
                </div>
                <div class="card kpi" style="--c:#16a34a">
                    <div class="kpi-top"><span class="kpi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v4M5.2 5.2l2.8 2.8M3 9h4"/><path d="M10 10l10 4-4.5 1.5L14 20z"/></svg></span><div class="label">클릭수</div></div>
                    <div class="value" data-v="clk">−</div>
                    <div class="kpi-sub" data-kpi="clk"></div>
                </div>
                <div class="card kpi" style="--c:#8b5cf6">
                    <div class="kpi-top"><span class="kpi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18L20 6"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg></span><div class="label">클릭률 (CTR)</div></div>
                    <div class="value" data-v="ctr">−</div>
                    <div class="kpi-sub" data-kpi="ctr"></div>
                </div>
                <div class="card kpi" style="--c:#f59e0b">
                    <div class="kpi-top"><span class="kpi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></span><div class="label">세션 ROAS (24시간 이내 구매)</div></div>
                    <div class="value" data-v="roas">−</div>
                    <div class="kpi-sub" data-kpi="roas"></div>
                </div>
                <div class="card kpi" style="--c:#e0262f">
                    <div class="kpi-top"><span class="kpi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/></svg></span><div class="label">소진금액</div></div>
                    <div class="value" data-v="spend">−</div>
                    <div class="kpi-sub" data-kpi="spend"></div>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>2. 전일 vs 전전일</h2>
            </div>
            <div class="card">
                <div class="yd-head" id="ydHead"></div>
                <div class="yd" id="yd"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>3. 최근 7일 성과 비교</h2>
            </div>
            <div class="card">
                <div class="wk-legend" id="wkLegend"></div>
                <div class="wk-scroll">
                    <div class="wk" id="wk"></div>
                </div>

            </div>
        </section>

        <section>
            <div class="title">
                <h2>4. 일별 데이터 그래프</h2>
                <div class="seg month-seg" role="group" aria-label="월 선택"></div>
            </div>
            <div class="card">
                <div class="dl-toggles" id="dlToggles" role="group" aria-label="그래프에 표시할 지표 (여러 개 선택 가능)"></div>
                <div class="chart dl-chart" id="dlChart">
                    <svg id="dlSvg" role="img" aria-label="일별 데이터 그래프"></svg>
                    <div class="dl-tip" id="dlTip" hidden></div>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>5. 일별 성과 테이블</h2>
                <div class="seg month-seg" role="group" aria-label="월 선택"></div>
            </div>
            <div class="card">
                <div class="scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>날짜</th>
                                <th>노출수</th>
                                <th>클릭수</th>
                                <th>클릭률 (CTR)</th>
                                <th>세션 ROAS</th>
                                <th>소진금액</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
    <button type="button" class="to-top" id="toTop" aria-label="맨 위로">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <script src="../js/holidays.js"></script>
    <script>
        // 일별 데이터 [날짜, 노출수, 클릭수, 소진금액, 세션매출], update_data.py 가 채움
        /* DAYS:START */
        const DAYS = [
            ["2026-09-01", 5681766, 3076, 1296972, 1360074],
            ["2026-09-02", 8089663, 3173, 1293987, 5725094],
            ["2026-09-03", 7870542, 3343, 1343615, 7416679],
            ["2026-09-04", 7724281, 3737, 1522702, 16337384],
            ["2026-09-05", 5475763, 2609, 987848, 600818],
            ["2026-09-06", 5276109, 2634, 979424, 1051049],
            ["2026-09-07", 7509858, 3388, 1398286, 9047808],
            ["2026-09-08", 7725283, 3923, 1608550, 11091892],
            ["2026-09-09", 7329949, 3715, 1595862, 12207608],
            ["2026-09-10", 7144357, 3464, 1500093, 3088914],
            ["2026-09-11", 7299012, 2864, 1236661, 19987663],
            ["2026-09-12", 4247571, 2161, 873568, 1506498],
            ["2026-09-13", 4678776, 2340, 937129, 620949],
            ["2026-09-14", 7306875, 2805, 1263127, 6389737],
            ["2026-09-15", 7938411, 2635, 1216904, 4933825],
            ["2026-09-16", 10893322, 4009, 2137665, 9859243],
            ["2026-09-17", 9453662, 3654, 1828473, 6999145],
            ["2026-09-18", 12210712, 3809, 2098041, 6171718],
            ["2026-09-19", 8494178, 2605, 1438397, 798234],
            ["2026-09-20", 8991286, 2924, 1578777, 1181064],
            ["2026-09-21", 10543876, 2221, 1146441, 2143207],
            ["2026-09-22", 10034690, 1764, 831791, 3407213],
            ["2026-09-23", 8260805, 1762, 899943, 601264],
            ["2026-09-24", 3948706, 1392, 628815, 93400],
            ["2026-09-25", 3728690, 1273, 571785, 304336],
            ["2026-09-26", 3931183, 1366, 605647, 865100],
            ["2026-09-27", 4295440, 1413, 642725, 415630],
            ["2026-09-28", 7054322, 1855, 875076, 6619605],
            ["2026-09-29", 7254409, 1992, 956570, 641780],
            ["2026-09-30", 6840180, 2290, 1084834, 1376851],
            ["2026-10-01", 6239073, 2231, 1096278, 1044000],
            ["2026-10-02", 6431053, 2232, 1040412, 1562688],
            ["2026-10-03", 4429398, 2014, 887431, 7587001],
            ["2026-10-04", 4444043, 1955, 858092, 987601],
            ["2026-10-05", 4552339, 2029, 923430, 1017563],
        ];
        /* DAYS:END */

        const ROWS = DAYS.map(([ymd, imp, clk, spend, srev]) => ({
            ymd, d: ymd.slice(5).replace('-', '/'), imp, clk, spend, srev,
            ctr: imp ? clk / imp * 100 : 0, roas: spend ? Math.round(srev / spend * 100) : 0,
        })).sort((a, b) => a.ymd < b.ymd ? -1 : 1);
        const MONTHS = [...new Set(ROWS.map(r => r.ymd.slice(0, 7)))];
        const WEEK = ROWS.slice(-7);   // 최근 7일, 마지막이 전일
        const f = n => Math.round(n).toLocaleString('ko-KR');
        const WK_METRICS = [
            { k: 'imp', label: '노출수', color: '#4f6bed', fmt: v => f(v), short: v => f(v / 1e4) + '만' },
            { k: 'clk', label: '클릭수', color: '#ff7a59', fmt: v => f(v) },
            { k: 'ctr', label: '클릭률 (CTR)', color: '#1fb5a3', fmt: v => v.toFixed(3) + '%' },
            { k: 'roas', label: '세션 ROAS', color: '#f5a524', fmt: v => v + '%' },
            { k: 'spend', label: '소진금액', color: '#9b6bdf', fmt: v => f(v) + '원', short: v => f(v / 1e4) + '만원' },
        ];

        // 월 선택, 1 · 4 · 5번 버튼이 함께 움직임
        let month = MONTHS[MONTHS.length - 1];
        const monthRows = () => ROWS.filter(r => r.ymd.startsWith(month));
        const onMonth = [];
        (function () {
            const multiYear = new Set(MONTHS.map(m => m.slice(0, 4))).size > 1;
            const label = m => (multiYear ? `${m.slice(2, 4)}년 ` : '') + `${+m.slice(5)}월`;
            const segs = document.querySelectorAll('.month-seg');
            const draw = () => segs.forEach(s => {
                s.innerHTML = MONTHS.map(m => `<button type="button" data-m="${m}" aria-pressed="${m === month}" title="${m.slice(0, 4)}년 ${+m.slice(5)}월">${label(m)}</button>`).join('');
            });
            segs.forEach(s => s.addEventListener('click', e => {
                const b = e.target.closest('button[data-m]'); if (!b || b.dataset.m === month) return;
                month = b.dataset.m;
                draw(); onMonth.forEach(fn => fn());
            }));
            draw();
        })();

        // 월별 핵심 성과
        onMonth.push(function () {
            const rows = monthRows(), days = rows.length;
            const T = rows.reduce((a, r) => ({ imp: a.imp + r.imp, clk: a.clk + r.clk, spend: a.spend + r.spend, srev: a.srev + r.srev }), { imp: 0, clk: 0, spend: 0, srev: 0 });
            const val = {
                imp: f(T.imp), clk: f(T.clk), ctr: T.imp ? (T.clk / T.imp * 100).toFixed(3) + '%' : '−',
                roas: T.spend ? Math.round(T.srev / T.spend * 100) + '%' : '−', spend: f(T.spend) + '원',
            };
            document.querySelectorAll('.value[data-v]').forEach(el => { el.textContent = val[el.dataset.v]; });
            const ctrs = rows.map(r => r.ctr);
            document.getElementById('kpiPeriod').textContent = days ? `${rows[0].d} ~ ${rows[days - 1].d} · ${days}일 누계` : '';
            const sub = {
                imp: `일 평균 <b>${f(T.imp / days)}</b>`,
                clk: `일 평균 <b>${f(T.clk / days)}</b>`,
                ctr: `일별 최고 <b>${Math.max(...ctrs).toFixed(3)}%</b> · 최저 <b>${Math.min(...ctrs).toFixed(3)}%</b>`,
                roas: `세션매출 ÷ 소진 <span class="pill">24시간</span>`,
                spend: `일 평균 <b>${f(T.spend / days)}원</b> · CPC <b>${T.clk ? f(T.spend / T.clk) : '−'}원</b>`,
            };
            document.querySelectorAll('.kpi-sub[data-kpi]').forEach(el => { el.innerHTML = sub[el.dataset.kpi] || ''; });
        });

        // 최근 7일 차트
        (function () {
            const max = Object.fromEntries(WK_METRICS.map(m => [m.k, Math.max(...WEEK.map(r => r[m.k]))]));
            document.getElementById('wkLegend').innerHTML = WK_METRICS.map(m => `<span><i style="background:${m.color}"></i>${m.label}</span>`).join('');
            document.getElementById('wk').innerHTML = WEEK.map((r, i) => `
    <div class="wk-day${i === WEEK.length - 1 ? ' today' : ''}">
      <div class="wk-bars">${WK_METRICS.map(m => `
        <div class="wk-col" data-k="${m.k}" title="${r.d} ${m.label}: ${m.fmt(r[m.k])}">
          <b>${(m.short || m.fmt)(r[m.k])}</b>
          <i style="height:${(r[m.k] / max[m.k] * 85).toFixed(1)}%;background:${m.color}"></i>
        </div>`).join('')}
      </div>
      <div class="wk-date">${r.d}${i === WEEK.length - 1 ? ' (전일)' : ''}</div>
    </div>`).join('');

            // 바 호버 시 같은 지표를 선으로 연결
            const wk = document.getElementById('wk');
            const NS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(NS, 'svg');
            svg.setAttribute('class', 'wk-line');
            wk.appendChild(svg);
            let cur = null;
            const show = k => {
                if (k === cur) return;
                cur = k;
                const m = WK_METRICS.find(x => x.k === k);
                const box = wk.getBoundingClientRect();
                svg.setAttribute('width', wk.scrollWidth);
                svg.setAttribute('height', wk.clientHeight);
                const pts = [...wk.querySelectorAll(`.wk-col[data-k="${k}"] i`)].map(el => {
                    const r = el.getBoundingClientRect();
                    return [r.left + r.width / 2 - box.left, r.top - box.top];
                });
                svg.innerHTML = `<polyline fill="none" stroke="${m.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => p.join(',')).join(' ')}"/>`
                    + pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.5" fill="#fff" stroke="${m.color}" stroke-width="2"/>`).join('');
                wk.classList.add('hl');
                wk.querySelectorAll('.wk-col').forEach(c => c.classList.toggle('on', c.dataset.k === k));
            };
            wk.addEventListener('mouseover', e => { const c = e.target.closest('.wk-col'); if (c) show(c.dataset.k); });
            wk.addEventListener('mouseleave', () => { cur = null; svg.innerHTML = ''; wk.classList.remove('hl'); });

        })();

        // 전일 vs 전전일
        (function () {
            const Y = WEEK[WEEK.length - 1], B = WEEK[WEEK.length - 2]; // WEEK 마지막이 전일
            const YC = '#3446b8', BC = '#b9bfca';
            document.getElementById('ydHead').innerHTML = `<span><i style="background:${YC}"></i>전일 ${Y.d}</span><span><i style="background:${BC}"></i>전전일 ${B.d}</span>`;
            document.getElementById('yd').innerHTML = WK_METRICS.map(m => {
                const y = Y[m.k], b = B[m.k];
                const ratio = m.k === 'ctr' || m.k === 'roas';
                const diff = ratio ? y - b : (y / b - 1) * 100;
                const txt = ratio ? `${Math.abs(diff).toFixed(m.k === 'ctr' ? 3 : 0)}%` : `${Math.abs(diff).toFixed(1)}%`;
                const cls = Math.abs(diff) < 0.0005 ? 'flat' : diff > 0 ? 'up' : 'down';
                const arrow = cls === 'flat' ? '−' : diff > 0 ? '▲' : '▼';
                const mx = Math.max(y, b);
                return `<div class="yd-item">
                    <div class="yd-top"><span class="yd-label">${m.label}</span><span class="yd-chg ${cls}">${arrow} ${txt}</span></div>
                    <div class="yd-row now"><span class="yd-day">전일</span><span class="yd-num">${m.fmt(y)}</span></div>
                    <span class="yd-track"><span style="width:${y / mx * 100}%;background:${YC}"></span></span>
                    <div class="yd-row"><span class="yd-day">전전일</span><span class="yd-num">${m.fmt(b)}</span></div>
                    <span class="yd-track"><span style="width:${b / mx * 100}%;background:${BC}"></span></span>
                </div>`;
            }).join('');
        })();

        // 일별 그래프, 선택한 월
        (function () {
            let DAYS = [];
            const sel = new Set(['clk', 'ctr']);
            const box = document.getElementById('dlChart'), svg = document.getElementById('dlSvg'), tip = document.getElementById('dlTip');
            const tg = document.getElementById('dlToggles');

            function drawToggles() {
                tg.innerHTML = WK_METRICS.map(m => `<button type="button" role="checkbox" data-k="${m.k}" style="--c:${m.color}" aria-checked="${sel.has(m.k)}" aria-pressed="${sel.has(m.k)}"><i></i>${m.label}</button>`).join('');
            }
            tg.addEventListener('click', e => {
                const b = e.target.closest('button'); if (!b) return;
                const k = b.dataset.k;
                sel.has(k) ? sel.delete(k) : sel.add(k);
                drawToggles(); draw();
            });

            const L = 24, R = 24, T = 16, B = 30;
            let W = 0, H = 0, xs = [];
            function draw() {
                W = box.clientWidth; H = box.clientHeight;
                svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
                const n = DAYS.length, iw = W - L - R, ih = H - T - B;
                xs = DAYS.map((_, i) => L + (n === 1 ? iw / 2 : i / (n - 1) * iw));
                let out = '';
                for (let g = 0; g <= 4; g++) { const y = T + ih * g / 4; out += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#eceef1"/>`; }
                const fs = iw / Math.max(1, n - 1) < 40 ? 9.5 : 11;
                DAYS.forEach((r, i) => { out += `<text x="${xs[i]}" y="${H - 8}" font-size="${fs}" fill="#888" text-anchor="middle">${r.d}</text>`; });
                WK_METRICS.filter(m => sel.has(m.k)).forEach(m => {
                    const v = DAYS.map(r => r[m.k]), lo = Math.min(...v), hi = Math.max(...v), pad = (hi - lo || 1) * 0.08;
                    const y = x => T + ih - (x - lo + pad) / (hi - lo + pad * 2) * ih;
                    const pts = v.map((x, i) => `${xs[i].toFixed(1)},${y(x).toFixed(1)}`).join(' ');
                    out += `<polyline fill="none" stroke="${m.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>`;
                    out += `<circle cx="${xs[n - 1]}" cy="${y(v[n - 1])}" r="4" fill="${m.color}" stroke="#fff" stroke-width="2"/>`;
                    m._y = y;
                });
                out += `<g id="dlHover" visibility="hidden"><line id="dlLine" y1="${T}" y2="${T + ih}" stroke="#9aa0a8" stroke-dasharray="3 3"/>${WK_METRICS.filter(m => sel.has(m.k)).map(m => `<circle data-k="${m.k}" r="5" fill="${m.color}" stroke="#fff" stroke-width="2"/>`).join('')}</g>`;
                if (!sel.size) out += `<text x="${W / 2}" y="${T + ih / 2}" font-size="13" fill="#9aa0a8" text-anchor="middle">위에서 보고 싶은 지표를 선택하세요</text>`;
                svg.innerHTML = out;
            }
            function hover(e) {
                const rect = svg.getBoundingClientRect(), x = e.clientX - rect.left;
                let i = 0; xs.forEach((v, j) => { if (Math.abs(v - x) < Math.abs(xs[i] - x)) i = j; });
                const r = DAYS[i], g = document.getElementById('dlHover'), ln = document.getElementById('dlLine');
                g.setAttribute('visibility', 'visible');
                ln.setAttribute('x1', xs[i]); ln.setAttribute('x2', xs[i]);
                g.querySelectorAll('circle').forEach(c => { const m = WK_METRICS.find(m => m.k === c.dataset.k); c.setAttribute('cx', xs[i]); c.setAttribute('cy', m._y(r[m.k])); });
                tip.innerHTML = `<b>${r.d}</b>` + WK_METRICS.filter(m => sel.has(m.k)).map(m => `<span><em style="font-style:normal"><i style="background:${m.color}"></i>${m.label}</em>${m.fmt(r[m.k])}</span>`).join('');
                tip.hidden = false;
                const tw = tip.offsetWidth;
                tip.style.left = (xs[i] + 14 + tw > W ? xs[i] - 14 - tw : xs[i] + 14) + 'px';
            }
            svg.addEventListener('mousemove', hover);
            svg.addEventListener('mouseleave', () => { tip.hidden = true; const g = document.getElementById('dlHover'); if (g) g.setAttribute('visibility', 'hidden'); });
            window.addEventListener('resize', draw);
            drawToggles();
            onMonth.push(() => { DAYS = monthRows(); tip.hidden = true; draw(); });
        })();

        // 일별 표, 선택한 월 · 헤더 클릭 정렬 · 합계 행
        (function () {
            const table = document.querySelector('.scroll table'), tbody = table.tBodies[0];
            const KEYS = ['ymd', 'imp', 'clk', 'ctr', 'roas', 'spend'];
            const ths = [...table.querySelectorAll('thead th')];
            let sortI = 0, sortDir = 'desc';   // 처음에는 날짜 최신순
            const total = document.createElement('tr');
            total.className = 'total-row';
            table.tHead.appendChild(total);

            function render() {
                const rows = monthRows();
                const k = KEYS[sortI], s = sortDir === 'desc' ? -1 : 1;
                tbody.innerHTML = [...rows].sort((a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * s).map(r => `
                            <tr>
                                <td class="${dayCls(r.ymd)}">${r.d}</td>
                                <td>${f(r.imp)}</td>
                                <td>${f(r.clk)}</td>
                                <td>${r.ctr.toFixed(3)}%</td>
                                <td>${r.roas}%</td>
                                <td>${f(r.spend)}원</td>
                            </tr>`).join('');
                const T = rows.reduce((a, r) => ({ imp: a.imp + r.imp, clk: a.clk + r.clk, spend: a.spend + r.spend, srev: a.srev + r.srev }), { imp: 0, clk: 0, spend: 0, srev: 0 });
                total.innerHTML = `<td>합계</td><td>${f(T.imp)}</td><td>${f(T.clk)}</td><td>${T.imp ? (T.clk / T.imp * 100).toFixed(3) : '−'}%</td><td title="세션매출 합 ÷ 소진금액 합">${T.spend ? Math.round(T.srev / T.spend * 100) : '−'}%</td><td>${f(T.spend)}원</td>`;
            }
            function mark() {
                ths.forEach((t, j) => {
                    const b = t.querySelector('button');
                    if (j === sortI) { b.dataset.dir = sortDir; t.setAttribute('aria-sort', sortDir === 'desc' ? 'descending' : 'ascending'); }
                    else { delete b.dataset.dir; t.removeAttribute('aria-sort'); }
                });
            }
            ths.forEach((th, i) => {
                th.innerHTML = `<button type="button" class="sort-btn" title="▲ 큰 순 · ▼ 작은 순 (이름을 누르면 번갈아 정렬)">${th.textContent}<span class="arw" aria-hidden="true"><span class="arw-up">▲</span><span class="arw-dn">▼</span></span></button>`;
                th.querySelector('button').addEventListener('click', e => {
                    const b = e.currentTarget, hit = e.target.closest('.arw-up, .arw-dn');
                    sortDir = hit ? (hit.classList.contains('arw-up') ? 'desc' : 'asc') : (b.dataset.dir === 'desc' ? 'asc' : 'desc');
                    sortI = i;
                    mark(); render();
                });
            });
            mark();
            onMonth.push(render);
        })();

        onMonth.forEach(fn => fn());
    </script>
    <script>
        /* 맨 위로 버튼 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
</body>

</html>
