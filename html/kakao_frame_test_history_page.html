<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kakao 상품 고정 프레임</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/frame_test_history_page.css">
</head>

<body>
    <div class="wrap">

        <section>
            <div class="title">
                <h2>1. 프레임 테마별 성과</h2>
                <div class="period-ctrl" id="themePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="themeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="themes" id="themes"></div>
        </section>

        <section>
            <div class="title">
                <h2>2. 전전일 vs 전일 프레임 테마별 비교</h2>
            </div>
            <div class="card">
                <div class="scroll yd-scroll" id="yd"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>3. 최근 7일 프레임 테마별 비교</h2>
            </div>
            <div class="card">
                <div class="legend" id="w7Legend"></div>
                <div class="w7" id="w7"></div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>4. 프레임 테마별 일별 추이 <span class="h2-help" data-tip="구간: 그날 어떤 배너가 나갔는지 보여 줍니다.&#10;&#160;&#160;• 단독 = 배너 하나만 나간 날&#10;&#160;&#160;• 병행 = 여러 배너가 같이 나간 날&#10;&#10;노란색 줄: 나가는 배너 조합이 전날과 달라진 날&#10;1위 메달: 여러 배너가 같이 나간 날 중 클릭률이 가장 높았던 배너" aria-label="구간 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="transPeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="scroll">
                    <table id="transTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>5. 사이즈별 프레임 비교 (3개 사이즈)</h2>
                <div class="period-ctrl" id="sizePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="sizeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="sizeMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="ss" id="sizeSummary"></div>
                <div class="scroll">
                    <table id="sizeTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>6. 프레임 테마 · 사이즈별 성과 순위 <span class="h2-help" data-tip="어떤 테마의 어떤 사이즈 배너가 가장 잘 나왔는지 순위로 보여 줍니다.&#10;예: 1위 블랙골드 336×280 = 블랙골드 테마의 336×280 배너가 클릭률이 가장 높음&#10;&#10;표 읽는 법&#10;&#160;&#160;• 한 줄 = 테마 하나 × 사이즈 하나&#10;&#160;&#160;• 1 · 2 · 3위는 지금 정렬된 기준(처음엔 클릭률)으로 매깁니다&#10;&#160;&#160;• 열 제목을 누르면 노출수 · 클릭수 기준으로 바꿀 수 있습니다" aria-label="표 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="namePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="nameDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="scroll name-scroll">
                    <table id="nameTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>7. 프레임 지면별 비교 (상위 10개 지면) <span class="h2-help" data-tip="배너가 실제로 걸린 지면별로&#10;디자인별 성과를 비교합니다.&#10;&#10;9월 전체: 9월 누적 기준&#10;&#160;&#160;• 노출이 많은 지면 10곳&#10;일별: 하루 단위 기준&#10;&#160;&#160;• 그날 노출이 많은 지면 10곳&#10;&#10;지면은 사이트 이름 기준이며, 같은 사이트의 여러 광고 자리는 합산합니다." aria-label="지면별 표 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="placePeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="placeDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="placeMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="ss" id="placeSummary"></div>
                <div class="scroll">
                    <table id="placeTable"></table>
                </div>
            </div>
        </section>

        <section>
            <div class="title">
                <h2>8. 태그 · 사이즈별 테마 비교 <span class="h2-help" data-tip="광고 자리(TAG ID) 하나와 사이즈 하나를 한 줄로 묶고,&#10;그 자리에 나간 테마별 노출 · 클릭 · 클릭률을 옆으로 펼칩니다.&#10;&#10;같은 자리, 같은 사이즈에서 비교하므로 지면 차이가 빠집니다.&#10;블랙골드는 가격 표시 버전과 가격 숨김 버전을 따로 열로 보여 줍니다.&#10;(9/23 이후는 숨김 버전만, 10/15 부터 두 버전 병행)&#10;화이트레드는 가격 숨김 변형(whiteRedNo)을 합쳐서 봅니다.&#10;&#10;월 전체: 누적 노출 상위 100개 자리&#10;일별: 그날 노출 상위 40개 자리&#10;&#10;노출이 적은 자리는 클릭 1건에 클릭률이 크게 흔들리니&#10;'모든 테마가 나간 자리만' 을 켜고 비교하는 게 안전합니다." aria-label="태그 사이즈별 표 설명" tabindex="0">?</span></h2>
                <div class="period-ctrl" id="tagPeriod" role="group" aria-label="기간 선택">
                    <div class="seg">
                        <button type="button" data-mode="month" aria-pressed="true">9월 전체</button>
                        <button type="button" data-mode="day" aria-pressed="false">일별</button>
                    </div>
                    <input type="date" id="tagDate" class="date-in" aria-label="날짜 선택" hidden>
                </div>
            </div>
            <div class="card">
                <div class="m-tabs" id="tagMetric" role="tablist" aria-label="지표 선택">
                    <button type="button" role="tab" data-metric="imp" aria-selected="false">노출수</button>
                    <button type="button" role="tab" data-metric="clk" aria-selected="false">클릭수</button>
                    <button type="button" role="tab" data-metric="ctr" aria-selected="true">클릭률 (CTR)</button>
                </div>
                <div class="tag-opts">
                    <label class="tag-chk"><input type="checkbox" id="tagOnlyAll"> 모든 테마가 나간 자리만</label>
                    <input type="search" id="tagSearch" class="tag-search" placeholder="지면명 · 사이즈 검색" aria-label="검색">
                    <span class="tag-count" id="tagCount"></span>
                </div>
                <div class="ss" id="tagSummary"></div>
                <div class="scroll tag-scroll">
                    <table id="tagTable"></table>
                </div>
            </div>
        </section>

    </div>

    <button type="button" class="tl-open" id="tlOpen" aria-haspopup="dialog" aria-label="프레임 변경 Timeline 보기">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
        </svg>
        <span class="tl-open-label">프레임 변경 Timeline</span>
    </button>

    <dialog class="tl-modal" id="tlModal" aria-labelledby="tlModalTitle">
        <div class="tl-modal-head">
            <div>
                <h2 id="tlModalTitle">프레임 변경 Timeline</h2>
            </div>
            <button type="button" class="tl-close" id="tlClose" aria-label="닫기">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>
            </button>
        </div>
        <div class="tl-modal-body">
            <ol class="tl" id="timeline"></ol>
        </div>
    </dialog>

    <button type="button" class="to-top" id="toTop" aria-label="맨 위로">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <script src="../js/holidays.js"></script>
    <script>window.TL_CH = '카카오';</script>
    <script src="../js/frame_timeline.js"></script>
    <script src="../js/ghost_outfits.js"></script>

        // 이름 끝 한글의 받침에 맞춰 이/가를 붙임 (맥날이 · 화이트레드가 · 블랙골드 (가격 표시)가)
        const josa = w => { const h = [...w].reverse().find(ch => ch >= '가' && ch <= '힣'); return w + (h && (h.charCodeAt(0) - 0xAC00) % 28 ? '이' : '가'); };
        /* 종료된 프레임(T.retired)은 배너 대신 묘비 + 유령. 비문: 데이터 기간 · 최종 클릭률 · 순위 · T.epitaph. 유령 옷은 js/ghost_outfits.js 의 테마별 정의 */
        function tombArt(T, s, ds, rank) {

            return `<div class="tomb" role="button" tabindex="0" title="비석을 누르면 유언장" aria-label="${T.name} 유언장 펼치기/접기"><svg class="tomb-svg" viewBox="0 0 190 218" aria-hidden="true"><path d="M30 200V70a65 65 0 0 1 130 0v130z" fill="#9aa3b2" stroke="#6b7482" stroke-width="3"/><path d="M40 196V72a55 55 0 0 1 110 0v124z" fill="#b4bcc8"/><rect x="16" y="196" width="158" height="16" rx="3" fill="#7d8694"/><path d="M8 212h174" stroke="#7a7f38" stroke-width="6" stroke-linecap="round"/><path d="M20 212q4-10 8 0M150 212q4-12 8 0M60 214q3-8 6 0" fill="#9a9c44"/><g transform="translate(6 209) rotate(-12) scale(1)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#d9622a"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(24 214) rotate(10) scale(0.85)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#e9a53b"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(52 211) rotate(-28) scale(0.9)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#b9452b"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(120 213) rotate(18) scale(0.8)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#e9a53b"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(140 208) rotate(-8) scale(1)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#d9622a"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(166 213) rotate(24) scale(0.9)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#c9752e"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(176 207) rotate(-20) scale(0.8)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#b9452b"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(84 4) rotate(-14) scale(0.95)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#d9622a"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g><g transform="translate(142 36) rotate(38) scale(0.8)"><path d="M0 0q8-9 17 0q-9 9-17 0z" fill="#e9a53b"/><path d="M2 0h13" stroke="rgba(0,0,0,.28)" stroke-width="1"/></g></svg><div class="ep"><small>HERE LIES</small><b>${T.name.replace(' 프레임', '').replace(' (', '<br>(')}</b><i>${period}</i><i>${s.imp ? `CTR ${pct(s.ctr)}${rank ? ` · ${rank}위` : ''}` : '데이터 없음'}</i>${T.epitaph ? `<q>${T.epitaph}</q>` : ''}</div><div class="ghost" aria-hidden="true"><svg viewBox="0 0 64 76" overflow="visible"><path d="M32 2C17 2 6 14 6 29v40c0 3 3 4 5 2l5-5 5 5c2 2 4 2 6 0l5-5 5 5c2 2 4 2 6 0l5-5 5 5c2 2 5 1 5-2V29C58 14 47 2 32 2z" fill="#fff" stroke="#9aa0a8" stroke-width="2"/><circle cx="23" cy="30" r="4" fill="#2b2d31"/><circle cx="41" cy="30" r="4" fill="#2b2d31"/><path d="M26 44q6 5 12 0" stroke="#2b2d31" stroke-width="2.5" fill="none" stroke-linecap="round"/>${ghostOutfit(T.id)}</svg></div><span class="leaves" aria-hidden="true"><i></i><i></i><i></i></span><span class="tomb-say">마지막 인사 보기</span></div>`;

        // 종료된 카드의 비석을 누르면 유언장 펼침/접기
        (function () {

            const level = () => {

        function renderThemes(from, to) {

            const themeRank = (id, k) => { const n = TS[id][k] > 0 ? 1 + THEMES.filter(T => TS[T.id][k] > TS[id][k]).length : 0; return n ? `<em class="rk-badge rk${Math.min(n, 3)}">${n}위</em>` : ''; };
            // 카드 순서: 광고 중인 프레임 → 예정 프레임(??? 카드) → 종료(묘비) 프레임 (각 묶음 안에서는 THEMES 순서 유지)
            const CARD_ORDER = [...THEMES].sort((a, b) => (a.retired ? 1 : 0) - (b.retired ? 1 : 0));

                const ctrRank = s.ctr > 0 ? 1 + THEMES.filter(X => TS[X.id].ctr > s.ctr).length : 0;
                return `<article class="card theme${T.retired ? ' retired' : ''}${ctrRank === 1 ? ' champ' : ''}">

            document.getElementById('themes').innerHTML = cards.join('');
        }
        (function () {

            dateEl.min = DATES[0]; dateEl.max = TODAY; dateEl.value = TODAY;

        })();

        const CROWN = `<svg class="crown" viewBox="0 0 24 28" aria-hidden="true"><path d="M6 1h5l3 8H9z" fill="#3f7ee8"/><path d="M18 1h-5l-3 8h5z" fill="#d7262f"/><circle cx="12" cy="17.5" r="9" fill="#f2b705" stroke="#c98f00" stroke-width="1.5"/><circle cx="12" cy="17.5" r="6.3" fill="none" stroke="#fff3c4" stroke-width="1"/><text x="12" y="21.6" text-anchor="middle" font-size="11" font-weight="800" font-family="Arial, sans-serif" fill="#7a5200">1</text></svg>`;

        /* 전전일 vs 전일 */
        (function () {
            const Y = DATES[DATES.length - 1], B = DATES[DATES.length - 2];
            const Ys = Object.fromEntries(THEMES.map(T => [T.id, sum(pick(r => r.t === T.id && r.d === Y))]));

                const flat = k === 'ctr' ? Math.abs(diff) <= 0.001 : Math.abs(diff) <= 1;   // 유지 기준: CTR ±0.001%p, 노출과 클릭 ±1%

                const fmtAvg = () => { const avg = cs.reduce((a, x) => a + x.c.diff, 0) / cs.length; return k === 'ctr' ? `${avg > 0 ? '+' : '−'}${Math.abs(avg).toFixed(3)}%p` : `${avg > 0 ? '+' : '−'}${Math.abs(avg).toFixed(0)}%`; };
                if (cs.length === 1) return `${nameOf(cs[0].T)}만 데이터 있음`;
                const groups = {}; cs.forEach(x => (groups[dir(x)] = groups[dir(x)] || []).push(x));
                const kinds = Object.keys(groups);
                const all = cs.length === TH.length ? (TH.length === 2 ? '두 프레임 모두' : `${['', '', '두', '세', '네', '다섯'][TH.length] || TH.length + '개'} 테마 모두`) : '모두';
                if (kinds.length === 1) {

            const totAll = allOf(tot);
            const head = `<thead>
                <tr><th>사이즈</th>${FR.map((T, i) => `<th data-col="${i + 1}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}</th>`).join('')}<th data-col="${FR.length + 1}" class="grp sep all" title="${allTip}">${allLabel}</th></tr>
                <tr class="total-row"><td>합계</td>${tot.map((o, i) => !o.imp ? `<td class="sep na" data-v="-1">−</td>` : numTd(o[mk], m.fmt, 'sep' + (i === argmax(tot) ? ' top' : ''), i === argmax(tot) ? FR[i] : '', `합계 · ${m.label} 1위
${FR[i].name} ${m.fmt(o[mk])}`)).join('')}${allTd(totAll)}</tr>
            </thead>`;
            const sizeRow = ({ S, v, win }) => `<tr><td class="size-cell"><b>${S.name}</b></td>${v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === win ? ' top' : ''), i === win ? FR[i] : '', `${S.name} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}${allTd(allOf(v))}</tr>`;
            const body = `<tbody>${rows.map(sizeRow).join('')}</tbody>`;
            const t = document.getElementById('sizeTable');
            t.innerHTML = head + body;
            makeSortable(t);
            document.getElementById('sizeSummary').innerHTML = stackSummary(FR, rows.map(r => ({ win: r.win, name: r.S.name })), m.label, '사이즈');
        }
        (function () {
            const ctrl = document.getElementById('sizePeriod'), dateEl = document.getElementById('sizeDate'), tabs = document.getElementById('sizeMetric');
            if (!DAILY_DETAIL) ctrl.querySelector('[data-mode="day"]').hidden = true;
            dateEl.min = DATES[0]; dateEl.max = DTODAY; dateEl.value = DTODAY;
            monthButtons(ctrl, DATES);
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                const mk = tabs.querySelector('[aria-selected="true"]').dataset.metric;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || DTODAY;
                if (mode === 'day') renderSize(d, d, mk); else renderSize(...monthRange(ctrl, DATES), mk);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();

        /* 프레임 이름별 표 */
        function renderNames(from, to) {
            const inR = r => r.d >= from && r.d <= to;
            const whole = wholeRange(from, to, DATES) && NROWS.length;   // 월 전체는 NDATA, 일별은 DROWS
            const src = whole ? NROWS : dpick(inR);
            // 테마 x 사이즈로 합산, 변형 배너는 하나로
            const keys = [...new Set(src.map(r => `${r.t}|${r.s}`))];
            const rows = keys.map(k => { const [tid, size] = k.split('|'); return { T: theme(tid), size, s: sum(src.filter(r => r.t === tid && r.s === size)) }; });
            const t = document.getElementById('nameTable');
            t.innerHTML = `<thead>
                <tr><th data-col="0" style="text-align:left">프레임 테마</th><th data-col="1" style="text-align:left">사이즈</th>${M3.map((m, i) => `<th data-col="${i + 2}">${m.label}</th>`).join('')}</tr>
            </thead><tbody>${rows.length ? rows.map(({ T, size, s }) => `<tr>
                <td class="left"><span class="rk-slot"></span><span class="dot" style="${sw(T)}"></span>${nm(T)}</td>
                <td class="left"><b>${size === '비규격' ? '비규격 (오토)' : size}</b></td>
                ${M3.map(m => numTd(s[m.k], m.fmt)).join('')}</tr>`).join('') : '<tr><td colspan="5" class="na" style="text-align:center">이 날짜에는 데이터가 없습니다</td></tr>'}</tbody>`;
            makeSortable(t);
            // 순위 배지는 정렬한 지표 기준, 이름 정렬이면 CTR
            const rank = () => {
                const th = t.querySelector('th[aria-sort]'), col = th && +th.dataset.col >= 2 ? +th.dataset.col : 4;
                const trs = [...t.tBodies[0].rows].filter(r => r.cells.length > 1);
                const order = trs.filter(r => +r.cells[col].dataset.v > 0).sort((x, y) => +y.cells[col].dataset.v - +x.cells[col].dataset.v);   // 0이면 순위 없음
                trs.forEach(r => r.querySelector('.rk-slot').innerHTML = '');
                order.slice(0, 3).forEach((r, i) => r.querySelector('.rk-slot').innerHTML = `<span class="rk-badge rk${i + 1}">${i + 1}위</span>`);
            };
            t.tHead.addEventListener('click', () => setTimeout(rank));
            t.querySelector('th[data-col="4"] .arw-up').click();   // 처음엔 CTR 높은 순
        }
        (function () {
            const ctrl = document.getElementById('namePeriod'), dateEl = document.getElementById('nameDate');
            if (!DAILY_DETAIL) ctrl.querySelector('[data-mode="day"]').hidden = true;
            dateEl.min = DATES[0]; dateEl.max = DTODAY; dateEl.value = DTODAY;
            monthButtons(ctrl, DATES);
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || DTODAY;
                if (mode === 'day') renderNames(d, d); else renderNames(...monthRange(ctrl, DATES));
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();
        /* 지면별 표 */
        // 지면은 사이트 이름 기준으로 합산
        const siteOf = p => p.replace(/^RTB_다음카카오_/, '');   // 카카오 지면명, 공통 접두사만 뗌
        const PROWS = PDATA.map(([d, t, p, imp, clk]) => ({ d, t, p: siteOf(p), imp, clk }));
        const XPROWS = XPDATA.map(([t, p, imp, clk]) => ({ t, p: siteOf(p), imp, clk }));
        const ETC_PLACE = '기타 지면';
        const PLACE_N = 10;   // 표에 보여 줄 지면 수
        const placeLabel = p => `<b>${p}</b>`;
        function renderPlace(from, to, mk) {
            const whole = wholeRange(from, to, DATES) && to !== from && XPROWS.length > 0;   // 월 전체는 XPROWS, 일별은 PROWS
            const src = whole ? XPROWS : PROWS;
            const inR = r => whole || (r.d >= from && r.d <= to);
            const m = M3.find(x => x.k === mk);
            const FR = THEMES;
            const psum = fn => sum(src.filter(fn));
            const argmax = list => { let w = -1; list.forEach((o, i) => { if (o.imp && o[mk] > 0 && (w < 0 || o[mk] > list[w][mk])) w = i; }); return w; };   // 값이 0이면 1위 없음
            // 노출 상위 PLACE_N개 지면
            const places = [...new Set(src.filter(r => inR(r) && r.p !== ETC_PLACE).map(r => r.p))]
                .map(p => ({ p, all: psum(r => inR(r) && r.p === p) }))
                .sort((a, b) => b.all.imp - a.all.imp).slice(0, PLACE_N);
            const rows = places.map(({ p }) => ({ p, v: FR.map(T => psum(r => inR(r) && r.t === T.id && r.p === p)) }));
            rows.forEach(r => r.win = argmax(r.v));
            const shown = new Set(rows.map(r => r.p));
            const tot = FR.map(T => psum(r => inR(r) && r.t === T.id && shown.has(r.p)));   // 합계도 표에 있는 지면 기준
            const head = `<thead>
                <tr><th>지면</th>${FR.map((T, i) => `<th data-col="${i + 1}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${nm(T)}</th>`).join('')}</tr>
                <tr class="total-row"><td>합계</td>${tot.map((o, i) => !o.imp ? `<td class="sep na" data-v="-1">−</td>` : numTd(o[mk], m.fmt, 'sep' + (i === argmax(tot) ? ' top' : ''), i === argmax(tot) ? FR[i] : '', `합계 · ${m.label} 1위
${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>
            </thead>`;
            const placeRow = ({ p, v, win }) => `<tr><td class="place-cell">${placeLabel(p)}</td>${v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === win ? ' top' : ''), i === win ? FR[i] : '', `${p} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}</tr>`;
            const t = document.getElementById('placeTable');
            t.innerHTML = head + `<tbody>${rows.length ? rows.map(placeRow).join('') : `<tr><td colspan="${FR.length + 1}" class="na" style="text-align:center">이 날짜에는 데이터가 없습니다</td></tr>`}</tbody>`;
            makeSortable(t);
            document.getElementById('placeSummary').innerHTML = stackSummary(FR, rows.map(r => ({ win: r.win, name: r.p })), m.label, '지면');
        }
        (function () {
            const ctrl = document.getElementById('placePeriod'), dateEl = document.getElementById('placeDate'), tabs = document.getElementById('placeMetric');
            const PD = [...new Set(PROWS.map(r => r.d))].sort(), PTODAY = PD[PD.length - 1] || TODAY;
            dateEl.min = DATES[0]; dateEl.max = PTODAY; dateEl.value = PTODAY;
            monthButtons(ctrl, PD);
            if (!PROWS.length) ctrl.querySelector('[data-mode="day"]').hidden = true;
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                const mk = tabs.querySelector('[aria-selected="true"]').dataset.metric;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || PTODAY;
                if (mode === 'day') renderPlace(d, d, mk); else renderPlace(...monthRange(ctrl, PD), mk);
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            run();
        })();
        /* 태그×사이즈별 테마 비교 표 */
        // xlsx 테마 이름 그대로 씀, 목록에 없는 테마는 회색으로 자동 추가
        const TAG_THEMES = [
            { id: 'blackGold', name: '블랙골드 (가격 표시)', color: '#2b2d31' },
            { id: 'blackGoldNo', name: '블랙골드 (가격 숨김)', color: '#8a8d93' },
            { id: 'whiteRed', name: '화이트레드', color: '#e0262f' },
            { id: 'magazine', name: '매거진', color: '#8b5cf6' },
            { id: 'mcnal', name: '맥날', color: '#e09b00' },
            { id: 'jelly', name: '젤리', color: '#d946ef' },
            { id: 'wjelly', name: '화이트 젤리', color: '#f472b6' },
            { id: 'story', name: '스토리', color: '#0ea5e9' },
            { id: 'design', name: '기존 디자인 A~D', color: '#1fb5a3' },
            { id: '기본', name: '기본 (이전 프레임)', color: '#9aa0a8', hide: true },   // 9/1~9/2 테마 미기록분, 표에서 제외
            { id: 'verygoodtour', name: 'verygoodtour', color: '#22c55e', hide: true },   // 표에서 제외
        ];
        const tagTheme = id => TAG_THEMES.find(T => T.id === id) || (TAG_THEMES.push({ id, name: id, color: '#9aa0a8' }), TAG_THEMES[TAG_THEMES.length - 1]);
        // 블랙골드는 가격 표시(blackGold)·숨김(blackGoldNo)을 따로 열로 (10/15 부터 두 버전 병행). 화이트레드의 숨김 변형(whiteRedNo)은 1~7번과 같이 화이트레드로 합침
        const TAG_ALIAS = { whiteRedNo: 'whiteRed', A: 'design', B: 'design', C: 'design', D: 'design' };
        const TROWS = TSDATA.map(([d, t, p, s, imp, clk]) => ({ d, t: TAG_ALIAS[t] || t, p, s, imp, clk }));
        const XTROWS = XTSDATA.map(([t, p, s, imp, clk]) => ({ t: TAG_ALIAS[t] || t, p, s, imp, clk }));
        [...TROWS, ...XTROWS].forEach(r => tagTheme(r.t));
        const TDATES = [...new Set(TROWS.map(r => r.d))].sort();
        const sizeLabel = s => s.replace('_', '×');
        function renderTag(from, to, mk, onlyAll, q) {
            const whole = wholeRange(from, to, TDATES) && to !== from && XTROWS.length > 0;   // 월 전체는 누적, 일별은 일별
            const src = (whole ? XTROWS : TROWS).filter(r => whole || (r.d >= from && r.d <= to));
            const m = M3.find(x => x.k === mk);
            const FR = TAG_THEMES.filter(T => !T.hide && src.some(r => r.t === T.id && r.imp));   // hide 테마는 표·합계에서 제외
            const byKey = new Map();
            src.forEach(r => {
                const k = `${r.p}|${r.s}`, i = FR.findIndex(T => T.id === r.t);
                if (i < 0) return;
                const o = byKey.get(k) || { p: r.p, s: r.s, v: FR.map(() => ({ imp: 0, clk: 0 })), all: { imp: 0, clk: 0 } };
                o.v[i].imp += r.imp; o.v[i].clk += r.clk; o.all.imp += r.imp; o.all.clk += r.clk;
                byKey.set(k, o);
            });
            let rows = [...byKey.values()];
            rows.forEach(r => { [...r.v, r.all].forEach(o => o.ctr = o.imp ? o.clk / o.imp * 100 : 0); r.n = r.v.filter(o => o.imp).length; r.site = siteOf(r.p); });
            const total = rows.length;
            if (onlyAll) rows = rows.filter(r => r.n === FR.length);
            if (q) { const qq = q.toLowerCase(); rows = rows.filter(r => r.p.toLowerCase().includes(qq) || r.site.toLowerCase().includes(qq) || sizeLabel(r.s).includes(qq) || r.s.includes(qq)); }
            rows.sort((a, b) => b.all.imp - a.all.imp);
            const argmax = list => { let w = -1; list.forEach((o, i) => { if (o.imp && o[mk] > 0 && (w < 0 || o[mk] > list[w][mk])) w = i; }); return w; };
            rows.forEach(r => r.win = argmax(r.v));
            const tot = FR.map((T, i) => { const o = { imp: 0, clk: 0 }; rows.forEach(r => { o.imp += r.v[i].imp; o.clk += r.v[i].clk; }); o.ctr = o.imp ? o.clk / o.imp * 100 : 0; return o; });
            const totAll = { imp: tot.reduce((a, o) => a + o.imp, 0), clk: tot.reduce((a, o) => a + o.clk, 0) }; totAll.ctr = totAll.imp ? totAll.clk / totAll.imp * 100 : 0;
            const nTh = 3;   // 지면, 사이즈, 테마 수 다음부터 테마 열
            const head = `<thead>
                <tr><th>지면 (TAG ID)</th><th data-col="1">사이즈</th><th data-col="2">테마 수</th>${FR.map((T, i) => `<th data-col="${i + nTh}" class="grp sep" style="${cv(T)}"><span class="dot" style="${sw(T)}"></span>${T.name}</th>`).join('')}<th data-col="${FR.length + nTh}" class="grp sep">합계</th></tr>
                <tr class="total-row"><td>합계 (표에 있는 자리 기준)</td><td data-v="-1"></td><td data-v="-1"></td>${tot.map((o, i) => !o.imp ? `<td class="sep na" data-v="-1">−</td>` : numTd(o[mk], m.fmt, 'sep' + (i === argmax(tot) ? ' top' : ''), i === argmax(tot) ? FR[i] : '', `합계 · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}${numTd(totAll[mk], m.fmt, 'sep')}</tr>
            </thead>`;
            const row = r => `<tr><td class="place-cell"><b>${r.site}</b></td><td class="size-cell" data-v="${r.s}">${sizeLabel(r.s)}</td><td data-v="${r.n}">${r.n}/${FR.length}</td>${r.v.map((o, i) => !o.imp
                ? `<td class="sep na" data-v="-1">−</td>`
                : numTd(o[mk], m.fmt, 'sep' + (i === r.win ? ' top' : ''), i === r.win ? FR[i] : '', `${r.site} ${sizeLabel(r.s)} · ${m.label} 1위\n${FR[i].name} ${m.fmt(o[mk])}`)).join('')}${numTd(r.all[mk], m.fmt, 'sep')}</tr>`;
            const t = document.getElementById('tagTable');
            t.innerHTML = head + `<tbody>${rows.length ? rows.map(row).join('') : `<tr><td colspan="${FR.length + nTh + 1}" class="na" style="text-align:center">${total ? '조건에 맞는 자리가 없습니다' : '이 날짜에는 데이터가 없습니다'}</td></tr>`}</tbody>`;
            makeSortable(t);
            document.getElementById('tagSummary').innerHTML = FR.length ? stackSummary(FR, rows.map(r => ({ win: r.win, name: `${r.site} ${sizeLabel(r.s)}` })), m.label, '자리') : '';
            document.getElementById('tagCount').textContent = `${rows.length.toLocaleString('ko-KR')}개 자리${onlyAll || q ? ` (전체 ${total.toLocaleString('ko-KR')}개 중)` : ''} · 테마 ${FR.length}개`;
        }
        (function () {
            const ctrl = document.getElementById('tagPeriod'), dateEl = document.getElementById('tagDate'), tabs = document.getElementById('tagMetric');
            const onlyEl = document.getElementById('tagOnlyAll'), qEl = document.getElementById('tagSearch');
            if (!TROWS.length && !XTROWS.length) { ctrl.closest('section').hidden = true; return; }
            const TD = TDATES.length ? TDATES : DATES, TTODAY = TD[TD.length - 1] || TODAY;
            dateEl.min = TD[0]; dateEl.max = TTODAY; dateEl.value = TTODAY;
            monthButtons(ctrl, TD);
            if (!TROWS.length) ctrl.querySelector('[data-mode="day"]').hidden = true;
            const run = () => {
                const mode = ctrl.querySelector('[aria-pressed="true"]').dataset.mode;
                const mk = tabs.querySelector('[aria-selected="true"]').dataset.metric;
                dateEl.hidden = mode !== 'day';
                const d = dateEl.value || TTODAY;
                if (mode === 'day') renderTag(d, d, mk, onlyEl.checked, qEl.value.trim()); else renderTag(...monthRange(ctrl, TD), mk, onlyEl.checked, qEl.value.trim());
            };
            ctrl.addEventListener('click', e => {
                const b = e.target.closest('button[data-mode]'); if (!b) return;
                ctrl.querySelectorAll('button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
                run();
            });
            tabs.addEventListener('click', e => {
                const b = e.target.closest('button[data-metric]'); if (!b) return;
                tabs.querySelectorAll('button[data-metric]').forEach(x => x.setAttribute('aria-selected', x === b));
                run();
            });
            dateEl.addEventListener('change', run);
            onlyEl.addEventListener('change', run);
            qEl.addEventListener('input', run);
            run();
        })();
        // 날짜 칸은 포커스 없이 달력만 띄움
        document.querySelectorAll('.date-in').forEach(el => {
            el.addEventListener('mousedown', e => { e.preventDefault(); try { el.showPicker(); } catch (err) { } });
            el.addEventListener('keydown', e => { if (e.key !== 'Tab') e.preventDefault(); });   // Tab 이동만 허용
        });
    </script>
    <script>
        /* 맨 위로 버튼 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
</body>
