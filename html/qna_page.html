<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/qna_page.css">
</head>

<body>
    <div class="wrap">
        <section>
            <div class="title">
                <h2>Q&amp;A</h2>
            </div>
            <div class="qa-tools">
                <input type="search" class="qa-search" id="qaSearch" placeholder="질문·답변 검색" aria-label="질문·답변 검색">
                <div class="qa-cats" id="qaCats" role="group" aria-label="분류"></div>
                <span class="qa-count" id="qaCount"></span>
            </div>
            <div class="qa-list" id="qaList"></div>
        </section>
    </div>

    <button type="button" class="to-top" id="toTop" aria-label="맨 위로">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <script>
        /* Q&A 목록, 여기만 고치면 됨. date 내림차순으로 표시
           cat: 분류, q: 질문, a: 답변 (줄바꿈 = 문단), date: 등록일 YYYY-MM-DD */
        const QNA = [
            { cat: '종합', q: '지금 대결 중인 배너는 무엇이고, 현재 결과는 어떤가요? (11/18 기준)', date: '2026-11-19',
              a: 'Google에서 두 대결이 진행 중입니다. 상품 고정 배너는 매거진 (가격 표시) · 매거진 (가격 숨김) · 비비 3종(11/10~), 상품 오토 배너는 레드오토 · 매거진오토 (가격 표시) · 매거진오토 (가격 숨김) 3종(11/04~)이 같은 비중으로 나갑니다.\n상품 고정은 매거진 (가격 숨김) 0.028% · 매거진 (가격 표시) 0.027% · 비비 0.025%로 차이가 작고, 비비가 가장 낮습니다. 오토는 웹 · 모바일과 앱 모두 매거진오토가 레드오토보다 높습니다.\nKakao는 10/29부터 상품 고정 매거진 하나만 나가고(11월 클릭률 0.156%), 비상품 오토는 두 채널 모두 11/11부터 블랙골드 하나만 나갑니다. 프레임 데이터에는 매출이 없어 클릭률 기준 결과입니다.' },
            { cat: '상품 고정 프레임', q: 'Google 매거진 (가격 표시) vs 매거진 (가격 숨김) vs 비비, 결과는 어떤가요?', date: '2026-11-19',
              a: '세 디자인을 같은 비중(각 하루 60~100만 노출)으로 내보낸 11/11~18 8일 클릭률은 매거진 (가격 숨김) 0.028% · 매거진 (가격 표시) 0.027% · 비비 0.025%입니다. 날짜별 1위는 가격 숨김 6일 · 가격 표시 2일 · 비비 0일입니다.\n가격 숨김과 가격 표시의 차이는 0.001%p로 작아, 10월 블랙골드 때처럼 가격 숨김이 확실히 낫다고 보기는 어렵습니다. 비비(블랙프라이데이 블라인드)는 8일 중 하루도 1위를 하지 못했고, 11/16~18은 매일 가장 낮았습니다.\n블랙프라이데이 시즌 중이라 시즌이 끝난 뒤 흐름도 함께 보는 것이 좋습니다.' },
            { cat: '종합', q: '매거진 가격 표시 vs 가격 숨김, 결과는 어떤가요? (11/18 기준)', date: '2026-11-19',
              a: 'Google에서 매거진 디자인을 가격 표시 · 가격 숨김 두 버전으로 같은 비중으로 내보내고 있습니다. 지면마다 결과가 달라, 한쪽이 확실히 낫다고 보기는 어렵습니다.\n상품 고정 배너(11/11~18 8일)는 가격 숨김 0.028% · 가격 표시 0.027%로 숨김이 조금 높고, 날짜별로도 숨김 6일 · 표시 2일 이겼습니다. 다만 차이가 0.001%p로 작습니다.\n상품 오토 웹 · 모바일(11/05~18 14일)은 둘 다 0.058%로 같고, 날짜별로도 7일씩 나눠 이겼습니다.\n상품 오토 앱(11/11~18 8일)은 가격 표시 0.173% · 가격 숨김 0.144%로 표시가 높고, 8일 내내 표시가 이겼습니다.\n정리하면 상품 고정은 숨김이 근소하게 앞서고, 오토 웹 · 모바일은 같고, 오토 앱은 표시가 확실히 앞섭니다. 10월 블랙골드 비교(Google 숨김 우세, Kakao 표시 우세)에 이어 이번에도 가격 숨김이 일관되게 낫다는 근거는 없습니다. 클릭 뒤 매출은 프레임별 매출 데이터가 없어 비교할 수 없습니다.' },
            { cat: '오토 · 비상품 프레임', q: 'Google 레드오토 vs 매거진오토, 결과는 어떤가요?', date: '2026-11-19',
              a: '웹 · 모바일은 세 디자인을 같은 비중으로 내보낸 11/05~18 14일 클릭률이 매거진오토 (가격 표시) 0.058% · 매거진오토 (가격 숨김) 0.058% · 레드오토 0.050%입니다. 레드오토는 14일 중 하루도 1위를 하지 못했고, 매거진오토 두 버전은 서로 비슷합니다.\n앱은 11/10까지 매거진오토 (가격 표시)만 노출이 적게 나가서, 세 디자인이 같은 비중이 된 11/11~18 8일로 비교했습니다. 매거진오토 (가격 표시) 0.173% · 매거진오토 (가격 숨김) 0.144% · 레드오토 0.134%로, 가격 표시 버전이 8일 내내 1위입니다.\n두 지면 모두 매거진오토가 레드오토보다 높고, 가격 표시와 숨김은 웹 · 모바일에서 같고 앱에서는 가격 표시가 높습니다.' },
            { cat: '오토 · 비상품 프레임', q: '비상품 플립 · 글로우 테스트는 어떻게 끝났나요?', date: '2026-11-19',
              a: '11/04에 기존 블랙골드 디자인과 함께 투입했다가 11/11부터 종료했습니다. 11/04~10 클릭률은 Google 블랙골드 0.025% · 글로우 0.025% · 플립 0.024%로 차이가 없었고, Kakao는 블랙골드 0.071% · 글로우 0.063% · 플립 0.053%로 기존 디자인이 가장 높았습니다.\n두 채널 모두 새 디자인의 이점이 없어, 지금은 비상품 오토 배너가 블랙골드 하나만 나갑니다.' },
        ];

        const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const items = [...QNA].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        const cats = ['전체', ...new Set(items.map(x => x.cat).filter(Boolean))];
        let cat = '전체', kw = '';
        const catsEl = document.getElementById('qaCats'), listEl = document.getElementById('qaList'), countEl = document.getElementById('qaCount');
        catsEl.innerHTML = cats.map(c => `<button type="button" data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join('');
        catsEl.addEventListener('click', e => {
            const b = e.target.closest('button[data-cat]'); if (!b) return;
            cat = b.dataset.cat;
            catsEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
            render();
        });
        document.getElementById('qaSearch').addEventListener('input', e => { kw = e.target.value.trim().toLowerCase(); render(); });
        function render() {
            const shown = items.filter(x => (cat === '전체' || x.cat === cat) && (!kw || (x.q + ' ' + x.a).toLowerCase().includes(kw)));
            countEl.textContent = `${shown.length} / ${items.length}개`;
            listEl.innerHTML = shown.length ? shown.map((x, i) => `<details class="qa"${kw && i === 0 ? ' open' : ''}>
                <summary><span class="q-mark">Q</span>${x.cat ? `<span class="q-cat">${esc(x.cat)}</span>` : ''}<span>${esc(x.q)}</span>
                    <svg class="q-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
                <div class="a"><span class="a-mark">A</span><div class="a-body">${x.a.split('\n').map(p => `<p>${esc(p)}</p>`).join('')}${x.date ? `<div class="a-meta">${x.date}</div>` : ''}</div></div>
            </details>`).join('') : '<div class="qa-empty">조건에 맞는 질문이 없습니다.</div>';
        }
        render();
    </script>
    <script>
        /* 맨 위로 버튼 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
</body>

</html>
