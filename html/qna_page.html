<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/qna_page.css">
</head>

<body>
    <div class="wrap">
        <section>
            <div class="title">
                <h2>Q&amp;A</h2>
            </div>
            <div class="qa-tools">
                <input type="search" class="qa-search" id="qaSearch" placeholder="질문·답변 검색" aria-label="질문·답변 검색">
                <div class="qa-cats" id="qaCats" role="group" aria-label="분류"></div>
                <span class="qa-count" id="qaCount"></span>
            </div>
            <div class="qa-list" id="qaList"></div>
        </section>
    </div>

    <button type="button" class="to-top" id="toTop" aria-label="맨 위로">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <script>
        /* Q&A 목록, 여기만 고치면 됨. date 내림차순으로 표시
           cat: 분류, q: 질문, a: 답변 (줄바꿈 = 문단), date: 등록일 YYYY-MM-DD */
        const QNA = [
            { cat: '종합', q: '프레임 테스트 결론은 지금까지 무엇이 나왔나요? (8월 말~10/15 누적)', date: '2026-10-16',
              a: '상품 고정 프레임: 1위는 매거진입니다. 10월(1~15일) 클릭률은 Google 매거진 0.031% · 블랙골드(가격 숨김) 0.029% · 화이트레드 0.027%, Kakao 매거진 0.198% · 기존 디자인 A~D 0.177% · 블랙골드(가격 숨김) 0.169% · 화이트레드 0.150%입니다. 심플한 잡지형이 두 채널 모두 1위이고, 화려한 맥날은 8일 내내 꼴찌라 10/15 종료했습니다.\n사이즈별로는 가로형(728x90 · 300x250 · 120x600)은 매거진, 정방형(336x280 · 250x250 · 300x600)은 블랙골드가 1위라 나눠 쓰면 조금 더 좋습니다. 320x50과 160x600은 어느 프레임이든 같습니다.\n가격 숨김: 9/23부터 블랙골드 · 화이트레드의 가격을 숨겼는데 클릭률은 늘지 않았고 Google 클릭당 매출은 절반 아래로 떨어졌습니다. 10/14부터 블랙골드 두 버전을 병행해 확인 중입니다.\n상품 오토 · 비상품 프레임: 레드오토와 기존 디자인은 클릭률이 같아 레드오토를 유지하고, 비상품은 iauto 하나로 합친 뒤에도 성과가 유지돼 그대로 둡니다. 두 테스트는 끝내도 됩니다.\n공통 한계: 프레임 데이터에는 매출이 없어 "잘 클릭되는 프레임"까지만 알 수 있습니다. 어떤 프레임이 잘 팔리는지는 프레임별 매출 데이터를 붙여야 판단할 수 있습니다.' },
            { cat: '상품 고정 프레임', q: '10/7에 투입한 맥날 프레임은 어떻게 됐나요?', date: '2026-10-16',
              a: '10/15에 종료했습니다. 10/7~14 8일 동안 Google 0.022% · Kakao 0.110%로 두 채널 모두 8일 내내 꼴찌였고, 1위 매거진(Google 0.031% · Kakao 0.198%)의 55~70% 수준이었습니다. Google 13개 사이즈 중 1위가 하나도 없었습니다.\n매거진과 뼈대가 같고 옷만 화려하게 입힌 디자인이라 "화려해야 클릭된다"는 가설은 기각입니다. 사람들은 화려한 배너를 광고로 보고 넘겼습니다.\n맥날이 쓰던 노출은 Google은 블랙골드 가격 표시 버전에, Kakao는 젤리 · 화이트 젤리에 돌아갔습니다. 대시보드의 맥날 카드는 묘비로 남겨 두었습니다.' },
            { cat: '상품 고정 프레임', q: '가격을 숨긴 배너(9/23~)는 효과가 있었나요?', date: '2026-10-16',
              a: '클릭률에는 효과가 없고, 클릭당 매출은 그 뒤로 절반 아래입니다.\n기간 비교(Google): 가격 표시 기간(9/16~22) 블랙골드 0.032%, 숨김 기간(9/23~10/6) 0.026%로 내려갔는데, 바뀌지 않은 매거진도 같이 내려가(0.036% → 0.030%) 가격 숨김 때문에 클릭이 늘지는 않았습니다.\n매출: Google 클릭당 세션매출이 9/1~15 2,210원 → 9/16~22 1,456원 → 9/28~10/12 878원입니다. 가격을 보고 들어오던 클릭이 가격을 모르고 들어오는 클릭으로 바뀌며 구매율이 낮아졌을 가능성이 있습니다.\n10/14부터 블랙골드만 가격 표시 · 숨김 두 버전을 같은 비중으로 병행하고 있습니다(Kakao는 10/15부터). 첫 이틀은 숨김 0.046% · 표시 0.025%(Kakao 10/15 0.177% · 0.129%)로 숨김 쪽 클릭률이 높지만, 매출 영향은 프레임별 매출 데이터가 없어 Google ROAS 추이로 1~2주 봐야 합니다. 대시보드에서는 두 버전을 따로 카드로 보여 줍니다.' },
            { cat: '상품 고정 프레임', q: 'Kakao에서는 새 테마가 기존 디자인을 이기고 있나요?', date: '2026-10-16',
              a: '매거진만 이기고 있습니다. 10월(1~15일) Kakao 클릭률은 매거진 0.198% · 기존 디자인 A~D 0.177% · 블랙골드(가격 숨김) 0.169% · 화이트레드 0.150% · 맥날 0.110%입니다. 기존 디자인(카운트다운 배너, 상품 수 많은 배너, 가격 표시 없는 깔끔한 배너)이 블랙골드 · 화이트레드보다 높습니다.\n10/14 투입한 젤리 · 화이트 젤리는 이틀 기준 0.133% · 0.140%로 하위권입니다. 첫날 절반 비중으로 시작했고 10/15부터 다른 테마와 같은 비중이라 일주일 더 보고 판단합니다.\nKakao 클릭률은 Google의 6배 수준이라 두 채널 숫자를 직접 비교하면 안 되고, 순위만 비교하면 됩니다. 순위는 두 채널 모두 매거진 1위로 같습니다.' },
            { cat: '오토 · 비상품 프레임', q: '오토 프레임과 비상품 프레임 테스트는 끝내도 되나요?', date: '2026-10-16',
              a: '둘 다 끝내도 됩니다.\n상품 오토 프레임(레드오토 vs 기존 auto_origin): 9/9 레드오토 교체 → 9/22 기존으로 되돌림 → 9/28 레드오토 복귀를 거친 누적 클릭률이 웹 · 모바일 0.052% vs 0.051%, 앱 0.138% vs 0.124%로 같습니다. 레드오토를 유지합니다.\n앱 클릭률이 9/22 이후 3분의 1로 떨어진 것은 어느 프레임을 써도 같아서 프레임 원인이 아닙니다. 앱 지면 · 태그 · 클릭 집계 설정 변경 여부를 확인해야 합니다.\n비상품 프레임: 9/2에 사이즈별 고정 프레임 12개를 iauto 하나로 합친 뒤 10월 클릭률 0.026%(845만 노출)로 합치기 전(0.032%) · 9월(0.028%)과 같은 범위이고 물량도 유지됐습니다. 관리 부담이 12분의 1로 줄어 전환은 성공이고 그대로 둡니다.' },
        ];

        const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const items = [...QNA].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        const cats = ['전체', ...new Set(items.map(x => x.cat).filter(Boolean))];
        let cat = '전체', kw = '';
        const catsEl = document.getElementById('qaCats'), listEl = document.getElementById('qaList'), countEl = document.getElementById('qaCount');
        catsEl.innerHTML = cats.map(c => `<button type="button" data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join('');
        catsEl.addEventListener('click', e => {
            const b = e.target.closest('button[data-cat]'); if (!b) return;
            cat = b.dataset.cat;
            catsEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
            render();
        });
        document.getElementById('qaSearch').addEventListener('input', e => { kw = e.target.value.trim().toLowerCase(); render(); });
        function render() {
            const shown = items.filter(x => (cat === '전체' || x.cat === cat) && (!kw || (x.q + ' ' + x.a).toLowerCase().includes(kw)));
            countEl.textContent = `${shown.length} / ${items.length}개`;
            listEl.innerHTML = shown.length ? shown.map((x, i) => `<details class="qa"${kw && i === 0 ? ' open' : ''}>
                <summary><span class="q-mark">Q</span>${x.cat ? `<span class="q-cat">${esc(x.cat)}</span>` : ''}<span>${esc(x.q)}</span>
                    <svg class="q-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
                <div class="a"><span class="a-mark">A</span><div class="a-body">${x.a.split('\n').map(p => `<p>${esc(p)}</p>`).join('')}${x.date ? `<div class="a-meta">${x.date}</div>` : ''}</div></div>
            </details>`).join('') : '<div class="qa-empty">조건에 맞는 질문이 없습니다.</div>';
        }
        render();
    </script>
    <script>
        /* 맨 위로 버튼 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
</body>

</html>
