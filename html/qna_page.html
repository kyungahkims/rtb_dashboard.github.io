<body>
    <div class="wrap">
        <section>
            <div class="title">
                <h2>Q&amp;A</h2>

                <span class="qa-count" id="qaCount"></span>
            </div>

    <button type="button" class="to-top" id="toTop" aria-label="맨 위로">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <script>
        /* Q&A 목록, 여기만 고치면 됨. date 내림차순으로 표시
           cat: 분류, q: 질문, a: 답변 (줄바꿈 = 문단), date: 등록일 YYYY-MM-DD */
        const QNA = [
            /* 핵심 요약 */
            { cat: '핵심 요약', q: '10월(1~12일) 성과는 한 줄로 어떻게 정리되나요?', date: '2026-10-13',
              a: '두 채널 합계 소진 7,234만원 · 매출 7,256만원 · ROAS 100%입니다. 쓴 만큼만 벌고 있습니다.\nGoogle은 소진 1,227만원 · ROAS 161%, Kakao는 소진 6,007만원 · ROAS 88%입니다. 예산의 83%가 Kakao에 들어가 있는데 Kakao는 쓴 돈보다 726만원을 덜 벌었습니다.\n9월(소진 1억 4,019만원 · ROAS 292%)과 비교하면 효율이 3분의 1입니다. Google 393% → 161%, Kakao 256% → 88%로 두 채널이 같이 내려왔습니다.\nGoogle 161%도 10/3 하루(매출 759만원 · ROAS 855%)가 만든 숫자입니다. 그날을 빼면 Google도 107%입니다.\n매출은 클릭 후 24시간 안의 구매(세션매출) 기준 추정치이고, 마지막 날(10/12)은 집계가 끝나지 않아 다음 갱신 때 바뀔 수 있습니다.' },
            { cat: '핵심 요약', q: '지금 바로 확인이 필요한 이상 신호는 무엇인가요?', date: '2026-10-13',
              a: '네 가지입니다.\n1) Kakao ROAS 25일째 100% 안팎: 9/18 이후 10/12까지 9월 초 수준(400%대)으로 돌아온 날이 하루도 없습니다. 10월 평일 117% · 휴일 54%입니다. 클릭 단가도 647원으로 9/1~17(503원)보다 29% 비쌉니다. 9/18 전후 입찰 · 타겟 · 소재 변경과 상품 · 프로모션 변화를 아직 확인하지 못했다면 가장 먼저 봐야 합니다.\n2) Google ROAS: 10/6~12 7일 ROAS 101%입니다. 클릭률은 0.049%로 9월 말(0.028%)의 1.8배로 좋아졌는데 매출이 따라오지 않습니다. 클릭은 늘고 구매가 줄었습니다.\n3) imbc.com 지면: 10월 노출 122만(상품 고정 프레임 노출의 7.8%)에 클릭 0건입니다. 노출만 소진하는 지면이라 제외를 검토해야 합니다. daum.net도 9월 말 0.023%에서 10월 0.008%로 클릭률이 3분의 1이 됐습니다.\n4) 앱 오토 프레임 클릭률: 10/8~12 0.06~0.08%로 9/9~22(0.215%)의 3분의 1 그대로입니다. 레드오토 · 기존 프레임 어느 쪽을 써도 같아서 프레임 문제가 아닙니다.' },
            { cat: '핵심 요약', q: '10월 남은 기간에는 무엇을 바꿔야 하나요?', date: '2026-10-13',
              a: '1) Kakao 일 예산을 350만원으로 내립니다. 9월 ROAS 550%였던 구간(9/10~17)의 소진 수준입니다. 지금은 일 500만원에 ROAS 88%라 늘릴수록 손실이 커집니다.\n2) 주말 · 공휴일은 Kakao 예산을 평일의 절반 이하로 둡니다. 10월 휴일 6일 ROAS가 54%입니다.\n3) Google은 imbc.com처럼 클릭이 없는 지면을 빼고 daum.net · wisetoto.com 입찰을 낮춥니다. 이 세 지면이 노출의 24%인데 클릭률은 0.01% 이하입니다.\n4) 상품 고정 프레임은 매거진을 기본으로 하고, 정방형(250x250 · 336x280 · 300x600)만 블랙골드로 씁니다. 10/7 투입한 맥날 프레임은 모든 사이즈에서 꼴찌라 테스트를 끝내도 됩니다.\n5) 오토 프레임 AB 테스트는 끝내고 레드오토를 유지합니다. 앱 클릭률 하락은 프레임 원인이 아니므로 앱 지면 · 태그 설정 점검을 진행합니다.\n6) 프레임별 매출 데이터는 여전히 없습니다. 어떤 프레임이 잘 팔리는지는 붙여야 알 수 있습니다.' },
            { cat: '핵심 요약', q: '프레임 테스트 결론은 지금까지 무엇이 나왔나요? (8월 말~10/12 누적)', date: '2026-10-13',
              a: '상품 고정 프레임(블랙골드 · 화이트레드 · 매거진 · 맥날): 8/26 블랙골드, 9/2 화이트레드, 9/15 매거진, 10/7 맥날 순으로 추가했고 9/16부터는 똑같이 나눠 노출하고 있습니다. 균등 노출 기간(9/16~10/12) 누적 클릭률은 매거진 0.032% · 화이트레드 0.030% · 블랙골드 0.029%이고, 하루 1위는 데이터가 있는 25일 중 매거진 16일 · 화이트레드 5일 · 블랙골드 4일입니다. 10/7 들어온 맥날은 0.021%로 6일 내내 꼴찌입니다.\n사이즈별로는 가로형(728x90 · 300x250 · 160x600 · 120x600 · 300x100) 매거진, 정방형과 큰 세로형(336x280 · 250x250 · 300x600 · 200x200 · 300x50) 블랙골드, 320x100 · 970x250 · 234x60 화이트레드입니다. 320x50은 세 프레임이 같습니다.\n결론: 하나만 쓴다면 매거진, 나눠 쓴다면 가로형 매거진 · 정방형 블랙골드입니다. 맥날은 종료하고, 화이트레드는 위 세 사이즈 외에는 매거진으로 대체해도 됩니다. 단, 블랙골드 · 화이트레드는 9/23부터 가격을 숨긴 버전이라 가격 표시판과는 조건이 다릅니다.\n상품 오토 프레임(레드오토 vs 기존 auto_origin): 9/9 레드오토 교체 → 9/22 기존으로 되돌림 → 9/28 레드오토 복귀를 거쳤습니다. 전체 누적 클릭률은 웹 · 모바일 레드오토 0.052% · 기존 0.051%, 앱 레드오토 0.138% · 기존 0.124%로 두 프레임이 같습니다. 앱 클릭률이 9/22 이후 3분의 1로 떨어진 것은 어느 프레임을 써도 같아서 프레임 원인이 아닙니다. 테스트는 끝내고 레드오토를 유지하면 됩니다.\n비상품 프레임: 9/2에 i사이즈별 고정 프레임 12개를 iauto 하나로 합쳤습니다. 합치기 전 0.032%(9/1~2), 합친 뒤 0.028%(9/2~10/12 · 3,286만 노출)로 클릭률과 물량이 유지됐습니다. 관리 부담이 12분의 1로 줄어 전환은 성공입니다.\n공통 한계: 프레임 데이터에는 매출이 없어 "잘 클릭되는 프레임"까지만 알 수 있습니다. 어떤 프레임이 잘 팔리는지는 프레임별 매출 데이터를 붙여야 판단할 수 있습니다.' },
            /* 프레임 변경 이력 */
            { cat: '프레임 변경 이력', q: '프레임은 언제 무엇이 바뀌었나요? (변경 타임라인)', date: '2026-10-13',
              a: '8/11 네이티브 광고 로고 오류 수정.\n8/19 배너 노출 조건 정리. 네이티브 자리를 정해진 비율대로 받고, 50px 미만 자리에는 입찰하지 않게 했습니다.\n8/26 블랙골드 프레임 출시. 상품 고정 배너 14개 사이즈 전부에 적용했습니다.\n9/2 화이트레드 프레임 추가, 블랙골드와 2종 비교 시작. 같은 날 비상품 배너를 i사이즈별 고정 프레임 12개에서 iauto 오토 배너 하나로 통합했습니다.\n9/9 상품 오토 배너를 기존 auto_origin에서 레드오토 디자인으로 교체(웹 · 모바일 · 앱).\n9/15 매거진 프레임 추가, 배너 크기에 따라 상품 개수 자동 조절. 9/16부터 3종 균등 노출.\n9/22 상품 오토 배너를 기존 auto_origin으로 되돌림(~9/27). 같은 날 블랙골드 · 화이트레드의 가격 숨김 버전(blackGoldNo · whiteRedNo)을 3분의 1 비중으로 투입.\n9/23 블랙골드 · 화이트레드를 가격 숨김 버전으로 완전 교체. 이날부터 가격 표시판 노출은 0이고, 대시보드에서는 가격 표시 · 숨김을 합쳐 블랙골드 · 화이트레드로 보여줍니다. 매거진은 그대로입니다.\n9/28 상품 오토 배너를 레드오토로 복귀(9/28은 두 프레임 병행, 9/29부터 레드오토만).\n10/6~10/7 기존 auto_origin 오토 배너가 이틀간 레드오토와 함께 다시 노출됨(데이터 기준).\n10/7 맥날 프레임 추가, 상품 고정 배너 4종 균등 노출 시작.\n같은 내용을 프레임 페이지 위쪽 "프레임 변경 Timeline" 버튼에서도 볼 수 있습니다.' },
            /* Google RTB */
            { cat: 'Google RTB', q: '10월 들어 클릭률은 올랐는데 ROAS는 왜 내려갔나요?', date: '2026-10-13',
              a: '클릭률은 9/18~30 0.028% → 10월 0.045% → 10/9~12 0.05~0.06%로 두 배가 됐습니다. 노출이 일 600만대에서 340만~430만으로 줄면서 반응 낮은 노출이 빠진 영향입니다.\n그런데 ROAS는 10/6~12 101%입니다. 클릭 수는 일 2,000~2,600으로 9월 말과 같은데 클릭당 매출이 줄었습니다. 10월 Google 매출 1,976만원 중 759만원이 10/3 하루에 나왔고, 나머지 11일은 일 평균 111만원(ROAS 107%)입니다.\n9월에는 휴일 ROAS가 평일의 5분의 1이었는데, 10월은 평일 · 휴일 모두 107%(10/3 제외)입니다. 휴일이 좋아진 것이 아니라 평일이 휴일 수준으로 내려온 것입니다.\n광고(클릭)보다 클릭 뒤 구매 쪽 문제입니다. 상품 · 가격 · 랜딩 변화가 있었는지 확인이 필요합니다. 하루 ROAS는 10/3 855% · 10/8 50%처럼 크게 흔들리므로 7일 합계로 보는 것이 맞습니다.' },
            { cat: 'Google RTB', q: '어느 지면이 노출만 먹고 클릭이 없나요?', date: '2026-10-13',
              a: '10월 상품 고정 프레임 기준 노출 비중은 theqoo.net 28% · daum.net 12% · imbc.com 8% · inven.co.kr 5% · cafe.daum.net 5%입니다.\nimbc.com은 122만 노출에 클릭 0건, daum.net은 188만 노출에 클릭 143건(0.008%), wisetoto.com은 0.009%입니다. 이 세 지면이 노출의 24%인데 클릭은 거의 없습니다.\n반대로 v.daum.net 0.140% · dogdrip.net 0.055% · cafe.daum.net 0.037% · ppomppu.co.kr 0.033%는 평균(0.024%)의 1.5~6배입니다.\ndaum.net은 9/16~30 클릭률 0.023%였는데 10월 0.008%로 떨어졌습니다. 지면 쪽에서 바뀐 것이 있는지 확인이 필요합니다.' },
            /* Kakao RTB */
            { cat: 'Kakao RTB', q: '9/18 급락이 10월에도 계속되나요? 연휴가 끝나면 회복되나요?', date: '2026-10-13',
              a: '계속됩니다. 9/18~30 ROAS 99% → 10/1~12 88%입니다. 10/6 · 10/7 · 10/12 세 평일만 150% 안팎이고, 나머지 9일 중 8일은 40~75%입니다.\n연휴는 더 나쁩니다. 10월 휴일 6일(10/3~5 · 10/9~11) ROAS 54%, 특히 10/9~11 사흘은 소진 1,181만원에 매출 581만원(49%)입니다. 9월 추석(45%)과 같은 수준인데 예산은 그대로 일 370만~410만원을 썼습니다.\n클릭 수(일 5,600~10,000) · 클릭률(0.113%)은 9월과 같습니다. 클릭 단가 647원(9/1~17 503원)과 클릭 뒤 구매율이 문제입니다. 9/18에 바뀐 설정을 찾지 못했다면 9/17 이전 설정으로 되돌려 보는 것이 가장 빠른 확인 방법입니다.' },
            { cat: 'Kakao RTB', q: '10월 예산의 83%를 Kakao에 쓰는 것이 맞나요?', date: '2026-10-13',
              a: '지금 구조로는 아닙니다. 10월 Kakao 소진 6,007만원에 매출 5,280만원(ROAS 88%)으로, 쓴 돈보다 726만원 덜 벌었습니다. Google은 1,227만원에 1,976만원입니다.\nKakao는 9/10~17 일 250만~400만원일 때 ROAS 550%였고, 9/18 이후 일 450만~600만원으로 늘린 뒤 100% 아래입니다. 10월도 일 501만원입니다. 늘린 예산이 비싼 클릭(CPC 647원)으로 나가고 구매로 이어지지 않습니다.\nKakao를 일 350만원으로 내려 ROAS가 돌아오는지 한 주 확인하고, 그 사이 Google은 클릭률이 좋은 지면 위주로 소폭(일 120만~130만원) 늘려 보는 순서를 권합니다. Google도 10/6~12 ROAS 101%라 크게 옮길 상황은 아닙니다.' },
            /* 프레임 */
            { cat: '상품 고정 프레임', q: '10/7에 투입한 맥날 프레임은 어떤가요?', date: '2026-10-13',
              a: '10/7~12 6일 동안 네 프레임을 똑같이 노출(각 190만~235만)한 결과 맥날 0.021% · 매거진 0.033% · 블랙골드 0.030% · 화이트레드 0.028%입니다. 맥날이 나머지보다 25~35% 낮고, 6일 내내 꼴찌입니다.\n사이즈별로도 13개 사이즈 중 1위가 하나도 없습니다. 지면별로는 dogdrip.net(0.081%)에서만 1위인데 노출이 적어 의미가 없습니다.\n6일 · 190만 노출이면 결론 내기에 충분합니다. 맥날 프레임은 테스트를 끝내고 그 노출을 매거진 · 블랙골드로 돌리는 것을 권합니다.' },
            { cat: '상품 고정 프레임', q: '사이즈별로는 어떤 프레임을 써야 하나요?', date: '2026-10-13',
              a: '10월 기준 노출이 많은 사이즈부터: 728x90(506만) 매거진 0.021% · 300x250(248만) 매거진 0.052% · 160x600(227만) 세 프레임 0.033~0.034%로 동률 · 320x50(217만) 네 프레임 모두 0.011~0.012%로 같음 · 120x600(166만) 매거진 0.030%.\n정방형은 블랙골드입니다. 336x280 0.055% · 300x600 0.052% · 250x250 0.043% · 200x200 0.023%에서 블랙골드가 1위입니다.\n가로 배너(728x90 · 300x250 · 120x600)는 매거진, 정방형은 블랙골드로 나누면 됩니다. 320x50과 160x600은 어느 프레임이든 같습니다.' },
            { cat: '상품 고정 프레임', q: '블랙골드 · 화이트레드는 9/23부터 가격을 숨긴 버전인데, 효과가 있었나요?', date: '2026-10-13',
              a: '클릭률에는 효과가 없고, 클릭당 매출은 그 뒤로 절반 아래입니다.\n클릭률: 가격 표시 기간(9/16~22) 블랙골드 0.032% · 화이트레드 0.036%, 가격 숨김 기간(9/23~10/6) 0.026% · 0.027%로 둘 다 내려갔습니다. 다만 바뀌지 않은 매거진도 같은 기간 0.036% → 0.030%로 내려갔으니, 하락분은 대부분 지면 변화에 따른 전체 하락입니다. 가격을 숨겨서 클릭이 늘지는 않았고, 화이트레드는 매거진보다 조금 더 빠졌습니다.\n매출: Google 클릭당 세션매출이 9/1~15 2,210원 → 9/16~22 1,456원 → 9/28~10/12 878원입니다. 가격을 보고 들어오던 클릭이 가격을 모르고 들어오는 클릭으로 바뀌면서 구매율이 낮아졌을 가능성이 있습니다. 다만 9/23 전후로 지면 구성과 연휴도 같이 바뀌어 가격 숨김만의 효과로 단정할 수는 없습니다.\n지금은 가격 표시판 노출이 0이라 비교 대상이 없습니다. 블랙골드 하나만이라도 가격 표시 · 숨김을 반반 나눠 1~2주 돌리면 클릭률과 매출(Google ROAS) 영향을 같이 확인할 수 있습니다.' },
            { cat: '상품 오토 프레임', q: '앱 클릭률은 회복됐나요? 레드오토 테스트는 끝내도 되나요?', date: '2026-10-13',
              a: '회복되지 않았습니다. 앱 레드오토는 10/1~5 0.085~0.114%로 잠깐 올랐다가 10/8~12 0.059~0.079%로 다시 내려왔습니다. 9/9~22(0.215%)의 3분의 1입니다.\n10/6~7 이틀 기존 프레임(0.107~0.117%)과 레드오토(0.102~0.133%)를 같이 띄워 봤는데 차이가 없습니다. 프레임을 바꿔도 같으니 원인은 프레임이 아닙니다.\n웹 · 모바일도 레드오토 0.051% · 기존 0.066%로 비슷합니다. 오토 프레임 AB 테스트는 끝내고 레드오토를 유지해도 됩니다. 앱 클릭률 하락은 9/22 전후 앱 지면 · 태그 · 클릭 집계 설정 변경 여부를 확인해야 합니다.' },
            { cat: '비상품 프레임', q: 'iauto 하나로 합친 뒤 10월 성과는 유지되고 있나요?', date: '2026-10-13',
              a: '유지되고 있습니다. 10월 iauto 클릭률 0.026%(845만 노출)로 9/9~22 0.029%, 9월 말 0.023%와 같은 범위입니다. 10/9~12 연휴에도 0.025~0.029%로 떨어지지 않았습니다.\n12개 사이즈별 프레임을 하나로 합친 뒤 물량(일 56만~84만)과 클릭률이 모두 유지됐으니 전환은 그대로 두면 됩니다.' },
        ];

        const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const items = [...QNA].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        const cats = ['전체', ...new Set(items.map(x => x.cat).filter(Boolean))];
        let cat = '전체', kw = '';
        const catsEl = document.getElementById('qaCats'), listEl = document.getElementById('qaList'), countEl = document.getElementById('qaCount');
        catsEl.innerHTML = cats.map(c => `<button type="button" data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join('');
        catsEl.addEventListener('click', e => {
            const b = e.target.closest('button[data-cat]'); if (!b) return;
            cat = b.dataset.cat;
            catsEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
            render();
        });
        document.getElementById('qaSearch').addEventListener('input', e => { kw = e.target.value.trim().toLowerCase(); render(); });
        function render() {
            const shown = items.filter(x => (cat === '전체' || x.cat === cat) && (!kw || (x.q + ' ' + x.a).toLowerCase().includes(kw)));
            countEl.textContent = `${shown.length} / ${items.length}개`;
            listEl.innerHTML = shown.length ? shown.map((x, i) => `<details class="qa"${kw && i === 0 ? ' open' : ''}>
                <summary><span class="q-mark">Q</span>${x.cat ? `<span class="q-cat">${esc(x.cat)}</span>` : ''}<span>${esc(x.q)}</span>
                    <svg class="q-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
                <div class="a"><span class="a-mark">A</span><div class="a-body">${x.a.split('\n').map(p => `<p>${esc(p)}</p>`).join('')}${x.date ? `<div class="a-meta">${x.date}</div>` : ''}</div></div>
            </details>`).join('') : '<div class="qa-empty">조건에 맞는 질문이 없습니다.</div>';
        }
        render();
    </script>
    <script>
        /* 맨 위로 버튼 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
</body>
