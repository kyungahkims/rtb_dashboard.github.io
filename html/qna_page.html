<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/qna_page.css">
</head>

<body>
    <div class="wrap">
        <section>
            <div class="title">
                <h2>Q&amp;A</h2>
            </div>
            <div class="qa-tools">
                <input type="search" class="qa-search" id="qaSearch" placeholder="질문·답변 검색" aria-label="질문·답변 검색">
                <div class="qa-cats" id="qaCats" role="group" aria-label="분류"></div>
                <span class="qa-count" id="qaCount"></span>
            </div>
            <div class="qa-list" id="qaList"></div>
        </section>
    </div>

    <button type="button" class="to-top" id="toTop" aria-label="맨 위로">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <script>
        /* Q&A 목록, 여기만 고치면 됨. date 내림차순으로 표시
           cat: 분류, q: 질문, a: 답변 (줄바꿈 = 문단), date: 등록일 YYYY-MM-DD */
        const QNA = [
            { cat: '종합', q: '프레임 테스트 결론은 무엇인가요? (10/29 기준)', date: '2026-10-30',
              a: '상품 고정 프레임은 매거진이 두 채널 모두 1위라, Google은 10/27부터 · Kakao는 10/29부터 매거진만 내보냅니다.\n10월 클릭률은 Google 매거진 0.035% · 화이트레드 0.028% · 블랙골드(가격 숨김) 0.027% · 블랙골드(가격 표시) 0.026% · 맥날 0.022%, Kakao 매거진 0.192% · 블랙골드(가격 표시) 0.182% · 기존 디자인 A~D 0.175% · 블랙골드(가격 숨김) 0.171% · 화이트 젤리 0.166% · 화이트레드 0.150% · 스토리 0.143% · 젤리 0.142% · 맥날 0.110%입니다.\n오토 프레임은 레드오토 유지, 비상품은 iauto 하나로 유지합니다. 프레임 데이터에는 매출이 없어 "잘 클릭되는 프레임"까지만 결론이고, 잘 팔리는 프레임은 프레임별 매출을 붙여야 알 수 있습니다.' },
            { cat: '상품 고정 프레임', q: '가격 숨김 vs 가격 표시, 결론은 무엇인가요?', date: '2026-10-30',
              a: '클릭률 차이가 없어 둘 다 종료했습니다. 같은 비중으로 나란히 내보낸 기간의 클릭률은 Google(10/14~19) 숨김 0.036% · 표시 0.026%, Kakao(10/15~21) 숨김 0.177% · 표시 0.182%로 채널마다 방향이 달라 숨김이 낫다고 볼 수 없습니다.\n마지막까지 남았던 Google 블랙골드(가격 숨김)도 매거진과 둘만 남은 10/20~26에 0.023% vs 0.031%로 져서 10/27 종료했습니다. 클릭당 매출은 프레임별 매출 데이터가 없어 가격 숨김의 효과를 따로 잴 수 없었습니다. RTB 전체 클릭당 세션매출이 9월 중순부터 떨어지긴 했지만 가격을 숨기기 전(9/16~22)부터 내려갔고 Kakao는 숨긴 채로 10월 중순 다시 올라서, 가격 숨김 탓이라고 볼 근거는 없습니다.' },
            { cat: '상품 고정 프레임', q: 'Kakao 스토리와 기존 디자인 A~D는 왜 끝냈나요?', date: '2026-10-30',
              a: '셋을 같은 비중으로 내보낸 10/22~27 클릭률이 매거진 0.190% · 기존 디자인 A~D 0.173% · 스토리 0.146%로, 매거진이 6일 내내 1위였습니다.\n10/21 투입한 스토리는 첫날부터 끝까지 꼴찌였고, 기존 디자인은 10/28 절반으로 줄인 뒤 종료했습니다. 10/29부터 Kakao도 Google처럼 매거진 하나만 나갑니다.' },
            { cat: '상품 고정 프레임', q: '매거진만 내보낸 뒤 성과는 어떤가요?', date: '2026-10-30',
              a: 'Google은 단독 노출 10/27~29 사흘 클릭률 0.040%로, 비교 기간(10/20~26) 0.031%보다 높고 10/29는 0.048%까지 올랐습니다. Kakao는 10/29 0.169%입니다.\n다만 10/26부터 Google RTB 전체 노출이 하루 280만에서 700만대로 늘어 매거진 노출도 하루 300만대가 됐습니다. 물량이 급하게 늘어난 시기라 클릭률은 1~2주 더 보고 판단해야 합니다.' },
            { cat: '오토 · 비상품 프레임', q: '오토 프레임과 비상품 프레임은 그대로 두면 되나요?', date: '2026-10-30',
              a: '네, 둘 다 그대로 둡니다. 레드오토의 10월 클릭률은 웹 · 모바일 0.059%, 앱 0.099%로 9월과 같은 범위이고, 남아 있던 기존 오토 프레임 소량 노출과도 차이가 없습니다.\n비상품 iauto는 10월 Google 0.024%(2,185만 노출) · Kakao 0.078%(3,436만 노출)로 9월부터 같은 수준을 유지하고 있습니다. 두 테스트는 종료 상태이고, 다음은 새 프레임을 추가 투입해 다시 비교할 예정입니다.' },
        ];

        const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const items = [...QNA].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        const cats = ['전체', ...new Set(items.map(x => x.cat).filter(Boolean))];
        let cat = '전체', kw = '';
        const catsEl = document.getElementById('qaCats'), listEl = document.getElementById('qaList'), countEl = document.getElementById('qaCount');
        catsEl.innerHTML = cats.map(c => `<button type="button" data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join('');
        catsEl.addEventListener('click', e => {
            const b = e.target.closest('button[data-cat]'); if (!b) return;
            cat = b.dataset.cat;
            catsEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
            render();
        });
        document.getElementById('qaSearch').addEventListener('input', e => { kw = e.target.value.trim().toLowerCase(); render(); });
        function render() {
            const shown = items.filter(x => (cat === '전체' || x.cat === cat) && (!kw || (x.q + ' ' + x.a).toLowerCase().includes(kw)));
            countEl.textContent = `${shown.length} / ${items.length}개`;
            listEl.innerHTML = shown.length ? shown.map((x, i) => `<details class="qa"${kw && i === 0 ? ' open' : ''}>
                <summary><span class="q-mark">Q</span>${x.cat ? `<span class="q-cat">${esc(x.cat)}</span>` : ''}<span>${esc(x.q)}</span>
                    <svg class="q-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
                <div class="a"><span class="a-mark">A</span><div class="a-body">${x.a.split('\n').map(p => `<p>${esc(p)}</p>`).join('')}${x.date ? `<div class="a-meta">${x.date}</div>` : ''}</div></div>
            </details>`).join('') : '<div class="qa-empty">조건에 맞는 질문이 없습니다.</div>';
        }
        render();
    </script>
    <script>
        /* 맨 위로 버튼 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
</body>

</html>
