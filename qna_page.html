<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #f5f6f8;
            color: #202124;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif
        }

        .wrap {
            margin: auto;
            padding: 28px 32px
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-bottom: 22px;
            gap: 12px
        }

        .head h1 {
            margin: 0;
            font-size: 27px
        }

        .date {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            padding: 10px 14px;
            font-size: 13px
        }

        .card {
            background: #fff;
            border: 1px solid #e6e8ec;
            border-radius: 12px;
            padding: 26px 24px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .07);
            min-width: 0
        }

        section {
            margin-bottom: 64px
        }

        section:last-of-type {
            margin-bottom: 24px
        }

        .title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px
        }

        .title h2 {
            font-size: 17px;
            font-weight: 800;
            color: #1a1d23;
            letter-spacing: -.01em;
            margin: 0
        }

        .title span {
            font-size: 12px;
            color: #858a92
        }

        .note {
            font-size: 11px;
            color: #858a92;
            margin-top: 10px
        }

        .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: 0;
            flex: none
        }

        .num {
            font-variant-numeric: tabular-nums
        }

        /* ① 테마별 성과 박스 */
        .themes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px
        }

        .theme {
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        .theme-art {
            background: #f8f9fb;
            padding: 16px;
            border-bottom: 1px solid #eceef1
        }

        .theme-art .ad {
            max-width: 280px;
            margin: auto
        }

        .theme-body {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .theme-name {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center
        }

        /* 프레임 이름 호버 툴팁 */
        .fname { cursor: default; border-bottom: 1px dotted transparent }
        .fname:hover { border-bottom-color: currentColor }
        #frameTip { position: fixed; left: -9999px; top: -9999px; z-index: 2000; width: 216px; padding: 8px; background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .16); pointer-events: none; visibility: hidden }
        #frameTip.show { visibility: visible }
        #frameTip .ft-item { display: none }
        #frameTip .ft-item.on { display: block }
        #frameTip .ad.ad-slot { width: 200px; margin: 0 auto }
        #frameTip .ft-name { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; font-size: 12px; font-weight: 700; color: #20242a }

        /* ① 신규 표시 */
        .tag-chip { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 999px; background: #3446b8; color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: .2px; line-height: 1.5 }
        /* ① 프레임 미리보기 링크 (뷰어 페이지 새 탭) */
        a.theme-art { display: block; text-decoration: none; color: inherit }
        .theme-view { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: #3446b8; text-decoration: none; white-space: nowrap; padding: 2px 7px; border-radius: 999px; background: #eef0f9 }
        .theme-view:hover { background: #3446b8; color: #fff }

        .theme-period {
            font-size: 12px;
            color: #6b7078
        }

        .theme-period b {
            color: #3446b8
        }

        .theme-stats {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 7px 10px;
            font-size: 13px;
            border-top: 1px dashed #e1e4e9;
            padding-top: 10px;
            margin: 0
        }

        .theme-stats dt {
            color: #7b8088
        }

        .theme-stats dd {
            margin: 0;
            text-align: right;
            font-weight: 700;
            font-variant-numeric: tabular-nums
        }

        /* ② 타임라인 */
        .tl {
            list-style: none;
            margin: 0;
            padding: 0;
            position: relative
        }

        .tl::before {
            content: "";
            position: absolute;
            left: 82px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: #e6e8ec
        }

        .tl li {
            display: grid;
            grid-template-columns: 70px 26px 1fr 150px;
            gap: 0 12px;
            align-items: start;
            padding: 10px 0
        }

        .tl li+li {
            border-top: 1px solid #f1f2f4
        }

        .tl-date {
            font-size: 13px;
            font-weight: 700;
            text-align: right;
            padding-top: 2px;
            font-variant-numeric: tabular-nums
        }

        .tl-date small {
            display: block;
            font-size: 11px;
            color: #9aa0a8;
            font-weight: 400
        }

        .tl-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 0 2px var(--c);
            background: var(--c);
            margin: 3px auto 0;
            position: relative;
            z-index: 1
        }

        .tl-body {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0
        }

        .tl-top {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .tl-top b {
            font-size: 14px
        }

        .tl-body p {
            margin: 0;
            font-size: 12.5px;
            color: #6b7078;
            line-height: 1.5
        }

        .chip {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap
        }

        .chip.deploy {
            background: #e8ecff;
            color: #3446b8
        }

        .chip.copy {
            background: #fff3dc;
            color: #a86b00
        }

        .chip.ratio {
            background: #fbe9ea;
            color: #c9444d
        }

        .chip.ch.google {
            background: #eef0f3;
            color: #4b5260
        }

        .chip.ch.kakao {
            background: #fff4c2;
            color: #6b5300
        }

        .tl-target {
            font-size: 12px;
            font-weight: 700;
            color: #444;
            display: flex;
            align-items: center
        }

        .chip.live {
            background: #e6f4ec;
            color: #198754
        }

        .tl-art .ad {
            width: 150px
        }

        /* ② 어제 vs 그제 */
        .yd-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px
        }

        .yd-card {
            background: #f8f9fb;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0
        }

        .yd-card h3 {
            margin: 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .yd-m {
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .yd-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px
        }

        .yd-label {
            font-size: 12px;
            color: #6b7078;
            font-weight: 600
        }

        .yd-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px
        }

        .yd-day {
            font-size: 11px;
            color: #858a92
        }

        .yd-num {
            font-size: 12.5px;
            color: #858a92;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap
        }

        .yd-row.now .yd-day {
            color: #3446b8;
            font-weight: 700
        }

        .yd-row.now .yd-num {
            font-size: 17px;
            color: #202124;
            font-weight: 750
        }

        .yd-track {
            display: block;
            height: 6px;
            background: #e6e8ec;
            border-radius: 3px;
            overflow: hidden
        }

        .yd-track span {
            display: block;
            height: 100%;
            border-radius: 3px
        }

        .yd-chg {
            font-size: 11.5px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap
        }

        .yd-chg.rise {
            background: #e6f4ec;
            color: #198754
        }

        .yd-chg.fall {
            background: #fbe9ea;
            color: #c9444d
        }

        .yd-chg.flat {
            background: #eceef1;
            color: #666
        }

        .yd-head {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #666;
            margin-bottom: 12px
        }

        .yd-head i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: -1px
        }

        /* ③ 최근 7일 */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            font-size: 12px;
            color: #555;
            margin-bottom: 8px
        }

        .legend i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: -1px
        }

        .w7 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px
        }

        .w7-box h3 {
            margin: 0 0 6px;
            font-size: 13px;
            color: #444
        }

        .w7-chart {
            height: 230px;
            position: relative
        }

        .w7-chart svg {
            display: block;
            overflow: visible
        }

        .tip {
            position: absolute;
            pointer-events: none;
            background: #20242a;
            color: #fff;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.6;
            white-space: nowrap;
            z-index: 3;
            box-shadow: 0 4px 14px #0003
        }

        .tip b {
            display: block
        }

        .tip i {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px
        }

        .tip span {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            font-variant-numeric: tabular-nums
        }

        /* 표 */
        .scroll {
            overflow: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px
        }

        th,
        td {
            padding: 10px 10px;
            border-bottom: 1px solid #e9ebef;
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums
        }

        th:first-child,
        td:first-child {
            text-align: left
        }

        th {
            color: #777;
            background: #fafbfc;
            font-size: 11px;
            font-weight: 700
        }

        th.grp {
            text-align: center;
            color: #202124;
            font-size: 12px;
            border-bottom: 2px solid var(--c)
        }

        th.sep,
        td.sep {
            border-left: 1px solid #e6e8ec
        }

        td.best {
            color: #3446b8;
            font-weight: 700
        }

        .crown-wrap {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
            cursor: default
        }

        .crown-wrap::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 8px);
            right: -6px;
            background: #20242a;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.5;
            text-align: left;
            white-space: pre;
            padding: 7px 10px;
            border-radius: 7px;
            box-shadow: 0 4px 14px #0003;
            opacity: 0;
            pointer-events: none;
            transition: opacity .12s;
            z-index: 5
        }

        .crown-wrap::before {
            content: "";
            position: absolute;
            bottom: calc(100% + 2px);
            right: 10px;
            border: 6px solid transparent;
            border-top-color: #20242a;
            border-bottom: 0;
            opacity: 0;
            transition: opacity .12s;
            z-index: 5
        }

        td.top:hover .crown-wrap::after,
        td.top:hover .crown-wrap::before {
            opacity: 1
        }

        .crown {
            width: 17px;
            height: 20px;
            flex: none;
            margin: -3px 0
        }

        td.top {
            background: color-mix(in srgb, var(--c) 16%, #fff);
            font-weight: 700;
            box-shadow: inset 3px 0 0 var(--c)
        }

        td.size-cell {
            padding-left: 22px
        }

        .win {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 12px
        }

        .win::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--c)
        }

        .ss {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 14px
        }

        .ss-item {
            background: #f8f9fb;
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            min-width: 0
        }

        .ss-top {
            display: flex;
            align-items: center;
            font-size: 13px;
            font-weight: 700
        }

        .ss-top b {
            margin-left: auto;
            font-size: 13px
        }

        .ss-bar {
            height: 6px;
            background: #e6e8ec;
            border-radius: 3px;
            overflow: hidden
        }

        .ss-bar span {
            display: block;
            height: 100%;
            background: var(--c);
            border-radius: 3px
        }

        .ss-list {
            font-size: 11.5px;
            color: #6b7078;
            line-height: 1.5
        }

        @media(max-width:700px) {
            .ss {
                grid-template-columns: 1fr
            }
        }

        td.left {
            text-align: left
        }

        .cell-name {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .cell-name .ad {
            width: 56px;
            flex: none;
            box-shadow: none
        }

        .total-row td {
            background: #f3f5ff;
            font-weight: 700;
            color: #202124;
            border-bottom: 2px solid #d9ddf5;
            font-size: 12.5px
        }

        .total-row td:first-child {
            color: #3446b8
        }

        .sort-btn {
            all: unset;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 6px;
            margin: -3px -6px;
            border-radius: 6px;
            font: inherit;
            color: inherit
        }

        .sort-btn:hover {
            background: #eef0f3
        }

        .sort-btn:focus-visible {
            outline: 2px solid #3446b8
        }

        .sort-btn .arw {
            display: inline-flex;
            flex-direction: column;
            font-size: 7px;
            line-height: 7px;
            color: #d3d7dd
        }

        .sort-btn .arw span {
            padding: 1px 4px;
            margin: 0 -4px;
            cursor: pointer
        }

        .sort-btn .arw span:hover {
            color: #6b7078
        }

        .sort-btn[data-dir="desc"] .arw .arw-up,
        .sort-btn[data-dir="asc"] .arw .arw-dn {
            color: #3446b8
        }

        .sort-btn[data-dir] {
            color: #3446b8;
            font-weight: 700
        }

        /* ---------- 프레임 예시 이미지 (HTML 목업 · 실제 소재 이미지로 교체 가능) ---------- */
        .ad {
            container-type: inline-size;
            aspect-ratio: 6/5;
            width: 100%;
            max-width: 100%;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            line-height: 1.25;
            letter-spacing: -.01em;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .12)
        }

        .ad svg {
            display: block;
            width: 100%;
            height: 100%
        }

        .ad-btn {
            display: inline-block;
            border-radius: 1.4cqw;
            padding: 2.2cqw 4cqw;
            font-size: 4.2cqw;
            font-weight: 700
        }

        .ad-hide {
            display: inline-block;
            padding: 1.6cqw 3cqw;
            border-radius: 1.4cqw;
            font-size: 4cqw;
            font-weight: 700;
            background: repeating-linear-gradient(135deg, rgba(0, 0, 0, .08) 0 2cqw, rgba(0, 0, 0, .02) 2cqw 4cqw)
        }

        .ad-tag {
            position: absolute;
            right: 1.6cqw;
            bottom: 1.4cqw;
            font-size: 2.4cqw;
            color: rgba(128, 128, 128, .9)
        }

        .ad-blackgold {
            background: radial-gradient(120% 90% at 50% 0%, #232018 0%, #0b0b0a 60%);
            color: #f4ecd8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.8cqw;
            text-align: center;
            padding: 6cqw
        }

        .ad-blackgold::before {
            content: "";
            position: absolute;
            inset: 3cqw;
            border: 1px solid #c9a54a;
            pointer-events: none
        }

        .ad-blackgold .eyebrow {
            font-size: 3.2cqw;
            letter-spacing: .35em;
            color: #d8b65c;
            font-weight: 700
        }

        .ad-blackgold .img {
            width: 36cqw;
            height: 32cqw
        }

        .ad-blackgold .ttl {
            font-size: 5.4cqw;
            font-weight: 700
        }

        .ad-blackgold .price {
            font-size: 6.4cqw;
            font-weight: 700;
            color: #e2c270
        }

        .ad-blackgold .ad-btn {
            border: 1px solid #d8b65c;
            color: #e2c270;
            padding: 1.6cqw 5cqw;
            font-size: 3.8cqw
        }

        .ad-blackgold .ad-hide {
            background: repeating-linear-gradient(135deg, rgba(226, 194, 112, .22) 0 2cqw, rgba(226, 194, 112, .06) 2cqw 4cqw);
            color: #e2c270
        }

        .ad-whitered {
            background: #fff;
            color: #1c1c1c;
            display: grid;
            grid-template-rows: auto 1fr;
            border: 1px solid #eee
        }

        .ad-whitered .band {
            background: #d7262f;
            color: #fff;
            font-weight: 800;
            font-size: 4.6cqw;
            padding: 2.6cqw 5cqw;
            display: flex;
            justify-content: space-between
        }

        .ad-whitered .band em {
            font-style: normal;
            background: #fff;
            color: #d7262f;
            border-radius: 1cqw;
            padding: 0 2cqw
        }

        .ad-whitered .row {
            display: grid;
            grid-template-columns: 46% 1fr;
            align-items: center
        }

        .ad-whitered .img {
            padding: 5cqw 4cqw
        }

        .ad-whitered .body {
            padding: 3cqw 5cqw 3cqw 1cqw;
            display: flex;
            flex-direction: column;
            gap: 2cqw
        }

        .ad-whitered .ttl {
            font-size: 5.4cqw;
            font-weight: 700
        }

        .ad-whitered .price {
            font-size: 8cqw;
            font-weight: 800;
            color: #d7262f
        }

        .ad-whitered .price s {
            display: block;
            font-size: 3.8cqw;
            color: #999;
            font-weight: 400
        }

        .ad-whitered .ad-btn {
            background: #d7262f;
            color: #fff;
            align-self: flex-start
        }

        .ad-redauto {
            background: linear-gradient(160deg, #e3182f 0%, #a80e22 100%);
            color: #fff;
            padding: 5cqw;
            display: flex;
            flex-direction: column;
            gap: 3cqw
        }

        .ad-redauto .head2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 4.6cqw;
            font-weight: 800
        }

        .ad-redauto .auto {
            font-size: 3cqw;
            background: rgba(255, 255, 255, .18);
            border-radius: 10cqw;
            padding: .8cqw 2.4cqw;
            font-weight: 700
        }

        .ad-redauto .tiles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.4cqw;
            flex: 1
        }

        .ad-redauto .tile {
            background: #fff;
            color: #222;
            border-radius: 2cqw;
            padding: 2cqw;
            display: flex;
            flex-direction: column;
            gap: 1cqw;
            justify-content: space-between
        }

        .ad-redauto .tile .img {
            height: 17cqw
        }

        .ad-redauto .tile b {
            font-size: 3.6cqw;
            color: #d0142b
        }

            /* ---------------- 핵심 요약 (경영진용) ---------------- */
            { cat: '핵심 요약', q: '9월(1~22일) 전체 성과는 한 줄로 어떻게 정리되나요?', date: '2026-09-23',
              a: '두 채널 합계 소진 9,943만원 · 노출 2억 8,453만 · 클릭 18만 8천 · 통합 ROAS 약 376%(추정 매출 약 3억 7,400만원)입니다.\nGoogle RTB는 소진 3,011만원 · ROAS 438% · CPC 450원, Kakao RTB는 소진 6,931만원 · ROAS 349% · CPC 570원입니다. 예산은 Kakao에 70%가 들어가 있고, 효율(ROAS·CPC)은 Google이 더 좋습니다.\n매출은 대시보드의 일별 ROAS × 소진으로 역산한 근사치이며, 세션매출(클릭 후 24시간 내 구매) 기준입니다.' },
            { cat: '핵심 요약', q: '프레임 AB 테스트 결론은 무엇이고, 어떤 프레임을 남겨야 하나요?', date: '2026-09-23',
              a: '상품 고정 프레임: 화이트레드가 누계 CTR 0.050%로 1위이고, 3종이 균등 노출된 9/16~9/21에도 0.042%로 1위(매거진 0.038% · 블랙골드 0.036%)입니다. 다만 정방형(300×250 등)에서는 블랙골드가 0.069% vs 0.057%로 앞서고, 세로형·300×100에서는 매거진이 1위입니다. 하나만 남기기보다 가로형·모바일형은 화이트레드, 정방형은 블랙골드로 사이즈별 배분하는 것이 CTR을 가장 높이는 선택입니다.\n상품 오토 프레임: 신규 레드오토가 기존 대비 웹·모바일 +6%(0.049% → 0.052%), 앱 +47%(0.148% → 0.217%)로 모두 앞섭니다. 전환을 유지하는 것이 맞습니다.\n단, 프레임 데이터에는 클릭까지만 있고 매출·ROAS가 없습니다. CTR이 높은 프레임이 구매까지 더 잘 이어지는지는 프레임 단위 전환 데이터가 붙어야 최종 판단할 수 있습니다.' },
            { cat: '핵심 요약', q: '예산을 더 쓰면 그만큼 더 벌리는 구조인가요?', date: '2026-09-23',
              a: 'Kakao는 9/10부터 일 소진을 166만원 → 350만원으로 2.1배 늘렸는데 9/10~9/17 ROAS가 346% → 550%로 오히려 좋아졌습니다. 이 구간까지는 확대가 성과를 냈습니다.\n그런데 9/18~9/22는 일 소진 527만원까지 늘린 뒤 ROAS 137% · CPC 730원으로 급격히 나빠졌습니다. Google도 9/16부터 일 소진을 127만원 → 158만원(+24%)으로 늘리자 ROAS가 532% → 276%로 떨어졌습니다.\n두 채널 모두 "일정 수준까지는 확대가 통하지만 최근 구간에서 한계 신호"가 나타난 상태입니다. 원인(주말·입찰 변경·상품/프로모션 요인)이 확인되기 전까지는 현 수준에서 추가 확대를 보류하는 것이 안전합니다.' },
            { cat: '핵심 요약', q: '지금 바로 확인이 필요한 이상 신호는 무엇인가요?', date: '2026-09-23',
              a: '세 가지입니다.\n1) Google 9/21~9/22: 노출은 1,000만대를 유지하는데 클릭이 2,221 → 1,764로 급감해 CTR 0.021% · 0.018%(9월 평균 0.039%)입니다. 소재 노출 오류나 클릭 트래킹 이상 가능성이 있습니다.\n2) Kakao 9/18~9/22: 9월 최고 소진(일 462만~592만원)에 ROAS 40~220%, CPC 700원대입니다. 입찰가·타겟 변경이나 상품 재고·프로모션 종료 여부 확인이 필요합니다.\n3) 레드오토 앱 9/21: 노출이 67만~82만에서 38만으로 반토막 났습니다. 웹·모바일은 정상이라 앱 지면 물량 변화로 보입니다.\n마지막 날 숫자는 집계 지연으로 다음 갱신 때 바뀔 수 있으니, 하루 뒤 같은 날짜를 다시 확인한 뒤 판단하는 것이 좋습니다.' },

            /* ---------------- Google RTB ---------------- */
            { cat: 'Google RTB', q: '9월 중순부터 노출은 늘었는데 CTR은 왜 떨어졌나요?', date: '2026-09-23',
              a: '9/1~9/11 평균 일 노출 701만 · CTR 0.047%였는데, 9/12~9/22는 평균 862만 · CTR 0.033%로 노출은 23% 늘고 CTR은 30% 낮아졌습니다. 특히 9/16(1,089만), 9/18(1,221만)부터 노출이 크게 뛰었습니다.\n같은 시기(9/15 퇴근 후)에 매거진 배너가 추가되어 고정 프레임 3종이 각 87만씩 균등 노출로 바뀌었습니다. 새 소재가 더 넓은 지면에 노출되면서 클릭 전환이 낮은 지면까지 물량이 확대된 것이 CTR 희석의 주된 원인으로 추정됩니다.\n9/21~9/22는 노출 1,000만대에 클릭 2,221 → 1,764로 CTR이 0.021% · 0.018%까지 내려갔습니다. 하루 이틀 만에 클릭이 절반이 된 것은 이례적이라 소재·트래킹 이상 여부를 확인할 필요가 있습니다.' },
            { cat: 'Google RTB', q: '주말 ROAS가 유독 낮은 이유는?', date: '2026-09-23',
              a: '9월 주말 6일 평균 ROAS는 89%인데 평일 16일 평균은 546%입니다. 주말은 노출도 평일의 74%(619만 vs 842만)로 줄고 소진도 113만원으로 낮습니다.\n CTR은 주말이 0.041%로 평일(0.038%)보다 오히려 높습니다. 즉 클릭은 들어오는데 24시간 안의 구매(세션매출)가 주말에 적은 것입니다. 소진이 아니라 구매 행동의 요일 차이로 보는 것이 맞고, 주간 ROAS를 볼 때는 주말을 분리해서 보는 것이 좋습니다.' },
            { cat: 'Google RTB', q: '9/4 ROAS 1,073%, 9/11 1,616%는 왜 이렇게 높나요?', date: '2026-09-23',
              a: 'ROAS는 하루 세션매출 ÷ 소진입니다. 이 두 날의 소진(152만 · 124만)과 클릭(3,737 · 2,864)은 평범한데 매출이 크게 잡혔습니다. 고단가 상품이 소수 구매되어 하루 매출이 튄 것으로 추정되며, 이런 날은 추세가 아니라 단발 이벤트로 보아야 합니다.\n같은 이유로 일별 ROAS는 편차가 매우 커서(55% ~ 1,616%) 7일 이동 합계나 월 누계(438%)로 보는 것이 안정적입니다.' },
            { cat: 'Google RTB', q: 'CPC(클릭당 비용)가 9/16부터 400원대에서 500원대로 올랐어요.', date: '2026-09-23',
              a: '9/1~9/15 CPC는 372~462원이었고 9/16~9/21은 500~552원입니다(9/22는 472원으로 내려왔지만 이 날은 클릭 자체가 급감한 날입니다). 소진은 9/16 214만원 · 9/18 210만원으로 늘었지만 클릭은 4,009 · 3,809로 비례해서 늘지 않았습니다.\n노출 확대 구간에서 CTR이 떨어졌기 때문에(위 질문 참고) 같은 돈으로 얻는 클릭이 줄어든 결과입니다. 노출을 늘린 지면이 클릭 효율이 낮은 지면이라는 뜻이기도 해서, 지면 단위 CTR을 함께 확인해 볼 필요가 있습니다.' },

            /* ---------------- Kakao RTB ---------------- */
            { cat: 'Kakao RTB', q: '9/10부터 노출이 2~3배로 뛰었는데 무슨 일인가요?', date: '2026-09-23',
              a: '9/9 430만 → 9/10 922만으로 하루 만에 노출이 2배 이상 늘었고, 이후 9/12~9/22 평균 661만(전반기 363만의 1.8배)을 유지합니다. 소진도 일 199만원 → 431만원으로 같이 늘었습니다.\n물량 확대 조정이 들어간 것으로 보이며, 이 구간 CTR은 0.114% → 0.104%로 소폭 낮아졌습니다. 노출을 늘리면 상대적으로 반응이 낮은 지면까지 들어가기 때문에 CTR이 약간 희석되는 것은 일반적인 현상입니다.' },
            { cat: 'Kakao RTB', q: '9/18 이후 ROAS가 급락했어요 (220% → 63% → 40%).', date: '2026-09-23',
              a: '9/18~9/22 소진은 일 462만~592만원으로 9월 최고 수준인데 ROAS는 220% · 63% · 40% · 130% · 204%로 무너졌습니다. 같은 기간 CPC도 700원대(9/17까지는 430~560원)로 올랐습니다.\n클릭은 6,374~8,433으로 유지되고 있어 클릭이 줄어든 것이 아니라, 클릭당 비용이 오르고 클릭 이후 구매가 줄어든 것입니다. 9/19~9/20이 주말이라는 점을 감안해도 9/18(금)과 9/21(월)까지 낮은 것은 주말 효과만으로 설명되지 않습니다. 입찰가·타겟 변경이나 상품 재고·프로모션 종료 같은 외부 요인을 확인해 보는 것이 좋습니다.' },
            { cat: 'Kakao RTB', q: 'Kakao CTR(0.108%)이 Google(0.039%)보다 3배 높은데, 왜 ROAS는 Google이 더 높나요?', date: '2026-09-23',
              a: '9월 누계 CTR은 Kakao 0.108% · Google 0.039%로 Kakao가 2.8배 높습니다. 그런데 ROAS는 Google 438% · Kakao 349%입니다.\nKakao는 소진이 6,931만원으로 Google(3,011만원)의 2.3배이고 CPC도 570원 수준(Google 450원)으로 더 비쌉니다. 클릭은 잘 나오지만 클릭 한 번의 비용이 높고, 그 클릭이 구매로 이어지는 비율은 Google보다 낮다는 뜻입니다. 채널 성격이 다르므로 CTR만으로 우열을 가리기보다 CPC와 ROAS를 함께 보는 것이 맞습니다.' },

            /* ---------------- 상품 고정 프레임 ---------------- */
            { cat: '상품 고정 프레임', q: '화이트레드 프레임 CTR이 가장 높게 나온 이유는?', date: '2026-09-23',
              a: '9/2~9/21 누계 CTR은 화이트레드 0.050% · 블랙골드 0.041% · 매거진 0.038%입니다. 단, 노출량이 화이트레드 1,772만 · 블랙골드 1,082만 · 매거진 322만으로 크게 달라 단순 비교는 불공정합니다.\n3종이 각 322만씩 정확히 균등하게 노출된 9/16~9/21만 보면 화이트레드 0.042% · 매거진 0.038% · 블랙골드 0.036%로 순위는 같지만 격차는 줄어듭니다. 화이트레드의 강점은 가로형 사이즈에서 나옵니다. 노출이 가장 많은 728×90에서 화이트레드 0.059% vs 블랙골드 0.034%로 1.7배 차이가 나고, 이 사이즈 하나가 전체 노출의 약 3분의 1을 차지해 전체 CTR을 끌어올렸습니다.' },
            { cat: '상품 고정 프레임', q: '사이즈별 비교에서 정방형은 블랙골드가 1위인데 전체는 왜 화이트레드인가요?', date: '2026-09-23',
              a: '정방형(300×250 · 336×280 · 250×250 · 200×200) 누계 CTR은 블랙골드 0.069% · 화이트레드 0.057%로 블랙골드가 앞섭니다. 336×280은 0.093% vs 0.067%, 250×250은 0.069% vs 0.048%입니다.\n반면 가로형은 화이트레드 0.054% vs 블랙골드 0.032%, 모바일형도 0.040% vs 0.031%로 화이트레드가 앞섭니다. 가로형·모바일형 노출이 정방형의 약 2.6배라서 전체 합계는 화이트레드가 유리하게 나옵니다. 어두운 배경의 블랙골드는 큰 정방형 지면에서, 밝은 화이트레드는 얇은 가로 배너에서 잘 보이는 것으로 해석할 수 있습니다.' },
            { cat: '상품 고정 프레임', q: '매거진 프레임은 9/16 첫날 CTR이 좋았는데 왜 이후 떨어졌나요?', date: '2026-09-23',
              a: '9/15 퇴근 후 배포되어 9/16 첫 정상 집행일 CTR이 0.046%로 블랙골드(0.042%)를 앞섰지만, 9/17 0.035% · 9/18 0.037% · 9/21 0.034%로 내려와 3종 중 2~3위입니다.\n같은 기간 블랙골드·화이트레드도 각각 0.042 → 0.032%, 0.048 → 0.036%로 함께 하락했고 Google 채널 전체 CTR도 같은 추세였습니다. 매거진만의 문제가 아니라 시장 전체가 내려간 구간이라, 매거진 성과는 같은 날 다른 프레임과의 상대 비교로 판단해야 합니다. 세로형(160×600 0.053%)과 300×100(0.047%)에서는 매거진이 1위라 세로·모바일 지면 위주로 강점이 있습니다.' },
            { cat: '상품 고정 프레임', q: '9월 들어 세 프레임 모두 CTR이 계속 낮아지는데 프레임 문제인가요?', date: '2026-09-23',
              a: '9/3~9/4에는 0.05~0.06%대였던 CTR이 9/21에는 0.032~0.036%로 3주 만에 40% 정도 내려왔습니다. 세 프레임이 같은 방향으로 움직이고, 오토 프레임(레드오토 웹·모바일 0.070% → 0.037%)과 Google 채널 전체(0.047% → 0.033%)도 같은 기울기입니다.\n따라서 특정 프레임의 소재 피로보다 채널 전체의 노출 확대와 지면 구성 변화가 원인일 가능성이 높습니다. 프레임 간 우열은 "절대 CTR"이 아니라 "같은 날의 상대 순위"로 보는 것이 이 데이터에서는 안전합니다.' },

            /* ---------------- 상품 오토 프레임 (웹, 모바일) ---------------- */
            { cat: '상품 오토 (웹, 모바일)', q: '레드오토(신규)가 autoETC(기존)보다 얼마나 나은가요?', date: '2026-09-23',
              a: 'autoETC(9/1~9/9) 누계 CTR 0.049%, 레드오토 웹·모바일(9/9~9/21) 0.052%로 약 6% 높습니다. 전환 다음 날인 9/10 0.070%는 autoETC의 최고치(9/9 0.059%)를 넘었고, 9/11 0.058%도 그에 맞먹는 수준이었습니다.\n다만 두 프레임은 같은 날 나눠 노출한 A/B가 아니라 9/9를 기준으로 시기가 갈린 비교입니다. 9/9 이후 Google 채널 전체 CTR이 내려간 것을 감안하면, 시장이 나빠진 구간에서 기존보다 높은 CTR을 낸 것이므로 실제 개선 폭은 숫자보다 클 수 있습니다.' },
            { cat: '상품 오토 (웹, 모바일)', q: '레드오토 CTR이 9/10 0.070%에서 9/21 0.037%로 계속 떨어지는데요.', date: '2026-09-23',
              a: '9/10 0.070% → 9/14 0.058% → 9/16 0.050% → 9/18 0.046% → 9/21 0.037%로 매주 낮아졌습니다. 노출은 80만 → 115만으로 늘어난 구간입니다.\n신규 소재의 초기 반응이 잦아드는 것과, 노출 확대로 반응이 낮은 지면이 섞인 것이 겹친 결과로 추정됩니다. 같은 기간 고정 프레임 3종과 Google 전체 CTR도 같은 기울기로 내려갔기 때문에 레드오토만의 소재 피로로 단정할 수는 없습니다. 지면별 비교에서 CTR이 낮은 요청 사이즈의 비중이 늘었는지 확인해 보면 원인을 나눌 수 있습니다.' },
            { cat: '상품 오토 (웹, 모바일)', q: '지면(요청 사이즈)별로 보면 어디서 차이가 났나요?', date: '2026-09-23',
              a: '두 프레임에 공통으로 잡힌 14개 사이즈 중 10개에서 레드오토가 높습니다. 작은 사이즈에서 차이가 큽니다. 120×60은 0.002% → 0.014%, 176×62는 0.004% → 0.015%, 220×90은 0.006% → 0.024%로 3~7배입니다.\n반대로 큰 가로형에서는 기존이 앞섭니다. 노출이 가장 많은 970×280은 autoETC 0.097% vs 레드오토 0.046%로 기존이 2배 높고, 970×90(0.069% vs 0.047%) · 468×60(0.035% vs 0.018%)도 기존이 높습니다. 레드오토의 최다 노출 지면은 320×50(253만 · 0.105%)과 655×120(64만 · 0.193%)로 모바일 가로 배너에서 강합니다. 큰 가로형 970×280의 레이아웃은 별도 점검이 필요합니다.' },

            /* ---------------- 상품 오토 프레임 (앱) ---------------- */
            { cat: '상품 오토 (앱)', q: '앱에서 레드오토는 coupangETC보다 얼마나 좋았나요?', date: '2026-09-23',
              a: 'coupangETC(9/1~9/9) 누계 CTR 0.148%, 레드오토 앱(9/9~9/21) 0.217%로 47% 높습니다. 클릭 수도 coupangETC 9일 9,240 → 레드오토 10일 10,909로, 노출이 19% 적은데(622만 → 503만) 클릭은 18% 많습니다.\n특히 9/16~9/18은 0.223% · 0.260% · 0.309%로 coupangETC 최고치(9/9 0.225%)를 넘었습니다. 웹·모바일(+6%)보다 앱에서 개선 폭이 훨씬 큽니다.' },
            { cat: '상품 오토 (앱)', q: '앱 CTR(0.2%)이 웹·모바일(0.05%)보다 4배 높은 이유는?', date: '2026-09-23',
              a: '같은 레드오토 프레임인데 앱은 0.217%, 웹·모바일은 0.052%입니다. 레드오토 요청 사이즈 상위는 320×50(253만 · 0.105%) 같은 모바일 배너가 차지하는데, 이 사이즈는 화면 폭을 꽉 채우는 형태라 터치 반응이 높습니다. 웹은 970×280(0.046%) · 180×150(0.014%) 같은 데스크톱 지면이 섞여 있어 평균이 낮아집니다. 지면별.csv는 앱·웹을 나누지 않아 사이즈별 채널 구분은 추정입니다.\n채널 특성 차이이므로 앱과 웹·모바일 CTR을 직접 비교하기보다 각 페이지 안에서 Before/After를 비교해야 합니다.' },
            { cat: '상품 오토 (앱)', q: '9/21 레드오토 앱 노출이 38만으로 반토막 났는데요.', date: '2026-09-23',
              a: '9/16~9/18 67만~82만이던 노출이 9/21(월) 38만으로 줄었고 CTR도 0.309% → 0.172%로 내려왔습니다. 웹·모바일은 같은 날 107만으로 평소 수준이라 앱 지면에서만 물량이 줄었습니다.\n9/19~9/20 주말 데이터가 CSV에 없어 연속 추세는 확인할 수 없습니다. 앱 지면 입찰 변경이나 특정 매체 물량 감소 가능성이 있어 원본 데이터에서 9/21 앱 지면 구성을 확인해 보는 것이 좋습니다.' },

        ];

        const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const items = [...QNA].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        const cats = ['전체', ...new Set(items.map(x => x.cat).filter(Boolean))];
        let cat = '전체', kw = '';
        const catsEl = document.getElementById('qaCats'), listEl = document.getElementById('qaList'), countEl = document.getElementById('qaCount');
        catsEl.innerHTML = cats.map(c => `<button type="button" data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join('');
        catsEl.addEventListener('click', e => {
            const b = e.target.closest('button[data-cat]'); if (!b) return;
            cat = b.dataset.cat;
            catsEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
            render();
        });
        document.getElementById('qaSearch').addEventListener('input', e => { kw = e.target.value.trim().toLowerCase(); render(); });
        function render() {
            const shown = items.filter(x => (cat === '전체' || x.cat === cat) && (!kw || (x.q + ' ' + x.a).toLowerCase().includes(kw)));
            countEl.textContent = `${shown.length} / ${items.length}개`;
            listEl.innerHTML = shown.length ? shown.map((x, i) => `<details class="qa"${kw && i === 0 ? ' open' : ''}>
                <summary><span class="q-mark">Q</span>${x.cat ? `<span class="q-cat">${esc(x.cat)}</span>` : ''}<span>${esc(x.q)}</span>
                    <svg class="q-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
                <div class="a"><span class="a-mark">A</span><div class="a-body">${x.a.split('\n').map(p => `<p>${esc(p)}</p>`).join('')}${x.date ? `<div class="a-meta">${x.date}</div>` : ''}</div></div>
            </details>`).join('') : '<div class="qa-empty">조건에 맞는 질문이 없습니다.</div>';
        }
        render();
    </script>
    <script>
        /* 맨 위로 버튼 — 300px 이상 내려가면 표시 */
        (function () {
            const b = document.getElementById('toTop');
            const on = () => b.classList.toggle('show', window.scrollY > 300);
            window.addEventListener('scroll', on, { passive: true });
            b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            on();
        })();
    </script>
